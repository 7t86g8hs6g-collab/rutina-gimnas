uis; com a alternativa ocasional, sí.</p> <p><span class=\"k\">Quan té sentit.</span> Els dies que vas curt de temps i vols cobrir l'espatlla amb un sol exercici, o com a canvi d'estímul en una posició d'elevació lateral, sabent que aquell cicle el deltoide lateral rebrà una mica menys de càrrega.</p>","cues":["El colze sempre una mica per sobre de la mà al tram lateral","No baixis els braços entre els dos trams","Espatlles avall; el coll no hi participa","Tronc quiet: si es balanceja, el pes és massa alt"],"setup_steps":["Dempeus, peus a l'amplada del maluc, genolls una mica flexionats i abdomen estret.","Una manuella a cada mà, al costat de les cuixes, amb els palmells cap al cos.","Espatlles enrere i avall abans de començar.","Tria un pes que et permeti fer el <span class=\"key\">tram lateral</span> amb bona forma: el tram frontal sempre acceptarà més pes que aquest, i no és el que decideix."],"grip_html":"<p><span class=\"k\">Pronada als dos trams.</span> Palmells cap avall. Girar la mà entre els dos trams només afegeix una maniobra i cap benefici.</p> <p><span class=\"k\">El colze mana.</span> Al tram lateral, puja com si volguessis tocar les parets amb els colzes: el colze una mica per sobre de la mà. Si puja primer la mà, el pes es queda penjat del canell i el deltoide en fa menys.</p>","execution_steps":["<span class=\"key\">Tram lateral (2 s).</span> Obre els braços de costat fins que les mans arribin a l'alçada de l'espatlla, amb el colze una mica doblegat.","<span class=\"key\">Pas al davant (1 s).</span> Sense baixar els braços ni un centímetre, porta'ls endavant fins que quedin davant del cos, a la mateixa alçada.","<span class=\"key\">Tornada (2 s).</span> Desfés el camí cap als costats, mantenint l'alçada.","<span class=\"key\">Baixada (1 s).</span> Baixa els braços als costats del cos i torna a començar sense rebot."],"notice_html":"<p>Feina al lateral de l'espatlla al primer tram i al davant al segon, amb cremor acumulada cap al final. <span class=\"k\">Si el segon tram et sembla fàcil</span>, és normal: és el que passa quan el pes el mana el tram lateral. <span class=\"k\">Si notes el coll</span>, les espatlles pugen. <span class=\"k\">Si et gronxes</span>, el pes és massa per al tram que decideix.</p>","verify_html":"<p><span class=\"k\">Prova de l'alçada:</span> les mans no baixen ni pugen entre els dos trams; el recorregut és un quadrat, no una onada.</p> <p><span class=\"k\">Prova del tronc:</span> de costat al mirall, el cos no es balanceja a cap repetició.</p> <p><span class=\"k\">Prova de l'última repetició:</span> si el tram lateral ja no arriba a l'alçada de l'espatlla, la sèrie ha acabat, encara que el tram frontal encara surti.</p>","errors":[{"error":"Baixar els braços entre els dos trams","why":"Desapareix el que fa útil l'exercici, que és mantenir la tensió mentre canvies de pla.","fix":"Mantén l'alçada; si no pots, baixa pes.","cause":"El braç busca descans just on la palanca és més dura."},{"error":"Triar el pes per al tram frontal","why":"El tram lateral queda desbordat i l'exercici es converteix en un balanceig.","fix":"Tria el pes amb el tram lateral i accepta que el frontal anirà sobrat.","cause":"El tram frontal permet més càrrega i enganya."},{"error":"Pujar més amunt de l'espatlla","why":"Per sobre d'aquesta alçada, hi entra el trapezi.","fix":"Atura els dos trams a l'alçada de l'espatlla.","cause":"Buscar recorregut quan el pes ja no puja net."}],"progression_html":"<p>12 repeticions combinades netes a les dues sèries → següent parell de manuelles i torna a 8. Com a la resta del treball de deltoide, allarga la fase de repeticions abans de tocar el pes.</p>","note_html":"No la comptis com una elevació lateral i una frontal: és una sola posició. Si un cicle la fas en lloc d'una elevació lateral, no afegeixis les frontals a sobre.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=7FYVO57z_ns","title":"Dumbbell Lateral To Front Raise (Tutorial + Tips)","confidence":"alta","note":"Mateixa combinació de trams, lateral i després frontal."},"alternatives":{"principal":{"name":"Elevació lateral amb manuelles","why_equivalent":"Conserva el tram que decideix la càrrega i deixa fora el tram redundant.","adjust":"Mateix rang de repeticions; permet més pes.","short":"només el tram que compta"},"contingencia":{"name":"Elevació lateral a politja, un braç","why_acceptable":"Tensió constant en tot el recorregut i un braç cada vegada.","adjust":"Politja baixa; descans de 30 s després dels dos braços.","short":"tensió constant, unilateral"},"not_equivalent":["Press per sobre del cap · empenta, no elevació","Elevació frontal sola · només el segon tram"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada del maluc, genolls una mica flexionats i abdomen estret.</li> <li>Una manuella a cada mà, al costat de les cuixes, amb els palmells cap al cos.</li> <li>Espatlles enrere i avall abans de començar.</li> <li>Tria un pes que et permeti fer el <span class=\"key\">tram lateral</span> amb bona forma: el tram frontal sempre acceptarà més pes que aquest, i no és el que decideix.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Tram lateral (2 s).</span> Obre els braços de costat fins que les mans arribin a l'alçada de l'espatlla, amb el colze una mica doblegat.</li> <li><span class=\"key\">Pas al davant (1 s).</span> Sense baixar els braços ni un centímetre, porta'ls endavant fins que quedin davant del cos, a la mateixa alçada.</li> <li><span class=\"key\">Tornada (2 s).</span> Desfés el camí cap als costats, mantenint l'alçada.</li> <li><span class=\"key\">Baixada (1 s).</span> Baixa els braços als costats del cos i torna a començar sense rebot.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide lateral"],"secondary":["Deltoide anterior"],"minor":[],"traits":["Combinat"]}},{"key":"AX-05","position":"AX-05","session":"AX","order":5,"name":"Rotació externa d'espatlla, a politja baixa","category":"ANNEX","category_label":"Annex","machine":{"code":null,"label":"Torre de politges, politja baixa · no consta a l'inventari M1–M7"},"muscles":"Infraespinós · rodó menor","prescription":{"series":"2","reps":"12–15","tempo":"2–3 s ↓","rest":"45 s","rir":"0–1"},"quick":{"do":["Colze enganxat a les costelles, doblegat a 90°","De costat a la politja, a l'alçada del melic","Comença amb l'avantbraç creuat davant del cos","Gira cap enfora sense separar el colze de les costelles"],"dont":"Separar el colze del cos per guanyar recorregut","feel":"La part posterior de l'espatlla, sota l'omòplat","grip":"Nansa simple, presa neutra"},"theory_html":"<p><span class=\"k\">Què fa, exactament.</span> Gira l'espatlla cap enfora amb el colze com a eix: és la funció de l'infraespinós i el rodó menor, els dos músculs petits de la part posterior del manegot rotador. No mouen gaire pes, però estabilitzen l'articulació cada vegada que empenys o estires.</p> <p><span class=\"k\">Per què és a l'annex i no a la rutina.</span> Perquè el programa ja el fa treballar indirectament: el Face Pull (TB‑05) hi inclou una rotació externa amb més pes, i l'escalfament de Tronc A la repeteix cada cicle. Afegir-hi un aïllament directe a totes les sessions seria sumar fatiga a una articulació petita sense un motiu clar per fer-ho.</p> <p><span class=\"k\">Quan té sentit fer-la.</span> Si notes l'espatlla fràgil en algun dels pressos, o si vols un manteniment addicional entre cicles. Dues sèries curtes en tenen prou; no és un exercici que busqui creixement.</p>","cues":["Colze fix a les costelles de principi a fi","El moviment el fa l'espatlla, no l'avantbraç sol","Espatlles avall; el coll no hi participa","Gira fins on arribis sense forçar, no fins on «toca»"],"setup_steps":["Assegut o dempeus, de costat a la politja, amb la politja a l'alçada del melic.","Colze doblegat a 90° i enganxat a les costelles del mateix costat.","Agafa la nansa amb l'avantbraç creuat davant del cos, com a posició d'inici.","Comprova que el colze no es mou quan estires el cable: si es mou, ets massa lluny."],"execution_steps":["<span class=\"key\">Rotació (2 s).</span> Gira l'avantbraç cap enfora, colze quiet a les costelles, fins on arribis sense forçar.","<span class=\"key\">Pausa (1 s).</span> Sense que el colze s'obri del cos.","<span class=\"key\">Retorn (2 s).</span> Controlat, fins a l'avantbraç creuat davant del cos."],"grip_title":"La presa","grip_html":"<p><span class=\"k\">Nansa simple.</span> Presa neutra, com si donessis la mà. És l'única presa que cal aquí: no hi ha variants de rotació de canell que canviïn la funció.</p> <p><span class=\"k\">Amb goma, si la politja és ocupada.</span> El mateix gest amb una goma ancorada a l'alçada del melic funciona igual; la diferència és que la tensió puja a mesura que gires, en lloc de mantenir-se constant.</p>","notice_html":"<p>Poca cosa: és un múscul petit i el pes hi és baix. <span class=\"k\">Si notes el davant de l'espatlla</span>, el colze s'ha separat del cos i ha entrat el deltoide anterior. <span class=\"k\">Si no notes res</span>, probablement estàs girant amb el braç sencer en lloc de fer-ho des de l'espatlla.</p>","verify_html":"<p><span class=\"k\">Prova del colze:</span> ha de tocar les costelles a l'inici i al final de cada repetició, sense excepció.</p> <p><span class=\"k\">Prova del canell:</span> es manté recte, alineat amb l'avantbraç, en tot el recorregut.</p> <p><span class=\"k\">Prova de la velocitat:</span> si necessites impuls per arrencar, el pes és massa alt per a un múscul tan petit.</p>","errors":[{"error":"Separar el colze del cos","why":"El deltoide anterior i el pit entren a ajudar, i l'aïllament desapareix.","fix":"Enganxa una tovallola petita entre el colze i les costelles i no la deixis caure.","cause":"Buscar més recorregut del que el múscul petit pot donar."},{"error":"Girar amb tot el braç","why":"El moviment surt de l'espatlla, no del colze ni del canell.","fix":"Redueix el pes fins que notis clarament la part posterior de l'espatlla.","cause":"Pes triat pensant en un exercici de força, no d'aïllament."},{"error":"Fer-lo ràpid","why":"Aquest múscul estabilitza; entrenar-lo ràpid no reprodueix la seva funció real.","fix":"Compta els segons de la baixada en veu alta si cal.","cause":"Costum d'altres exercicis més grans del programa."}],"progression_html":"<p>15 repeticions netes a les dues sèries, amb el colze quiet tota la sèrie → següent graó de pes i torna a 12. És treball de manteniment: la progressió aquí importa molt menys que a la resta del programa.</p>","note_html":"És l'única fitxa del programa que aïlla el manegot rotador. Si ja notes l'espatlla forta i sense molèsties, no cal que la facis cada cicle.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=JAwG4b0dndc","title":"Seated Banded External Rotation of the Shoulder","confidence":"aproximada","note":"Mostra el patró assegut i amb goma; el gest de rotació amb el colze fix és el mateix que amb politja."},"alternatives":{"principal":{"name":"Rotació externa amb goma, colze al costat","why_equivalent":"Exactament el mateix gest: el colze fix i l'espatlla girant. És, de fet, el mateix moviment de l'escalfament.","adjust":"Ancora la goma a l'alçada del melic; mateix rang de repeticions.","short":"mateix gest, amb goma"},"contingencia":{"name":"Face Pull amb rotació externa (TB‑05)","why_acceptable":"Ja treballa infraespinós i rodó menor, amb més pes però barrejat amb el treball d'esquena.","adjust":"No en tens prou amb la teva sessió de Tronc B habitual; no la dupliquis el mateix dia.","short":"el mateix múscul, ja al cicle"},"not_equivalent":["Rotació interna d'espatlla · el múscul contrari, no un substitut","Press militar · patró d'empenta, no d'aïllament"]},"v22":true,"setup_html":"<ol> <li>Assegut o dempeus, de costat a la politja, amb la politja a l'alçada del melic.</li> <li>Colze doblegat a 90° i enganxat a les costelles del mateix costat.</li> <li>Agafa la nansa amb l'avantbraç creuat davant del cos, com a posició d'inici.</li> <li>Comprova que el colze no es mou quan estires el cable: si es mou, ets massa lluny.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Rotació (2 s).</span> Gira l'avantbraç cap enfora, colze quiet a les costelles, fins on arribis sense forçar.</li> <li><span class=\"key\">Pausa (1 s).</span> Sense que el colze s'obri del cos.</li> <li><span class=\"key\">Retorn (2 s).</span> Controlat, fins a l'avantbraç creuat davant del cos.</li> </ol>","tags":{"primary":["Infraespinós"],"secondary":["Rodó menor"],"minor":[],"traits":["Aïllament"]}},{"key":"AX-06","position":"AX-06","session":"AX","order":6,"name":"Gambada búlgara amb manuelles","category":"ANNEX","category_label":"Annex","machine":{"code":null,"label":"Banc pla i manuelles · no consta a l'inventari M1–M7"},"muscles":"Quàdriceps · gluti","prescription":{"series":"2–3","reps":"8–12 per cama","tempo":"2–3 s ↓","rest":"90 s","rir":"1–2"},"quick":{"do":["Peu del darrere sobre el banc, amb l'empenya (la part de dalt del peu) recolzada","Peu davanter prou avançat perquè el genoll no passi la punta a baix de tot","Pes repartit davant: el peu del darrere gairebé no empeny","Baixa fins que el genoll del darrere gairebé toqui a terra"],"dont":"Deixar caure el genoll davanter cap endins","feel":"Quàdriceps i gluti de la cama del davant","grip":"Manuelles neutres, als costats, sense participar en el moviment"},"theory_html":"<p><span class=\"k\">Què fa, exactament.</span> Un esquat amb una sola cama, amb l'altra recolzada darrere sobre un banc. Gairebé tot el pes el porta la cama del davant, que treballa quàdriceps i gluti en un rang llarg.</p> <p><span class=\"k\">Per què és a l'annex i no al cicle.</span> És l'únic exercici unilateral de cama del programa, i la sessió de Cames ja és la més llarga del cicle amb nou posicions. Hi entra també perquè exigeix més tècnica —equilibri, col·locació del peu del darrere— que la resta d'exercicis de cama, tots guiats per màquina. El disseny general prioritza la simplicitat; aquest exercici en surt.</p> <p><span class=\"k\">Quan té sentit fer-la.</span> Si vols saber si una cama treballa més que l'altra —cosa que cap exercici bilateral et pot dir—, o si busques volum extra de quàdriceps i gluti sense afegir més pes a la premsa.</p>","cues":["Peu del darrere just al centre del banc, sense buscar-hi equilibri","Genoll davanter alineat amb la punta del peu, no cap endins","Tronc alt, sense inclinar-se endavant per compensar","Mateix pes i mateixa distància a totes dues cames"],"setup_steps":["Banc pla darrere teu, a l'alçada del genoll.","Una manuella a cada mà, als costats, presa neutra.","Un peu al centre del banc, amb l'empenya recolzada, no la punta.","L'altre peu, uns dos peus per davant del banc: prova-ho sense pes fins que el genoll baixi net."],"execution_steps":["<span class=\"key\">Baixada (2 s).</span> Doblega el genoll del davant fins que el del darrere gairebé toqui a terra.","<span class=\"key\">Pausa (1 s).</span> Pes repartit; el peu del darrere no empeny.","<span class=\"key\">Pujada (2 s).</span> Empeny des del taló del davant fins a estirar la cama."],"grip_title":"El peu del darrere i la col·locació","grip_html":"<p><span class=\"k\">Distància del banc.</span> Massa a prop, el genoll davanter passa la punta del peu a baix de tot; massa lluny, costa mantenir l'equilibri. Ajusta-ho abans de carregar pes.</p> <p><span class=\"k\">Si el banc és massa alt per començar.</span> Fes-la com una gambada estàtica, amb el peu del darrere a terra en lloc del banc: mateix patró, rang més curt i menys exigència d'equilibri.</p>","notice_html":"<p>Cremor al quàdriceps i al gluti de la cama del davant, i molt poca cosa a la del darrere: si la notes, estàs repenjant-t'hi més del compte. <span class=\"k\">Si notes el genoll del davant</span>, revisa que no caigui cap endins. És normal notar una cama més forta que l'altra: és justament el que aquest exercici t'ensenya.</p>","verify_html":"<p><span class=\"k\">Prova del genoll:</span> mirant-te al mirall de front, el genoll davanter no ha de creuar cap a dins de la línia del peu en cap moment.</p> <p><span class=\"k\">Prova del tronc:</span> de costat, el tors es manté alt; no cal inclinar-se endavant.</p> <p><span class=\"k\">Prova de la baixada:</span> dos segons controlats; si l'última repetició es converteix en una caiguda, la sèrie ha acabat.</p>","errors":[{"error":"El genoll davanter cau cap endins","why":"Perd alineació i el gluti mitjà deixa de controlar el maluc.","fix":"Baixa pes i empeny activament el genoll cap a fora mentre baixes.","cause":"Gluti mitjà fatigat o pes massa alt per a l'equilibri que tens avui."},{"error":"Repenjar-se al peu del darrere","why":"La cama del darrere roba feina a la del davant, que és la que hauria de treballar.","fix":"Redueix el pes fins que puguis aixecar el peu del darrere del banc un instant a cada repetició.","cause":"Cerca d'estabilitat abans que de tensió."},{"error":"Baixar massa de pressa","why":"El genoll del darrere frena de cop i el control desapareix.","fix":"Compta els dos segons de baixada en veu alta si cal.","cause":"Voler acabar la sèrie abans que la tècnica ho permeti."}],"progression_html":"<p>12 repeticions netes a cada cama, a totes les sèries → següent parell de manuelles i torna a 8. Si una cama hi arriba i l'altra no, queda't amb el pes de la cama més fluixa fins que s'igualin.</p>","note_html":"És l'únic exercici unilateral de cama del programa. Si les dues cames no aguanten el mateix pes, no és un error: és informació. Fes sempre primer la cama que et costa més.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=hiLF_pF3EJM","title":"Stop F*cking Up Bulgarian Split Squats (PROPER FORM!)","confidence":"aproximada","note":"Mostra la versió amb manuelles i el mateix criteri de genoll darrere gairebé a terra; els ritmes de tempo són els d'aquesta fitxa, no els del vídeo."},"alternatives":{"principal":{"name":"Gambada estàtica, peu del darrere a terra","why_equivalent":"Mateix patró unilateral de quàdriceps i gluti, amb menys exigència d'equilibri.","adjust":"Peu del darrere una mica enrere i sobre les puntes, en lloc de sobre el banc; mateix rang de repeticions.","short":"mateix patró, sense banc"},"contingencia":{"name":"Leg Press, una cama (C‑01)","why_acceptable":"Mateix múscul principal, guiat i sense el component d'equilibri.","adjust":"La meitat del pes que faries a dues cames; RIR 2.","short":"mateix múscul, guiat"},"not_equivalent":["Gambada caminant amb barra · afegeix un component de desplaçament que això no té","Esquat búlgar amb barra a l'esquena · barra a les espatlles, fora de les línies vermelles"]},"v22":true,"setup_html":"<ol> <li>Banc pla darrere teu, a l'alçada del genoll.</li> <li>Una manuella a cada mà, als costats, presa neutra.</li> <li>Un peu al centre del banc, amb l'empenya recolzada, no la punta.</li> <li>L'altre peu, uns dos peus per davant del banc: prova-ho sense pes fins que el genoll baixi net.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (2 s).</span> Doblega el genoll del davant fins que el del darrere gairebé toqui a terra.</li> <li><span class=\"key\">Pausa (1 s).</span> Pes repartit; el peu del darrere no empeny.</li> <li><span class=\"key\">Pujada (2 s).</span> Empeny des del taló del davant fins a estirar la cama.</li> </ol>","tags":{"primary":["Quàdriceps"],"secondary":["Gluti"],"minor":[],"traits":["Unilateral"]}}],"annex_optional":[{"where":"C-03 / C-03b","what":"Fer les dues, Leg Extension i adducció, en lloc d'alternar-les","cost":"+6 min","when":"Cicles sense cursa exigent a menys de 24 h"},{"where":"C-04","what":"Quarta sèrie de Lying Leg Curl","cost":"+3 min","when":"Setmanes de running baix"},{"where":"C-05","what":"Quarta sèrie de Hip Thrust","cost":"+3 min","when":"Cicles en què el gluti sigui la prioritat"},{"rule":"Amb tot el volum opcional, Cames torna als 90 minuts. Afegeix-ne un, no tots: la sessió no ha de passar de 80 minuts de manera habitual."}],"registre_ui":{"data":"Data de l'entrenament","que_has_fet":"Què has fet","que":{"previst":"Previst","alternativa":"Alternativa","variant":"Variant","substitut":"Substitut · un altre exercici","addicional":"Exercici addicional (no compta al programa)"},"canvia":"Canvia","nom":"Nom de l'exercici","equip":"Equip","nota":"Nota","altra":"Altra…","usat_abans":"Usat abans","tipus_valor_titol":"El número és","tipus_valor":{"carrega":{"etiqueta":"Càrrega","unitat":"kg"},"assistencia":{"etiqueta":"Assistència","unitat":"kg"},"pes_corporal":{"etiqueta":"Pes corporal","unitat":"kg"},"temps":{"etiqueta":"Temps","unitat":"s"}},"tipus_valor_defecte":"carrega","tecnica_titol":"Tècnica","tecnica_cap":"Cap","tecniques":["Dropset","Pausa curta","Parcials","Aguantada","Retracció final"],"tecnica_avis":"Una sèrie amb tècnica no compta per al pes de referència ni per a la comparació.","elimina_serie":"Elimina la sèrie","fet":"Fet","proposta":"Proposta","regla_fitxa":"regla de la fitxa","data_desconeguda_v23":"data desconeguda (V23)","grup":{"2":"una de les dues","3":"una de les tres"},"logica_sessio_boto":"Per què aquesta sessió","logica_sessio_titol":"Per què és una sessió completa","exportar_text":"Text","exportar_csv":"CSV","ajuda_rir":{"capitol":"t2-esforc","apartat":"Com estimar-lo durant la sèrie","boto":"?"},"proposta_textos":{"doble":"{kg} kg a totes les sèries","alternativa":"si alguna baixa de {lo}, {alt} kg","quan":"quan arribis a {hi} a totes, {seg}","pujar":"puja: {seg}","seg_kg":"{seg} kg","seg_sense":"l'increment més petit disponible","inversa":"{kg} kg d'assistència a totes les sèries","treure":"treu un esglaó d'assistència","baixar":"baixa a {kg} kg","baixar_sense":"baixa un esglaó","regla":"segueix la regla de la fitxa"},"boto_addicional":"+ Exercici addicional","addicional_tria":"Tria'n un del document…","addicional_altre":"Un altre (escriu-lo)","paper_exercicis":"Què hi fa cada exercici","o":"o","entrades":"Entrades d'aquesta sessió","una_altra":"+ Una altra entrada"},"grups_variants":{"TA-06":{"regla":"oposada a la de Tronc B"},"TB-06":{"regla":"oposada a la de Tronc A"},"TA-07":{"regla":"alternen cicle a cicle"},"TB-S1":{"regla":"només el cicle que saltes Tronc C"},"C-01":{"regla":"per miniblocs de 3–4 cicles"},"C-03":{"regla":"un cicle sí, un cicle no"},"TC-01":{"regla":"per miniblocs de 3–4 cicles"},"TC-07":{"regla":"alternen cicle a cicle"},"TC-08":{"regla":"alternen per miniblocs"},"C-02":{"regla":"el pes mort, només amb les condicions de la fitxa"}},"ajuda_rir_html":"<h3>Com estimar-lo durant la sèrie</h3>\n<ol>\n<li><b>Recorda el RIR objectiu</b> de la fitxa abans de començar.</li>\n<li><b>Estima'l a les dues o tres últimes repeticions,</b> no a les primeres: a prop del final l'estimació és una mica més fiable.</li>\n<li><b>Fixa't en la velocitat:</b> com més lenta et surt la repetició, menys te'n queden.</li>\n<li><b>Pregunta't «amb la mateixa tècnica, quantes més en faria?»</b> i anota aquesta xifra a l'app.</li>\n</ol>\n<p>De mitjana, la gent creu que li queda una repetició menys de les que li queden, i a les sèries de més de 12 repeticions l'error sol ser més gran. L'apartat següent t'ensenya a comprovar cap a on t'equivoques tu.</p>\n"};

  function rang(k){ var m = MV[k]; if (!m) return null; var x = String(m.prescription.reps || "").match(/(\d+)\s*[–-]\s*(\d+)/); return x ? [+x[1], +x[2]] : null; }
  // D-K (V24-19): mateix càlcul que analitza_registre.py, secció 11. Només pesos ja usats; cap increment inventat.
  function proposal(r){
    var m = MV[r.clau]; if (!m || !m.registre || !m.registre.proposta) return null;

    var cls = (r.que === "previst" || r.que === "variant") ? m.registre.proposta : "doble";

function mix(hex, f){ const c=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)).map(v=>Math.round(255-(255-v)*f));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join(""); }

            <input class="v24in v24eq" data-act="equip" placeholder="${esc(UI.equip)}" value="${esc(st.equip)}">
            <datalist id="dl-${k}">${usats.map(u => `<option value="${esc(u.nom)}">`).join("")}</datalist></div>`;
      if (usats.length) h += `<div class="v24row">${usats.map((u, i) => `<button class="v24chip" data-act="usat" data-i="${i}" data-nom="${esc(u.nom)}" data-eq="${esc(u.equip)}">${esc(UI.usat_abans)}: ${esc(u.nom)}${u.equip ? " · " + esc(u.equip) : ""}</button>`).join("")}</div>`;
    }
    h += `<div class="v24row"><span class="lbl2">${esc(UI.tipus_valor_titol)}</span><div class="v24seg">
      ${Object.keys(UI.tipus_valor).map(t => `<button data-act="tv" data-v="${t}" class="${st.tipus_valor === t ? "on" : ""}">${esc(UI.tipus_valor[t].etiqueta)}</button>`).join("")}</div></div>`;
  }
  if (opc && st.que === "previst") {   // V24-03: opcions del JSON + «Altra…» amb text lliure
    const extra = st.opcio && opc.valors.indexOf(st.opcio) < 0 ? st.opcio : null;
    h += `<div class="v24row"><span class="lbl2">${esc(opc.titol)}</span><div class="v24opts">
      ${opc.valors.map(v => `<button data-act="opc" data-v="${esc(v)}" class="${st.opcio === v ? "on" : ""}">${esc(v)}</button>`).join("")}
      <button data-act="opc-altra" class="${extra ? "on" : ""}">${esc(extra || UI.altra)}</button></div></div>`;
  }
  if (st.data === null) h += `<div class="lasttime">${esc(UI.data_desconeguda_v23)}</div>`;
  if (prev) {
    const ss = (prev.series || []).filter(x => x.valor !== null || x.reps !== null).map(x => `${fmtN(x.valor)}×${x.reps === null ? "–" : x.reps}`).join(" · ");
    h += `<div class="lasttime">Cicle ${prev.cicle}${prev.que !== "previst" ? " · " + esc(prev.nom) : ""}${prev.opcio ? " · " + esc(prev.opcio) : ""} · ${esc(TVL(prev.tipus_valor))}: <b>${ss || "–"}</b></div>`;
  }
  const pt = propText(prop);
  if (pt) h += `<div class="v24prop">${esc(UI.proposta)}: <b>${esc(pt)}</b> · <a data-act="regla">${esc(UI.regla_fitxa)} ›</a></div>`;
  const ph = propPlaceholder(prop, tvInfo.unitat);
  h += `<div class="setrow"><span class="n"></span><span class="lbl">${esc(tvInfo.etiqueta.toUpperCase())}</span>
        <span class="lbl">${st.tipus_valor === "temps" ? "S" : "REPS"}</span><span class="lbl">RIR<button class="v24help" data-act="rir">${esc(UI.ajuda_rir.boto)}</button></span><span></span></div>`;
  st.series.forEach((x, i) => {
    h += `<div class="setrow"><span class="n">${i + 1}</span>
      <input inputmode="decimal" placeholder="${esc(ph)}" value="${esc(x.valor_brut !== undefined && x.valor_brut !== "" ? x.valor_brut : fmtN(x.valor))}" data-f="valor" data-i="${i}">
      <input inputmode="numeric" placeholder="${st.tipus_valor === "temps" ? "s" : "reps"}" value="${x.reps === null ? "" : x.reps}" data-f="reps" data-i="${i}">
      <input inputmode="numeric" placeholder="RIR" value="${x.rir === null || x.rir === undefined ? "" : x.rir}" data-f="rir" data-i="${i}">
      <button class="rmset" data-act="menu" data-i="${i}">⋯</button></div>`;
    if (x.tecnica) h += `<div class="setrow"><span></span><span class="v24tec"><span class="v24chip">${esc(UI.tecnica_titol)}: ${esc(x.tecnica)}</span></span></div>`;
  });
  if (st.obert) h += `<div class="v24row"><input class="v24in" data-act="nota" placeholder="${esc(UI.nota)}" value="${esc(st.nota)}"></div>`;
  h += `<div class="logacts"><button class="addset" data-act="add">+ sèrie</button><button class="savelog" data-act="save">Desa</button></div>`;
  box.innerHTML = h;
  box.querySelectorAll("input[data-f]").forEach(inp => inp.oninput = () => {
    const x = st.series[+inp.dataset.i], v = inp.value.trim();
    if (inp.dataset.f === "valor") { x.valor_brut = v; x.valor = REG.num(v); } else x[inp.dataset.f] = REG.num(v);
  });
  box.querySelectorAll("[data-act]").forEach(el => {
    const a = el.dataset.act;
    if (a === "que") el.onchange = () => { const v = el.value;
      if (v === "previst") { st.que = "previst"; st.nom = m.name; }
      else if (v.indexOf("alt:") === 0) { st.que = "alternativa"; st.nom = v.slice(4); st.opcio = null; }
      else { st.que = "substitut"; if (st.nom === m.name) st.nom = ""; st.opcio = null; }
      renderLog(k); };
    else if (a === "nom") el.oninput = () => { st.nom = el.value; };
    else if (a === "equip") el.oninput = () => { st.equip = el.value; };
    else if (a === "nota") el.oninput = () => { st.nota = el.value; };
    else el.onclick = () => {
      if (a === "obre") { st.obert = true; renderLog(k); }
      else if (a === "usat") { st.nom = el.dataset.nom; st.equip = el.dataset.eq; renderLog(k); }
      else if (a === "entrada") { PST[k] = newState(k, +el.dataset.i); renderLog(k); }
      else if (a === "nova") { PST[k] = newState(k, "nou"); renderLog(k); }
      else if (a === "tv") { st.tipus_valor = el.dataset.v; renderLog(k); }
      else if (a === "opc") { st.opcio = st.opcio === el.dataset.v ? null : el.dataset.v; renderLog(k); }
      else if (a === "opc-altra") { const v = window.prompt(UI.altra, ""); if (v && v.trim()) st.opcio = v.trim(); renderLog(k); }
      else if (a === "regla") openModal(k);
      else if (a === "rir") openRirHelp();
      else if (a === "menu") openSetMenu(k, +el.dataset.i);
      else if (a === "add") { st.series.push(emptySet()); renderLog(k); }
      else if (a === "save") doSave(k, el);
    };
  });
}

function doSave(k, btn){
  const st = PST[k], m = mv(k);
  const series = st.series.filter(x => String(x.valor_brut || "").trim() !== "" || x.reps !== null)
    .map(x => ({valor: REG.num(x.valor_brut), valor_brut: String(x.valor_brut || ""), reps: x.reps, rir: x.rir, tecnica: x.tecnica || null}));
  const rec = {id: st.id || null, cicle: cycle, sessio: sess, posicio: m.position, clau: k, que: st.que, opcio: st.opcio,
    nom: st.que === "previst" ? m.name : (st.nom || ""), equip: st.equip || "", tipus_valor: st.tipus_valor,
    series: series, nota: st.nota || "", data: st.data === null ? null : sessDate()};
  if (st.ref_v23) { rec.ref_v23 = st.ref_v23; rec.origen = "V23 reetiquetat"; }
  let ok = true; try { st.id = REG.save(rec); } catch(e) { ok = false; }
  btn.textContent = ok ? "Desat ✓" : "No s'ha pogut desar";
  setTimeout(() => { delete PST[k]; renderList(true); }, 700);
}

// ── exportació (V24-08 · D-D): pestanyes Text i CSV ──
function exportText(){
  let out = `RUTINA HIPERTRÒFIA — registre\nExportat: ${new Date().toLocaleString("ca-ES")}\n`;
  const recs = REG.all(), cicles = Array.from(new Set(recs.map(r => r.cicle))).sort((a, b) => a - b);
  cicles.forEach(c => {
    let block = "";
    ORDER.forEach(s => {
      let sb = "";
      recs.filter(r => r.cicle === c && r.sessio === s).sort((a, b) => ((mv(a.clau) || {}).order || 99) - ((mv(b.clau) || {}).order || 99)).forEach(r => {
        const sets = (r.series || []).filter(x => x.valor !== null || x.reps !== null); if (!sets.length) return;
        const m = mv(r.clau), unit = (UI.tipus_valor[r.tipus_valor] || {}).unitat || "kg";
        const extra = [r.que !== "previst" ? (UI.que[r.que] || r.que) + ": " + r.nom : "", r.opcio || "", r.equip || "",
                       (r.tipus_valor !== "carrega" && r.tipus_valor !== "incert") ? TVL(r.tipus_valor) : "", r.data || ""].filter(Boolean).join(" · ");
        sb += `  ${m ? m.position : "+"} ${m && r.que === "previst" ? m.name : (r.nom || "")}${extra ? "  [" + extra + "]" : ""}\n     ` +
          sets.map((x, i) => `S${i + 1} ${x.valor_brut || fmtN(x.valor) || "–"}${unit} × ${x.reps === null ? "–" : x.reps} (RIR ${x.rir === null || x.rir === undefined ? "–" : x.rir})${x.tecnica ? " [" + x.tecnica + "]" : ""}`).join("  ") + "\n";
      });
      if (sb) block += ` ${D.sessions[s].name}\n${sb}`;
    });
    if (block) out += `\n═══ CICLE ${c} ═══\n${block}`;
  });
  if (!recs.length) out += "\n(encara no hi ha cap sèrie registrada)\n";
  return out;
}

     ${sec("Alternatives", altsHtml(m.alternatives), true)}
     ${m.cues&&m.cues.length?sec("Cues tècniques",`<ul class="cues">${m.cues.map(c=>`<li>${c}</li>`).join("")}</ul>`):""}
     ${sec("Què has de notar", m.notice_html)}
     ${sec("Comprovacions", m.verify_html)}
     ${errs?sec("Errors habituals", errs):""}
     ${sec("Progressió", m.progression_html)}
     ${m.optional_extra?sec("Volum opcional", `<p>${m.optional_extra}</p>`):""}
     ${sec("Teoria", m.theory_html)}
     ${m.note_html?sec("Nota", m.note_html):""}
     ${(m.extra_sections||[]).map(e=>sec(e.title, e.html)).join("")}
   </div>`;
  document.getElementById("modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  document.getElementById("mclose").onclick = closeModal;
  document.getElementById("modal").scrollTop = 0;
}
function altsHtml(a){
  if(!a) return "";
  const one = (lbl,x,why) => `<p><b>${lbl}:</b> ${x.name}. ${why||""} <i>Ajust:</i> ${x.adjust}</p>`;
  return one("Principal", a.principal, a.principal.why_equivalent)
       + one("Contingència", a.contingencia, a.contingencia.why_acceptable)
       + (a.not_equivalent&&a.not_equivalent.length?`<p><b>No equivalents:</b> ${a.not_equivalent.join(" · ")}</p>`:"");
}
// volum opcional de l'annex: només a les sessions a què fa referència (camp «where»)
function optRows(s){ return (D.annex_optional||[]).filter(r => r.where && r.where.split(" / ").some(k => mv(k) && mv(k).session===s)); }
function hasOptional(s){ return optRows(s).length > 0; }
function openOptional(){
  const rows = optRows(sess), rule = (D.annex_optional||[]).find(r => r.rule);
  document.getElementById("modal").innerHTML = `
   <div class="mtop"><button class="mclose" id="mclose">←</button>
     <div class="mtitle">El volum que pots recuperar<small>${D.sessions[sess].name} · annex</small></div></div>
   <div class="mbody"><div class="secbody">
     <table><tr><th>Posició</th><th>Opcional</th><th>Cost</th><th>Quan</th></tr>
     ${rows.map(r=>`<tr><td><b>${r.where}</b></td><td>${r.what}</td><td>${r.cost}</td><td>${r.when}</td></tr>`).join("")}</table>
     ${rule?`<div class="vidnote">${rule.rule}</div>`:""}</div></div>`;
  document.getElementById("modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  document.getElementById("mclose").onclick = closeModal;
}
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
  document.body.style.overflow = "";
}

function openWarmup(){
  const S = D.sessions[sess], w = S.warmup;
  document.getElementById("modal").innerHTML = `
   <div class="mtop"><button class="mclose" id="mclose">←</button>
     <div class="mtitle">Escalfament<small>${S.name} · ${w.duration}</small></div></div>
   <div class="mbody">
     <div class="secbody"><ol>${w.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
     <div class="vidnote" style="background:var(--panel);border-color:var(--soft)">${w.why}</div></div>
   </div>`;
  document.getElementById("modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  document.getElementById("mclose").onclick = closeModal;
}

// ═══ exportació ═══
// ═══ cicle ═══
function renderCycle(){ document.getElementById("cyclen").textContent = cycle; }
function bumpCycle(d){
  cycle = Math.max(1, cycle + d);
  localStorage_set("ui:cycle", String(cycle));
  renderCycle(); renderList();
}

// ═══ arrencada ═══
function boot(){
  // prova real d'escriptura abans de decidir si avisem
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ storeOK = false; }
  if(!storeOK){
    document.getElementById("warnbar").classList.remove("hidden");
  }
  setAccent(sess); renderTabs(); renderCycle(); renderList();
  document.getElementById("cyup").onclick = () => bumpCycle(1);
  document.getElementById("cydown").onclick = () => bumpCycle(-1);
  document.getElementById("btnexport").onclick = exportLog;
  document.getElementById("btntop").onclick = () => window.scrollTo({top:0,behavior:"smooth"});
  window.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });
}
document.addEventListener("DOMContentLoaded", boot);
</script>
