 torna a baixar sense deixar que la corda t'estiri.</li> </ol>","tags":{"primary":["Tríceps, cap llarg"],"secondary":[],"minor":[],"traits":["Estirament"]},"registre":{"proposta":"doble"}},{"key":"TC-05","position":"TC-05","session":"TC","order":6,"name":"Elevacions laterals a politja","category":"FIX","category_label":"Fix","machine":{"code":null,"label":"Torre de politges, politja baixa amb nansa simple · no consta a l'inventari M1–M7"},"muscles":"Deltoide lateral","prescription":{"series":"3","reps":"12–20","tempo":"2–3 s ↓","rest":"30 s","rir":"0–1"},"quick":{"do":["Politja a l'alçada més baixa, amb nansa simple","De costat a la torre, amb la torre a la banda contrària del braç que treballa","Agafa la nansa passant-la per davant del cos: el cable creua en diagonal","Comença sempre pel braç més feble i iguala el fort a les seves repeticions"],"dont":"Deixar que la pila toqui fons entre repeticions","feel":"Crema al costat de l'espatlla des del primer centímetre","grip":"Neutra — palmell cap al cos, i no gira"},"theory_html":"<p><span class=\"k\">Per què una tercera vegada.</span> El deltoide lateral és el múscul que més decideix l'<span class=\"k\">amplada de les espatlles vista de front</span>, i alhora és petit, es recupera de pressa i no genera fatiga general. És el perfil exacte del múscul que agraeix freqüència: tres estímuls repartits pesen més que dos, i aquest arriba a la sessió menys exigent del cicle.</p> <p><span class=\"k\">Per què aquí sempre és politja i a un braç.</span> Per dos motius pràctics: evita fer tres sessions seguides amb la mateixa eina, i treballar un braç cada vegada <span class=\"k\">és l'única manera de veure si una espatlla puja diferent de l'altra</span>. A dues mans, el costat fort compensa i no te n'assabentes.</p> <p><span class=\"k\">La col·locació és el 90% de l'exercici.</span> Creuant el cable per davant del cos, el braç arrenca per dins de la línia del tronc i el deltoide comença estirat, que és on la manuella no dona res.</p>","cues":["Puja el colze, no la mà","Atura't a l'alçada de l'espatlla, ni un dit més amunt","Baixa fins que la mà creui una mica la línia del cos","La tensió no s'apaga mai: la pila no toca fons","Coll llarg i espatlla avall abans de cada repetició"],"setup_steps":["Politja a l'<span class=\"key\">alçada més baixa</span>, amb una nansa simple.","Col·loca't <span class=\"key\">de costat a la torre</span>, amb la torre a la banda contrària del braç que treballarà.","Agafa la nansa amb el braç més allunyat, passant-la <span class=\"key\">per davant del cos</span>: el cable creua el cos en diagonal.","Peus a l'amplada dels malucs i mà lliure agafada a la torre. Colze amb 10–15° de flexió, que no canvia en tota la sèrie."],"grip_html":"<p><span class=\"k\">Presa neutra, i no gira.</span> Palmell cap al cos de principi a fi. Girar-lo cap avall al punt alt rota l'espatlla cap endins en la posició amb menys espai articular.</p> <p><span class=\"k\">La mà només enganxa la nansa.</span> Estrènyer-la amb força tensa l'avantbraç i el fa entrar en un exercici que no és seu. Agafada ferma però relaxada.</p> <p><span class=\"k\">Per on passa el cable.</span> Per davant del cos, no per darrere ni pel costat. Si el cable et passa per darrere del canell, el braç arrenca fora de la línia i la primera part del recorregut se't fa impossible.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat i lleugerament endavant, fins a l'alçada de l'espatlla.","<span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més amunt que el canell.","<span class=\"key\">Baixada (3 s).</span> Torna fins que la mà creui una mica la línia del cos, sense deixar que la pila reposi.","Fes totes les repeticions d'un braç començant pel més feble, canvia de costat sense descansar i descansa 30 s en acabar els dos."],"notice_html":"<p>Crema al costat de l'espatlla, present ja a les primeres repeticions. <span class=\"k\">Si el que notes és el coll</span>, el trapezi ha pres el relleu. <span class=\"k\">Si notes l'espatlla per dins</span>, has passat de l'horitzontal o has girat el palmell cap avall.</p>","verify_html":"<p><span class=\"k\">Prova de la col·locació:</span> a la posició inicial, la mà queda lleugerament creuada per davant de la cuixa contrària.</p> <p><span class=\"k\">Prova dels dos braços:</span> has de poder fer les mateixes repeticions amb tots dos sense que el tronc es mogui gens. Si el segon en fa menys, iguala'l al feble i no a l'inrevés.</p> <p><span class=\"k\">Prova de la pila:</span> si sents el cop dels pesos entre repeticions, has perdut la tensió que era el motiu de fer-ho a politja.</p>","errors":[{"error":"Encongir l'espatlla cap a l'orella","why":"El trapezi fa la feina i el deltoide en queda fora. És el teu error més repetit.","fix":"Coll llarg i espatlla avall abans de cada repetició; si no es manté, baixa la càrrega.","cause":"Amb tensió des del primer centímetre, l'espatlla puja buscant on fer força abans que el deltoide arrenqui."},{"error":"Pujar per sobre de l'espatlla","why":"Per sobre de l'horitzontal hi entra el trapezi superior i l'espai de l'espatlla s'estreny.","fix":"Atura't a l'alçada de l'espatlla.","cause":"Amb tensió constant el braç encara pot continuar, i l'horitzontal no es nota com un final."},{"error":"Igualar el braç feble pel fort","why":"És l'única exposició del cicle a un braç, i per tant l'única que pot corregir una asimetria en comptes d'amagar-la.","fix":"Comença pel braç feble i fes amb el fort les repeticions que ha fet el feble, encara que en poguessis fer més.","cause":"Es comença pel braç dominant i el segon ha d'arribar on ha arribat el primer."},{"error":"Aixecar els talons","why":"L'has detectat tu. Si els talons pugen, el cos pot ajudar a moure el pes i les repeticions deixen de ser comparables.","fix":"Peus plans i talons a terra a totes les repeticions; si no es mantenen, baixa de pes."}],"progression_html":"<p>Per repeticions abans que per pes: de 12 a 20 amb la mateixa càrrega, i llavors un sol increment i tornada a 12.</p>","note_html":"Aquesta és la tercera de les tres exposicions de deltoide lateral del cicle, i l'única que es fa sempre amb la mateixa eina: les de Tronc A i Tronc B alternen entre elles.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie, <span class=\"k\">dropset</span>: baixa un o dos esglaons de la pila en acabar cada braç i continua sense descansar. Fes-ho als dos braços o a cap.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=eihMRam0P2Q","title":"Low Cable Lateral Raise: How To","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Elevació lateral a màquina","why_equivalent":"Mateix pla d'abducció amb trajectòria guiada.","adjust":"Pes similar al de la politja; mateix RIR.","short":"mateix pla, guiada"},"contingencia":{"name":"Elevacions laterals amb manuelles","why_acceptable":"És l'altra variant d'aquesta posició. Perd la tensió constant, guanya llibertat de trajectòria.","adjust":"Comença un esglaó per sota: sense politja, els primers graus costen més.","short":"mateixa abducció, trajectòria lliure"},"not_equivalent":["Press militar · treball per sobre del cap","Remada al mentó · risc d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Politja a l'<span class=\"key\">alçada més baixa</span>, amb una nansa simple.</li> <li>Col·loca't <span class=\"key\">de costat a la torre</span>, amb la torre a la banda contrària del braç que treballarà.</li> <li>Agafa la nansa amb el braç més allunyat, passant-la <span class=\"key\">per davant del cos</span>: el cable creua el cos en diagonal.</li> <li>Peus a l'amplada dels malucs i mà lliure agafada a la torre. Colze amb 10–15° de flexió, que no canvia en tota la sèrie.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat i lleugerament endavant, fins a l'alçada de l'espatlla.</li> <li><span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més amunt que el canell.</li> <li><span class=\"key\">Baixada (3 s).</span> Torna fins que la mà creui una mica la línia del cos, sense deixar que la pila reposi.</li> <li>Fes totes les repeticions d'un braç començant pel més feble, canvia de costat sense descansar i descansa 30 s en acabar els dos.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide lateral"],"secondary":[],"minor":[],"traits":["Tercera exposició","Unilateral"]},"registre":{"proposta":"doble"}},{"key":"TC-06","position":"TC-06","session":"TC","order":7,"name":"Crunch amb disc al pit","category":"FIX","category_label":"Fix","machine":{"code":null,"label":"A terra, amb un disc"},"muscles":"Recte abdominal","prescription":{"series":"3","reps":"10–15","tempo":"3‑1‑2‑1","rest":"60 s","rir":"0–1"},"quick":{"do":["Estirat de panxa amunt, genolls doblegats i peus plans a terra","Disc creuat sobre el pit, subjectat amb les dues mans","Barbeta separada del pit, com si hi tinguessis una pilota de tennis","Lumbar en contacte amb el terra abans de la primera repetició"],"dont":"Doblegar-te pel maluc: llavors treballa el flexor del maluc i no l'abdomen","feel":"Enrotllament de l'abdomen, curt i concentrat","grip":"Dues mans creuades i quietes sobre el disc"},"grip_title":"El disc i la càrrega","theory_html":"<p><span class=\"k\">L'abdomen és un múscul, i s'entrena com un múscul.</span> La seva funció més coneguda és <span class=\"k\">acostar les costelles a la pelvis</span>, que és el que fas aquí. I com qualsevol altre múscul, creix amb càrrega que va pujant, no amb repeticions infinites: quan els crunchs es fan fàcils, afegir repeticions només acumula temps. Aquesta és l'única posició de core del programa on la progressió és per pes, i per això obre el bloc.</p> <p><span class=\"k\">Doblegar-se no és el mateix que girar sobre el maluc.</span> Aquí la columna <span class=\"k\">s'enrotlla</span> i el moviment s'acaba de seguida. Si el que es mou és el tronc sencer pujant recte cap als genolls, el que treballa és el flexor del maluc i l'abdomen només hi va enganxat.</p> <p><span class=\"k\">El que aquestes sèries no faran.</span> Fer créixer i enfortir l'abdomen, sí. Que es vegi depèn del greix que el tapa, i això es decideix a taula. Entrenar-lo més dies no accelera aquella part, i saber-ho estalvia mesos de sèries fetes amb l'expectativa equivocada.</p>","cues":["Acosta les costelles a la pelvis: el moviment és curt","Els omòplats se separen del terra; la part baixa de l'esquena no","Pausa d'1 segon amb l'abdomen ben contret","Baixada de 3 s fins que les espatlles freguin el terra","El coll no fa força: la mirada va al sostre"],"setup_steps":["Estirat de panxa amunt, genolls doblegats i peus plans a terra a l'amplada dels malucs.","Un disc creuat sobre el pit, subjectat amb les <span class=\"key\">dues mans</span>. Comença lleuger.","Barbeta separada del pit, com si hi tinguessis una pilota de tennis.","<span class=\"key\">Lumbar en contacte amb el terra</span> abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Les mans només aguanten.</span> Creuades i quietes sobre el disc, contra el pit. Si empenyen el disc cap amunt, la càrrega es converteix en impuls i el mateix disc deixa de comptar igual.</p> <p><span class=\"k\">Quin disc és el correcte.</span> El que et deixi fer 15 repeticions amb una pausa neta a dalt i la part baixa de l'esquena sempre en contacte amb el terra. Si necessites impuls o la lumbar es desenganxa, has pujat massa aviat.</p> <p><span class=\"k\">On portar-lo.</span> Contra el pit és la posició de partida. Sostenir-lo amb els braços estesos per sobre del cap allarga la palanca i fa la repetició més dura sense canviar de disc: és un esglaó intermedi si no tens el disc següent.</p>","execution_steps":["<span class=\"key\">Flexió (2 s).</span> Acosta les costelles a la pelvis contraient l'abdomen. Els omòplats se separen del terra; la part baixa de l'esquena no.","<span class=\"key\">Contracció (1 s)</span> al punt alt, amb l'abdomen ben contret.","<span class=\"key\">Baixada (3 s)</span> fins que les espatlles freguin el terra, sense recolzar-t'hi del tot ni deixar-te caure.","<span class=\"key\">Pausa (1 s)</span> sense perdre la tensió abans de la repetició següent."],"notice_html":"<p>Crema concentrada a l'abdomen, curta i que arriba de seguida. <span class=\"k\">Si el que notes és el coll</span>, estàs estirant la barbeta cap al pit per arrencar. <span class=\"k\">Si el que notes és la part baixa de l'esquena o l'engonal</span>, has deixat de doblegar-te i has començat a girar sobre el maluc.</p>","verify_html":"<p><span class=\"k\">Prova de la lumbar:</span> posa't la mà sota la part baixa de l'esquena abans de començar. Durant tota la sèrie hi ha de fer pressió.</p> <p><span class=\"k\">Prova de les mans:</span> si notes els braços o les espatlles més que l'abdomen, estàs empenyent el disc en comptes de sostenir-lo.</p> <p><span class=\"k\">Prova del pes:</span> has de poder fer 15 repeticions amb una pausa neta a dalt.</p>","errors":[{"error":"Doblegar-se pel maluc","why":"Llavors treballa el flexor del maluc i no l'abdomen, i la lumbar es desenganxa del terra amb pes al pit.","fix":"El moviment és curt i d'enrotllament. Si vols més dificultat, més disc, no més recorregut.","cause":"Es busca més recorregut quan la flexió de columna ja s'ha acabat."},{"error":"Estirar la barbeta cap al pit","why":"Carrega el coll, que és justament la zona que el programa vigila, i no afegeix res a l'abdomen.","fix":"Barbeta separada i mirada al sostre, no als genolls.","cause":"El coll s'afegeix per arrencar quan l'abdomen encara no s'ha activat."},{"error":"Empènyer el disc amb els braços","why":"Converteix la càrrega en impuls i deixa de ser progressió.","fix":"Mans creuades i quietes sobre el disc. Si es mouen, baixa de pes.","cause":"Quan el pes és alt, els braços l'acompanyen cap amunt per ajudar la pujada."}],"progression_html":"<p>15 repeticions netes a les tres sèries amb pausa a dalt → disc següent i tornada a 10. Si no tens el disc següent, allarga primer la palanca portant el mateix disc per sobre del cap.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=G8937xqkxDo","title":"Machine Crunch | Proper Form Tutorial for Stronger Abs","confidence":"aproximada","note":"Mostra la versió a màquina: el patró de flexió és el mateix, l'aparell no."},"alternatives":{"principal":{"name":"Crunch a la màquina, si n'hi ha de lliure","why_equivalent":"Mateixa flexió de columna amb càrrega progressable i trajectòria guiada.","adjust":"Coixí a la part alta del pit i eix de gir a la cintura; les mans només subjecten.","short":"mateixa flexió, càrrega guiada"},"contingencia":{"name":"Crunch amb el pes del cos, braços creuats al pit","why_acceptable":"Manté la flexió de columna sense càrrega externa. Deixa de ser progressable per pes.","adjust":"Puja repeticions i allarga la baixada abans de buscar càrrega.","short":"mateixa flexió, sense càrrega"},"not_equivalent":["Elevació de cames · antiextensió, no flexió","Gir rus · rotació"]},"v22":true,"setup_html":"<ol> <li>Estirat de panxa amunt, genolls doblegats i peus plans a terra a l'amplada dels malucs.</li> <li>Un disc creuat sobre el pit, subjectat amb les <span class=\"key\">dues mans</span>. Comença lleuger.</li> <li>Barbeta separada del pit, com si hi tinguessis una pilota de tennis.</li> <li><span class=\"key\">Lumbar en contacte amb el terra</span> abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Flexió (2 s).</span> Acosta les costelles a la pelvis contraient l'abdomen. Els omòplats se separen del terra; la part baixa de l'esquena no.</li> <li><span class=\"key\">Contracció (1 s)</span> al punt alt, amb l'abdomen ben contret.</li> <li><span class=\"key\">Baixada (3 s)</span> fins que les espatlles freguin el terra, sense recolzar-t'hi del tot ni deixar-te caure.</li> <li><span class=\"key\">Pausa (1 s)</span> sense perdre la tensió abans de la repetició següent.</li> </ol>","tags":{"primary":["Recte abdominal"],"secondary":[],"minor":[],"traits":["Flexió amb càrrega"]},"registre":{"proposta":"doble"}},{"key":"TC-07","position":"TC-07","session":"TC","order":8,"name":"Elevació de cames estirat","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"A terra o en un banc pla"},"muscles":"Recte abdominal · antiextensió lumbar","prescription":{"series":"2","reps":"8–12","tempo":"3‑1‑2‑0","rest":"60 s","rir":"1–2"},"quick":{"do":["Estirat de panxa amunt, cames juntes i esteses","Mans planes sota el gluti o agafades a la vora del banc","Lumbar en contacte amb la superfície abans de començar","Puja les cames a la vertical: aquest és el punt de partida"],"dont":"Baixar fins al terra amb la lumbar arquejada","feel":"Tensió sostinguda a tot l'abdomen, sobretot per sota del melic","grip":"Mans planes sota el gluti, o agafat a la vora del banc"},"grip_title":"La col·locació i la palanca","theory_html":"<p><span class=\"k\">Aquí l'abdomen no es dobla: aguanta.</span> És l'altra manera de treballar-lo, i la que fa servir el cos tot el dia. Les cames baixen i estiren la pelvis cap endavant; <span class=\"k\">tota la feina consisteix a impedir que la lumbar les segueixi</span>. Si la lumbar es desenganxa, l'exercici deixa d'existir i qui treballa és la columna.</p> <p><span class=\"k\">La feina és la baixada.</span> La pujada només et torna al punt de partida. Si puges ràpid i baixes poc, el que treballa és el flexor del maluc —el múscul que puja el genoll— i l'abdomen queda de comparsa. És l'error que converteix aquest exercici en un dels més mal fets del gimnàs.</p> <p><span class=\"k\">Per què alterna amb el reverse crunch.</span> Són dos exercicis que s'assemblen molt en la postura i demanen coses contràries: aquí el maluc no es mou; allà, s'ha de separar. Alternant-los, cap de les dues maneres de treballar l'abdomen queda fora i la sessió cap en el temps previst.</p>","cues":["Baixa les cames esteses, lent, sense perdre la pressió de la lumbar","Atura't al punt més baix que controles, encara que sembli curt","No toquis la superfície amb els talons entre repeticions","Puja movent només el maluc, sense impuls","Guanya rang abans de pensar a allargar més les cames"],"setup_steps":["Estirat de panxa amunt, en un banc o a terra, amb les cames juntes i esteses.","Mans planes sota el gluti, o agafades a la vora del banc per sobre del cap.","<span class=\"key\">Lumbar en contacte amb la superfície</span>: aquesta pressió no es perd en tota la sèrie.","Puja les cames fins a la vertical: aquest és el punt de partida, no el d'arribada."],"grip_html":"<p><span class=\"k\">Les mans donen la referència.</span> Sota el gluti ajuden a mantenir la pelvis quieta; agafades a la vora del banc per sobre del cap, fixen el tronc i permeten més rang. Tria'n una i fes-la sempre igual.</p> <p><span class=\"k\">La palanca és la progressió.</span> Amb els genolls recollits l'exercici és fàcil; amb les cames del tot esteses és molt més dur, sense canviar res més. És l'esglaó que has de fer servir abans de pensar en llast.</p> <p><span class=\"k\">Decideix la llargada abans de començar.</span> Recollir els genolls a mitja sèrie és una regressió legítima, però si passa sense comptar-ho has canviat d'exercici enmig.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Baixa les cames esteses tan avall com puguis sense que la lumbar es desenganxi. Aquí és on es fa l'exercici.","<span class=\"key\">Pausa (1 s)</span> al punt més baix que controles, sense tocar la superfície amb els talons.","<span class=\"key\">Pujada (2 s)</span> fins a la vertical, movent només el maluc.","Encadena la repetició següent sense descansar a dalt."],"notice_html":"<p>Tensió sostinguda a tot l'abdomen, sobretot per sota del melic, que creix a mesura que les cames baixen. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, la lumbar ja s'ha desenganxat. <span class=\"k\">Si el que notes és el davant de la cuixa i l'engonal</span>, el flexor del maluc ha agafat la feina: inverteix el ritme i allarga la baixada.</p>","verify_html":"<p><span class=\"k\">Prova de la mà:</span> posa una mà plana sota la part baixa de l'esquena. El punt on deixes de notar pressió és el teu punt baix. No el negociïs per baixar més.</p> <p><span class=\"k\">Prova del ritme:</span> la baixada dura tres segons i la pujada dos. Si les cames pugen més ràpid que no baixen, has convertit l'exercici en el contrari del que és.</p> <p><span class=\"k\">Prova de la palanca:</span> si arribes a 12 repeticions netes amb les cames del tot esteses i el rang complet, la posició ja no et queda gran: entra el llast als turmells.</p>","errors":[{"error":"La lumbar es desenganxa a la baixada","why":"Sense la lumbar enganxada l'exercici desapareix i la columna treballa en extensió amb la palanca de les dues cames.","fix":"Atura la baixada on encara notes la pressió a la mà. Aquell rang és el teu.","cause":"Es busca tot el recorregut fins al terra i la pelvis acompanya les cames quan l'abdomen ja no pot."},{"error":"Recollir els genolls a mitja sèrie","why":"És una regressió legítima, però si passa sense comptar-ho has canviat d'exercici enmig.","fix":"Tria la llargada de cama abans de començar. Si has de recollir, comença ja recollit.","cause":"Doblegar els genolls escurça la palanca i fa la baixada molt més fàcil."},{"error":"Deixar caure els talons entre repeticions","why":"Tocar la superfície apaga la tensió i deixa la repetició següent sense el punt més útil del recorregut.","fix":"Atura't un pam per sobre. Si no pots, la sèrie s'ha acabat.","cause":"El punt baix es fa servir com a descans quan la sèrie es fa llarga."}],"progression_html":"<p>12 repeticions netes a les dues sèries amb el rang complet → allarga la palanca: de genolls recollits a mig estesos, i de mig estesos a del tot estesos, tornant a 8 cada vegada. El llast als turmells entra al final.</p>","note_html":"El rang que aguantes aquí amb la lumbar enganxada és el mateix que has de respectar a la resta del bloc de core.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=JB2oyawG9KI","title":"How To Do A LYING LEG RAISE","confidence":"aproximada","note":"Mostra el patró general; el criteri de la lumbar enganxada és el d'aquesta fitxa."},"alternatives":{"principal":{"name":"Elevació de cames en banc inclinat, cap amunt","why_equivalent":"Mateixa antiextensió amb la pelvis fixada pel banc i més rang.","adjust":"Comença amb poca inclinació: el rang creix de pressa.","short":"mateixa funció, més rang"},"contingencia":{"name":"Dead bug amb cames alternades","why_acceptable":"Mateixa feina d'impedir que la lumbar s'arquegi, amb una cama cada vegada.","adjust":"Mateix criteri de la lumbar; per temps en comptes de repeticions.","short":"mateixa funció, una cama"},"not_equivalent":["Crunch · flexió de columna, no antiextensió","Elevació de genolls amb impuls · el maluc fa la feina"]},"v22":true,"setup_html":"<ol> <li>Estirat de panxa amunt, en un banc o a terra, amb les cames juntes i esteses.</li> <li>Mans planes sota el gluti, o agafades a la vora del banc per sobre del cap.</li> <li><span class=\"key\">Lumbar en contacte amb la superfície</span>: aquesta pressió no es perd en tota la sèrie.</li> <li>Puja les cames fins a la vertical: aquest és el punt de partida, no el d'arribada.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Baixa les cames esteses tan avall com puguis sense que la lumbar es desenganxi. Aquí és on es fa l'exercici.</li> <li><span class=\"key\">Pausa (1 s)</span> al punt més baix que controles, sense tocar la superfície amb els talons.</li> <li><span class=\"key\">Pujada (2 s)</span> fins a la vertical, movent només el maluc.</li> <li>Encadena la repetició següent sense descansar a dalt.</li> </ol>","tags":{"primary":["Recte abdominal"],"secondary":[],"minor":[],"traits":["Antiextensió lumbar"]},"registre":{"opcions":{"titol":"On el fas","valors":["A terra","Banc pla"]},"proposta":"regla"}},{"key":"TC-07b","position":"TC-07","session":"TC","order":9,"name":"Reverse crunch","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"A terra o en un banc pla"},"muscles":"Recte abdominal, porció inferior","prescription":{"series":"2","reps":"12–20","tempo":"3‑1‑2‑0","rest":"60 s","rir":"0–1"},"quick":{"do":["Estirat de panxa amunt, genolls doblegats a 90° i cames juntes","Cuixes a la vertical: els genolls just sobre els malucs","Mans planes al costat dels malucs o agafades a la vora del banc","Comença sense llast: el criteri és que el maluc se separi"],"dont":"Llançar les cames amunt i deixar el maluc a terra","feel":"Abdomen per sota del melic, en un recorregut curt","grip":"Mans planes al costat del maluc, o agafat a la vora del banc"},"grip_title":"La col·locació i la palanca","theory_html":"<p><span class=\"k\">La meitat de baix del mateix múscul.</span> L'abdomen és un sol múscul, però es pot escurçar per dalt o per baix. Al crunch són les costelles les que baixen cap a la pelvis; aquí és <span class=\"k\">la pelvis la que puja cap a les costelles</span>, i la zona de sota el melic hi treballa molt més.</p> <p><span class=\"k\">Una sola variable: el maluc se separa o no.</span> És el criteri de tot l'exercici. Portar els genolls cap al pit sense enrotllar la pelvis és flexió de maluc, i l'abdomen no s'escurça gens. El recorregut útil són pocs centímetres, i si et sembla llarg és que és buit.</p> <p><span class=\"k\">Per què dues sèries.</span> Perquè aquesta posició es fa bé o no es fa. Val més dues sèries amb el maluc separant-se que tres comptant repeticions que no han passat.</p>","cues":["Enrotlla la pelvis: el maluc se separa de la superfície","Pensa a portar el pubis cap al melic, no els genolls cap al pit","Recorregut curt, sense impuls de cames","Genolls a 90° i quiets: les cames no s'estenen","Baixada de 3 s fins a recolzar el maluc"],"setup_steps":["Estirat de panxa amunt, en un banc o a terra, amb els genolls doblegats a 90° i les cames juntes.","Mans planes al costat dels malucs, o agafades a la vora del banc per sobre del cap.","Cuixes a la vertical: els genolls queden just sobre els malucs.","Comprova que la part baixa de l'esquena hi fa contacte abans de començar."],"grip_html":"<p><span class=\"k\">On van les mans.</span> Al costat del maluc si ho fas a terra; agafades a la vora del banc si ho fas en un banc, perquè el tronc no llisqui. No empenyen: només et donen referència.</p> <p><span class=\"k\">L'angle del genoll és la palanca.</span> Com més tancat, més fàcil; obrint-lo una mica, la repetició es fa més dura sense afegir cap pes. És el primer esglaó de progressió, abans del llast entre els genolls.</p> <p><span class=\"k\">Cames juntes.</span> Si s'obren, el moviment perd la línia i l'abdomen deixa d'enrotllar-se recte.</p>","execution_steps":["<span class=\"key\">Enrotllada (2 s).</span> Porta els genolls cap al pit fins que <span class=\"key\">el maluc se separi de la superfície</span>. El moviment és curt: el que compta és que la pelvis roti.","<span class=\"key\">Contracció (1 s)</span> a dalt, sense prendre impuls amb les cames.","<span class=\"key\">Baixada (3 s)</span> fins a tornar a recolzar el maluc, amb les cuixes a la vertical.","Encadena sense estendre les cames ni deixar-les caure."],"notice_html":"<p>Abdomen per sota del melic, en un recorregut curt i amb una contracció molt concentrada. <span class=\"k\">Si no notes res i el moviment sembla llarg</span>, estàs llançant les cames i el maluc no s'ha mogut. <span class=\"k\">Si el que notes és el davant de la cuixa</span>, has estès les cames i el flexor del maluc ha entrat a la feina.</p>","verify_html":"<p><span class=\"k\">Prova del maluc:</span> de costat, s'ha de veure el maluc separar-se clarament de la superfície a cada repetició. Si no se separa, no has fet cap repetició, per moltes que n'hagis comptat.</p> <p><span class=\"k\">Prova dels genolls:</span> si s'obren o les cames s'estenen, has passat a prendre impuls.</p> <p><span class=\"k\">Prova del ritme:</span> has de poder fer 20 repeticions sense que la baixada s'escurci.</p>","errors":[{"error":"El maluc no se separa de la superfície","why":"Sense la rotació de la pelvis no hi ha flexió de columna: és una flexió de maluc, i l'abdomen no s'escurça.","fix":"Pensa a portar el pubis cap al melic. El recorregut útil són pocs centímetres.","cause":"Es puja portant els genolls cap al pit sense enrotllar la pelvis, que és el gest difícil."},{"error":"Llançar les cames per arrencar","why":"La inèrcia fa el que hauria de fer l'abdomen, i el recorregut sembla més llarg justament perquè és buit.","fix":"Puja en dos segons comptats. Si necessites impuls, la sèrie ja ha acabat.","cause":"Apareix quan es busquen més repeticions de les que la posició permet fer netes."},{"error":"Estendre les cames a la baixada","why":"Es converteix en una elevació de cames feta malament, amb la lumbar sense control.","fix":"Angle de genoll fix tota la sèrie; si no el pots mantenir, recull-los més des del principi.","cause":"Les cames pesen i s'obren soles quan l'abdomen es cansa de sostenir-les."}],"progression_html":"<p>20 repeticions netes a les dues sèries amb el maluc separant-se cada vegada → obre una mica l'angle del genoll i torna a 12. El llast entre els genolls és l'esglaó següent.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=hyv14e2QLnc","title":"How To Do A REVERSE CRUNCH","confidence":"aproximada","note":"El criteri d'aquesta fitxa és que el maluc se separi; comprova-ho abans de copiar el ritme del vídeo."},"alternatives":{"principal":{"name":"Reverse crunch en banc inclinat, cap amunt","why_equivalent":"Mateixa enrotllada de pelvis amb més resistència a la part alta del recorregut.","adjust":"Poca inclinació per començar; el recorregut útil continua sent curt.","short":"mateixa enrotllada, més resistència"},"contingencia":{"name":"Elevació de genolls penjat amb enrotllada de pelvis","why_acceptable":"Conserva la rotació de pelvis amb les cames lliures. Demana més control de l'espatlla.","adjust":"Espatlles avall i actives; només compten les repeticions on la pelvis roti.","short":"mateixa rotació, penjat"},"not_equivalent":["Elevació de cames amb la pelvis quieta · antiextensió, no flexió","Gir rus · rotació"]},"v22":true,"setup_html":"<ol> <li>Estirat de panxa amunt, en un banc o a terra, amb els genolls doblegats a 90° i les cames juntes.</li> <li>Mans planes al costat dels malucs, o agafades a la vora del banc per sobre del cap.</li> <li>Cuixes a la vertical: els genolls queden just sobre els malucs.</li> <li>Comprova que la part baixa de l'esquena hi fa contacte abans de començar.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Enrotllada (2 s).</span> Porta els genolls cap al pit fins que <span class=\"key\">el maluc se separi de la superfície</span>. El moviment és curt: el que compta és que la pelvis roti.</li> <li><span class=\"key\">Contracció (1 s)</span> a dalt, sense prendre impuls amb les cames.</li> <li><span class=\"key\">Baixada (3 s)</span> fins a tornar a recolzar el maluc, amb les cuixes a la vertical.</li> <li>Encadena sense estendre les cames ni deixar-les caure.</li> </ol>","tags":{"primary":["Recte abdominal, porció inferior"],"secondary":[],"minor":[],"traits":["Flexió des de baix"]},"registre":{"opcions":{"titol":"On el fas","valors":["A terra","Banc pla"]},"proposta":"regla"}},{"key":"TC-08b","position":"TC-08","session":"TC","order":10,"name":"Planca lateral","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"A terra, sobre una estora"},"muscles":"Oblics · quadrat lumbar","prescription":{"series":"2","reps":"20–40 s per costat","tempo":"isomètric","rest":"45 s","rir":"—"},"quick":{"do":["De costat a terra, amb l'avantbraç just sota l'espatlla","Cames esteses, un peu davant de l'altre o apilats","Cos en línia recta de cap a peus abans d'aixecar el maluc","Mà lliure a la cintura o cap al sostre, mai fent força a terra"],"dont":"Deixar caure el maluc i continuar aguantant","feel":"Els oblics del costat de sota sostenint-ho tot","grip":"Avantbraç pla a terra, empenyent el terra"},"grip_title":"La col·locació","theory_html":"<p><span class=\"k\">Resistir en lloc de moure.</span> El crunch i el reverse crunch fan que l'abdomen s'escurci. Aquesta planca no mou res: impedeix que <span class=\"k\">el maluc caigui cap a terra</span>. És la mateixa cadena lateral que la hiperextensió lateral, amb què alterna per miniblocs, un de cada dos, en un cas generant força i en l'altre resistint-la. Les dues capacitats fan falta, i el cos fa servir molt més la segona.</p> <p><span class=\"k\">Per què lateral i no frontal.</span> De costat, els oblics del costat de sota han de sostenir tot el pes del tronc contra la gravetat. Cap planca frontal els demana això.</p> <p><span class=\"k\">Per què no busquem aguantar molta estona.</span> L'objectiu és mantenir la forma, no el rècord. Ben feta és exigent als 30 segons; si n'aguantes dos minuts, gairebé segur que la forma s'ha anat relaxant pel camí.</p>","cues":["Espatlla, maluc i peu en un sol pla, com si fossis entre dues parets","Empeny el terra amb l'avantbraç i allunya l'espatlla de l'orella","Estreny el gluti i inclina la pelvis lleugerament enrere","Aguanta entre 20 i 40 segons per costat","Respira amb normalitat mentre aguantes"],"setup_steps":["De costat a terra, amb l'<span class=\"key\">avantbraç just sota l'espatlla</span>, ni endavant ni enrere.","Cames esteses, amb un peu davant de l'altre o apilats.","Cos en línia recta de cap a peus: turmell, genoll, maluc, espatlla i orella alineats.","Mà lliure a la cintura o cap al sostre, mai fent força contra terra."],"grip_html":"<p><span class=\"k\">L'avantbraç empeny.</span> Pla a terra i actiu: has d'allunyar l'espatlla de l'orella empenyent el terra. Sense això, el pes cau sobre l'articulació de l'espatlla i el core deixa de treballar mentre tu continues comptant segons.</p> <p><span class=\"k\">Els peus.</span> Apilats és més difícil; un davant de l'altre dona més base i és la versió per començar.</p> <p><span class=\"k\">Progressions sense allargar el temps.</span> Quan els 40 segons siguin còmodes, aixeca el braç lliure cap al sostre o eleva la cama de sobre. Això afegeix dificultat sense convertir la sèrie en una prova de resistència.</p>","execution_steps":["<span class=\"key\">Puja el maluc</span> fins a la línia i mantén-lo: no ha de caure ni pujar en excés.","<span class=\"key\">Estreny el gluti</span> i inclina la pelvis lleugerament enrere.","<span class=\"key\">Aguanta de 20 a 40 segons</span>, respirant amb normalitat.","Canvia de costat sense descansar i descansa 45 s en acabar els dos."],"notice_html":"<p>Feina al costat del tronc, entre les costelles i el maluc, de la banda de sota. <span class=\"k\">Si el que notes és l'espatlla de sota</span>, has deixat caure el pes sobre l'articulació: empeny el terra amb l'avantbraç. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, has rodat enrere i has perdut el pla.</p>","verify_html":"<p><span class=\"k\">Prova del pla únic:</span> espatlla, maluc i peu alineats, com si estiguessis entre dues parets.</p> <p><span class=\"k\">Prova del maluc:</span> quan cau, la sèrie s'ha acabat. Millor acabar-la que aguantar amb la forma trencada.</p> <p><span class=\"k\">Prova dels dos minuts:</span> si hi arribes còmodament, la planca no és prou activa: estreny més el gluti i el core, o passa a les progressions.</p>","errors":[{"error":"El maluc cau","why":"És el senyal que els oblics ja no sostenen res.","fix":"Atura't quan caigui, no aguantis amb la forma trencada.","cause":"Els oblics cedeixen abans que arribi la sensació d'esgotament, i el maluc baixa sense avisar."},{"error":"Rodar endavant o enrere","why":"Treu càrrega als oblics i la reparteix cap on hi ha més superfície de suport.","fix":"Espatlla, maluc i peu alineats.","cause":"Rodar fa la posició més fàcil sense que es noti des de dins."},{"error":"Deixar-se caure sobre l'espatlla de sota","why":"El pes passa a l'articulació i el core deixa de treballar, que és tot el que fa aquesta posició.","fix":"Empeny el terra amb l'avantbraç. Si no pots, la sèrie s'ha acabat.","cause":"És la manera d'aguantar més segons quan els oblics ja no poden."}],"progression_html":"<p>De 20 fins a 40 segons per costat. Quan els 40 siguin còmodes amb la forma intacta, aixeca el braç lliure o eleva la cama de sobre. Mai allargant la sèrie amb el maluc caigut.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=iNbH7_edNI8","title":"Side Plank Tutorial - Proper Form and Technique","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Planca lateral amb elevació de maluc","why_equivalent":"Mateixa cadena lateral amb un component dinàmic afegit.","adjust":"Comença amb poques elevacions: el temps sota tensió ja és alt.","short":"mateixa cadena, amb moviment"},"contingencia":{"name":"Planca lateral de genolls","why_acceptable":"Mateix patró amb menys palanca. Útil si el temps complet encara no és sostenible.","adjust":"Puja el temps abans de passar a peus estesos.","short":"mateix patró, menys palanca"},"not_equivalent":["Flexió lateral dempeus amb manuella · càrrega vertical amb la columna doblegada","Gir rus · rotació"]},"v22":true,"setup_html":"<ol> <li>De costat a terra, amb l'<span class=\"key\">avantbraç just sota l'espatlla</span>, ni endavant ni enrere.</li> <li>Cames esteses, amb un peu davant de l'altre o apilats.</li> <li>Cos en línia recta de cap a peus: turmell, genoll, maluc, espatlla i orella alineats.</li> <li>Mà lliure a la cintura o cap al sostre, mai fent força contra terra.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Puja el maluc</span> fins a la línia i mantén-lo: no ha de caure ni pujar en excés.</li> <li><span class=\"key\">Estreny el gluti</span> i inclina la pelvis lleugerament enrere.</li> <li><span class=\"key\">Aguanta de 20 a 40 segons</span>, respirant amb normalitat.</li> <li>Canvia de costat sense descansar i descansa 45 s en acabar els dos.</li> </ol>","tags":{"primary":["Oblics"],"secondary":["Quadrat lumbar"],"minor":[],"traits":["Isomètric"]},"registre":{"tipus_valor":"temps","proposta":"regla"}},{"key":"TC-08","position":"TC-08","session":"TC","order":11,"name":"Hiperextensió lateral al banc de 45°","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Banc de Back Extension 45° (el mateix de C‑02), fet servir de costat"},"muscles":"Oblics · quadrat lumbar","prescription":{"series":"2","reps":"10–15 per costat","tempo":"2‑1‑2‑1","rest":"45 s","rir":"2"},"quick":{"do":["Coixí a l'alçada de l'os del maluc","Peus falcats sota els suports, un davant de l'altre","Braços creuats al pit","Gluti i abdomen estrets abans de començar"],"dont":"Girar el tronc cap a terra o cap al sostre: deixa de ser un exercici d'oblics","feel":"El costat de la cintura que queda a dalt, entre les costelles i el maluc","grip":"Braços creuats al pit; més endavant, un disc abraçat"},"theory_html":"<p><span class=\"k\">Què fan els oblics.</span> Dues coses: <span class=\"k\">inclinen el tronc cap al costat</span> i el giren. Aquest exercici treballa la primera amb recorregut i amb una càrrega que pot créixer, que és el que els falta a la majoria de rutines: els oblics se solen entrenar només amb isomètrics i amb girs fets de qualsevol manera.</p> <p><span class=\"k\">Per què aquest i no el gir rus.</span> Els vídeos de referència són clars: el gir rus amb pes no és gaire interessant, i la hiperextensió lateral és la millor manera de treballar l'oblic aïllat. El banc et fixa el maluc i les cames, i l'únic que es mou és el tronc, que és exactament el que busques.</p> <p><span class=\"k\">Per què amb prudència.</span> És l'únic exercici del programa en què la columna es doblega de costat sota el pes del tronc. No hi ha càrrega vertical, i per això no travessa la línia vermella lumbar, però demana començar amb el pes del cos, recorregut còmode i RIR 2. Si et desperta la lumbar, torna a la planca encara que sigui el minibloc d'aquesta.</p>","cues":["Baixa de costat fins a un estirament còmode, no fins al màxim","Puja fins a la línia de les cames o una mica per sobre","Espatlles i malucs en un sol pla, sense girar","El maluc no es mou del coixí: només es mou el tronc"],"setup_steps":["És el banc de C‑02 fet servir de costat. Ajusta el coixí perquè la <span class=\"key\">vora superior quedi a l'alçada de l'os del maluc</span> del costat de sota: el maluc hi recolza i la cintura queda lliure per sobre.","Posa't de costat amb els peus falcats sota els suports, <span class=\"key\">un davant de l'altre</span> per tenir estabilitat. Cames esteses i fermes.","Braços creuats al pit. Vist de davant, el cos és una línia recta des dels peus fins al cap.","Estreny el gluti i l'abdomen abans de començar: el maluc no es mou en tota la sèrie."],"grip_html":"<p><span class=\"k\">Braços creuats al pit.</span> Cada mà a l'espatlla contrària. És la posició de partida i la més fàcil.</p> <p><span class=\"k\">Més difícil sense pes.</span> Amb les puntes dels dits a les temples, el pes del tronc queda més lluny del maluc i l'exercici es fa més dur. Les mans no estiren el cap.</p> <p><span class=\"k\">Amb disc.</span> Quan les 15 repeticions per costat surtin netes amb les mans a les temples, torna als braços creuats amb un disc petit abraçat contra el pit.</p>","execution_steps":["<span class=\"key\">Baixada (2 s).</span> Deixa anar el tronc de costat cap a terra, doblegant la cintura, fins que notis un estirament còmode al costat de dalt. No cal arribar al màxim.","<span class=\"key\">Pausa baixa (1 s).</span> Sense rebotar.","<span class=\"key\">Pujada (2 s).</span> Inclina el tronc cap amunt fins que quedi alineat amb les cames o una mica per sobre, com si acostessis l'última costella al maluc de dalt.","<span class=\"key\">Pausa alta (1 s).</span> Estreny el costat de dalt. Fes totes les repeticions d'un costat i canvia."],"notice_html":"<p>Feina al costat de la cintura que queda a dalt, i un estirament suau al mateix costat al punt baix. <span class=\"k\">Si el que notes és el centre de la lumbar</span>, t'estàs doblegant endavant o enrere en lloc de de costat. <span class=\"k\">Si notes l'engonal o la cama de sota</span>, els peus no estan prou falcats.</p>","verify_html":"<p><span class=\"k\">Prova del pla:</span> fes una repetició mirant-te al mirall de davant: les dues espatlles continuen una sobre l'altra. Si una avança, has girat.</p> <p><span class=\"k\">Prova del coixí:</span> a la baixada, el maluc no llisca pel coixí. Si llisca, revisa l'alçada del coixí i com tens els peus.</p> <p><span class=\"k\">Prova de l'endemà:</span> no hi ha d'haver molèstia a la lumbar. Si n'hi ha, la propera vegada fes la meitat de baixada; si persisteix, fes la planca lateral.</p>","errors":[{"error":"Girar el tronc","why":"La rotació treu la feina de la flexió lateral i la reparteix entre músculs que no són els que busques.","fix":"Espatlles i malucs en un sol pla; més lent.","cause":"Quan cansa, el cos busca la sortida girant."},{"error":"Doblegar-se endavant","why":"Es converteix en mitja extensió d'esquena i carrega la lumbar.","fix":"Vist de davant, el cos continua sent una línia; si no hi arribes així, escurça el recorregut.","cause":"El coixí massa alt empeny el tronc endavant."},{"error":"Baixar més del compte","why":"Més recorregut a la part baixa no és més feina d'oblic: és més estrès per a la columna.","fix":"Estirament còmode, i prou.","cause":"Pensar que el màxim rang sempre és millor."}],"progression_html":"<p>Primer amb el pes del cos: 15 repeticions netes per costat a les dues sèries → mans a les temples i torna a 10. Quan també et surtin 15, braços creuats amb un disc petit al pit. El pes sempre és l'últim que puja.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=TsO1sY81Djc","title":"45 Degree Oblique Extension","confidence":"alta","note":"Mateix exercici i mateix banc. Coixí a l'alçada de la part alta del maluc."},"alternatives":{"principal":{"name":"Elevació de maluc en planca lateral","why_equivalent":"Flexió lateral dinàmica amb el pes del cos, sense el banc.","adjust":"De costat a terra, avantbraç sota l'espatlla: baixa el maluc uns centímetres i torna a pujar-lo. Mateixes repeticions per costat.","short":"flexió lateral a terra"},"contingencia":{"name":"Planca lateral isomètrica (TC‑08b)","why_acceptable":"Mateixa cadena lateral, però resistint en lloc de moure. És la variant germana d'aquesta posició.","adjust":"20–40 s per costat.","short":"mateixa cadena, isomètrica"},"not_equivalent":["Flexió lateral dempeus amb manuella · càrrega vertical amb la columna doblegada: línia vermella","Gir rus · rotació, no flexió lateral"]},"v22":true,"setup_html":"<ol> <li>És el banc de C‑02 fet servir de costat. Ajusta el coixí perquè la <span class=\"key\">vora superior quedi a l'alçada de l'os del maluc</span> del costat de sota: el maluc hi recolza i la cintura queda lliure per sobre.</li> <li>Posa't de costat amb els peus falcats sota els suports, <span class=\"key\">un davant de l'altre</span> per tenir estabilitat. Cames esteses i fermes.</li> <li>Braços creuats al pit. Vist de davant, el cos és una línia recta des dels peus fins al cap.</li> <li>Estreny el gluti i l'abdomen abans de començar: el maluc no es mou en tota la sèrie.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (2 s).</span> Deixa anar el tronc de costat cap a terra, doblegant la cintura, fins que notis un estirament còmode al costat de dalt. No cal arribar al màxim.</li> <li><span class=\"key\">Pausa baixa (1 s).</span> Sense rebotar.</li> <li><span class=\"key\">Pujada (2 s).</span> Inclina el tronc cap amunt fins que quedi alineat amb les cames o una mica per sobre, com si acostessis l'última costella al maluc de dalt.</li> <li><span class=\"key\">Pausa alta (1 s).</span> Estreny el costat de dalt. Fes totes les repeticions d'un costat i canvia.</li> </ol>","grip_title":"La presa","tags":{"primary":["Oblics"],"secondary":["Quadrat lumbar"],"minor":[],"traits":["Flexió lateral"]},"registre":{"proposta":"regla"}},{"key":"TC-S1","position":"TC-S1","session":"TC","order":12,"name":"Shrugs amb manuelles","category":"OBERT","category_label":"Obert","machine":{"code":null,"label":"Manuelles · no consta a l'inventari M1–M7"},"muscles":"Trapezi superior","prescription":{"series":"2–3","reps":"10–15","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Es fa si el coll no ha parlat en tot el cicle; si parla, se salta","Dempeus, peus a l'amplada dels malucs i braços estesos als costats","Una manuella a cada mà, presa neutra","Tronc uns graus endavant, no dempeus del tot recte"],"dont":"Avançar el cap per guanyar els últims centímetres","feel":"Feina entre el coll i l'espatlla, no tensió que puja cap al clatell","grip":"Neutra — manuelles als costats del cos"},"grip_title":"La presa i la inclinació","theory_html":"<p><span class=\"k\">L'única excepció del programa.</span> A tot el document la instrucció és mantenir les espatlles avall, perquè encongir-les és l'error recurrent: el trapezi superior pren la feina d'un altre múscul. <span class=\"k\">Aquí encongir no és l'error: és l'exercici.</span> La diferència és senzilla: al press o al pulldown el trapezi fa una feina que no li toca; aquí la feina és seva.</p> <p><span class=\"k\">Per què és obert, i amb quina condició.</span> El trapezi ja rep estímul indirecte a totes les tirades, així que el treball directe és un afegit. La condició no és «si et queden ganes», sinó <span class=\"k\">si el coll no parla</span>: amb molèstia al coll o a la part alta de l'esquena, aquesta és la primera posició que surt de la sessió, perquè el que millora aquella molèstia és el treball d'esquena alta que ja fas, i això hi suma càrrega directa.</p>","cues":["Encongeix recte cap amunt, cap a les orelles, sense girar","Pausa d'1–2 segons a dalt: és el que fa l'exercici","Baixada completa, deixant que l'espatlla caigui del tot","Coll llarg i mirada endavant abans de cada repetició"],"setup_steps":["Dempeus, peus a l'amplada dels malucs i braços estesos als costats.","Una manuella a cada mà amb <span class=\"key\">presa neutra</span>.","Inclina el tronc <span class=\"key\">uns graus endavant</span>, no gaires: alinea millor la tirada amb la direcció de les fibres.","Coll relaxat i mirada endavant abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Presa neutra, manuelles als costats.</span> Palmells encarats al cos. Amb les manuelles al costat, el recorregut és una mica més llarg que amb una barra per davant, i l'espatlla treballa en una línia més natural.</p> <p><span class=\"k\">Per què una inclinació lleugera.</span> El pes cau en vertical i les fibres que treballes aquí tiren cap amunt i una mica enrere; uns graus d'inclinació del tronc alineen millor la tirada amb aquella direcció. No cal exagerar-ho.</p> <p><span class=\"k\">Les mans no fan res més.</span> Si l'agarrament et falla abans que el trapezi, fes servir corretges: aquí el limitant ha de ser el múscul, no la mà.</p>","execution_steps":["<span class=\"key\">Encongiment (1 s).</span> Puja les espatlles recte cap a les orelles, sense girar-les.","<span class=\"key\">Pausa (1–2 s)</span> a dalt: és el que fa l'exercici.","<span class=\"key\">Baixada (3 s)</span> completa, deixant que l'espatlla caigui del tot.","Encadena sense rebotar amb els genolls."],"notice_html":"<p>Feina clara al trapezi superior, entre el coll i l'espatlla, que marxa de pressa en acabar. <span class=\"k\">Si notes tensió que puja cap al clatell</span>, o el cap s'avança, atura la sèrie: aquesta és exactament la molèstia que aquesta posició ha d'evitar, no provocar.</p>","verify_html":"<p><span class=\"k\">Prova del perfil:</span> al punt alt, el cap ha de quedar a la mateixa vertical que abans de començar.</p> <p><span class=\"k\">Prova del rang:</span> has de poder pujar del tot, aguantar un segon i baixar del tot. Si el recorregut s'escurça, baixa la càrrega.</p> <p><span class=\"k\">Prova de l'endemà:</span> si el coll parla, la propera vegada salta-la.</p>","errors":[{"error":"Fer cercles amb les espatlles","why":"No afegeix res i posa l'articulació en posicions incòmodes amb pes a sobre.","fix":"Amunt i avall, en línia recta.","cause":"Es busca més recorregut girant l'espatlla quan el moviment recte ja s'ha acabat."},{"error":"Recorregut curt i molt de pes","why":"Sense rang complet ni pausa a dalt, el trapezi no arriba a la contracció que justifica la sèrie.","fix":"Pes que permeti pujar del tot, aguantar un segon i baixar del tot.","cause":"És l'exercici on més fàcil és carregar de més, perquè el pes es pot sostenir encara que no es pugui moure."},{"error":"Avançar el cap per acabar la repetició","why":"Carrega el coll justament a la zona que el programa vigila.","fix":"Coll llarg i mirada endavant tota la sèrie. Si el cap s'avança, baixa un esglaó.","cause":"Apareix amb el pes alt: el coll s'afegeix per guanyar els últims centímetres."}],"progression_html":"<p>15 repeticions netes amb pausa completa a dalt → següent parell de manuelles. Si el recorregut s'escurça en pujar de pes, has pujat massa. I si el coll ha parlat en algun moment del cicle, aquesta no és setmana de pujar pes.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=xiLT85G_GuU","title":"Dumbbell Shrug (Proper Form)","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Shrugs a la Smith, presa pronada","why_equivalent":"Mateix encongiment vertical amb càrrega progressable i trajectòria fixa.","adjust":"Comença lleuger: la trajectòria fixa no perdona compensacions amb l'esquena.","short":"mateix encongiment, guiat"},"contingencia":{"name":"Shrugs amb barra, presa una mica més ampla que les espatlles","why_acceptable":"Mateix encongiment amb més càrrega possible; la barra va per davant del cos i el recorregut és una mica més curt.","adjust":"Mateix RIR; pausa a dalt igualment.","short":"més càrrega, menys rang"},"not_equivalent":["Remada al mentó · risc d'espatlla","Rem · tirada, no encongiment"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs i braços estesos als costats.</li> <li>Una manuella a cada mà amb <span class=\"key\">presa neutra</span>.</li> <li>Inclina el tronc <span class=\"key\">uns graus endavant</span>, no gaires: alinea millor la tirada amb la direcció de les fibres.</li> <li>Coll relaxat i mirada endavant abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Encongiment (1 s).</span> Puja les espatlles recte cap a les orelles, sense girar-les.</li> <li><span class=\"key\">Pausa (1–2 s)</span> a dalt: és el que fa l'exercici.</li> <li><span class=\"key\">Baixada (3 s)</span> completa, deixant que l'espatlla caigui del tot.</li> <li>Encadena sense rebotar amb els genolls.</li> </ol>","tags":{"primary":["Trapezi superior"],"secondary":[],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"AX-01","position":"AX-01","session":"AX","order":1,"name":"Pallof Press a politja","category":"ANNEX","category_label":"Annex","machine":{"code":null,"label":"Torre de politges, politja a l'alçada de l'estèrnum · no consta a l'inventari M1–M7"},"muscles":"Oblics · transvers · antirrotació","prescription":{"series":"2","reps":"8–12 per costat o 20–30 s","tempo":"2‑2‑2‑0","rest":"45 s","rir":"—"},"quick":{"do":["Politja a l'alçada de l'estèrnum, amb nansa simple","De costat a la màquina, a la distància que ja doni tensió amb les mans al pit","Peus a l'amplada del maluc, genolls una mica flexionats","Gluti i abdomen estrets abans de la primera repetició"],"dont":"Girar el tronc cap a la politja, encara que sigui un grau","feel":"Els oblics del costat contrari impedint el gir","grip":"Les dues mans juntes sobre la nansa, contra l'estèrnum"},"theory_html":"<p><span class=\"k\">La feina del core que no es veu.</span> De l'abdomen se'n sol pensar que serveix per doblegar el tronc endavant. A la pràctica, la seva feina més constant és la contrària: <span class=\"k\">impedir que el tronc es mogui</span> quan alguna cosa l'empeny. Aquí ho entrenes en la seva forma més pura: no es mou res, i tota la sèrie consisteix a no cedir al gir que el cable et vol fer fer.</p> <p><span class=\"k\">On ho fas servir.</span> Cada vegada que carregues una bossa a una banda, cada vegada que obres una porta pesada, i a cada pas que fas corrent, on el tronc ha de sostenir la rotació que generen les cames. Un core que resisteix bé és el que fa que la columna no hagi de fer de fre.</p> <p><span class=\"k\">Per què és a l'annex i per què a politja.</span> La posició del cicle que ocupava la fa ara la papallona de M3, i l'antirrotació queda aquí com a complement: per als dies sobrats de temps o per substituir una posició de core que et salti. El programa reserva les politges per a braços i deltoides; aquesta fitxa n'és l'excepció acordada, perquè la politja dona una resistència constant i graduable que la goma no dona.</p> <p><span class=\"k\">El rang és la variable, no els quilos.</span> Com més lluny de la politja et col·loques, més força de gir has de resistir. Per això es progressa allunyant-se, i el pes només es toca quan la distància màxima ja no suposa cap repte.</p>","cues":["Només es mouen els braços; tota la resta és un bloc","Costelles i pelvis encarades al mateix punt de principi a fi","Colzes estesos del tot al final de l'empenta","Respira normal: no aguantis l'aire"],"setup_steps":["Posa la politja a l'<span class=\"key\">alçada de l'estèrnum</span> amb una nansa simple i selecciona un pes baix: aquí el pes que costa de moure no és el que costa de resistir.","Col·loca't <span class=\"key\">de costat</span> a la màquina, amb la politja a la teva esquerra o dreta, a la distància on el cable ja fa tensió amb les mans al pit.","Peus a l'amplada del maluc i genolls una mica flexionats. Una base ampla et deixaria resistir amb les cames, que és justament el que no vols.","Agafa la nansa amb les dues mans juntes contra l'estèrnum. Estreny el gluti i l'abdomen abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Les dues mans juntes.</span> Una sobre l'altra o entrellaçades a la nansa, sempre al centre del pit. Si una mà queda més endavant que l'altra, el tronc ja ha començat a girar.</p> <p><span class=\"k\">Els braços no són l'exercici.</span> Empenyen i tornen, res més. Si els colzes es dobleguen a mitja extensió, la palanca s'escurça just quan es fa més difícil i l'exercici perd la part que val.</p>","execution_steps":["<span class=\"key\">Empenta (2 s).</span> Estén els braços endavant fins a tenir-los rectes, mantenint les mans a l'alçada de l'estèrnum. El cable et vol girar: no cedeixis ni un grau.","<span class=\"key\">Pausa (2 s).</span> Braços estesos, tronc encarat endavant. Si fas la versió per temps, és aquí on comptes els segons.","<span class=\"key\">Tornada (2 s).</span> Porta les mans al pit sense deixar que el cable les arrossegui.","Fes totes les repeticions d'un costat i gira't per fer l'altre. <span class=\"key\">Sempre les dues bandes.</span>"],"notice_html":"<p>Els oblics del costat contrari a la politja treballant per mantenir-te encarat, i el gluti ferm. <span class=\"k\">Si notes les espatlles o els braços</span>, el pes és massa alt per a la teva distància. <span class=\"k\">Si no notes gairebé res</span>, estàs massa a prop de la torre: el que fa l'exercici és la distància, no la pila.</p>","verify_html":"<p><span class=\"k\">Prova del mirall:</span> davant d'un mirall frontal, el tronc no gira cap a la politja ni un grau. Si gira, acosta't un pas.</p> <p><span class=\"k\">Prova del contrapès:</span> si t'inclines cap al costat contrari, no estàs resistint: t'estàs recolzant.</p> <p><span class=\"k\">Prova de la distància:</span> un pas més lluny és la progressió. Si des d'allà no pots estendre els braços amb el tronc quiet, aquella distància encara no és teva.</p>","errors":[{"error":"Girar el tronc cap a la politja","why":"Si cedeixes, ja no resisteixes res: l'exercici es converteix en una rotació lenta amb pes.","fix":"Acosta't un pas o baixa el pes fins que el tronc quedi quiet.","cause":"Massa distància o massa càrrega per al control que tens ara."},{"error":"Inclinar-se cap al costat contrari","why":"El contrapès del cos substitueix la feina dels oblics.","fix":"Cos vertical; si no pots, baixa el pes.","cause":"És la sortida més còmoda quan la sèrie es fa llarga."},{"error":"Aguantar la respiració","why":"L'abdomen ha de sostenir la posició respirant; si només aguanta amb l'aire, la feina no és la que busques.","fix":"Respiracions curtes i constants durant la pausa.","cause":"Apareix sol quan la posició costa."}],"progression_html":"<p>Tres esglaons, per aquest ordre: primer <span class=\"k\">distància</span> —un pas més lluny de la politja—; després <span class=\"k\">temps</span>, de 20 a 30 segons per costat; i només al final <span class=\"k\">pes</span>, tornant a 20 segons. La progressió per distància és més fina que la de la pila de pesos.</p>","note_html":"Quan la torre de politges estigui ocupada, la versió amb goma ancorada a l'alçada del pit fa exactament la mateixa feina: només canvia com es gradua la resistència.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=LA6Uc5yIV1c","title":"How To Do a Pallof Press | Band & Cable Anti-Rotation Core Exercise","confidence":"alta","note":"Cobreix les dues versions, la de politja i la de goma."},"alternatives":{"principal":{"name":"Pallof Press amb goma","why_equivalent":"Mateixa antirrotació horitzontal. Canvia la manera de graduar la resistència, no la funció.","adjust":"Ajusta la tensió i la distància fins que costi mantenir el tronc quiet.","short":"mateixa funció, resistència elàstica"},"contingencia":{"name":"Planca lateral amb rotació de braç","why_acceptable":"Antirrotació sense resistència externa. Menys càrrega, mateixa idea.","adjust":"Sèries curtes; atura't si la lumbar compensa.","short":"antirrotació amb el pes del cos"},"not_equivalent":["Gir rus amb pes · rotació activa, no antirrotació","Flexió lateral · pla diferent"]},"v22":true,"setup_html":"<ol> <li>Posa la politja a l'<span class=\"key\">alçada de l'estèrnum</span> amb una nansa simple i selecciona un pes baix: aquí el pes que costa de moure no és el que costa de resistir.</li> <li>Col·loca't <span class=\"key\">de costat</span> a la màquina, amb la politja a la teva esquerra o dreta, a la distància on el cable ja fa tensió amb les mans al pit.</li> <li>Peus a l'amplada del maluc i genolls una mica flexionats. Una base ampla et deixaria resistir amb les cames, que és justament el que no vols.</li> <li>Agafa la nansa amb les dues mans juntes contra l'estèrnum. Estreny el gluti i l'abdomen abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Empenta (2 s).</span> Estén els braços endavant fins a tenir-los rectes, mantenint les mans a l'alçada de l'estèrnum. El cable et vol girar: no cedeixis ni un grau.</li> <li><span class=\"key\">Pausa (2 s).</span> Braços estesos, tronc encarat endavant. Si fas la versió per temps, és aquí on comptes els segons.</li> <li><span class=\"key\">Tornada (2 s).</span> Porta les mans al pit sense deixar que el cable les arrossegui.</li> <li>Fes totes les repeticions d'un costat i gira't per fer l'altre. <span class=\"key\">Sempre les dues bandes.</span></li> </ol>","grip_title":"La presa","tags":{"primary":["Oblics"],"secondary":["Transvers"],"minor":[],"traits":["Antirrotació"]}},{"key":"AX-02","position":"AX-02","session":"AX","order":2,"name":"Press militar amb manuelles, assegut","category":"ANNEX","category_label":"Annex","machine":{"code":null,"label":"Banc regulable amb respatller i manuelles · no consta a l'inventari M1–M7"},"muscles":"Deltoide anterior · deltoide lateral · tríceps","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"2"},"quick":{"do":["Respatller gairebé vertical, però inclinat un punt enrere","Esquena, espatlles i cap recolzats; peus plans a terra","Puja una manuella, fes una pausa, i després l'altra","Manuelles a l'alçada de les orelles per començar"],"dont":"Bloquejar el colze a dalt ni deixar que els colzes s'obrin del tot en creu","feel":"La part davantera i lateral de l'espatlla; el tríceps acompanya al final","grip":"Pronada — palmells endavant, canell recte sobre el colze"},"theory_html":"<p><span class=\"k\">Què fa el deltoide anterior.</span> Puja el braç per davant i, amb el tríceps, empeny per sobre del cap. Ja treballa a tots els pressos de pit, però amb el <span class=\"k\">braç completament vertical</span> no el toca cap altre exercici del programa. Aquesta fitxa és la versió lliure d'aquella posició: hi vas quan la màquina està ocupada, quan vols canviar d'estímul o quan entrenes en un altre gimnàs. <span class=\"k\">No s'hi suma: la substitueix.</span></p> <p><span class=\"k\">Per què amb manuelles i assegut.</span> Dempeus amb barra, tot el pes passa per la columna i la lumbar acaba compensant amb un arc quan la sèrie es fa dura. Amb el respatller darrere, la columna queda descarregada, i amb una manuella a cada mà cada braç segueix la seva trajectòria natural, que és el que agraeix l'espatlla. Amb el teu historial lumbar, la versió dempeus amb barra queda fora del programa.</p> <p><span class=\"k\">Per què sempre a RIR 2.</span> És la regla de totes les empentes per sobre del cap d'aquest document: és la posició amb menys marge d'error, i no es negocia amb les ganes que tinguis aquell dia.</p>","cues":["Colzes lleugerament endavant, no oberts del tot de costat","Canell recte i just a sobre del colze","Extensió còmoda, sense impacte","Costelles avall: la lumbar no s'arqueja per empènyer"],"setup_steps":["Posa el respatller <span class=\"key\">gairebé vertical, amb un punt d'inclinació enrere</span>. Del tot vertical, l'espatlla treballa en la posició més exigent; massa inclinat, es converteix en un press inclinat de pit.","Seu amb l'esquena, les espatlles i el cap recolzats, i els peus plans a terra.","Agafa les manuelles amb els palmells cap a dins i recolza-les de cantell sobre les cuixes.","Puja'n una fins a l'espatlla amb una empenta del genoll, fes una <span class=\"key\">pausa</span>, i després l'altra: col·locar-les totes dues alhora per sobre de l'espatlla és on es fan els mals gestos. Palmells endavant, manuelles a l'alçada de les orelles."],"grip_html":"<p><span class=\"k\">Presa pronada, canell recte.</span> Palmells endavant i canell alineat amb l'avantbraç. Si el canell cau enrere, el pes queda darrere de la línia de força i el colze se'n ressent.</p> <p><span class=\"k\">Canell a sobre del colze.</span> És la referència que manté l'avantbraç vertical durant tota la repetició. Si el canell se separa cap enfora, l'espatlla treballa en una posició més oberta i menys segura.</p> <p><span class=\"k\">Si el canell o l'espatlla et molesten.</span> Gira lleugerament les manuelles cap a una presa semineutra, amb els palmells una mica encarats. És la posició que sol tolerar millor l'espatlla, a canvi d'una mica menys de feina per al deltoide lateral.</p>","execution_steps":["<span class=\"key\">Empenta (1 s).</span> Puja les manuelles fins a tenir els braços gairebé estesos, amb les mans acostant-se però sense fer-les xocar. <span class=\"key\">No bloquegis el colze.</span>","<span class=\"key\">Pausa alta (1 s).</span> Espatlles lluny de les orelles.","<span class=\"key\">Baixada (3 s).</span> Controlada fins que les manuelles tornen a l'alçada de les orelles, amb el colze una mica per davant del tronc.","<span class=\"key\">Pausa baixa (1 s).</span> Sense deixar caure el pes ni rebotar per pujar."],"notice_html":"<p>Feina al davant i al costat de l'espatlla, i al tríceps al final de l'empenta. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, t'has arquejat per empènyer: baixa pes i estreny l'abdomen. <span class=\"k\">Si el que notes és el coll</span>, les espatlles pugen cap a les orelles. <span class=\"k\">Si notes el pit</span>, el respatller està massa inclinat i estàs fent un press inclinat.</p>","verify_html":"<p><span class=\"k\">Prova de l'esquena:</span> la lumbar manté el seu arc natural i no se separa més del respatller a l'última repetició que a la primera.</p> <p><span class=\"k\">Prova de l'avantbraç:</span> de front al mirall, els avantbraços són verticals durant tot el recorregut.</p> <p><span class=\"k\">Prova del final:</span> si has de bloquejar els colzes per acabar la repetició, el pes és massa alt.</p>","errors":[{"error":"Arquejar la lumbar per empènyer","why":"Converteix el press per sobre del cap en un press inclinat i carrega la columna, que és exactament el que aquest programa evita.","fix":"Costelles avall i abdomen estret; si continua, baixa un parell de manuelles.","cause":"Pes massa alt per a les últimes repeticions."},{"error":"Baixar més avall de les orelles","why":"Per sota d'aquest punt, l'espatlla treballa en una posició forçada sense afegir estímul útil.","fix":"Atura la baixada amb les manuelles a l'alçada de les orelles.","cause":"Buscar més recorregut pensant que sempre és millor."},{"error":"Bloquejar el colze a dalt","why":"El pes passa a l'articulació i la tensió del deltoide desapareix just al final.","fix":"Atura't just abans del bloqueig si et fa perdre tensió o molesta.","cause":"És on sembla que la sèrie descansa."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb RIR 2 i sense arquejar → següent parell de manuelles i torna a 8. Aquí la progressió va a poc a poc a propòsit: és l'exercici amb menys marge del document.</p>","note_html":"Si el fas un cicle en lloc de TB‑04, no comptis les càrregues d'un i de l'altre com si fossin comparables: la màquina permet més pes perquè no has d'estabilitzar res.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=fuQpuu--bMI","title":"Seated Dumbbell Shoulder Press Guide | Form, Tips, and Mistakes!","confidence":"alta","note":"Mateix exercici; el vídeo mostra també la col·locació inicial de les manuelles."},"alternatives":{"principal":{"name":"PureStrength Shoulder Press (TB‑04)","why_equivalent":"Mateixa empenta per sobre del cap amb trajectòria guiada i menys demanda d'estabilitat.","adjust":"Mateix RIR 2; permet més càrrega.","short":"mateixa empenta, guiada"},"contingencia":{"name":"Press amb manuelles en banc inclinat a 60°","why_acceptable":"Conserva l'empenta amb component ascendent amb una exigència menor per a l'espatlla. Hi guanya pit clavicular.","adjust":"Mateix RIR; una mica més de pes que assegut vertical.","short":"empenta ascendent, menys vertical"},"not_equivalent":["Press militar amb barra dempeus · càrrega sobre la columna: línia vermella","Press darrere del clatell · posició forçada d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Posa el respatller <span class=\"key\">gairebé vertical, amb un punt d'inclinació enrere</span>. Del tot vertical, l'espatlla treballa en la posició més exigent; massa inclinat, es converteix en un press inclinat de pit.</li> <li>Seu amb l'esquena, les espatlles i el cap recolzats, i els peus plans a terra.</li> <li>Agafa les manuelles amb els palmells cap a dins i recolza-les de cantell sobre les cuixes.</li> <li>Puja'n una fins a l'espatlla amb una empenta del genoll, fes una <span class=\"key\">pausa</span>, i després l'altra: col·locar-les totes dues alhora per sobre de l'espatlla és on es fan els mals gestos. Palmells endavant, manuelles a l'alçada de les orelles.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Empenta (1 s).</span> Puja les manuelles fins a tenir els braços gairebé estesos, amb les mans acostant-se però sense fer-les xocar. <span class=\"key\">No bloquegis el colze.</span></li> <li><span class=\"key\">Pausa alta (1 s).</span> Espatlles lluny de les orelles.</li> <li><span class=\"key\">Baixada (3 s).</span> Controlada fins que les manuelles tornen a l'alçada de les orelles, amb el colze una mica per davant del tronc.</li> <li><span class=\"key\">Pausa baixa (1 s).</span> Sense deixar caure el pes ni rebotar per pujar.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide anterior"],"secondary":["Deltoide lateral"],"minor":["Tríceps"],"traits":[]}},{"key":"AX-03","position":"AX-03","session":"AX","order":3,"name":"Elevacions frontals amb manuelles","category":"ANNEX","category_label":"Annex","machine":{"code":null,"label":"Manuelles · no consta a l'inventari M1–M7"},"muscles":"Deltoide anterior · pit clavicular (acompanya)","prescription":{"series":"2","reps":"12–20","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Manuelles lleugeres: aquí el pes alt només porta balanceig","Dempeus, peus a l'amplada del maluc i abdomen estret","Una manuella a cada mà, davant de les cuixes","Alterna els braços si vols més control de cada costat"],"dont":"Tirar el tronc enrere per arrencar el pes","feel":"La part davantera de l'espatlla, just sota la clavícula","grip":"Pronada — palmells cap avall; neutra si el canell molesta"},"theory_html":"<p><span class=\"k\">Què fa, exactament.</span> Puja el braç estès per davant del cos, que és la funció principal de la part davantera del deltoide. És un aïllament de recorregut curt: el valor hi és en el control, no en la càrrega.</p> <p><span class=\"k\">Per què és a l'annex i no a la rutina.</span> Perquè la part davantera de l'espatlla ja treballa a tots els pressos de pit i al press per sobre del cap. Quan una rutina porta prou empenta, els vídeos de referència diuen que aquest treball directe no cal, i afegir-lo suma fatiga a l'espatlla sense afegir gran cosa. Si el que busques és amplada, el múscul que la dona és el lateral, no aquest.</p> <p><span class=\"k\">Quan té sentit fer-la.</span> En tres casos: un cicle en què hagis retallat pressos i el davant de l'espatlla hagi quedat curt; una setmana en què el colze o el pit no et deixin empènyer i vulguis mantenir el deltoide actiu amb poca càrrega; o com a escalfament llarg abans del press. En els tres, dues sèries basten.</p>","cues":["Puja fins a l'alçada de l'espatlla i no més amunt","Colze una mica doblegat i fix durant tot el recorregut","Baixa en 3 s, sense deixar caure el braç","Espatlles avall: si s'encongeixen, el trapezi ha agafat la feina"],"setup_steps":["Dempeus, peus a l'amplada del maluc, genolls una mica flexionats i abdomen estret.","Una manuella a cada mà, davant de les cuixes, amb els <span class=\"key\">palmells cap al cos</span>.","Espatlles enrere i avall abans de la primera repetició.","Tria si les faràs <span class=\"key\">alternades</span> —un braç cada vegada, més control— o totes dues alhora, i no ho canviïs dins de la mateixa sèrie."],"grip_html":"<p><span class=\"k\">Presa pronada.</span> Palmells cap avall quan el braç puja. És la posició clàssica i la que carrega el deltoide anterior de manera més directa.</p> <p><span class=\"k\">Presa neutra.</span> Palmells encarats, com si portessis un maletí a cada mà. Sol ser més còmoda per al canell i per a l'espatlla, i fa participar una mica més el pit clavicular. Si la pronada et molesta, aquesta és la sortida.</p> <p><span class=\"k\">Amb disc.</span> El mateix moviment amb un disc agafat de cantell per les dues mans reparteix la càrrega entre els dos braços i fa més fàcil mantenir el recorregut net. És la variant a triar quan busques control i no simetria entre costats.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Puja el braç per davant del cos, amb el colze una mica doblegat, fins que la mà arribi a l'<span class=\"key\">alçada de l'espatlla</span>. El tronc no es mou.","<span class=\"key\">Pausa (1 s).</span> Sense encongir l'espatlla ni tirar el cos enrere.","<span class=\"key\">Baixada (3 s).</span> Controlada fins a tenir la manuella davant de la cuixa.","Encadena la repetició següent sense rebotar contra la cuixa."],"notice_html":"<p>Cremor a la part davantera de l'espatlla a les últimes repeticions. <span class=\"k\">Si notes el coll o el trapezi</span>, estàs encongint l'espatlla o el pes és massa alt. <span class=\"k\">Si notes la lumbar</span>, el tronc s'està tirant enrere a cada repetició per fer de contrapès.</p>","verify_html":"<p><span class=\"k\">Prova del mirall lateral:</span> el tronc ha d'estar igual de vertical a la primera i a l'última repetició.</p> <p><span class=\"k\">Prova de l'alçada:</span> la mà s'atura a l'alçada de l'espatlla. Si puja per sobre del cap, ja no és aquest exercici.</p> <p><span class=\"k\">Prova de la baixada:</span> tres segons a cada baixada; si l'última se't converteix en una caiguda, la sèrie ha acabat.</p>","errors":[{"error":"Balancejar el tronc","why":"L'impuls de l'esquena aixeca el pes i el deltoide en fa menys, a més de carregar la lumbar.","fix":"Baixa pes fins que el tronc es quedi quiet.","cause":"Pes triat pensant que és un exercici de força."},{"error":"Pujar per sobre de l'espatlla","why":"Per damunt d'aquesta alçada hi entra el trapezi.","fix":"Atura la pujada quan la mà arriba a l'alçada de l'espatlla.","cause":"Buscar més recorregut sense mirar quin múscul l'acaba fent."},{"error":"Colze que s'obre i es tanca","why":"El braç es converteix en una palanca canviant i l'estímul deixa de ser constant.","fix":"Fixa el colze en una flexió lleugera i mantén-la.","cause":"Apareix quan la sèrie es fa llarga."}],"progression_html":"<p>20 repeticions netes a les dues sèries amb el tronc quiet → següent parell de manuelles i torna a 12. Aquí allarga tant com puguis la fase de repeticions abans de pujar pes: és la regla de tot el treball de deltoide del programa.</p>","note_html":"","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie pots fer un <span class=\"k\">dropset</span>: en arribar al punt on ja no puges a l'alçada de l'espatlla, canvia al parell immediatament inferior i continua sense descansar. Amb un múscul que ja rep molta feina indirecta, no cal fer-ho més d'una vegada.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=CH9JzDStL3U","title":"How to Do Dumbbell Front Raises | Proper Form & Tips","confidence":"alta","note":"Mateix exercici; hi surten les variants de presa."},"alternatives":{"principal":{"name":"Elevació frontal amb disc","why_equivalent":"Mateixa elevació per davant del cos, amb la càrrega repartida entre les dues mans.","adjust":"Agafa el disc de cantell a les dues bandes; mateix rang.","short":"mateix gest, càrrega compartida"},"contingencia":{"name":"Elevació frontal a politja, un braç","why_acceptable":"Manté la tensió també al punt baix. És deltoide, i per tant dins de la regla de politges.","adjust":"Politja a l'alçada més baixa; pes molt inferior.","short":"tensió constant, un braç"},"not_equivalent":["Press per sobre del cap · patró d'empenta, no aïllament","Elevació lateral · pla diferent: deltoide lateral"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada del maluc, genolls una mica flexionats i abdomen estret.</li> <li>Una manuella a cada mà, davant de les cuixes, amb els <span class=\"key\">palmells cap al cos</span>.</li> <li>Espatlles enrere i avall abans de la primera repetició.</li> <li>Tria si les faràs <span class=\"key\">alternades</span> —un braç cada vegada, més control— o totes dues alhora, i no ho canviïs dins de la mateixa sèrie.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Puja el braç per davant del cos, amb el colze una mica doblegat, fins que la mà arribi a l'<span class=\"key\">alçada de l'espatlla</span>. El tronc no es mou.</li> <li><span class=\"key\">Pausa (1 s).</span> Sense encongir l'espatlla ni tirar el cos enrere.</li> <li><span class=\"key\">Baixada (3 s).</span> Controlada fins a tenir la manuella davant de la cuixa.</li> <li>Encadena la repetició següent sense rebotar contra la cuixa.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide anterior"],"secondary":[],"minor":["Pit clavicular"],"traits":["Aïllament"]}},{"key":"AX-04","position":"AX-04","session":"AX","order":4,"name":"Elevació combinada, lateral i frontal","category":"ANNEX","category_label":"Annex","machine":{"code":null,"label":"Manuelles · no consta a l'inventari M1–M7"},"muscles":"Deltoide lateral · deltoide anterior","prescription":{"series":"2","reps":"8–12 combinades","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Manuelles clarament més lleugeres del que faries a les elevacions laterals","Dempeus, abdomen estret i tronc immòbil","Cada repetició són dos trams: obre de costat i després porta els braços endavant","Atura sempre les mans a l'alçada de l'espatlla"],"dont":"Triar el pes pensant en el tram frontal: el que mana és el lateral","feel":"El lateral de l'espatlla al primer tram i el davant al segon","grip":"Pronada — palmells cap avall en tots dos trams"},"theory_html":"<p><span class=\"k\">Què és.</span> Una repetició amb dos trams: primer obres els braços de costat fins a l'alçada de l'espatlla, i des d'allà els portes endavant sense baixar-los. El primer tram treballa la part lateral del deltoide —la que dona amplada— i el segon, la part davantera.</p> <p><span class=\"k\">Per què és a l'annex.</span> Per dos motius. El davant de l'espatlla ja té feina de sobres amb els pressos, així que el segon tram afegeix poc. I n'hi ha un de pràctic: el pes l'has de triar per al tram lateral, que és el més feble, de manera que el tram frontal queda sempre lleuger. Com a exercici principal no aporta res que no ting
