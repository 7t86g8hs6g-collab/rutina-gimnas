ecution_html":"<ol> <li><span class=\"key\">Tancament (1–2 s).</span> Junta les cames de manera controlada.</li> <li><span class=\"key\">Pausa (1 s)</span> amb les cames juntes.</li> <li><span class=\"key\">Obertura (3 s).</span> Lenta fins a l'estirament, sense que les plaques toquin fons.</li> <li>Encadena sense rebot: el retorn brusc amb obertura gran és el moment de risc.</li> </ol>","tags":{"primary":["Adductors"],"secondary":[],"minor":[],"traits":[]},"registre":{"proposta":"regla"}},{"key":"C-04","position":"C-04","session":"C","order":8,"name":"Lying Leg Curl","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Lying Leg Curl · no consta a l'inventari M1–M7"},"muscles":"Isquiotibials (flexió de genoll)","prescription":{"series":"3","reps":"10–15","tempo":"2–3 s ↓","rest":"90 s","rir":"0–1"},"quick":{"do":["Alinea l'eix de gir de la màquina amb el teu genoll","Coixí just sobre el tendó d'Aquil·les, no sobre el bessó","Falca o tovallola sota els malucs si el banc és pla","Tria una posició de turmell i fes-la sempre igual"],"dont":"Aixecar els malucs del banc per ajudar-te","feel":"Tensió a la part posterior de la cuixa","grip":"Peus i turmells sempre en la mateixa posició"},"grip_title":"La col·locació","theory_html":"<p><span class=\"k\">L'altra meitat de l'isquiotibial.</span> Aquest múscul travessa dues articulacions: el genoll i el maluc. Al Back Extension el treballes estenent el maluc, amb el múscul estirat; aquí el treballes <span class=\"k\">doblegant el genoll</span>. Són dues funcions del mateix múscul i cap de les dues substitueix l'altra, per això tots dos exercicis són fixos.</p> <p><span class=\"k\">La falca, i per què és més que un detall.</span> Estirat de bocaterrosa, el maluc queda del tot estès i l'isquiotibial comença la repetició ja escurçat, que és on té menys força i menys estímul. Amb un coixí o una tovallola sota els malucs, el maluc queda una mica doblegat i el múscul arrenca més estirat. Moltes màquines ja porten el banc amb aquesta inclinació: mira-ho abans d'afegir-hi res.</p> <p><span class=\"k\">Per què tres sèries i no quatre.</span> La quarta es va retallar per encabir la sessió en 80 minuts i és volum opcional que pots recuperar des de l'annex. Les tres que queden són l'única font de flexió de genoll del programa.</p>","cues":["Porta els talons cap al cul sense que el maluc s'aixequi","Contracció d'un segon al punt final","Retorn de 3 segons, sense que la pila toqui fons","Malucs enganxats al banc de la primera a l'última repetició"],"setup_steps":["Alinea <span class=\"key\">l'eix de gir de la màquina amb el teu genoll</span>. És l'ajust que més gent es salta i el que més canvia la sensació de l'exercici.","El coixí ha de quedar just sobre el tendó d'Aquil·les. Sobre el bessó prem el múscul i molesta abans que l'isquio es cansi.","Posa una falca o una tovallola enrotllada sota els malucs si el banc és completament pla: fa que el múscul comenci la repetició més estirat.","Agafa't als mànecs i comprova que els malucs queden enganxats al banc, perquè aixecar-los és la manera d'ajudar-se sense adonar-se'n."],"grip_html":"<p><span class=\"k\">La posició del turmell.</span> Pots portar la punta del peu estirada o recollida cap a la canyella. Totes dues són vàlides, però <span class=\"key\">canviar-la canvia el pes que pots moure</span>: tria'n una i fes-la igual a totes les sèries i tots els cicles, o el registre deixa de comparar el mateix.</p> <p><span class=\"k\">On recolzen les cames.</span> Els malucs enganxats al banc i les cuixes senceres en contacte. Si els malucs pugen, l'exercici es converteix en mitja extensió de maluc.</p> <p><span class=\"k\">Peus neutres.</span> En línia amb el genoll, sense girar les puntes cap enfora: la torsió se l'emporta l'articulació, no el múscul.</p>","execution_steps":["<span class=\"key\">Flexió (1–2 s).</span> Porta els talons cap al cul tan lluny com puguis sense que el maluc s'aixequi.","<span class=\"key\">Contracció (1 s).</span> Estreny al punt final.","<span class=\"key\">Retorn (3 s).</span> Baixa lentament fins gairebé estendre el genoll, sense que la pila toqui fons.","<span class=\"key\">Pausa (1 s)</span> amb l'isquiotibial estirat abans de la repetició següent."],"notice_html":"<p>Crema a la part posterior de la cuixa i estirament clar quan la cama torna a estendre's. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, els malucs s'han aixecat del banc. <span class=\"k\">Si notes el genoll per dins</span>, l'eix de la màquina no coincideix amb el teu. <span class=\"k\">Si notes el bessó</span>, tens la punta del peu massa estirada: recull-la cap a la canyella.</p>","verify_html":"<p><span class=\"k\">Prova de l'eix:</span> el genoll ha de coincidir amb el pivot abans de la primera sèrie. Si en flexionar notes una estrebada al genoll, el seient està mal ajustat.</p> <p><span class=\"k\">Prova dels malucs:</span> si s'aixequen del banc, el pes és excessiu.</p> <p><span class=\"k\">Prova de la baixada:</span> el retorn ha de durar tres segons sense que el pes t'arrossegui.</p>","errors":[{"error":"Aixecar els malucs del banc","why":"Fas servir el maluc per ajudar el genoll i el rang útil de la flexió desapareix.","fix":"Malucs enganxats; si no els pots mantenir, baixa el pes.","cause":"Aixecar el maluc escurça la palanca i deixa entrar el gluti."},{"error":"Eix de la màquina desalineat","why":"La força es perd en la palanca i el genoll rep una torsió innecessària.","fix":"Ajusta el seient abans de la primera sèrie, cada cop.","cause":"El seient es queda on el va deixar l'últim usuari i la diferència no es veu fins que hi ha càrrega."},{"error":"Canviar la posició del turmell entre sèries","why":"Canvia el pes que pots moure i el registre deixa de comparar el mateix.","fix":"Tria una posició i fes-la sempre igual. Quina triïs no importa; que no canviï, sí.","cause":"Sense una posició decidida, el peu es col·loca com surt a cada sèrie."}],"progression_html":"<p>15 repeticions netes a les tres sèries → un increment de pes i tornada a 10.</p>","note_html":"","extra_sections":[],"figure":null,"optional_extra":"Quarta sèrie opcional: és la que es va retallar per encabir la sessió en 80 minuts. L'annex diu quan val la pena recuperar-la.","video":{"url":"https://www.youtube.com/watch?v=SbSNUXPRkc8","title":"How To Do A Lying Leg Curl (Prone Leg Curl)","confidence":"alta","note":"Variant tombada, no l'asseguda."},"alternatives":{"principal":{"name":"Femoral assegut, si n'hi ha","why_equivalent":"Mateixa flexió de genoll aïllada amb els isquiotibials de motor únic.","adjust":"Pes similar; mateix RIR.","short":"mateixa flexió aïllada"},"contingencia":{"name":"Pont de malucs a una cama, taló al banc","why_acceptable":"Recluta els isquiotibials en cadena tancada, sense màquina d'aïllament.","adjust":"Comença sense pes afegit; RIR 3 fins a dominar l'estabilitat.","short":"isquios en cadena tancada"},"not_equivalent":["Pes mort romanès amb barra · càrrega en flexió","Good morning amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Alinea <span class=\"key\">l'eix de gir de la màquina amb el teu genoll</span>. És l'ajust que més gent es salta i el que més canvia la sensació de l'exercici.</li> <li>El coixí ha de quedar just sobre el tendó d'Aquil·les. Sobre el bessó prem el múscul i molesta abans que l'isquio es cansi.</li> <li>Posa una falca o una tovallola enrotllada sota els malucs si el banc és completament pla: fa que el múscul comenci la repetició més estirat.</li> <li>Agafa't als mànecs i comprova que els malucs queden enganxats al banc, perquè aixecar-los és la manera d'ajudar-se sense adonar-se'n.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Flexió (1–2 s).</span> Porta els talons cap al cul tan lluny com puguis sense que el maluc s'aixequi.</li> <li><span class=\"key\">Contracció (1 s).</span> Estreny al punt final.</li> <li><span class=\"key\">Retorn (3 s).</span> Baixa lentament fins gairebé estendre el genoll, sense que la pila toqui fons.</li> <li><span class=\"key\">Pausa (1 s)</span> amb l'isquiotibial estirat abans de la repetició següent.</li> </ol>","tags":{"primary":["Isquiotibials"],"secondary":[],"minor":[],"traits":["Flexió de genoll"]},"registre":{"proposta":"doble"}},{"key":"C-05","position":"C-05","session":"C","order":9,"name":"PureStrength Hip Thrust","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Hip Thrust PureStrength (Technogym), de discos · no consta a l'inventari M1–M7"},"muscles":"Gluti major","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"1–2"},"quick":{"do":["Coixí a la línia del maluc, no sobre la panxa ni les cuixes","Esquena alta recolzada al suport i costelles avall","Peus plans i a l'amplada dels malucs","Col·loca'ls de manera que al punt alt la canyella quedi vertical"],"dont":"Arquejar la lumbar per pujar més amunt","feel":"Gluti cremant al punt alt","grip":"Peus plans, pressió al taló"},"grip_title":"Els peus i la col·locació","theory_html":"<p><span class=\"k\">Què fa el gluti major.</span> Estén el maluc: porta la cuixa enrere i el tronc de doblegat a dret. És el múscul més gran del cos i el que empeny quan corres, quan puges escales o quan t'aixeques d'una cadira. A la premsa i a l'esquat hi participa, però ho fa <span class=\"k\">acompanyant i estirat</span>; aquí és l'únic moment del cicle en què treballa sol i contret.</p> <p><span class=\"k\">Per què la pausa de dalt és l'exercici.</span> El gluti arriba a la contracció màxima amb el maluc completament estès, i aquest punt dura un instant si no t'hi atures. Un segon o dos estrenyent a dalt valen més que dues repeticions de més. Per la mateixa raó, <span class=\"k\">no et quedis a mig camí</span>: si atures la pujada amb el tronc encara inclinat, et perds justament la part que fa l'exercici.</p> <p><span class=\"k\">El que no s'ha de fer per pujar més.</span> Passat el punt on el cos fa una línia recta, el recorregut extra no el fa el gluti: el fa la columna arquejant-se. Més amunt no vol dir més gluti.</p>","cues":["Empeny amb el taló, com si els dits no toquessin","Puja fins que el tronc i les cuixes formin una línia, ni un grau més","Pausa d'1–2 segons estrenyent el gluti a dalt","Costelles avall: no treguis el pit per pujar més","Baixada de 3 segons sense deixar el pes en repòs"],"setup_steps":["Ajusta el coixí perquè et quedi <span class=\"key\">a la línia del maluc</span>. Sobre la panxa fa mal i sobre les cuixes desplaça la força cap al quàdriceps.","Esquena alta recolzada al suport i <span class=\"key\">costelles avall</span>: treure el pit és el primer pas cap a arquejar la lumbar.","Peus plans, a l'amplada dels malucs, col·locats de manera que al punt alt la <span class=\"key\">canyella quedi vertical</span>. Si el genoll passa endavant, acosta els peus; si queda endarrere, allunya'ls.","Barbeta lleugerament recollida i abdomen estret abans de la primera repetició."],"grip_html":"<p><span class=\"k\">La distància dels peus decideix el múscul.</span> Massa a prop i el quàdriceps hi entra; massa lluny i la feina se'n va als isquiotibials. La referència és la canyella vertical al punt alt, i es comprova amb un mirall abans de carregar.</p> <p><span class=\"k\">Pressió al taló.</span> Tot el peu toca, però la força surt del taló. Si empenys amb la punta, el quàdriceps se'n queda una part.</p> <p><span class=\"k\">Amplada.</span> A l'amplada dels malucs i amb les puntes lleugerament obertes. Més separats, el gluti mitjà hi participa una mica més; més junts, el quàdriceps.</p>","execution_steps":["<span class=\"key\">Pujada (1–2 s).</span> Empeny amb els talons fins que el tronc i les cuixes formin una línia.","<span class=\"key\">Contracció (1–2 s).</span> Estreny el gluti amb força. Aquesta pausa és el cor de l'exercici.","<span class=\"key\">Baixada (3 s).</span> Controla el descens fins gairebé baix, sense deixar el pes en repòs.","Torna a pujar sense rebotar contra els discos."],"notice_html":"<p>El gluti cremant al punt alt: aquesta és la sensació que valida l'exercici. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, has arquejat la lumbar per pujar més. <span class=\"k\">Si notes la part davantera de la cuixa</span>, tens els peus massa a prop; <span class=\"k\">si notes els isquios</span>, massa lluny.</p>","verify_html":"<p><span class=\"k\">Prova de la canyella:</span> al punt alt ha de quedar vertical vista de costat.</p> <p><span class=\"k\">Prova de la línia:</span> la pujada s'atura quan el tronc i la cuixa formen una línia recta. Si notes la lumbar, has passat d'aquest punt.</p> <p><span class=\"k\">Prova de la pausa:</span> si no pots aguantar un segon a dalt amb el gluti ben estret, el pes és excessiu encara que completis les repeticions.</p>","errors":[{"error":"Hiperextendre la lumbar al punt alt","why":"És l'error que defineix aquest exercici: el recorregut extra el fa la columna, no el gluti.","fix":"Costelles avall i atura la pujada a la línia recta. Puges amb el gluti, no amb l'esquena.","cause":"És l'única manera de sentir que has pujat més quan el gluti ja ha arribat al final del seu recorregut."},{"error":"Quedar-se a mig camí","why":"El gluti fa la seva contracció màxima al final; si no hi arribes, et perds la part útil de la repetició.","fix":"Completa l'extensió fins a la línia recta, amb la pausa.","cause":"Amb un pes massa alt, la línia recta sembla assolida abans d'hora."},{"error":"Empènyer amb la punta del peu","why":"El quàdriceps se'n queda una part.","fix":"Tota la pressió al taló, com si els dits no toquessin la plataforma.","cause":"Amb els peus mal col·locats, el taló perd contacte sol."}],"progression_html":"<p>12 repeticions netes amb pausa completa a dalt a les tres sèries → puja pes i torna a 8. <span class=\"k\">La pausa de dalt no es negocia mai:</span> sense ella, l'exercici perd la meitat del valor.</p>","note_html":"Al punt alt, la pelvis s'ha d'inclinar lleugerament cap enrere, no endavant. És l'únic exercici del programa on aquesta basculació és la correcta, i és el que protegeix la lumbar mentre el gluti treballa.","extra_sections":[],"figure":null,"optional_extra":"Quarta sèrie opcional: recuperable des de l'annex els cicles en què el gluti sigui la prioritat i la sessió hi càpiga.","video":{"url":"https://www.youtube.com/watch?v=y50EcGQku58","title":"Technogym Pure Strength Hip Thrust - Set Up & Execution","confidence":"exacta","note":"Mateixa màquina Technogym PureStrength."},"alternatives":{"principal":{"name":"Hip thrust amb manuella al maluc, esquena al banc","why_equivalent":"Mateixa extensió de maluc amb l'esquena recolzada i el gluti major de motor.","adjust":"La manuella cau: comença lleuger fins a trobar una posició estable.","short":"mateixa extensió, esquena al banc"},"contingencia":{"name":"Pont de malucs a terra, dues cames","why_acceptable":"Conserva l'extensió de maluc sense recolzament elevat, amb menys rang.","adjust":"RIR 3; afegeix pes a la falda quan la tècnica sigui sòlida.","short":"extensió amb menys rang"},"not_equivalent":["Pes mort convencional · càrrega en flexió","Esquat amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Ajusta el coixí perquè et quedi <span class=\"key\">a la línia del maluc</span>. Sobre la panxa fa mal i sobre les cuixes desplaça la força cap al quàdriceps.</li> <li>Esquena alta recolzada al suport i <span class=\"key\">costelles avall</span>: treure el pit és el primer pas cap a arquejar la lumbar.</li> <li>Peus plans, a l'amplada dels malucs, col·locats de manera que al punt alt la <span class=\"key\">canyella quedi vertical</span>. Si el genoll passa endavant, acosta els peus; si queda endarrere, allunya'ls.</li> <li>Barbeta lleugerament recollida i abdomen estret abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (1–2 s).</span> Empeny amb els talons fins que el tronc i les cuixes formin una línia.</li> <li><span class=\"key\">Contracció (1–2 s).</span> Estreny el gluti amb força. Aquesta pausa és el cor de l'exercici.</li> <li><span class=\"key\">Baixada (3 s).</span> Controla el descens fins gairebé baix, sense deixar el pes en repòs.</li> <li>Torna a pujar sense rebotar contra els discos.</li> </ol>","tags":{"primary":["Gluti major"],"secondary":[],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"C-06","position":"C-06","session":"C","order":10,"name":"Abducció de maluc","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Màquina d'abducció · no consta a l'inventari M1–M7"},"muscles":"Gluti mitjà","prescription":{"series":"3","reps":"12–20","tempo":"3‑1‑2‑1","rest":"60 s","rir":"0–1"},"quick":{"do":["Coixins per fora de la cuixa, no del genoll","Tria la inclinació del tronc abans de començar: recte o uns 30° endavant","Obertura inicial amb les cames juntes i el gluti ja una mica estirat","Pes baix: has de poder fer 20 repeticions controlades"],"dont":"Rebotar amb molt de pes i recorregut curt","feel":"Crema al lateral del maluc, just sota la cresta ilíaca","grip":"Coixins per fora de la cuixa; peus sense empènyer enlloc"},"grip_title":"La col·locació i la inclinació","theory_html":"<p><span class=\"k\">Què fa el gluti mitjà.</span> Separa la cama del cos i, sobretot, <span class=\"k\">impedeix que la pelvis caigui quan estàs sobre una sola cama</span>: exactament el que passa a cada pas que fas corrent. És la part alta i lateral del gluti, i és la que dona la forma arrodonida vista de costat.</p> <p><span class=\"k\">Què passa quan és feble.</span> La pelvis cau cap al costat de la cama que no toca terra i el genoll de la que aguanta tendeix a tancar-se cap endins. Per a algú que corre, això no és un detall estètic: és el començament de molts dolors de genoll i de maluc.</p> <p><span class=\"k\">La inclinació del tronc és el regulador.</span> Ben recte treballes més les fibres altes. Inclinat uns 30° endavant, el múscul arrenca més estirat i la feina es desplaça cap a les fibres del darrere. Totes dues són vàlides: alterna-les entre cicles i apunta quina fas.</p>","cues":["Obertura controlada fins al rang complet","Pausa d'1 segon a l'obertura màxima","Tancament de 3 segons sense que les plaques toquin","Tronc immòbil en la inclinació que hagis triat"],"setup_steps":["Seu amb l'esquena recolzada i els <span class=\"key\">coixins per fora de la cuixa</span>, no del genoll.","Ajusta l'obertura inicial perquè les cames comencin juntes, amb el gluti ja una mica estirat.","Decideix la <span class=\"key\">inclinació del tronc</span> —recte o uns 30° endavant— i comprova que l'esquena hi queda recolzada.","Tria un pes que et permeti 20 repeticions controlades amb pausa."],"grip_html":"<p><span class=\"k\">Coixins per fora de la cuixa.</span> Si queden sobre el genoll, la força passa per l'articulació i el múscul en fa menys.</p> <p><span class=\"k\">La inclinació del tronc.</span> És la variable que rota entre cicles. Dret, fibres altes; inclinat cap endavant, el gluti arrenca més estirat i treballen més les fibres posteriors. El que no pot passar és que canviï a mitja sèrie.</p> <p><span class=\"k\">Els peus.</span> Recolzats però sense empènyer contra res. Si fas força amb els peus, les cames obren amb ajuda i el gluti mitjà se'n desentén.</p>","execution_steps":["<span class=\"key\">Obertura (1–2 s).</span> Separa les cames de manera controlada fins al rang complet.","<span class=\"key\">Contracció (1 s).</span> Estreny al punt d'obertura màxima.","<span class=\"key\">Tancament (3 s).</span> Torna lentament, sense deixar que les plaques toquin.","Encadena sense rebot."],"notice_html":"<p>Crema clara al lateral del maluc, just per sota de l'os de la cintura. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, has canviat la inclinació del tronc durant la sèrie. <span class=\"k\">Si no notes res i el pes puja fàcil</span>, estàs fent recorreguts curts amb massa càrrega, que és l'error típic d'aquesta màquina.</p>","verify_html":"<p><span class=\"k\">Prova del tronc:</span> la inclinació que has triat ha de ser la mateixa a la primera i a l'última repetició.</p> <p><span class=\"k\">Prova del pes:</span> has de poder fer 20 repeticions controlades amb pausa. Si rebotes, n'hi ha massa.</p> <p><span class=\"k\">Prova de l'ajuda:</span> si t'inclines endavant i enrere per obrir, no és el gluti qui treballa.</p>","errors":[{"error":"Rebotar amb pes excessiu","why":"És l'error típic d'aquesta màquina: molt de pes i recorreguts curts i violents.","fix":"Pes que permeti 20 repeticions controlades amb pausa. Aquí no busquem càrrega.","cause":"És una màquina on el pes es pot carregar molt sense que sembli perillós."},{"error":"Fer servir el tronc per obrir","why":"Si t'inclines enrere i endavant per ajudar-te, no és el gluti qui treballa.","fix":"Tronc immòbil en la posició triada.","cause":"Quan el gluti mitjà s'esgota, moure el tronc és l'única manera d'obrir més."},{"error":"Canviar la inclinació a mitja sèrie","why":"Les dues inclinacions reparteixen la feina de manera diferent; barrejar-les deixa el registre sense sentit.","fix":"Tria-la abans de la primera repetició i mantén-la fins a l'última.","cause":"La inclinació no està fixada per res: si no la decideixes, canvia sola a mesura que et canses."}],"progression_html":"<p>Per repeticions primer: de 12 a 20 amb la mateixa càrrega, i llavors un sol increment i tornada a 12.</p>","note_html":"","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie, <span class=\"k\">dropset</span>: en acabar-la, baixa un o dos esglaons de la pila i continua sense descansar fins que el recorregut complet ja no surti. És una màquina ideal per fer-ho, perquè no has de moure't ni carregar res.</p>"}],"figure":"abduction","video":{"url":"https://www.youtube.com/watch?v=h9BqUMqK-SY","title":"How to PROPERLY Use the Abductor & Adductor Machine","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Abducció de maluc amb goma, de costat","why_equivalent":"Mateixa abducció aïllada amb el gluti mitjà de motor únic.","adjust":"Ajusta la goma per sentir tensió des del primer grau.","short":"mateixa abducció aïllada"},"contingencia":{"name":"Clam amb goma, colzat de costat","why_acceptable":"Manté l'abducció amb rotació externa afegida i menys càrrega possible.","adjust":"Sèries més llargues, 15–20 repeticions.","short":"abducció amb rotació externa"},"not_equivalent":["Esquat sumo amb barra · barra a les espatlles","Gambada lateral amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Seu amb l'esquena recolzada i els <span class=\"key\">coixins per fora de la cuixa</span>, no del genoll.</li> <li>Ajusta l'obertura inicial perquè les cames comencin juntes, amb el gluti ja una mica estirat.</li> <li>Decideix la <span class=\"key\">inclinació del tronc</span> —recte o uns 30° endavant— i comprova que l'esquena hi queda recolzada.</li> <li>Tria un pes que et permeti 20 repeticions controlades amb pausa.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Obertura (1–2 s).</span> Separa les cames de manera controlada fins al rang complet.</li> <li><span class=\"key\">Contracció (1 s).</span> Estreny al punt d'obertura màxima.</li> <li><span class=\"key\">Tancament (3 s).</span> Torna lentament, sense deixar que les plaques toquin.</li> <li>Encadena sense rebot.</li> </ol>","tags":{"primary":["Gluti mitjà"],"secondary":[],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"C-07","position":"C-07","session":"C","order":11,"name":"Bessons","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Elevació de taló a la Leg Press o al Seated Calf · no consten a l'inventari M1–M7"},"muscles":"Gastrocnemi · sòli","prescription":{"series":"3","reps":"12–20","tempo":"3‑2‑1‑1","rest":"60 s","rir":"0–1"},"quick":{"do":["Alterna les dues variants entre cicles i apunta quina toca","A la premsa: puntes a la vora inferior de la plataforma, cames esteses sense bloquejar","Al Seated Calf: coixí sobre la part baixa de la cuixa, prop del genoll","Pes que et deixi baixar i pujar el taló del tot"],"dont":"Rebotar: el tendó fa la feina i el múscul no","feel":"Estirament clar al bessó a la part baixa","grip":"Puntes a la vora del suport, amb prou peu a sobre per empènyer"},"grip_title":"Els peus i la col·locació","theory_html":"<p><span class=\"k\">Dos músculs, no un.</span> El <span class=\"k\">gastrocnemi</span> és el que es veu, el que dibuixa la panxa del bessó, i creua el genoll: només treballa bé amb la cama estirada. El <span class=\"k\">sòli</span> queda a sota, no creua el genoll i és el que treballa quan el genoll està doblegat. Per això hi ha dues variants que alternen: amb una sola, en deixaries la meitat sense fer.</p> <p><span class=\"k\">Per què la pausa de baix és tot l'exercici.</span> El bessó i el seu tendó són molt elàstics, com una molla. Si rebotes, el que et torna amunt és el tendó i el múscul amb prou feines participa: pots fer vint repeticions i no haver entrenat res. Els dos segons aturat a baix són la diferència entre entrenar el múscul i moure pes.</p> <p><span class=\"k\">Una conseqüència que has de saber.</span> Com que les variants alternen, cada múscul es treballa un cicle sí i un no. És una decisió presa; si algun dia vols accelerar aquesta zona, aquí hi ha marge.</p>","cues":["Baixa el taló tan avall com puguis","Dos segons complets de pausa a baix, comptats","Puja del tot empenyent amb la base dels dits i estreny un segon","Angle de genoll fix: ni es dobla ni s'estira per ajudar"],"setup_steps":["<span class=\"key\">Calf a la premsa:</span> puntes dels peus a la vora inferior de la plataforma, talons a l'aire i cames esteses sense bloquejar el genoll. Aquesta és la variant del múscul que creua el genoll.","<span class=\"key\">Seated Calf:</span> coixí sobre la part baixa de la cuixa, prop del genoll. Amb el genoll doblegat treballa el múscul de sota.","En totes dues, comprova que tens <span class=\"key\">tota la part davantera del peu</span> sobre el suport: amb només els dits, el turmell treballa en equilibri en comptes de en força.","Peus rectes i a l'amplada dels malucs."],"grip_html":"<p><span class=\"k\">Quant peu ha de quedar sobre el suport.</span> La part del davant del peu sencera, no només els dits. Amb només els dits, el turmell treballa en equilibri en comptes de en força.</p> <p><span class=\"k\">Peus rectes.</span> Girar les puntes cap enfora o cap endins per buscar una part o altra del bessó no canvia gaire res i sí que canvia com treballa el turmell.</p> <p><span class=\"k\">Per què l'angle del genoll ho decideix tot.</span> Amb la cama estesa treballa sobretot el gastrocnemi; amb el genoll doblegat, com al Seated Calf, el gastrocnemi queda escurçat i la feina passa al sòli. És la mateixa flexió de turmell amb dos músculs diferents al davant.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Baixa el taló tan avall com puguis, buscant l'estirament complet.","<span class=\"key\">Pausa (2 s).</span> Dos segons complets, comptats, sense rebotar.","<span class=\"key\">Pujada (1 s).</span> Empeny amb la base dels dits fins a dalt de tot.","<span class=\"key\">Contracció (1 s).</span> Estreny un segon abans de tornar a baixar."],"notice_html":"<p>Estirament clar al bessó a la part baixa i crema profunda cap a la meitat de la sèrie. <span class=\"k\">Si notes el tendó d'Aquil·les punxant</span>, has rebotat o has baixat de cop. <span class=\"k\">Si la sèrie se't fa fàcil i no crema</span>, gairebé segur que el recorregut és curt: el bessó pot amb molt de pes i per això s'entrena malament tan sovint.</p>","verify_html":"<p><span class=\"k\">Prova del suport:</span> si només hi tens els dits, el turmell treballa en equilibri en comptes de en força.</p> <p><span class=\"k\">Prova del genoll:</span> si es dobla i s'estira per ajudar a pujar, el bessó ha deixat de fer la feina sol.</p> <p><span class=\"k\">Prova del rang:</span> si amb aquest pes no pots baixar i pujar del tot, redueix la càrrega.</p>","errors":[{"error":"Rebotar a baix","why":"Converteix l'exercici en un joc de tendons i el múscul amb prou feines participa.","fix":"Dos segons complets, comptats.","cause":"El bessó és molt elàstic i el rebot és el camí de menys resistència quan la sèrie es fa llarga."},{"error":"Rang curt amb molt de pes","why":"No treballes ni la part estirada ni la contreta.","fix":"Pes que permeti baixar el taló del tot i pujar del tot.","cause":"És un múscul acostumat a molta càrrega, i el pes alt sembla apropiat encara que impedeixi el rang."},{"error":"Ajudar-se doblegant i estirant el genoll","why":"Converteix el moviment en una mitja empenta de cama i treu el bessó de la feina quan cansa.","fix":"Angle de genoll fix de la primera a l'última repetició.","cause":"Quan el bessó s'esgota, el genoll és l'articulació més a prop per afegir un impuls que gairebé no es veu."}],"progression_html":"<p>Per repeticions: de 12 a 20 amb el mateix pes, i llavors un increment i tornada a 12.</p>","note_html":"","extra_sections":[],"figure":"calf","video":{"url":"https://www.youtube.com/watch?v=OMUvfMZOcSA","title":"Exercise Tutorial: Calf Raise On Leg Press Machine","confidence":"alta","note":"La segona variant, el Seated Calf, té el seu propi vídeo com a enllaç alternatiu.","alt_url":"https://www.youtube.com/watch?v=pz66Bw6HJ4s","alt_title":"Seated Calf Raise Machine Tutorial"},"alternatives":{"principal":{"name":"Elevació de taló a la premsa de cames","why_equivalent":"Mateixa flexió plantar amb càrrega i el bessó de motor.","adjust":"Rang complet: baixa fins a sentir estirament al taló.","short":"mateixa flexió plantar"},"contingencia":{"name":"Elevació de taló a una cama, dempeus amb suport","why_acceptable":"Sense màquina, el pes del cos ja és prou estímul si el rang és complet.","adjust":"Afegeix una manuella quan el pes del cos es quedi curt.","short":"pes del cos, rang complet"},"not_equivalent":["Salt a la corda · impacte no controlat","Sprint · fora del patró de força"]},"v22":true,"setup_html":"<ol> <li><span class=\"key\">Calf a la premsa:</span> puntes dels peus a la vora inferior de la plataforma, talons a l'aire i cames esteses sense bloquejar el genoll. Aquesta és la variant del múscul que creua el genoll.</li> <li><span class=\"key\">Seated Calf:</span> coixí sobre la part baixa de la cuixa, prop del genoll. Amb el genoll doblegat treballa el múscul de sota.</li> <li>En totes dues, comprova que tens <span class=\"key\">tota la part davantera del peu</span> sobre el suport: amb només els dits, el turmell treballa en equilibri en comptes de en força.</li> <li>Peus rectes i a l'amplada dels malucs.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Baixa el taló tan avall com puguis, buscant l'estirament complet.</li> <li><span class=\"key\">Pausa (2 s).</span> Dos segons complets, comptats, sense rebotar.</li> <li><span class=\"key\">Pujada (1 s).</span> Empeny amb la base dels dits fins a dalt de tot.</li> <li><span class=\"key\">Contracció (1 s).</span> Estreny un segon abans de tornar a baixar.</li> </ol>","tags":{"primary":["Gastrocnemi"],"secondary":["Sòli"],"minor":[],"traits":[]},"registre":{"opcions":{"titol":"Màquina","valors":["Leg Press","Seated Calf"]},"proposta":"doble"}},{"key":"C-S1","position":"C-S1","session":"C","order":12,"name":"Glute kickback unilateral","category":"SUPLETORI","category_label":"Supletori","machine":{"code":null,"label":"Màquina de patada de gluti amb coixí de genoll · no consta a l'inventari M1–M7"},"muscles":"Gluti major","prescription":{"series":"2–3","reps":"12–15","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Coixí del pit a l'alçada que et deixi agafar-te als mànecs còmodament","Peu de suport ben plantat, genoll una mica flexionat","Cama de treball al coixí amb el genoll a uns 90°","Abdomen estret i pelvis neutra abans de moure res"],"dont":"Arquejar la lumbar per arribar més lluny","feel":"Contracció localitzada al gluti de la cama que treballa","grip":"Pressió al taló o a la planta, mai a la punta"},"grip_title":"El peu i la col·locació","theory_html":"<p><span class=\"k\">Què aporta.</span> És una extensió de maluc a una cama, i el que fa bé és carregar el gluti <span class=\"k\">al final del recorregut</span>, on el hip thrust ja ha perdut tensió. A més, treballa una cama cada cop, i això revela asimetries que els exercicis a dues cames amaguen: el costat fort compensa i no te n'assabentes.</p> <p><span class=\"k\">Per què és supletori.</span> El gluti ja té la càrrega pesada garantida al hip thrust. Això és un complement per a dies sobrats de temps: si no el fas mai, el programa segueix complet.</p> <p><span class=\"k\">L'error que el converteix en inútil.</span> La temptació és arquejar la lumbar per portar la cama més enrere. Quan ho fas, deixa de ser un exercici de gluti i passa a ser de lumbar, que és justament el que aquest programa vol descarregar.</p>","cues":["Empeny amb el taló, com si deixessis una petjada a la paret de darrere","Atura quan la cuixa arribi a la línia del tronc","Els dos malucs quadrats, encarats al coixí","Retorn de 3 segons sense que la pila toqui fons","Comença per la cama feble i iguala amb la forta"],"setup_steps":["Ajusta l'alçada del coixí del pit perquè el tronc quedi inclinat endavant i puguis agafar-te als mànecs amb comoditat.","Peu de suport ben plantat, amb el genoll lleugerament flexionat, no bloquejat.","Col·loca la cama de treball al coixí, amb el genoll doblegat a uns 90°.","Estreny l'abdomen i posa la <span class=\"key\">pelvis neutra</span> abans de la primera repetició."],"grip_html":"<p><span class=\"k\">On empenys.</span> Al taló o a la planta, mai a la punta. Amb la punta, el bessó i l'isquiotibial prenen el relleu del gluti.</p> <p><span class=\"k\">Els malucs, quadrats.</span> Tots dos encarats al coixí. Girar el maluc cap enfora dona uns centímetres de recorregut que no fa el gluti, i no es veu si no et mires de front.</p>","execution_steps":["<span class=\"key\">Empenta (1–2 s).</span> Porta la cama enrere empenyent amb el taló.","<span class=\"key\">Punt final.</span> Atura't quan la cuixa estigui en línia amb el tronc, o just abans que la pelvis vulgui moure's.","<span class=\"key\">Contracció (1 s).</span> Estreny el gluti conscientment, un segon complet.","<span class=\"key\">Retorn (3 s).</span> Torna lentament fins a notar el gluti estirat, sense que la pila reposi."],"notice_html":"<p>Contracció clara i localitzada al gluti de la cama que treballa, sobretot al punt final. <span class=\"k\">Si notes la part baixa de l'esquena</span>, la pelvis ha rodat. <span class=\"k\">Si notes la cuixa posterior</span>, tens el genoll massa estès i l'isquiotibial ha agafat la feina.</p>","verify_html":"<p><span class=\"k\">Prova de la mà:</span> posa la mà lliure a la part baixa de l'esquena durant una sèrie lleugera. Si la zona es mou sota la mà, has passat el teu rang.</p> <p><span class=\"k\">Prova de la pausa:</span> atura't un segon al punt final amb els malucs quadrats. Si el maluc es gira o l'esquena es corba, el pes és excessiu.</p>","errors":[{"error":"Arquejar la lumbar per guanyar recorregut","why":"És l'error que converteix aquest exercici en inútil i potencialment molest.","fix":"Abdomen estret i atura el moviment quan la cuixa arriba a la línia del tronc.","cause":"Arquejar allarga el recorregut sense que el gluti hi posi res, i passa sol quan es busca arribar més amunt."},{"error":"Empènyer amb la punta del peu","why":"El bessó i l'isquiotibial prenen el relleu.","fix":"Tota la pressió al taló.","cause":"Amb la cama estesa, el taló queda lluny i la punta és el que toca primer el coixí."},{"error":"Deixar caure el pes al retorn","why":"Perds la meitat de l'exercici i la tensió s'apaga entre repeticions.","fix":"Tres segons de retorn i la pila no toca mai el fons.","cause":"El retorn no compta al comptador de repeticions."}],"progression_html":"<p>Fes primer la <span class=\"k\">cama més feble</span> i fes amb la forta exactament les mateixes repeticions, encara que en pogués fer més: és l'única manera que l'asimetria es tanqui. Puja pes quan facis 15 repeticions netes amb les dues cames i sense arquejar.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=kSDdn8uCRy4","title":"Glute Kickback Tutorial (The Gym In The North)","confidence":"alta","note":"Màquina amb coixí de genoll, no la variant de politja."},"alternatives":{"principal":{"name":"Patada de gluti a quatre grapes, goma al turmell","why_equivalent":"Mateixa extensió de maluc aïllada; la goma substitueix la resistència guiada.","adjust":"Tensió des del primer grau; ajusta la longitud de la goma abans de començar.","short":"mateixa extensió aïllada"},"contingencia":{"name":"Hip thrust a terra, una cama","why_acceptable":"Extensió de maluc unilateral en cadena tancada, amb menys aïllament.","adjust":"RIR 3; sense pes afegit fins a dominar l'equilibri.","short":"unilateral, cadena tancada"},"not_equivalent":["Pes mort a una cama amb barra · càrrega en flexió","Gambada posterior amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Ajusta l'alçada del coixí del pit perquè el tronc quedi inclinat endavant i puguis agafar-te als mànecs amb comoditat.</li> <li>Peu de suport ben plantat, amb el genoll lleugerament flexionat, no bloquejat.</li> <li>Col·loca la cama de treball al coixí, amb el genoll doblegat a uns 90°.</li> <li>Estreny l'abdomen i posa la <span class=\"key\">pelvis neutra</span> abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Empenta (1–2 s).</span> Porta la cama enrere empenyent amb el taló.</li> <li><span class=\"key\">Punt final.</span> Atura't quan la cuixa estigui en línia amb el tronc, o just abans que la pelvis vulgui moure's.</li> <li><span class=\"key\">Contracció (1 s).</span> Estreny el gluti conscientment, un segon complet.</li> <li><span class=\"key\">Retorn (3 s).</span> Torna lentament fins a notar el gluti estirat, sense que la pila reposi.</li> </ol>","tags":{"primary":["Gluti major"],"secondary":[],"minor":[],"traits":["Unilateral"]},"registre":{"proposta":"doble"}},{"key":"TB-01","position":"TB-01","session":"TB","order":1,"name":"PureStrength Row, presa prona","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"PureStrength Row amb pit recolzat · no consta a l'inventari M1–M7"},"muscles":"Trapezi mitjà · romboides · deltoide posterior · dorsal","prescription":{"series":"4","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"1–2"},"quick":{"do":["És el líder del dia: hi entres fresc i hi poses la càrrega","Seient a l'alçada que deixa la barra davant de la part baixa del pit","Barra horitzontal: aquesta sessió sempre presa pronada","Pit recolzat al coixí i omòplats avall abans de començar"],"dont":"Tirar amb els bíceps: crema l'avantbraç i no l'esquena","feel":"Feina entre els omòplats i darrere les espatlles","grip":"Pronada a la barra horitzontal, palmells cap avall"},"grip_title":"La presa","theory_html":"<p><span class=\"k\">L'altra funció del dorsal, i la de l'esquena alta.</span> El dorsal porta el braç enrere —això és un rem— i el baixa des de dalt —això és una tirada vertical—. Però un rem no és només dorsal: segons com vagin els colzes, hi entra tota la <span class=\"k\">musculatura d'entre els omòplats</span>, que és la que et manté el pit obert i les espatlles enrere sense pensar-hi.</p> <p><span class=\"k\">Què decideix la presa.</span> Amb la barra i els colzes oberts, la feina puja cap al trapezi mitjà, els romboides i el deltoide posterior. Amb les nanses verticals i els colzes arran del cos, el motor passa a ser el dorsal. Són dos exercicis diferents amb la mateixa màquina, i el cicle els reparteix: aquí la barra, perquè avui la tirada vertical ja va a buscar el dorsal; a Tronc A, les nanses.</p> <p><span class=\"k\">Per què obre la sessió.</span> A Tronc A aquesta màquina arriba amb el pit i una tirada al damunt. Aquí hi entres fresc, i per això porta una sèrie més i és on has de posar la teva millor sèrie del dia.</p>","cues":["Pensa en el colze cap enrere, no en la mà","Colzes oberts a uns 45–60° del tronc","Ajunta els omòplats al final del recorregut","Extensió completa deixant estirar els omòplats endavant","Coll llarg: les espatlles no pugen cap a les orelles"],"setup_steps":["Ajusta el seient perquè la barra quedi a l'alçada de la <span class=\"key\">part baixa del pit</span> amb els braços estesos.","Pit recolzat al coixí, sense enfonsar-hi el tronc ni separar-se'n per arribar més lluny.","Agafa la <span class=\"key\">barra horitzontal</span> amb els palmells cap avall, a l'amplada que et deixi portar els colzes oberts sense forçar el canell.","Omòplats avall abans de la primera tirada."],"grip_html":"<p><span class=\"k\">Barra horitzontal, presa pronada.</span> Palmells cap avall. És la presa que obre els colzes, i els colzes oberts són el que puja la feina cap a l'esquena alta.</p> <p><span class=\"k\">Quant d'oberts.</span> Uns 45–60° respecte del tronc. Del tot oberts, a 90°, l'espatlla treballa en una posició més exposada i el recorregut s'escurça; enganxats al cos, tornes a fer el rem de dorsal, que ja fas a Tronc A.</p> <p><span class=\"k\">La mà no estreny.</span> Presa ferma, però la força surt del colze. Si l'avantbraç crema abans que l'esquena, prova una sèrie pensant només a portar el colze cap a la paret de darrere.</p>","execution_steps":["<span class=\"key\">Tirada (2 s).</span> Colzes cap enrere i oberts, amb la barra venint cap a la part baixa del pit. Les mans només aguanten.","<span class=\"key\">Contracció (1 s).</span> Ajunta els omòplats al final del recorregut.","<span class=\"key\">Retorn (3 s).</span> Estén del tot i deixa que els omòplats s'estirin endavant.","<span class=\"key\">Pausa (1 s)</span> amb l'esquena estirada, sense que la pila reposi."],"notice_html":"<p>Feina al mig i a la part alta de l'esquena, amb el pit quiet contra el coixí. <span class=\"k\">Si el que notes és l'avantbraç</span>, has tirat amb la mà en comptes del colze. <span class=\"k\">Si el que notes és el coll</span>, has encongit les espatlles per acabar la tirada. <span class=\"k\">Si no notes res entre els omòplats</span>, els colzes van massa enganxats al cos i estàs fent el rem de Tronc A.</p>","verify_html":"<p><span class=\"k\">Prova del seient:</span> amb el pit al coixí i els braços estesos, les mans queden a l'alçada de la part baixa del pit.</p> <p><span class=\"k\">Prova del pit:</span> si has de separar el pit del coixí per completar la repetició, el pes és excessiu. És la comprovació més fiable d'aquest exercici.</p> <p><span class=\"k\">Prova de la càrrega:</span> com que hi arribes fresc, hauries de moure una mica més de pes que a TA‑04. Si no passa de manera repetida, revisa el descans entre sessions.</p>","errors":[{"error":"Tirar amb els bíceps","why":"Es nota perquè l'avantbraç crema i l'esquena no.","fix":"Pensa en el colze, no en la mà.","cause":"Agafar fort i tirar amb la mà és el gest natural."},{"error":"Separar el pit del coixí","why":"Perds l'aïllament que aquesta màquina et dona i tornes a gronxar-te.","fix":"Pit enganxat tota la sèrie.","cause":"Separar-se allarga el recorregut i regala els centímetres que amb el pes alt no surten."},{"error":"Encongir les espatlles","why":"El trapezi superior pren la feina del que havia de fer l'esquena mitjana.","fix":"Coll llarg i omòplats avall abans de cada repetició.","cause":"El trapezi entra a ajudar quan l'esquena arriba al final del seu rang i encara queda pes."}],"progression_html":"<p>12 repeticions netes a les quatre sèries → un increment i tornada a 8. Compara-ho amb la mateixa presa: les nanses neutres de TA‑04 no mesuren el mateix.</p>","note_html":"Aquesta posició i la de Tronc A són la mateixa màquina amb un paper diferent: allà arriba després de pit i tirada, i amb una presa que busca el dorsal; aquí obre la sessió amb la presa que busca l'esquena alta. Fes-hi sempre la teva millor sèrie del dia.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>Quan a l'última sèrie ja no puguis completar la tirada, deixa els colzes quiets i <span class=\"k\">continua només ajuntant els omòplats</span>, recorreguts de pocs centímetres, fins que tampoc surtin. Així la part final del moviment es manté encara que el braç ja no pugui. Opcional, i només a l'última sèrie.</p>"}],"figure":"row_grips","video":{"url":"https://www.youtube.com/watch?v=TvFhOtAdHno","title":"Technogym Pure Strength Plate Loaded | Row","confidence":"exacta","note":"Mateixa màquina. Aquí fes servir la barra horitzontal."},"alternatives":{"principal":{"name":"Rem a politja baixa amb barra, presa pronada","why_equivalent":"Mateixa tirada horitzontal amb els colzes oberts i l'esquena alta de motor.","adjust":"Sense suport al pit, el tronc s'ha de sostenir sol: RIR 3 i pes lleugerament inferior.","short":"mateixa tirada, sense suport"},"contingencia":{"name":"Rem amb manuella a un braç, mà i genoll al banc","why_acceptable":"Conserva la tirada amb suport de tres punts i la lumbar descarregada. Perd la càrrega bilateral.","adjust":"Cada braç la seva sèrie. Atura't quan el tronc comenci a girar, encara que el braç pugui.","short":"unilateral, lumbar descarregada"},"not_equivalent":["Rem inclinat amb barra · demanda d'erectors","Pes mort · càrrega en flexió"]},"v22":true,"setup_html":"<ol> <li>Ajusta el seient perquè la barra quedi a l'alçada de la <span class=\"key\">part baixa del pit</span> amb els braços estesos.</li> <li>Pit recolzat al coixí, sense enfonsar-hi el tronc ni separar-se'n per arribar més lluny.</li> <li>Agafa la <span class=\"key\">barra horitzontal</span> amb els palmells cap avall, a l'amplada que et deixi portar els colzes oberts sense forçar el canell.</li> <li>Omòplats avall abans de la primera tirada.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Tirada (2 s).</span> Colzes cap enrere i oberts, amb la barra venint cap a la part baixa del pit. Les mans només aguanten.</li> <li><span class=\"key\">Contracció (1 s).</span> Ajunta els omòplats al final del recorregut.</li> <li><span class=\"key\">Retorn (3 s).</span> Estén del tot i deixa que els omòplats s'estirin endavant.</li> <li><span class=\"key\">Pausa (1 s)</span> amb l'esquena estirada, sense que la pila reposi.</li> </ol>","tags":{"primary":["Trapezi mitjà","Romboides","Deltoide posterior"],"secondary":["Dorsal ample"],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TB-02","position":"TB-02","session":"TB","order":2,"name":"Banc inclinat 30° amb manuelles","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Banc regulable i manuelles · no consta a l'inventari M1–M7"},"muscles":"Pit clavicular · deltoide anterior · tríceps","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"1–2"},"quick":{"do":["Compta les marques del seient: 30°, no 45°","Cinc punts de contacte i peus empenyent el terra","Omòplats enrere i avall, clavats al banc","Puja una manuella amb el genoll, pausa, i després l'altra"],"dont":"Passar a 45° sense adonar-te'n i convertir-ho en un press d'espatlla","feel":"Tensió a la part alta del pit","grip":"Pronada — palmells endavant, canell just sobre el colze"},"grip_title":"La presa i la trajectòria","theory_html":"<p><span class=\"k\">La part del pit que dona la línia.</span> El pectoral té una part gran, que va de l'os del braç a l'estèrnum, i una de dalt que arriba a la clavícula. La de dalt <span class=\"k\">s'activa quan el braç va cap amunt</span>, i és la que dibuixa la línia del pit vista de front, just sota la clavícula. Als 15° de Tronc A amb prou feines hi participa; als 30° sí.</p> <p><span class=\"k\">Per què 30 i no 45.</span> La franja útil per a aquesta part va d'uns 25 a 40 graus. Per sobre, el braç es verticalitza tant que l'exercici es converteix, de fet, en un press d'espatlla amb ajuda del pit. Per això compta les marques del seient: a molts bancs, la següent marca salta directament a 45.</p> <p><span class=\"k\">El preu es paga en repeticions, no en tècnica.</span> Amb més inclinació el deltoide anterior hi participa més, i per això aquesta posició treballa a 8–12 en lloc de 6–10: una mica més de volum amb una mica menys de càrrega. Que et resulti més feixuc que el banc de 15° és normal, i no s'ha d'igualar el pes.</p>","cues":["Colzes a 45° del tronc, mai oberts a 90°","Les manuelles baixen cap a la part alta del pit","Pausa d'un segon a baix, sense rebotar","Empeny en línia recta i no facis xocar les manuelles a dalt","Extensió còmoda, sense impacte"],"setup_steps":["Banc a 30°. <span class=\"key\">Compta les marques del seient</span>: a molts bancs, la marca següent salta a 45°.","Seu amb les manuelles de cantell sobre les cuixes. <span class=\"key\">Puja'n una amb una empenta del genoll, fes una pausa, i després l'altra.</span>","<span class=\"key\">Cinc punts de contacte:</span> cap, espatlles, gluti i els dos peus a terra, empenyent perquè el cos no llisqui pel banc.","Omòplats enrere i avall, clavats al banc. Amb més inclinació costa més mantenir-los: si no pots, baixa el pes."],"grip_html":"<p><span class=\"k\">Presa pronada, canell recte.</span> Palmells endavant i canell <span class=\"key\">just a sobre del colze</span>, amb l'avantbraç vertical. Si el canell cau enrere, el pes queda darrere de la línia de força i el colze ho paga.</p> <p><span class=\"k\">On baixen les manuelles.</span> Cap a la <span class=\"key\">part alta del pit</span>, més amunt que al banc de 15°, tocant la part exterior. Mai a l'alçada del coll: amb el banc inclinat, portar-les amunt del tot posa l'espatlla en la posició de menys marge.</p> <p><span class=\"k\">A dalt.</span> Pugen rectes i es poden acostar, però no han de xocar. El rang útil és una mica més curt que al banc de 15°: no forcis per baixar més.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Les manuelles baixen cap a la part alta del pit, amb els colzes a 45° del tronc.","<span class=\"key\">Pausa (1 s)</span> al punt baix, sense rebotar.","<span class=\"key\">Empenta (1 s)</span> amb els omòplats clavats, en línia recta i acostant les manuelles sense fer-les tocar.","<span class=\"key\">Pausa (1 s)</span> a dalt, en una extensió còmoda, sense impacte."],"notice_html":"<p>Feina a la part alta del pit, més amunt que al banc de 15°, amb el deltoide anterior participant-hi clarament: en aquest angle és normal. <span class=\"k\">Si el pit gairebé no hi és</span>, l'angle ha passat de 30°. <span class=\"k\">Si el que notes és el coll</span>, les espatlles han pujat. <span class=\"k\">Si notes el davant de l'espatlla durant tota la sèrie</span>, i no només a les últimes repeticions, els colzes s'han obert massa.</p>","verify_html":"<p><span class=\"k\">Prova de les marques:</span> compta-les sempre abans de començar i fes-ho sempre igual.</p> <p><span class=\"k\">Prova del deltoide:</span> si el notes més que el pit durant tota la sèrie, i no només a les últimes repeticions, l'angle és massa alt o els colzes han pujat cap a les orelles.</p> <p><span class=\"k\">Prova del segon buit:</span> atura't un segon amb les manuelles al pit. Si els omòplats es deixen anar o les manuelles se't van cap enfora, el pes és excessiu.</p>","errors":[{"error":"Passar de 30° sense adonar-se'n","why":"A molts bancs la marca següent salta a 45°, i als 45° això ja és un press d'espatlla amb ajuda del pit.","fix":"Compta les marques del seient i fes-ho sempre igual.","cause":"El banc es queda on el va deixar l'últim que l'ha fet servir."},{"error":"Els omòplats es deixen anar","why":"La tensió emigra al davant de l'espatlla, que en aquest angle ja treballa prou.","fix":"Si no els pots mantenir, baixa el pes.","cause":"Amb el tronc més vertical costa més mantenir-los, i afluixar-los dona recorregut de franc."},{"error":"Deixar que els colzes s'obrin a 90°","why":"Desvia la tensió al deltoide i posa l'espatlla en la posició de més pinçament.","fix":"Braços que dibuixen una A, no una T, igual que al banc de 15°.","cause":"Amb més inclinació el braç tendeix a obrir-se sol, i obrir sembla donar més estirament."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb RIR 1–2 i els omòplats mantinguts → següent parell de manuelles i tornada a 8. Si en pujar de pes els omòplats es deixen anar, has pujat massa aviat.</p>","note_html":"Si aquest banc et resulta més feixuc que el de 15°, no hi ha res a corregir: el deltoide anterior hi participa més i el pit clavicular és un múscul més petit. No cal igualar el pes del primer banc.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=sK4Rvug6ufo","title":"Incline Dumbbell Bench Press Tutorial - Proper Form and Technique","confidence":"alta","note":"Genèric: no especifica els 30°."},"alternatives":{"principal":{"name":"Press inclinat a màquina, angle similar","why_equivalent":"Mateixa empenta ascendent amb esquena recolzada i trajectòria guiada.","adjust":"Pots pujar un esglaó: la guia treu part de l'estabilització.","short":"mateix angle, guiat"},"contingencia":{"name":"Press pla amb manuelles","why_acceptable":"Conserva l'estabilització de cada braç. Perd angle clavicular i guanya part esternal.","adjust":"Mateix RIR; menys pes que amb l'angle de 30°.","short":"empenta amb més part esternal"},"not_equivalent":["Press de banca amb barra · fora del sistema de màquines","Press militar · treball per sobre del cap"]},"v22":true,"setup_html":"<ol> <li>Banc a 30°. <span class=\"key\">Compta les marques del seient</span>: a molts bancs, la marca següent salta a 45°.</li> <li>Seu amb les manuelles de cantell sobre les cuixes. <span class=\"key\">Puja'n una amb una empenta del genoll, fes una pausa, i després l'altra.</span></li> <li><span class=\"key\">Cinc punts de contacte:</span> cap, espatlles, gluti i els dos peus a terra, empenyent perquè el cos no llisqui pel banc.</li> <li>Omòplats enrere i avall, clavats al banc. Amb més inclinació costa més mantenir-los: si no pots, baixa el pes.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Les manuelles baixen cap a la part alta del pit, amb els colzes a 45° del tronc.</li> <li><span class=\"key\">Pausa (1 s)</span> al punt baix, sense rebotar.</li> <li><span class=\"key\">Empenta (1 s)</span> amb els omòplats clavats, en línia recta i acostant les manuelles sense fer-les tocar.</li> <li><span class=\"key\">Pausa (1 s)</span> a dalt, en una extensió còmoda, sense impacte.</li> </ol>","tags":{"primary":["Pit clavicular"],"secondary":["Deltoide anterior"],"minor":["Tríceps"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TB-03","position":"TB-03","session":"TB","order":3,"name":"Dominada assistida, presa neutra","category":"FIX","category_label":"Fix","machine":{"code":"M2","label":"Kneeling Easy Chin Up (Technogym) · a M1 quan la facis sense ajuda"},"muscles":"Dorsal ample · rodó major · bíceps · braquial","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"1–2"},"quick":{"do":["Càrrega d'assistència amb el pin: més pes vol dir més ajuda","Genolls junts al coixí i tronc vertical","Presa neutra, a la part angulada de les nanses","Calibra a la primera sèrie: 8–12 repeticions amb 1–2 al pap"],"dont":"Arrencar amb una empenta dels genolls o una sacsejada del tronc: aquella repetició no compta","feel":"Els costats de l'esquena, de l'aixella cap avall; el bíceps hi treballa però no mana","grip":"Neutra — palmells encarats, a les nanses angulades"},"theory_html":"<p><span class=\"k\">Per què una dominada i no un pulldown.</span> És la mateixa funció del dorsal —baixar el braç des de dalt cap al costat del cos— però amb el cos com a càrrega. La manera d'entendre-la és exactament al revés del que sembla: <span class=\"k\">no pensis a pujar el cos, pensa a baixar les nanses cap a tu</span>. És un pulldown en què el que es mou ets tu.</p> <p><span class=\"k\">Per què assistida, i fins quan.</span> Sense ajuda en fas com a molt set, i una sèrie de 8–12 a prop de la fallada no hi cap. La màquina et resta pes corporal, i això et deixa treballar al mateix rang i RIR que la resta de tirades. El criteri dels vídeos de referència és que la dominada lliure comença a ser útil per créixer quan en surten unes 10–15 seguides: fins llavors, l'assistència és l'eina, no una concessió.</p> <p><span class=\"k\">Per què presa neutra.</span> M1 i M2 només admeten neutra o pronada oberta. Amb la neutra els colzes baixen arran del cos i el dorsal mana; amb la pronada oberta la feina pujaria a l'esquena alta, que avui ja la fa el rem amb barra.</p>","cues":["Primer baixen les espatlles, després tiben els colzes","Colzes en diagonal cap a les costelles, mai oberts en creu","Barbeta per sobre de les mans, amb les espatlles lluny de les orelles","Baixada de 3 s fins als braços estesos del tot"],"setup_steps":["Selecciona la <span class=\"key\">càrrega d'assistència</span> amb el pin groc. <span class=\"key\">Més pes vol dir més ajuda.</span> El primer dia comença amb molta assistència i treu-ne fins que la sèrie acabi entre 8 i 12 repeticions amb una o dues al pap.","Puja a l'estació, agafa les nanses angulades amb presa neutra i després recolza els dos genolls al coixí. El coixí cedeix amb el teu pes fins que quedes penjat amb els braços estesos.","Genolls junts, tronc vertical i abdomen lleugerament estret: el cos fa un sol bloc dels genolls al cap. No arquegis la lumbar per trobar l'equilibri.","Abans de la primera repetició, allunya les espatlles de les orelles uns centímetres sense doblegar els colzes. Aquest és el punt de partida de cada repetició."],"grip_html":"<p><span class=\"k\">On van les mans.</span> A la part angulada de les nanses, palmells encarats i polze tancat. L'amplada la fixa la màquina.</p> <p><span class=\"k\">Què fa la presa neutra.</span> Els colzes baixen per davant del tronc, a prop del cos: el dorsal és el motor principal i el braquial —el múscul sota el bíceps— hi treballa més que amb presa pronada. La presa pronada i oberta de M1 fa el contrari: colzes oberts i més feina per a l'esquena alta.</p> <p><span class=\"k\">Polze per sota o per sobre.</span> Per sota, l'agarrament és més ferm. Si l'avantbraç es cansa abans que l'esquena, posa el polze al costat dels altres dits: l'avantbraç hi participa menys i l'esquena es nota més.</p>","execution_steps":["<span class=\"key\">Arrencada.</span> Des de penjat, primer baixa les espatlles sense doblegar els colzes; just després comença a tibar. Els omòplats es mouen abans que els colzes.","<span class=\"key\">Pujada (1 s).</span> Porta els colzes cap a les costelles en diagonal, com si els volguessis ficar a les butxaques del darrere. Pit cap a les nanses; la barbeta supera l'alçada de les mans sense estirar el coll endavant.","<span class=\"key\">Pausa alta (1 s).</span> Espatlles avall, lluny de les orelles. Si per arribar més amunt les has d'encongir, el recorregut ja s'ha acabat.","<span class=\"key\">Baixada (3 s).</span> Controlada fins a tenir els braços estesos del tot.","<span class=\"key\">Pausa baixa (1 s).</span> Penjat, notant l'estirament als costats de l'esquena. Torna a arrencar sense rebotar."],"notice_html":"<p>Feina als costats de l'esquena, de l'aixella cap avall, i un estirament clar quan quedes penjat. <span class=\"k\">Si el que més notes és el bíceps</span>, estàs tirant amb les mans en lloc de portar els colzes avall. <span class=\"k\">Si notes el coll</span>, les espatlles pugen cap a les orelles a la part alta. <span class=\"k\">Si la sèrie s'acaba perquè no t'aguantes</span>, i no perquè l'esquena no pugui, necessites més assistència.</p>","verify_html":"<p><span class=\"k\">Prova del recorregut:</span> braços estesos del tot a baix i barbeta per sobre de les mans a dalt. Si alguna de les dues falla abans de la vuitena repetició, necessites més assistència.</p> <p><span class=\"k\">Prova de l'arrencada:</span> la primera repetició surt sense cap empenta dels genolls ni del tronc. Si no, un esglaó més d'assistència.</p>","errors":[{"error":"Recorregut escurçat","why":"Si no baixes del tot perds l'estirament del dorsal, que és on rep més estímul; si no arribes a dalt, perds la contracció final.","fix":"Més assistència abans que menys recorregut.","cause":"A les últimes repeticions, la part més dura és arrencar des de baix, i quedar-se a mig camí l'estalvia."},{"error":"Colzes oberts en creu","why":"La tirada passa a l'esquena alta, l'espatlla treballa en una posició més exposada i el dorsal perd protagonisme.","fix":"Colzes en diagonal cap a les costelles.","cause":"Apareix quan tires amb les mans en lloc de pensar en els colzes."},{"error":"Impuls de genolls o de tronc","why":"Amb el genoll al coixí és fàcil empènyer, i cada empenta és pes que no aixeca l'esquena.","fix":"Genolls quiets i cos en bloc. Si la repetició no surt així, més assistència.","cause":"Assistència massa baixa per al nombre de repeticions."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb RIR 1–2 → treu un esglaó d'assistència i torna a 8. El dia que en facis 8 de netes sense cap assistència, passa a M1 amb la mateixa presa i el mateix rang.</p>","note_html":"Si algun dia l'objectiu fos fer més dominades lliures i no créixer, el mètode seria un altre: moltes sèries curtes lluny de la fallada, amb 2–4 minuts de descans, per acumular repeticions.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=aYPEH4WRo9Q","title":"Exercise Tutorial: Technogym Assisted Pull Up Machine (Neutral Grip)","confidence":"alta","note":"Mateixa família de màquina i mateixa presa. El teu model porta el rètol «Kneeling Easy Chin Up»."},"alternatives":{"principal":{"name":"Lat Pulldown, presa neutra","why_equivalent":"Mateixa tirada vertical amb els colzes a prop del cos i el dorsal com a motor. Canvia què es mou: aquí baixa la nansa, no puja el cos.","adjust":"Tria el pes per quedar a 8–12 amb RIR 1–2; no es pot comparar amb la càrrega d'assistència.","short":"mateixa tirada, cos fix"},"contingencia":{"name":"Lat Pulldown, presa supina estreta","why_acceptable":"Conserva la tirada vertical amb els colzes tancats. Hi guanya bíceps i hi perd una mica de dorsal respecte de la neutra.","adjust":"Mateix RIR; sol permetre un esglaó més de pes.","short":"tirada vertical, més bíceps"},"not_equivalent":["Dominada amb impuls (kipping) · el pes no l'aixeca l'esquena","Rem · tirada horitzontal, no vertical"]},"v22":true,"setup_html":"<ol> <li>Selecciona la <span class=\"key\">càrrega d'assistència</span> amb el pin groc. <span class=\"key\">Més pes vol dir més ajuda.</span> El primer dia comença amb molta assistència i treu-ne fins que la sèrie acabi entre 8 i 12 repeticions amb una o dues al pap.</li> <li>Puja a l'estació, agafa les nanses angulades amb presa neutra i després recolza els dos genolls al coixí. El coixí cedeix amb el teu pes fins que quedes penjat amb els braços estesos.</li> <li>Genolls junts, tronc vertical i abdomen lleugerament estret: el cos fa un sol bloc dels genolls al cap. No arquegis la lumbar per trobar l'equilibri.</li> <li>Abans de la primera repetició, allunya les espatlles de les orelles uns centímetres sense doblegar els colzes. Aquest és el punt de partida de cada repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Arrencada.</span> Des de penjat, primer baixa les espatlles sense doblegar els colzes; just després comença a tibar. Els omòplats es mouen abans que els colzes.</li> <li><span class=\"key\">Pujada (1 s).</span> Porta els colzes cap a les costelles en diagonal, com si els volguessis ficar a les butxaques del darrere. Pit cap a les nanses; la barbeta supera l'alçada de les mans sense estirar el coll endavant.</li> <li><span class=\"key\">Pausa alta (1 s).</span> Espatlles avall, lluny de les orelles. Si per arribar més amunt les has d'encongir, el recorregut ja s'ha acabat.</li> <li><span class=\"key\">Baixada (3 s).</span> Controlada fins a tenir els braços estesos del tot.</li> <li><span class=\"key\">Pausa baixa (1 s).</span> Penjat, notant l'estirament als costats de l'esquena. Torna a arrencar sense rebotar.</li> </ol>","grip_title":"La presa","tags":{"primary":["Dorsal ample"],"secondary":["Rodó major"],"minor":["Bíceps","Braquial"],"traits":[]},"registre":{"tipus_valor":"assistencia","proposta":"inversa"}},{"key":"TB-04","position":"TB-04","session":"TB","order":4,"name":"PureStrength Shoulder Press","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Shoulder Press PureStrength, de discos"},"muscles":"Deltoide anterior · deltoide lateral · tríceps","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"2"},"quick":{"do":["Seient a l'alçada que deixa les nanses a l'alçada de les espatlles","Esquena sencera al respatller i peus plans a terra","Costelles avall i abdomen lleugerament estret abans de començar","RIR 2 sempre: aquí no s'hi va mai a la fallada"],"dont":"Arquejar la lumbar per guanyar recorregut","feel":"Feina a l'espatlla sense pressió a la part baixa de l'esquena","grip":"Neutra si la màquina ho permet; colzes lleugerament endavant"},"grip_title":"La presa i la posició del colze","theory_html":"<p><span class=\"k\">Què fa el deltoide anterior.</span> Puja el braç per davant i, amb el tríceps, empeny per sobre del cap. Ja rep molta feina indirecta a tots els pressos de pit, però <span class=\"k\">amb el braç completament vertical</span> no el treballa cap altre exercici del programa. Això és el que justifica aquesta posició, i prou: no cal buscar-hi res més.</p> <p><span class=\"k\">Per què el RIR és més alt que a la resta.</span> És l'únic exercici que treballa per sobre del cap, i això té dues conseqüències: la columna rep càrrega en vertical i l'espatlla treballa on té menys marge. Per això porta <span class=\"k\">RIR 2 i no 1</span>. És la mateixa lògica que a la premsa de cames: on hi ha columna o articulació exposada, es deixa marge.</p> <p><span class=\"k\">Costelles avall: el detall que ho decideix tot.</span> Si l'espatlla no té prou recorregut, el cos el busca on pot i arqueja la lumbar. El senyal és que treus el pit i les costelles de davant s'obren cap amunt. Aquell recorregut extra no el fa l'espatlla: el fa la columna.</p>","cues":["Colzes lleugerament endavant, no oberts en creu","Extensió còmoda, sense impacte","Baixa fins que les mans quedin a l'alçada de la barbeta","Espatlles lluny de les orelles, però l'omòplat puja amb el braç a dalt","Acaba la sèrie amb dues repeticions al pap"],"setup_steps":["Ajusta el seient perquè les nanses quedin <span class=\"key\">a l'alçada de les espatlles</span> a l'inici. Si comencen per sobre del cap, el recorregut es queda curt justament on el deltoide fa més feina.","Esquena sencera al respatller i peus plans a terra.","Carrega els discos als eixos laterals i comprova que els dos costats porten el mateix: una màquina descompensada t'inclina cap al costat carregat sense que te n'adonis.","<span class=\"key\">Costelles avall</span> i abdomen lleugerament estret. Aquest és el punt clau: és el que impedeix que la lumbar guanyi el recorregut que l'espatlla no té."],"grip_html":"<p><span class=\"k\">Presa neutra si la màquina en té.</span> Palmells encarats. És la que sol tolerar millor l'espatlla; amb presa pronada el braç treballa una mica més obert i el deltoide lateral hi participa més, a canvi de demanar més a l'articulació.</p> <p><span class=\"k\">Colzes lleugerament endavant.</span> No oberts en creu: dins del camp de visió. És la posició en què l'espatlla té més espai per empènyer amunt.</p> <p><span class=\"k\">Canell sobre el colze.</span> L'avantbraç vertical durant tot el recorregut. Si el canell queda per fora, la força es perd i l'espatlla treballa en una posició més exposada.</p>","execution_steps":["<span class=\"key\">Empenta (1–2 s).</span> Fins a una extensió còmoda, sense impacte i sense que les espatlles s'enfilin cap a les orelles.","<span class=\"key\">Pausa (1 s)</span> a dalt, amb les costelles encara tancades.","<span class=\"key\">Baixada (3 s)</span> controlada fins que les mans quedin a l'alçada de la barbeta, amb els colzes sota els canells.","<span class=\"key\">Pausa (1 s)</span> abans de tornar a empènyer, sense rebotar."],"notice_html":"<p>Feina al davant i al costat de l'espatlla, i al tríceps al final de l'empenta. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, has arquejat la lumbar: atura la sèrie i torna a col·locar-te. <span class=\"k\">Si el que notes és el coll</span>, les espatlles han pujat. Cap de les dues coses es corregeix pujant més a poc a poc: es corregeix baixant el pes.</p>","verify_html":"<p><span class=\"k\">Prova de les costelles:</span> mira't de costat al punt alt. Les costelles de davant han de quedar tancades, com abans de començar. Si s'obren cap amunt, has arquejat la lumbar per guanyar un recorregut que l'espatlla no et dona.</p> <p><span class=\"k\">Prova de les dues de reserva:</span> en acabar la sèrie has de tenir la sensació clara que en podries fer dues més. Si dubtes si te'n queda una, ja has passat el marge d'aquesta posició.</p>","errors":[{"error":"Arquejar la lumbar","why":"És l'error central: el recorregut extra el fa la columna i no l'espatlla.","fix":"Costelles avall i abdomen estret. Si per pujar el pes has d'arquejar, no has pujat el pes: has canviat d'exercici.","cause":"És l'única manera de guanyar recorregut quan l'espatlla ha arribat al seu rang, i amb pes alt surt sola."},{"error":"Encongir les espatlles cap a les orelles","why":"El trapezi acaba el recorregut que el deltoide ja no fa.","fix":"Coll llarg durant tota l'empenta; l'omòplat puja amb el braç.","cause":"Al final de l'empenta el trapezi és el múscul que pot acabar el moviment."},{"error":"Anar a la fallada","why":"Aquí la fallada no val el que costa: és la posició amb menys marge del programa.","fix":"RIR 2 sempre.","cause":"La sensació de poder fer-ne una més és fiable a la resta del programa, i aquí és on val menys la pena comprovar-ho."}],"progression_html":"<p>12 repeticions netes a les tres sèries <span class=\"k\">mantenint RIR 2</span> → un increment i tornada a 8. Aquí la progressió va deliberadament més lenta que a la resta.</p>","note_html":"És l'únic exercici per sobre del cap de tot el programa, i per això porta el marge de seguretat més gran de totes les prescripcions. A l'annex hi ha la versió lliure, amb manuelles i assegut, per si un dia la màquina està ocupada.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=Br8GG6v-l6I","title":"Technogym Pure Strength Plate Loaded | Shoulder Press","confidence":"exacta","note":"Mateixa màquina Technogym PureStrength."},"alternatives":{"principal":{"name":"Press militar amb manuelles, assegut (AX‑02)","why_equivalent":"Mateixa empenta per sobre del cap amb esquena recolzada. Cada braç segueix la seva trajectòria.","adjust":"Pes inferior al de la màquina; RIR 2 igualment, sense excepcions.","short":"mateixa empenta, pes lliure"},"contingencia":{"name":"Press d'espatlles a màquina selectoritzada","why_acceptable":"Conserva el pla d'empenta amb càrrega ràpida de canviar.","adjust":"Manté el RIR 2: aquesta posició no baixa mai de marge, sigui quina sigui la màquina.","short":"mateix pla, càrrega amb pin"},"not_equivalent":["Press militar dempeus amb barra · càrrega sobre la columna","Press darrere del clatell · posició forçada d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Ajusta el seient perquè les nanses quedin <span class=\"key\">a l'alçada de les espatlles</span> a l'inici. Si comencen per sobre del cap, el recorregut es queda curt justament on el deltoide fa més feina.</li> <li>Esquena sencera al respatller i peus plans a terra.</li> <li>Carrega els discos als eixos laterals i comprova que els dos costats porten el mateix: una màquina descompensada t'inclina cap al costat carregat sense que te n'adonis.</li> <li><span class=\"key\">Costelles avall</span> i abdomen lleugerament estret. Aquest és el punt clau: és el que impedeix que la lumbar guanyi el recorregut que l'espatlla no té.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Empenta (1–2 s).</span> Fins a una extensió còmoda, sense impacte i sense que les espatlles s'enfilin cap a les orelles.</li> <li><span class=\"key\">Pausa (1 s)</span> a dalt, amb les costelles encara tancades.</li> <li><span class=\"key\">Baixada (3 s)</span> controlada fins que les mans quedin a l'alçada de la barbeta, amb els colzes sota els canells.</li> <li><span class=\"key\">Pausa (1 s)</span> abans de tornar a empènyer, sense rebotar.</li> </ol>","tags":{"primary":["Deltoide anterior"],"secondary":["Deltoide lateral"],"minor":["Tríceps"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TB-05","position":"TB-05","session":"TB","order":5,"name":"Face Pull amb rotació externa","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Torre de politges amb corda, politja alta · no consta a l'inventari M1–M7"},"muscles":"Deltoide posterior · manegot rotador · trapezi mitjà","prescription":{"series":"3","reps":"15–20","tempo":"2–3 s ↓","rest":"60 s","rir":"2–3"},"quick":{"do":["Politja a l'alçada del cap o una mica per sobre, amb corda","Un peu una mica endavant, com si fessis un pas curt","Fes un pas enrere fins que el cable ja tingui tensió","Pes lleuger: has de poder fer 20 repeticions impecables"],"dont":"Oblidar la rotació externa i deixar-ho en un rem cap al pit","feel":"Feina darrere l'espatlla i entre els omòplats","grip":"Neutra, amb els polzes cap enrere"},"grip_title":"La presa i la rotació","theory_html":"<p><span class=\"k\">Dues feines en un sol exercici.</span> La primera és de múscul: el deltoide posterior, la cara de l'espatlla que cap empenta toca. La segona és de manteniment: els <span class=\"k\">rotadors externs</span>, uns músculs petits i profunds que mantenen el cap de l'os del braç centrat dins l'articulació. Tots els pressos treballen els que el tanquen cap endins; aquests són els que ho compensen.</p> <p><span class=\"k\">Per què aquesta versió i no la de només múscul.</span> Hi ha dues maneres de fer-lo. Amb la politja a l'alçada de les espatlles i sense girar els punys, tot l'estímul va al deltoide posterior. Amb la politja alta i la rotació final, en reparteixes una part cap a la feina de manteniment. Com que la hipertròfia del deltoide posterior ja la cobreix el Reverse Fly de Tronc A, aquí interessa la versió completa.</p> <p><span class=\"k\">Per què no és opcional.</span> Sense res que compensi, l'espatlla roda endavant cicle rere cicle i l'espai per on passa el tendó es va reduint. Aquest exercici és una de les peces que compensen tota l'empenta del programa.</p>","cues":["Tira la corda cap al nas, no cap al pit","Separa les mans a mesura que la corda s'acosta","Gira els punys fins que els canells quedin sobre els colzes","Colzes a l'alçada de l'espatlla, ni més amunt ni més avall","Coll llarg i espatlles avall abans de cada repetició"],"setup_steps":["Politja a l'<span class=\"key\">alçada del cap o lleugerament per sobre</span>, amb corda. Si la poses baixa, la tirada es converteix en un rem i perds la part que fa d'aquest exercici el que és.","Un peu una mica endavant, com si fessis un pas curt: evita que el tronc es tombi enrere per fer contrapès.","Fes un pas enrere fins que el cable ja tingui tensió amb els braços estesos.","Espatlles relaxades i lleugerament estirades endavant a la posició inicial: és d'on ha de sortir el moviment."],"grip_html":"<p><span class=\"k\">Presa neutra amb els polzes cap enrere.</span> Agafa cada punta de la corda pel nus o just per darrere, amb el palmell mirant cap endins. És la presa que permet fer la rotació final.</p> <p><span class=\"k\">La rotació és la meitat de l'exercici.</span> Al final del recorregut, gira els punys cap enrere fins que els <span class=\"key\">canells quedin per sobre dels colzes</span> i els palmells mirin endavant. Sense aquest gir, l'exercici treballa el deltoide posterior i prou.</p> <p><span class=\"k\">Com saber que t'has passat de pes.</span> Els tres senyals, en aquest ordre: primer deixes de girar els punys, després els colzes cauen per sota de l'alçada de les espatlles, i finalment el moviment es converteix en un rem cap al pit. Amb qualsevol dels tres, baixa un esglaó.</p>","execution_steps":["<span class=\"key\">Tirada (2 s).</span> Tira la corda cap a la cara, a l'alçada del nas o del front, separant les mans a mesura que s'acosten.","<span class=\"key\">Rotació.</span> Al final, gira els punys cap enrere fins que els canells quedin per sobre dels colzes i els palmells mirin endavant.","<span class=\"key\">Pausa (1 s)</span> amb els colzes a l'alçada de l'espatlla.","<span class=\"key\">Retorn (3 s).</span> Desfés el moviment a poc a poc, deixant que les espatlles s'estirin endavant al final."],"notice_html":"<p>Feina darrere l'espatlla i entre els omòplats, i una sensació de netedat a l'articulació. <span class=\"k\">No s'ha de notar com un exercici dur:</span> és de repeticions altes i pes baix, i si et sembla exigent és que n'hi has posat massa. <span class=\"k\">Si notes que el que treballa és el mig de l'esquena</span>, has passat a ajuntar omòplats i has deixat de girar els punys.</p>","verify_html":"<p><span class=\"k\">Prova del mirall:</span> la posició final és la d'algú que flexiona els bíceps davant del mirall: colzes alts, punys enrere, palmells endavant. Si la teva no s'hi assembla, encara no has fet la rotació.</p> <p><span class=\"k\">Prova dels omòplats:</span> si el que notes és que els ajuntes, la feina ha passat al trapezi mitjà. La corda ha de moure el braç, no els omòplats.</p> <p><span class=\"k\">Prova del pes:</span> has de poder fer 20 repeticions amb la rotació completa.</p>","errors":[{"error":"No fer la rotació externa","why":"Sense girar els punys, et quedes amb mitja feina: el deltoide posterior i res del manegot.","fix":"Comprova la posició final contra la imatge del mirall.","cause":"La rotació és la part que menys es nota i la primera que desapareix quan la càrrega puja."},{"error":"Massa pes","why":"Es detecta sol: el tronc es tomba enrere, els colzes cauen i la rotació desapareix.","fix":"Baixa fins a poder fer 20 repeticions impecables. Aquí el pes lleuger no és una concessió, és el punt.","cause":"El moviment sembla poca cosa amb pes baix i la temptació és carregar-lo com si fos un rem."},{"error":"Encongir les espatlles","why":"El trapezi superior s'afegeix quan els rotadors, que són petits, ja no poden amb la càrrega.","fix":"Coll llarg i espatlles avall abans de cada repetició.","cause":"És el teu error recurrent i aquí apareix de seguida."}],"progression_html":"<p>De 15 a 20 repeticions amb la mateixa càrrega i la rotació completa a les tres sèries → un sol increment i tornada a 15. Progressa <span class=\"k\">molt lentament</span>: fer-lo amb 5 kg impecables val més que amb 20 kg sense rotació.</p>","note_html":"Amb el Reverse Fly de Tronc A, aquestes dues posicions donen sis sèries de deltoide posterior per cicle en dues exposicions, que és el que evita que aquest múscul quedi endarrerit.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=ljgqer1ZpXg","title":"STOP F*cking Up Face Pulls (PROPER FORM!)","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Reverse Fly a màquina","why_equivalent":"Mateixa obertura cap enrere amb el deltoide posterior i els romboides de motors. Perd la rotació externa final.","adjust":"Pots pujar un esglaó: la màquina no exigeix la rotació de canell.","short
