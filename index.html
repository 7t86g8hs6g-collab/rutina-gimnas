:root{
 --ink:#15171a;--soft:#6b7280;--line:#e4e6ea;--bg:#fff;--panel:#f6f7f9;
 --ok:#2f7a3e;--no:#b03040;--star:#9a6a10;--a:#C42A6B;
 --tap:48px; /* alçada mínima de zona tàctil */
 --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:"Open Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
 -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}

/* ═══ capçalera ═══ */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem .5rem}
.htitle{font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
.htitle small{display:block;font-size:.72rem;font-weight:400;color:var(--soft);letter-spacing:0}
.cyclebox{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--soft)}
.cyclebox b{font-size:1.1rem;color:var(--ink)}
.cyclebtn{width:30px;height:30px;border-radius:8px;background:var(--panel);font-size:1.1rem;
 font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}

/* ═══ pestanyes de sessió ═══ */
.tabs{display:flex;gap:.3rem;padding:0 .6rem .6rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:var(--tap);padding:.5rem .9rem;border-radius:10px;
 background:var(--panel);font-weight:700;font-size:.82rem;letter-spacing:.02em;white-space:nowrap;
 display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.tab span{font-size:.66rem;font-weight:400;color:var(--soft)}
.tab.on{background:var(--a);color:#fff}
.tab.on span{color:rgba(255,255,255,.85)}

/* ═══ llista d'exercicis ═══ */
main{padding:.7rem .8rem calc(5.5rem + var(--safe-b))}   /* V24: que la barra d'exportar no tapi l'últim element */
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.1rem 0 .6rem}
.tg{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:4px}
.tg.tp{background:var(--sa);color:#fff}.tg.ts{background:var(--s1);color:var(--sd)}
.tg.tm{background:var(--s2);color:var(--sd)}.tg.tc{background:#fff;color:#475467;border:1px solid #98a2b3}
.sessmeta{display:flex;gap:.5rem;align-items:center;margin:0 0 .7rem;font-size:.8rem;color:var(--soft)}
.warmbtn{min-height:38px;padding:.4rem .8rem;border-radius:9px;background:var(--panel);
 font-size:.78rem;font-weight:700;color:var(--a)}
.ex{border:1px solid var(--line);border-radius:12px;margin-bottom:.6rem;overflow:hidden;
 background:var(--bg)}
.ex.done{border-color:var(--ok);background:#f4faf5}
.exhead{display:flex;align-items:stretch;min-height:var(--tap)}
.exopen{flex:1;display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;text-align:left}
.exnum{flex:0 0 auto;min-width:30px;height:30px;padding:0 .4rem;border-radius:8px;background:var(--a);color:#fff;font-weight:700;
 font-size:.72rem;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ex.done .exnum{background:var(--ok)}
.exname{font-weight:700;font-size:.93rem;line-height:1.25;letter-spacing:-.01em}
.exsub{font-size:.74rem;color:var(--soft);margin-top:.1rem}
.exsub b{color:var(--ink);font-weight:700}
.extag{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
 color:var(--soft);border:1px solid var(--line);border-radius:4px;padding:.1rem .3rem;
 display:inline-block;margin-left:.3rem;vertical-align:middle}
.exlog{flex:0 0 52px;border-left:1px solid var(--line);display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:.1rem;font-size:.62rem;color:var(--soft);font-weight:700}
.exlog i{font-style:normal;font-size:1.15rem;line-height:1}

/* ═══ registre en línia ═══ */
.logpanel{border-top:1px solid var(--line);padding:.7rem .8rem;background:var(--panel)}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 54px 34px;gap:.4rem;align-items:center;
 margin-bottom:.4rem}
.setrow .n{font-size:.75rem;font-weight:700;color:var(--soft);text-align:center}
.setrow input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;
 padding:.4rem .5rem;font-size:1rem;font-family:inherit;text-align:center;background:var(--bg)}
.setrow input:focus{outline:2px solid var(--a);outline-offset:-1px}
.setrow .lbl{font-size:.62rem;color:var(--soft);text-align:center;font-weight:700}
.rmset{min-height:44px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
 color:var(--no);font-size:1.1rem;font-weight:700}
.logacts{display:flex;gap:.4rem;margin-top:.5rem}
.logacts button{flex:1;min-height:var(--tap);border-radius:10px;font-weight:700;font-size:.82rem}
.addset{background:var(--bg);border:1px solid var(--line)}
.savelog{background:var(--a);color:#fff}
.lasttime{font-size:.72rem;color:var(--soft);margin-bottom:.5rem}
.lasttime b{color:var(--ink)}

/* ═══ modal de fitxa ═══ */
.modal{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
 -webkit-overflow-scrolling:touch}
.mtop{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;z-index:5}
.mclose{min-width:var(--tap);min-height:var(--tap);border-radius:10px;background:var(--panel);
 font-size:1.3rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.mtitle{font-weight:700;font-size:.95rem;line-height:1.2;flex:1}
.mtitle small{display:block;font-size:.7rem;color:var(--soft);font-weight:400}
.mbody{padding:.9rem .9rem calc(3rem + var(--safe-b))}
.presc{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem;margin-bottom:.9rem}
.presc>div{background:var(--panel);border-radius:10px;padding:.5rem .6rem}
.presc .l{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.presc .v{font-size:1.05rem;font-weight:700;margin-top:.1rem}
.vidbtn{display:flex;align-items:center;gap:.6rem;width:100%;min-height:56px;border-radius:12px;
 background:var(--a);color:#fff;font-weight:700;padding:.7rem .9rem;margin-bottom:.5rem;
 text-decoration:none;font-size:.9rem}
.vidbtn .play{flex:0 0 30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);
 display:flex;align-items:center;justify-content:center;font-size:.85rem}
.vidbtn small{display:block;font-weight:400;font-size:.68rem;opacity:.9;line-height:1.3}
.vidalt{background:var(--panel);color:var(--ink)}
.vidalt .play{background:rgba(0,0,0,.07)}
.vidnote{font-size:.72rem;color:var(--soft);background:#fdf6e6;border-left:3px solid var(--star);
 padding:.5rem .6rem;border-radius:0 8px 8px 0;margin-bottom:.8rem}
.quick{background:#fbeef3;border-radius:12px;padding:.7rem .8rem;margin-bottom:.9rem}
.qt{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--a);
 margin-bottom:.4rem}
.qi{display:flex;gap:.5rem;margin:.35rem 0;font-size:.87rem;line-height:1.4}
.qi i{font-style:normal;font-weight:700;flex:0 0 auto}
.qi .y{color:var(--ok)}.qi .n{color:var(--no)}.qi .s{color:var(--star)}.qi .g{color:var(--a)}
details.sec{border-top:1px solid var(--line);padding:.1rem 0}
details.sec>summary{min-height:var(--tap);display:flex;align-items:center;justify-content:space-between;
 font-weight:700;font-size:.9rem;list-style:none;cursor:pointer;padding:.5rem 0}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:1.3rem;color:var(--soft);font-weight:400}
details.sec[open]>summary::after{content:"−"}
.secbody{padding:0 0 .8rem;font-size:.88rem;line-height:1.55}
.secbody ol,.secbody ul{padding-left:1.1rem;margin:.4rem 0}
.secbody li{margin:.3rem 0}
.secbody p{margin:.4rem 0}
.err{border-left:3px solid var(--no);background:#fdf1f3;border-radius:0 8px 8px 0;
 padding:.55rem .7rem;margin:.5rem 0}
.err .et{font-weight:700;font-size:.85rem;color:var(--no)}
.err .ew{font-size:.82rem;color:#555;margin:.2rem 0}
.err .ef{font-size:.82rem;font-weight:700}
.cues li{margin:.3rem 0}
.mach{font-size:.76rem;color:var(--soft);margin-bottom:.8rem}
.mach b{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;margin-right:.3rem}
.mach .mc{background:var(--ink);color:#fff;font-weight:700;border-radius:4px;padding:.02rem .3rem;margin-right:.3rem}
.extag.alt{border-style:dashed}
table{border-collapse:collapse;width:100%;font-size:.8rem;margin:.4rem 0}
th,td{text-align:left;padding:.4rem .35rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.62rem;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.k,.key{font-weight:700}

/* ═══ full de resum / exportació ═══ */
.exportbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
 border-top:1px solid var(--line);padding:.5rem .8rem calc(.5rem + var(--safe-b));
 display:flex;gap:.4rem}
.exportbar button{flex:1;min-height:var(--tap);border-radius:10px;font-weight:700;font-size:.8rem;
 background:var(--panel)}
.exportbar .prim{background:var(--a);color:#fff}
.storewarn{background:#fdf1f3;color:var(--no);font-size:.76rem;padding:.5rem .8rem;
 border-bottom:1px solid var(--line);font-weight:700}
textarea.dump{width:100%;height:46vh;border:1px solid var(--line);border-radius:10px;padding:.6rem;
 font-family:ui-monospace,monospace;font-size:.74rem;line-height:1.45}
/* ═══ V24 · registre (D·2) — mateixes variables i mides de toc que la resta de l'app ═══ */
.v24row{display:flex;gap:.4rem;align-items:center;margin:0 0 .5rem;flex-wrap:wrap}
.v24row .lbl2{font-size:.62rem;color:var(--soft);font-weight:700;letter-spacing:.04em;text-transform:uppercase;width:100%}
.v24sum{justify-content:space-between;flex-wrap:nowrap;font-size:.78rem}

<script>
const D = {"meta":{"version":"24.0","language":"ca","page_mm":[244,348],"font":"Open Sans","font_band_pt":[7.54,9.37],"duration_model":"Estimació: sèrie = repeticions mitjanes × suma del tempo (×2 si és per costat o per braç) + 15 s; exercici = sèries × sèrie + descansos entre sèries + 90 s de canvi; sessió = escalfament + exercicis, comptant la variant més llarga de cada posició."},"sessions":{"TA":{"name":"Tronc A","sub":"Pit i esquena","color":"#C42A6B","tint":"#FBEDF3","deep":"#8E1D4D","duration":"≈ 79 min","warmup":{"duration":"7 min","steps":["<b>Cercles grans de braç.</b> Dret, amb el braç estès, dibuixa cercles amplis i lents cap endavant i cap enrere, buscant el rang màxim que no fa mal. <b>5 en cada direcció, cada braç.</b> No és un estirament mantingut: el braç no s'atura enlloc. Serveix per escalfar l'espatlla movent-la per tot el seu recorregut abans de carregar-la.","<b>Empènyer i ajuntar omòplats, de quatre grapes.</b> A terra, amb les mans sota les espatlles i els genolls sota els malucs i els braços rectes, empeny el terra fins que l'esquena alta s'arrodoneixi una mica, i tot seguit deixa caure el pit entre les espatlles ajuntant els omòplats. <b>10 repeticions lentes.</b> Serveix per despertar els músculs que mouen l'omòplat, que són els que has de controlar a tots els pressos i totes les tirades.","<b>Estirament dinàmic del dorsal.</b> Dret al costat d'un muntant, agafa'l amb una mà a l'alçada del pit, deixa anar el maluc cap al costat contrari i nota com s'obre el costat de l'esquena, del braç a la cintura. <b>Entra i surt de la posició 5 vegades per banda</b>, sense quedar-t'hi aturat. Abans d'un dia d'hipertròfia interessa moure's per dins del rang, no estirar-se i aguantar.","<b>Rotació externa amb goma.</b> Colze enganxat a les costelles i doblegat a 90°, amb l'avantbraç endavant i una goma lleugera a la mà. Obre l'avantbraç cap enfora com una porta, sense separar el colze del cos, i torna lentament. <b>15 per braç.</b> Escalfa els músculs que mantenen l'húmer centrat a l'espatlla, que són els que treballen a tots els pressos i normalment ningú prepara.","<b>Obertures amb goma davant del pit (band pull-apart).</b> Agafa una goma amb les dues mans, braços estesos a l'alçada del pit, i separa les mans fins que la goma et toqui l'estèrnum, ajuntant els omòplats. Torna lentament. <b>15 repeticions.</b> Desperta el deltoide posterior i l'esquena alta abans que la sessió es plegui cap endavant amb els pressos.","<b>Dues sèries d'aproximació</b> al banc inclinat, al 40–50% del pes de treball, 10 repeticions. No compten com a sèries: calibren la càrrega i acaben d'escalfar el patró concret. Després, una de curta al primer exercici pesat de cada patró nou de la sessió."],"why":"Les cinc primeres preparen l'espatlla i l'omòplat, que és el que més treballarà avui i el que vols protegir. Són moviments, no estiraments mantinguts: abans d'entrenar per créixer, l'estirament estàtic no ajuda. L'última calibra la càrrega."},"logica":"Toca els grups que el programa vol fer créixer: dos exercicis de pit, dos d'esquena —un per a l'esquena alta i un per al dorsal—, el deltoide posterior i el lateral, i dues sèries de braç que alternen bíceps i tríceps. El dead bug hi afegeix el core. Tronc B hi tornarà amb angles i preses diferents: així cada grup prioritari té almenys dues exposicions per cicle."},"C":{"name":"Cames","sub":"Sessió única del cicle","color":"#2F9E44","tint":"#EAF4EC","deep":"#1F5E2C","duration":"≈ 78 min","warmup":{"duration":"10 min","steps":["<b>Bici, 6 minuts</b> a ritme suau, fins que notis calor a les cames. És l'escalfament general: puja la temperatura del múscul abans de carregar-lo, i el dia de cames és el que més ho necessita.","<b>Balanceigs de cama.</b> Agafa't a un muntant i balanceja una cama endavant i enrere, deixant-la anar sense forçar, <b>12 vegades</b>; després, de costat a costat creuant per davant del cos, <b>12 més</b>. Canvia de cama. Prepara el maluc movent-lo en els dos plans en què treballarà.","<b>Esquat lateral.</b> Peus molt separats i puntes endavant; flexiona una cama i deixa l'altra estirada, desplaçant el pes d'un costat a l'altre <b>8 vegades per banda</b>. Serveix per obrir els adductors, que a la sessió treballen i que gairebé mai es preparen.","<b>Estirament dinàmic d'isquios.</b> Fes un pas endavant amb el taló a terra i la punta amunt, deixa el genoll de darrere una mica doblegat i porta el maluc enrere fins a notar la cuixa posterior. <b>Entra i surt de la posició 8 vegades per cama</b>, sense quedar-t'hi aturat.","<b>Glute bridge a terra.</b> Estirat de panxa amunt amb els genolls doblegats, puja el maluc estrenyent el gluti i baixa a poc a poc. <b>15 repeticions</b> amb contracció activa: si el gluti no s'activa, el quàdriceps i la lumbar faran la seva feina.","<b>Dues sèries d'aproximació</b> al primer exercici de la sessió, al 40–50% del pes de treball, 10 repeticions. No compten com a sèries. Després, una de curta al primer exercici pesat de cada patró nou de la sessió."],"why":"És l'escalfament més llarg del cicle perquè la sessió és la que mou més càrrega. Tot són moviments, no estiraments mantinguts: abans d'entrenar per créixer, l'estirament estàtic no ajuda. El glute bridge no és opcional."},"logica":"Una sola sessió cobreix tota la cama: el quàdriceps a la Leg Press, l'isquiotibial en les seves dues funcions —doblegar el genoll al Lying Leg Curl i estendre el maluc al Back Extension—, el gluti major i el mitjà, i els bessons. Leg Extension i adducció alternen per cicles. Busca força i proporció sense restar recuperació als grups prioritaris, i protegeix el que la cursa fa servir a cada passa."},"TB":{"name":"Tronc B","sub":"Esquena líder, pit inclinat, espatlla","color":"#3E63DD","tint":"#ECF0FD","deep":"#2B47A3","duration":"≈ 80 min","warmup":{"duration":"6 min","steps":["<b>Cercles grans de braç.</b> Dret, amb el braç estès, cercles amplis i lents cap endavant i cap enrere, buscant el rang màxim que no fa mal. <b>5 en cada direcció, cada braç.</b> Escalfa l'espatlla movent-la per tot el seu recorregut.","<b>Rotació externa amb goma.</b> Colze enganxat a les costelles i doblegat a 90°, avantbraç endavant i goma lleugera a la mà: obre l'avantbraç cap enfora com una porta, sense separar el colze del cos, i torna lentament. <b>15 per braç.</b> És la preparació específica de l'únic press per sobre del cap del programa.","<b>Obertures amb goma davant del pit (band pull-apart).</b> Braços estesos a l'alçada del pit, separa les mans fins que la goma toqui l'estèrnum ajuntant els omòplats, i torna lentament. <b>15 repeticions.</b>","<b>Una sèrie d'aproximació al rem</b>, al 50% del pes de treball, 10 repeticions. No compta com a sèrie. Després, una de curta al primer exercici pesat de cada patró nou de la sessió."],"why":"Avui hi ha treball per sobre del cap, i és l'única sessió on això passa. Són moviments, no estiraments mantinguts: abans d'entrenar per créixer, l'estirament estàtic no ajuda."},"logica":"Torna als grups de Tronc A per una altra via: rem amb presa prona (a Tronc A, neutra), banc a 30° per al pit alt (a Tronc A, a 15°), dominada per al dorsal i elevacions laterals amb la variant que no ha fet Tronc A. Hi afegeix el press d'espatlla —l'únic treball directe del deltoide anterior—, el face pull per al deltoide posterior i la papallona."},"TC":{"name":"Tronc C","sub":"Braços en fred, deltoide i abdominals","color":"#E8730C","tint":"#FDF2E6","deep":"#A85208","duration":"≈ 76 min","warmup":{"duration":"6 min","steps":["<b>Cercles de canell.</b> Amb els dits entrellaçats o els punys tancats, dibuixa cercles amb el canell <b>15 en cada direcció</b>. Avui els braços treballen en fred i amb càrrega real: el canell i el colze no han de ser el factor limitant.","<b>Obrir i tancar el colze sense pes.</b> Braços als costats, flexiona i estén el colze pel rang complet, <b>15 vegades</b>, i fes-ne 10 més amb el braç per sobre del cap, que és la posició del tríceps en estirament.","<b>Obertures amb goma davant del pit (band pull-apart).</b> Braços estesos a l'alçada del pit, separa les mans fins que la goma toqui l'estèrnum i torna lentament. <b>15 repeticions.</b> Desperta l'esquena alta i el deltoide posterior abans de les elevacions laterals.","<b>Una sèrie de curl i una de pushdown molt lleugeres</b>, 15 repeticions cadascuna. Calibren la càrrega i acaben d'escalfar el colze."],"why":"És l'escalfament més curt perquè la sessió és la menys exigent, però els braços hi entren en fred i amb càrrega real. Són moviments, no estiraments mantinguts."},"logica":"El braç hi treballa per parts: curl i curl martell per al bíceps i el braquial, pushdown per als caps lateral i medial del tríceps, i extensió per sobre del cap per al cap llarg. Les elevacions laterals en són la tercera exposició del cicle, i el core hi treballa la flexió i, per torns, l'antiextensió i la feina lateral."},"AX":{"name":"Annex · exercicis complementaris","sub":"Fitxes fora del recompte del cicle","duration":"—","color":"#15544F","tint":"#E7EFED","deep":"#0F3B37","warmup":null}},"categories":{"FIX":"Exercici fix","VAR":"Posició fixa · variant rotatòria","OBERT":"Obert","SUPLETORI":"Supletori","ALT":"Posició alterna · un cicle sí, un cicle no","ANNEX":"Annex · fora del cicle, documentat per si el necessites"},"movements":[{"key":"TA-01","position":"TA-01","session":"TA","order":1,"name":"Banc inclinat 15° amb manuelles","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Banc regulable i manuelles · no consta a l'inventari M1–M7"},"muscles":"Pit esternal · deltoide anterior · tríceps","prescription":{"series":"4","reps":"6–10","tempo":"2–3 s ↓","rest":"2–3 min","rir":"1–2"},"quick":{"do":["Banc a 15°: una o dues marques per sobre del pla","Cinc punts de contacte: cap, espatlles, gluti i els dos peus","Omòplats enrere i avall, clavats al banc, abans de la primera repetició","Puja una manuella amb el genoll, fes una pausa, i després l'altra"],"dont":"Deixar anar els omòplats a mitja empenta: la tensió se'n va a l'espatlla","feel":"Tensió creixent al centre del pit, no als tríceps","grip":"Pronada — palmells endavant, canell just sobre el colze"},"theory_html":"<p><span class=\"k\">Què fa el pit.</span> Una sola cosa: <span class=\"k\">acostar el braç al centre del cos</span>. Tot el que faràs de pit —premsar, obrir, creuar— és aquesta funció amb angles diferents. El múscul té dues parts: la gran, que va de l'os del braç a l'estèrnum, i la de dalt, que arriba a la clavícula i és la que dibuixa la línia del pit vista de front. La de dalt s'activa quan el braç puja; la gran, quan el braç va cap al centre.</p> <p><span class=\"k\">Per què 15°, i què no esperar-ne.</span> Quinze graus és gairebé pla: aquí treballes la part gran, no la línia alta, que demana angles de 25 a 40°. El que guanyes amb aquests graus és espatlla: al banc pla pots carregar més, però l'espatlla treballa on té menys marge i en paga una part. Les manuelles hi afegeixen uns centímetres d'estirament que la barra no dona, perquè amb barra el recorregut s'acaba quan toca el pit, i obliguen cada braç a valer-se sol, cosa que corregeix asimetries en comptes d'amagar-les.</p> <p><span class=\"k\">Per què obre la sessió.</span> És l'exercici que demana més concentració del cicle de tronc, i va quan encara no t'ha cansat res.</p>","cues":["Omòplats enrere i avall de la primera a l'última repetició","Colzes a 45° del tronc: els braços dibuixen una A, no una T","Baixa fins que la manuella toqui la part exterior del pit","Empeny en línia recta amunt; les mans només subjecten","Extensió còmoda, sense impacte ni fer xocar les manuelles"],"setup_steps":["Banc a <span class=\"key\">15°</span> — una o dues marques per sobre del pla. Als 30° l'exercici ja és un altre: més espatlla i menys pit.","Seu amb les manuelles de cantell sobre les cuixes. <span class=\"key\">Puja'n una amb una empenta del genoll, fes una pausa, i després l'altra</span>: col·locar-les totes dues alhora amb l'espatlla freda és on es fan els mals gestos.","<span class=\"key\">Cinc punts de contacte:</span> cap, espatlles, gluti i els dos peus a terra. Els peus empenyen el terra tota la sèrie; si no, el cos llisca cap amunt i el recorregut canvia a cada repetició.","<span class=\"key\">Omòplats enterrats</span> al banc, enrere i avall: són el punt fix contra el qual empeny el pit. Arc lumbar natural, sense forçar-lo."],"grip_html":"<p><span class=\"k\">Presa pronada, canell recte.</span> Palmells endavant i polze tancat. El canell no cau enrere: la manuella ha de quedar <span class=\"key\">just a sobre del colze</span>, amb l'avantbraç vertical, com una columna. Si el canell se'n va enrere, el pes queda darrere de la línia de força i el colze i l'espatlla ho paguen.</p> <p><span class=\"k\">On van les manuelles respecte del cos.</span> A baix, a l'alçada del mugró o just per sobre, tocant la <span class=\"key\">part exterior del pit</span>: no a l'alçada del coll ni a l'alçada del melic. A dalt, pugen rectes i es poden acostar una mica, però no han de xocar: el cop treu tensió i no afegeix contracció.</p> <p><span class=\"k\">Amplada dels colzes.</span> A uns 45° del tronc. Amb els colzes oberts a 90° notaràs més estirament, però la feina passa al davant de l'espatlla en la posició on menys marge té. Amb els colzes massa tancats, es converteix en un exercici de tríceps.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Fins que la manuella arribi a tocar la part exterior del pit, a l'alçada del mugró, amb els colzes a 45° del tronc.","<span class=\"key\">Pausa (1 s).</span> Sense rebotar. Aquí el múscul està estirat, que és on més disposat està a créixer.","<span class=\"key\">Empenta (1 s).</span> En línia recta cap amunt, amb els omòplats enterrats. Les manuelles s'acosten una mica al final, sense tocar-se.","<span class=\"key\">Pausa alta (1 s).</span> Extensió còmoda, sense impacte."],"notice_html":"<p>Tensió que creix al centre del pit i estirament clar al punt baix. <span class=\"k\">Si el que notes és el davant de l'espatlla</span>, els colzes van massa oberts o els omòplats s'han deixat anar. <span class=\"k\">Si el que s'acaba primer són els tríceps</span>, has tancat massa els colzes i l'exercici s'ha desplaçat cap al braç. <span class=\"k\">Si l'endemà tens les espatlles carregades i el pit fresc</span>, ha passat durant tota la sèrie, no en una repetició.</p>","verify_html":"<p><span class=\"k\">Prova del perfil:</span> al punt baix, el colze queda lleugerament per sota de la línia de l'espatlla, no molt més avall.</p> <p><span class=\"k\">Prova de les espatlles:</span> en acabar d'empènyer, continuen enfonsades al banc. Si s'enfilen cap al sostre, els omòplats s'han deixat anar.</p> <p><span class=\"k\">Prova del segon buit:</span> atura't un segon amb les manuelles al pit. Si allà perds la posició o se't van cap enfora, el pes és excessiu encara que completis les repeticions.</p>","errors":[{"error":"Els omòplats es deixen anar","why":"Quan es relaxen, l'húmer perd el punt de suport i la tensió emigra al deltoide anterior i al manegot rotador, que és la zona que el programa protegeix amb el Face Pull.","fix":"Enterrats de la primera a l'última repetició. Si no ho pots mantenir, el pes és excessiu.","cause":"El pes obliga a buscar recorregut extra, i deixar anar els omòplats en regala uns centímetres."},{"error":"El canell cau enrere","why":"La manuella queda darrere de la línia del colze i la força passa per l'articulació en lloc del pit.","fix":"Canell recte i sempre a sobre del colze, amb l'avantbraç vertical.","cause":"Apareix amb un pes alt, quan la mà busca allotjar la manuella en lloc d'aguantar-la."},{"error":"Rebotar les manuelles al pit","why":"El rebot aprofita l'elasticitat de la caixa toràcica, no el múscul.","fix":"Un segon de pausa, sense pressió.","cause":"A les últimes repeticions el rebot estalvia la part més dura, que és l'arrencada des de baix."},{"error":"Colzes oberts a 90°","why":"Desvia la tensió al deltoide i posa l'espatlla en la posició de més pinçament.","fix":"Braços que dibuixen una A, no una T.","cause":"És la posició on sembla que el pit s'estira més, i surt sola quan es busca rang en comptes de tensió."}],"progression_html":"<p>10 repeticions netes a les quatre sèries amb RIR 1–2 → següent parell de manuelles i tornada a 6.</p>","note_html":"Per deixar les manuelles en acabar, no les llencis: porta-les al pit, seu endavant amb l'impuls i deixa-les de cantell sobre les cuixes. L'espatlla fatigada és on es fan els mals gestos.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=sK4Rvug6ufo","title":"Incline Dumbbell Bench Press Tutorial - Proper Form and Technique","confidence":"alta","note":"Genèric: no especifica els 15°. La tècnica de base —colzes, recorregut, col·locació de les manuelles— és la mateixa."},"alternatives":{"principal":{"name":"Press inclinat a màquina, mateix angle","why_equivalent":"Mateixa empenta amb esquena recolzada i trajectòria guiada. Pit esternal com a motor.","adjust":"La guia treu part de l'estabilització: pots pujar un esglaó de pes amb el mateix RIR.","short":"mateix angle, esquena recolzada"},"contingencia":{"name":"Press pla amb manuelles","why_acceptable":"Conserva l'estabilització de cada braç i el control del recorregut. Perd els graus d'inclinació.","adjust":"Mateix RIR; notaràs una mica més de feina a la part mitjana del pit.","short":"mateixa empenta, sense inclinació"},"not_equivalent":["Press de banca amb barra · fora del sistema de màquines","Fons entre bancs · espatlla forçada"]},"v22":true,"setup_html":"<ol> <li>Banc a <span class=\"key\">15°</span> — una o dues marques per sobre del pla. Als 30° l'exercici ja és un altre: més espatlla i menys pit.</li> <li>Seu amb les manuelles de cantell sobre les cuixes. <span class=\"key\">Puja'n una amb una empenta del genoll, fes una pausa, i després l'altra</span>: col·locar-les totes dues alhora amb l'espatlla freda és on es fan els mals gestos.</li> <li><span class=\"key\">Cinc punts de contacte:</span> cap, espatlles, gluti i els dos peus a terra. Els peus empenyen el terra tota la sèrie; si no, el cos llisca cap amunt i el recorregut canvia a cada repetició.</li> <li><span class=\"key\">Omòplats enterrats</span> al banc, enrere i avall: són el punt fix contra el qual empeny el pit. Arc lumbar natural, sense forçar-lo.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Fins que la manuella arribi a tocar la part exterior del pit, a l'alçada del mugró, amb els colzes a 45° del tronc.</li> <li><span class=\"key\">Pausa (1 s).</span> Sense rebotar. Aquí el múscul està estirat, que és on més disposat està a créixer.</li> <li><span class=\"key\">Empenta (1 s).</span> En línia recta cap amunt, amb els omòplats enterrats. Les manuelles s'acosten una mica al final, sense tocar-se.</li> <li><span class=\"key\">Pausa alta (1 s).</span> Extensió còmoda, sense impacte.</li> </ol>","grip_title":"La presa","tags":{"primary":["Pit esternal"],"secondary":["Deltoide anterior"],"minor":["Tríceps"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TA-02","position":"TA-02","session":"TA","order":2,"name":"Lat Pulldown, presa prona ampla","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Torre de politja alta amb barra llarga · l'alternativa amb codi és M4, Vertical Traction"},"muscles":"Esquena alta · rodó major · dorsal ample","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"1–2"},"quick":{"do":["Coixí de les cuixes ben ajustat: si no, el cos s'enlaira al final","Assegut amb el tronc inclinat 10–15° enrere, i fix tota la sèrie","Mans per fora de les espatlles, un pam a cada banda","Omòplats avall abans de la primera tirada"],"dont":"Encongir l'espatlla i tirar amb el bíceps","feel":"Feina a l'aixella i a la part alta de l'esquena","grip":"Pronada i ampla — palmells endavant"},"theory_html":"<p><span class=\"k\">Què fa el dorsal.</span> Dues coses que val la pena tenir al cap, perquè expliquen tota la rutina d'esquena: <span class=\"k\">porta el braç enrere</span> —això és un rem— i <span class=\"k\">baixa el braç des de dalt cap al costat del cos</span> —això és aquesta tirada—. Per això cada sessió de tronc en porta una de cada: no són el mateix exercici amb una màquina diferent, són dues funcions. El dorsal és, a més, el múscul que dona amplada a l'esquena vista de front.</p> <p><span class=\"k\">Què fa la presa ampla.</span> Amb les mans clarament per fora de les espatlles, els colzes viatgen oberts i la feina puja cap a l'<span class=\"k\">esquena alta</span>: rodó major, romboides, infraespinós, trapezi mitjà. El dorsal hi treballa, però no és on més el notaràs; la seva part la fas a Tronc B amb la dominada de presa neutra i els colzes arran del cos. <span class=\"k\">El que no fa:</span> passar la barra pel clatell. És una idea molt estesa i no aïlla res; només posa l'espatlla en rotació forçada amb càrrega.</p> <p><span class=\"k\">Per què costa de notar l'esquena.</span> Perquè el braç queda entremig, i el bíceps i l'avantbraç són més petits, es noten abans i criden més fort. La solució pràctica és pensar sempre en el colze, mai en la mà.</p>","cues":["Primer baixa l'espatlla; després dobla el colze","El colze baixa i va una mica enrere, com si anés a la butxaca","Barra a la part alta del pit, mai al clatell","Tronc inclinat 10–15°, sense gronxar-se","Extensió completa a dalt, deixant estirar l'espatlla"],"setup_steps":["Ajusta el <span class=\"key\">coixí de les cuixes</span> perquè et bloquegi de veritat: si queda folgat, a les últimes repeticions el cos s'enlaira i et quedes sense on fer força.","Assegut, tronc lleugerament inclinat enrere, uns <span class=\"key\">10–15°</span>, i aquesta inclinació ja no canvia: si es mou durant la sèrie, el pes el mou el cos i no l'esquena.","Mans <span class=\"key\">un pam per fora de cada espatlla</span>, palmells endavant.","Abans de tirar, <span class=\"key\">baixa els omòplats</span>. És el que posa el dorsal en disposició de treballar; si comences doblegant el colze, comença el braç."],"grip_html":"<p><span class=\"k\">Quina amplada és «ampla».</span> Aproximadament un pam per fora de cada espatlla. Més enllà d'això no guanyes res: el recorregut s'escurça i l'espatlla treballa més oberta sense que la feina augmenti.</p> <p><span class=\"k\">Què canvia respecte de les altres preses.</span> Com més obert va el colze, més amunt treballa l'esquena. Amb aquesta presa, la feina va a l'esquena alta. Amb presa neutra o mitjana, els colzes baixen arran del cos i el motor passa a ser el dorsal. Amb presa supina i estreta, s'hi suma el bíceps. Són tres exercicis diferents amb la mateixa màquina, no el mateix exercici amb tres preses.</p> <p><span class=\"k\">El polze i el canell.</span> Canell recte, alineat amb l'avantbraç. Si l'avantbraç es cansa abans que l'esquena, posa el polze al mateix costat que els altres dits: la mà deixa de tenir tanta feina i l'esquena es nota més. Amb sèries pesades, torna al polze tancat.</p>","execution_steps":["<span class=\"key\">Arrencada.</span> Baixa les espatlles abans de començar a doblegar el colze.","<span class=\"key\">Tirada (2 s).</span> Porta la barra a la part alta del pit, amb els colzes cap avall i una mica enrere.","<span class=\"key\">Contracció (1 s).</span> Estreny com si volguessis ajuntar els colzes darrere teu.","<span class=\"key\">Retorn (3 s).</span> Deixa pujar la barra fins a l'extensió completa, permetent que <span class=\"key\">les espatlles s'estirin amunt</span> al final. Aquest estirament forma part de l'exercici."],"notice_html":"<p>Feina a la part alta de l'esquena i a la zona de sota l'aixella, i un estirament clar amb els braços estesos. <span class=\"k\">Si el que crema és l'avantbraç</span>, has tirat amb les mans: és el que passa sempre al principi, perquè el braç es nota abans que l'esquena. <span class=\"k\">Si el que notes és el coll</span>, les espatlles no han baixat abans de tirar.</p>","verify_html":"<p><span class=\"k\">Prova del coixí:</span> amb els braços estesos i el pes carregat, el maluc no s'aixeca del seient. Si s'aixeca, el coixí és massa alt.</p> <p><span class=\"k\">Prova de la pausa alta:</span> a l'última repetició, atura't tres segons amb els braços estesos i les espatlles estirades amunt. Si no pots controlar el retorn des d'allà, durant la sèrie no has fet el rang complet.</p> <p><span class=\"k\">Prova del tronc:</span> la inclinació és la mateixa a la primera i a l'última repetició.</p>","errors":[{"error":"Tirar per darrere del clatell","why":"Posa l'espatlla en rotació externa forçada amb càrrega i no afegeix res a l'esquena. És un dels pocs gestos del gimnàs que no té cap versió correcta.","fix":"Sempre al davant, cap a la part alta del pit.","cause":"Ve de la idea, molt estesa, que passar la barra pel clatell aïlla més el dorsal."},{"error":"Gronxar el tronc per arrencar","why":"Si el cos fa de contrapès, el pes és excessiu i l'esquena en fa menys.","fix":"Inclinació fixa de 10–15° tota la sèrie.","cause":"El pes és per sobre del que l'esquena pot moure sola i el tronc s'hi afegeix."},{"error":"No estendre del tot al final","why":"Et perds la posició estirada, que és la que més estimula.","fix":"Braços estesos i espatlles amunt abans de la tirada següent.","cause":"Amb la pila carregada, els últims centímetres són els que més costen de controlar i es retallen sols."}],"progression_html":"<p>12 repeticions netes a les tres sèries → un increment de pes i tornada a 8.</p>","note_html":"Aquesta màquina no consta a l'inventari de fotografies. Si un dia la trobes ocupada, M4 —la Vertical Traction— fa la mateixa tirada amb nanses independents i presa ampla.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=j6KuKd_N8uU","title":"How to Do Wide Grip Lat Pulldowns Correctly","confidence":"alta","note":"Mateixa presa i mateixa amplada de referència."},"alternatives":{"principal":{"name":"Vertical Traction (M4)","why_equivalent":"Mateixa tirada vertical amb presa ampla i pronada, amb nanses independents i recorregut guiat. Treballa la mateixa part alta de l'esquena.","adjust":"Coixí de les cuixes ben ajustat; la càrrega no es pot comparar amb la de la barra.","short":"mateixa tirada, nanses independents"},"contingencia":{"name":"Dominada assistida a M2, presa pronada oberta","why_acceptable":"Mateixa tirada amb el cos com a càrrega. Cal graduar l'assistència per quedar al rang.","adjust":"Assistència que et deixi a 8–12 repeticions amb RIR 1–2.","short":"mateixa presa, càrrega corporal"},"not_equivalent":["Rem inclinat amb barra · tirada horitzontal i càrrega en flexió","Pulldown darrere del clatell · posició forçada d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Ajusta el <span class=\"key\">coixí de les cuixes</span> perquè et bloquegi de veritat: si queda folgat, a les últimes repeticions el cos s'enlaira i et quedes sense on fer força.</li> <li>Assegut, tronc lleugerament inclinat enrere, uns <span class=\"key\">10–15°</span>, i aquesta inclinació ja no canvia: si es mou durant la sèrie, el pes el mou el cos i no l'esquena.</li> <li>Mans <span class=\"key\">un pam per fora de cada espatlla</span>, palmells endavant.</li> <li>Abans de tirar, <span class=\"key\">baixa els omòplats</span>. És el que posa el dorsal en disposició de treballar; si comences doblegant el colze, comença el braç.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Arrencada.</span> Baixa les espatlles abans de començar a doblegar el colze.</li> <li><span class=\"key\">Tirada (2 s).</span> Porta la barra a la part alta del pit, amb els colzes cap avall i una mica enrere.</li> <li><span class=\"key\">Contracció (1 s).</span> Estreny com si volguessis ajuntar els colzes darrere teu.</li> <li><span class=\"key\">Retorn (3 s).</span> Deixa pujar la barra fins a l'extensió completa, permetent que <span class=\"key\">les espatlles s'estirin amunt</span> al final. Aquest estirament forma part de l'exercici.</li> </ol>","grip_title":"La presa","tags":{"primary":["Rodó major","Romboides","Infraespinós","Trapezi mitjà"],"secondary":["Dorsal ample"],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TA-03","position":"TA-03","session":"TA","order":3,"name":"Chest Press a màquina","category":"VAR","category_label":"Fix · variant","machine":{"code":"M5","label":"Chest Press selectoritzada (Technogym) · alternativa: M6, de discos"},"muscles":"Pit esternal · deltoide anterior · tríceps","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"90 s","rir":"1–2"},"quick":{"do":["Seient amb la palanca groga: manetes a l'alçada de l'estèrnum","Pin groc a la pila; anota el número de seient al registre","Palanca d'assistència per posar les manetes a la posició d'inici","Omòplats enrere i avall abans de la primera repetició"],"dont":"Deixar que les espatlles pugin cap a les orelles per acabar l'empenta","feel":"Tensió creixent al centre del pit, no als tríceps ni al davant de l'espatlla","grip":"Manetes horitzontals (pronada) o verticals (neutra) — decideix abans de començar"},"theory_html":"<p><span class=\"k\">La mateixa funció, sense haver d'estabilitzar.</span> Aquí el pit torna a fer el que fa sempre, acostar el braç al centre, però la trajectòria la decideix la màquina. Això no és una versió menor de l'exercici lliure: com que no has de gastar atenció a sostenir el pes, pots acostar-te més a la fallada amb la tècnica intacta, que és exactament el que busques al segon exercici de pit del dia.</p> <p><span class=\"k\">Què decideix la presa.</span> Les manetes horitzontals obren els colzes i donen més estirament al principi, a canvi de demanar més a l'espatlla. Les verticals fan que els braços conflueixin cap al centre, la contracció final es noti més i l'espatlla treballi més protegida. Per defecte, les verticals: aquesta sessió ja porta molta empenta.</p> <p><span class=\"k\">M5 i M6 no són la mateixa màquina.</span> M5 és la selectoritzada, amb pin groc. M6 és la de discos, i el pes sempre queda un esglaó per sota del que diu el registre de M5: no els comparis.</p>","cues":["Omòplats enrere i avall, clavats al respatller","Canells rectes, en línia amb el colze","Colzes a uns 45° del tronc, mai oberts en creu","Extensió còmoda, sense impacte","No portis les manetes per darrere de la línia de les espatlles"],"setup_steps":["Regula el <span class=\"key\">seient amb la palanca groga</span> fins que les manetes quedin a l'<span class=\"key\">alçada de l'estèrnum</span>. Massa baix, empenys cap amunt i entra l'espatlla; massa alt, cap avall i entra el dorsal.","Selecciona la càrrega amb el <span class=\"key\">pin groc</span> de la pila.","Seu amb l'esquena sencera al respatller i els peus plans. Fes servir la <span class=\"key\">palanca d'assistència</span> per portar les manetes a la posició d'inici: així no has d'anar-les a buscar amb l'espatlla estirada enrere i freda.","Tria la presa i posa els <span class=\"key\">omòplats enrere i avall</span> abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Dues manetes, dos exercicis.</span> Les manetes horitzontals i les verticals no són dues mides del mateix: canvien la trajectòria del braç.</p> <p><span class=\"k\">Manetes horitzontals, presa pronada.</span> Palmells cap avall i colzes més oberts. El pit s'estira més al punt inicial i la part mitjana del pit hi treballa més, a canvi de demanar més a l'espatlla. Aquesta és la presa per als cicles en què vulguis buscar obertura.</p> <p><span class=\"k\">Manetes verticals, presa neutra.</span> Palmells encarats i colzes més arran del cos. Els braços conflueixen cap al centre, la contracció final es nota més i l'espatlla treballa en una posició més protegida. <span class=\"k\">És la presa per defecte</span>, perquè aquesta sessió ja porta molta empenta.</p> <p><span class=\"k\">En tots dos casos:</span> canell recte en línia amb l'avantbraç, i el mateix número de seient per a la mateixa presa. Anota quina has fet servir; si compares les càrregues sense saber-ho, semblarà que has retrocedit quan només has canviat de maneta.</p>","execution_steps":["<span class=\"key\">Empenta (1 s).</span> Fins a una extensió còmoda, sense impacte.","<span class=\"key\">Pausa alta (1 s).</span> Estreny el pit, com qui tanca unes portes.","<span class=\"key\">Baixada (3 s).</span> Fins que les manetes quedin a l'alçada del pit. <span class=\"key\">No passis per darrere</span> de la vertical de les espatlles.","<span class=\"key\">Pausa baixa (1 s).</span> Sense perdre tensió i sense deixar reposar la pila."],"notice_html":"<p>Feina repartida pel pit, amb la màquina fent la trajectòria: aquí no has de notar l'esforç d'estabilitzar res. <span class=\"k\">Si notes el coll o la part alta de l'esquena</span>, les espatlles han pujat. <span class=\"k\">Si notes el davant de l'espatlla</span>, has deixat anar els colzes massa enrere al punt baix. <span class=\"k\">Si només notes el tríceps</span>, el seient és massa alt i empenys cap amunt.</p>","verify_html":"<p><span class=\"k\">Prova de l'alçada:</span> assegut i sense pes, porta les manetes endavant. Si els canells queden més amunt que els colzes, el seient està massa baix.</p> <p><span class=\"k\">Prova del segon a baix:</span> atura't un segon amb les manetes a l'alçada del pit. Si les espatlles s'enfilen o has d'empènyer de seguida per no quedar-te encallat, el pes és excessiu.</p> <p><span class=\"k\">Prova de la pila:</span> els pesos no toquen fons entre repeticions.</p>","errors":[{"error":"Les espatlles pugen cap a les orelles","why":"El trapezi superior pren la feina del pit. <span class=\"key\">Atenció especial: és el teu error més repetit.</span>","fix":"Omòplats enrere i avall abans de cada repetició.","cause":"Amb l'esquena contra el respatller no hi ha on empènyer, i l'espatlla puja buscant suport quan el pes puja."},{"error":"Bloquejar el colze a dalt","why":"La càrrega salta del múscul a l'articulació i la tensió desapareix.","fix":"Atura't just abans del bloqueig si et fa perdre tensió o molesta.","cause":"Estendre del tot és l'únic punt de la sèrie on es pot descansar sense soltar el pes."},{"error":"Rang excessiu per darrere","why":"Estira en excés la part davantera de l'espatlla, que és justament la que el programa vigila.","fix":"Atura la baixada a l'alçada del pit.","cause":"El respatller convida a deixar anar els colzes enrere perquè no hi ha cap topall."}],"progression_html":"<p>12 repeticions netes a les tres sèries → un increment de la pila i tornada a 8. Si un dia has de fer servir M6, no comptis aquell pes com un retrocés: és una altra màquina.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=TklmCZ3IzIo","title":"Pure Strength Chest Press - Set Up & Execution","confidence":"alta","note":"El vídeo mostra la màquina de discos, que és M6. El patró i la col·locació són els mateixos; a M5 la càrrega es tria amb el pin i les manetes es col·loquen amb la palanca d'assistència."},"alternatives":{"principal":{"name":"Chest Press de discos (M6)","why_equivalent":"Mateixa empenta guiada amb braços independents. Només canvia com es carrega el pes.","adjust":"Carrega els discos a mà i comença un esglaó per sota: el pes efectiu no es correspon amb el de la pila de M5.","short":"mateixa empenta, càrrega manual"},"contingencia":{"name":"Press pla amb manuelles","why_acceptable":"Mateixa empenta horitzontal amb el pit esternal de motor, però has d'estabilitzar tu.","adjust":"Comença un esglaó per sota: sense la guia, el pes efectiu és més alt del que sembla.","short":"mateixa empenta, sense guia"},"not_equivalent":["Press de banca amb barra · fora del sistema de màquines","Creuament a politja · fora de la regla de politges"]},"v22":true,"setup_html":"<ol> <li>Regula el <span class=\"key\">seient amb la palanca groga</span> fins que les manetes quedin a l'<span class=\"key\">alçada de l'estèrnum</span>. Massa baix, empenys cap amunt i entra l'espatlla; massa alt, cap avall i entra el dorsal.</li> <li>Selecciona la càrrega amb el <span class=\"key\">pin groc</span> de la pila.</li> <li>Seu amb l'esquena sencera al respatller i els peus plans. Fes servir la <span class=\"key\">palanca d'assistència</span> per portar les manetes a la posició d'inici: així no has d'anar-les a buscar amb l'espatlla estirada enrere i freda.</li> <li>Tria la presa i posa els <span class=\"key\">omòplats enrere i avall</span> abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Empenta (1 s).</span> Fins a una extensió còmoda, sense impacte.</li> <li><span class=\"key\">Pausa alta (1 s).</span> Estreny el pit, com qui tanca unes portes.</li> <li><span class=\"key\">Baixada (3 s).</span> Fins que les manetes quedin a l'alçada del pit. <span class=\"key\">No passis per darrere</span> de la vertical de les espatlles.</li> <li><span class=\"key\">Pausa baixa (1 s).</span> Sense perdre tensió i sense deixar reposar la pila.</li> </ol>","grip_title":"La presa","tags":{"primary":["Pit esternal"],"secondary":["Deltoide anterior"],"minor":["Tríceps"],"traits":["Màquina guiada"]},"registre":{"opcions":{"titol":"Presa","valors":["Manetes horitzontals (pronada)","Manetes verticals (neutra)"]},"proposta":"doble"}},{"key":"TA-04","position":"TA-04","session":"TA","order":4,"name":"PureStrength Row, presa neutra","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"PureStrength Row amb pit recolzat · no consta a l'inventari M1–M7"},"muscles":"Dorsal ample · trapezi mitjà · romboides","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2 min","rir":"1–2"},"quick":{"do":["Seient a l'alçada que deixa les nanses davant de la part baixa del pit","Pit recolzat al coixí, sense enfonsar-hi el tronc","Nanses verticals: aquesta sessió sempre presa neutra","Omòplats avall abans de començar"],"dont":"Tirar amb els bíceps: crema l'avantbraç i no l'esquena","feel":"Feina al costat de l'esquena i entre els omòplats","grip":"Neutra — nanses verticals, palmells encarats"},"theory_html":"<p><span class=\"k\">L'altra funció del dorsal.</span> Portar el braç enrere. Per això el rem i la tirada vertical no es poden substituir: el primer dona <span class=\"k\">gruix</span> a l'esquena i el segon, amplada. Fer només verticals deixa una esquena ampla i plana; fer només rems, una de gruixuda i estreta.</p> <p><span class=\"k\">Què decideix la presa.</span> Amb les nanses verticals els colzes viatgen arran del cos i el dorsal és el motor; amb la barra, els colzes s'obren i la feina puja cap al trapezi mitjà i el deltoide posterior. Són dos exercicis diferents amb la mateixa màquina. El cicle els reparteix: aquí les nanses, perquè avui la tirada vertical ja va a l'esquena alta; a Tronc B, la barra.</p> <p><span class=\"k\">Per què amb el pit recolzat.</span> El coixí et treu la possibilitat de gronxar-te, que és la trampa clàssica del rem. El que queda és el moviment que volies.</p>","cues":["Pensa en el colze cap enrere, no en la mà","Colzes arran del cos, resseguint les costelles","Ajunta els omòplats al final del recorregut","Extensió completa deixant estirar els omòplats endavant","Coll llarg: les espatlles no pugen cap a les orelles"],"setup_steps":["Ajusta el seient perquè les nanses quedin a l'alçada de la <span class=\"key\">part baixa del pit</span>: és l'alçada que deixa els colzes viatjar arran del cos, que és el que fa treballar el dorsal.","Pit recolzat al coixí, sense enfonsar-hi el tronc. El coixí és el que t'impedeix gronxar-te.","Agafa les <span class=\"key\">nanses verticals</span> amb els palmells encarats.","Baixa els omòplats abans de la primera tirada."],"grip_html":"<p><span class=\"k\">Nanses verticals, presa neutra.</span> Palmells encarats l'un cap a l'altre. És la presa que permet portar el colze arran del cos, i el colze arran del cos és el que fa que el dorsal treballi.</p> <p><span class=\"k\">Per què no la barra en aquesta sessió.</span> La barra horitzontal obre els colzes i puja la feina cap a l'esquena alta, que a Tronc A ja té el pulldown ample. Fer-la aquí duplicaria una zona i en deixaria una altra curta. A Tronc B, on la tirada vertical és de dorsal, la barra és la que toca.</p> <p><span class=\"k\">Canell i polze.</span> Canell recte, en línia amb l'avantbraç. La mà només subjecta: si la premses amb força, l'avantbraç s'acaba abans que l'esquena. El gràfic de sota compara les dues preses i on treballa cadascuna.</p>","execution_steps":["<span class=\"key\">Tirada (2 s).</span> Colzes cap enrere, resseguint les costelles, com si volguessis tocar la paret de darrere amb ells. Les mans només aguanten.","<span class=\"key\">Contracció (1 s).</span> Ajunta els omòplats al final del recorregut.","<span class=\"key\">Retorn (3 s).</span> Estén del tot i deixa que els omòplats s'estirin endavant.","<span class=\"key\">Pausa (1 s)</span> amb l'esquena estirada, sense que la pila reposi."],"notice_html":"<p>Feina al costat de l'esquena, sota l'aixella, i entre els omòplats al final de cada repetició. <span class=\"k\">Si el que notes és l'avantbraç</span>, has tirat amb la mà: pensa en el colze i baixa un esglaó. <span class=\"k\">Si el que notes és el coll</span>, has encongit les espatlles per acabar la tirada. <span class=\"k\">Si no notes gairebé res</span>, sol voler dir que el recorregut s'ha quedat curt a la part estirada.</p>","verify_html":"<p><span class=\"k\">Prova del seient:</span> amb el pit al coixí i els braços estesos, les mans queden a l'alçada de la part baixa del pit. Si queden clarament més amunt o més avall, ajusta l'alçada abans de la primera sèrie.</p> <p><span class=\"k\">Prova del pit:</span> si has de separar el pit del coixí per completar la repetició, el pes és excessiu. És la comprovació més fiable d'aquest exercici.</p> <p><span class=\"k\">Prova del colze:</span> fes una sèrie pensant només a portar el colze enrere. Si així notes més l'esquena, abans tiraves amb la mà.</p>","errors":[{"error":"Tirar amb els bíceps","why":"Es nota perquè l'avantbraç crema i l'esquena no.","fix":"Pensa en el colze, no en la mà.","cause":"Agafar fort i tirar amb la mà és el gest natural; el colze només mana si t'hi fixes expressament."},{"error":"Separar el pit del coixí","why":"Perds l'aïllament que aquesta màquina et dona i tornes a gronxar-te.","fix":"Pit enganxat tota la sèrie.","cause":"Separar-se allarga el recorregut i regala els centímetres que amb el pes alt no surten."},{"error":"Encongir les espatlles","why":"Un altre cop el trapezi superior prenent la feina.","fix":"Coll llarg i omòplats avall abans de cada repetició.","cause":"El trapezi entra a ajudar quan l'esquena arriba al final del seu rang i encara queda pes per moure."}],"progression_html":"<p>12 repeticions netes a les tres sèries → un increment i tornada a 8. Compara sempre amb el mateix tipus de presa: la barra de Tronc B permet més pes i no mesura el mateix.</p>","note_html":"","extra_sections":[{"title":"Parcials després de la fallada","html":"<p>Quan a l'última sèrie ja no puguis completar la tirada, hi ha una manera d'allargar-la que no compromet res: deixa els colzes quiets i <span class=\"k\">continua només ajuntant els omòplats</span>, recorreguts de pocs centímetres, fins que tampoc surtin. La part final del moviment es manté i el braç deixa de ser el límit. Opcional, i només a l'última sèrie.</p>"}],"figure":"row_grips","video":{"url":"https://www.youtube.com/watch?v=TvFhOtAdHno","title":"Technogym Pure Strength Plate Loaded | Row","confidence":"exacta","note":"Mateixa màquina. Al vídeo hi surten totes dues preses; aquí fes servir les nanses verticals."},"alternatives":{"principal":{"name":"Rem a politja baixa, presa neutra","why_equivalent":"Mateixa tirada horitzontal amb els colzes arran del cos i el dorsal de motor.","adjust":"Sense suport al pit, el tronc s'ha de sostenir sol: RIR 3 i pes lleugerament inferior.","short":"mateixa tirada, sense suport"},"contingencia":{"name":"Rem amb manuella a un braç, mà i genoll al banc","why_acceptable":"Conserva la tirada amb suport de tres punts i la lumbar descarregada. Perd la càrrega bilateral.","adjust":"Cada braç la seva sèrie. Atura't quan el tronc comenci a girar, encara que el braç pugui.","short":"unilateral, lumbar descarregada"},"not_equivalent":["Rem inclinat amb barra · demanda d'erectors","Pes mort · càrrega en flexió"]},"v22":true,"setup_html":"<ol> <li>Ajusta el seient perquè les nanses quedin a l'alçada de la <span class=\"key\">part baixa del pit</span>: és l'alçada que deixa els colzes viatjar arran del cos, que és el que fa treballar el dorsal.</li> <li>Pit recolzat al coixí, sense enfonsar-hi el tronc. El coixí és el que t'impedeix gronxar-te.</li> <li>Agafa les <span class=\"key\">nanses verticals</span> amb els palmells encarats.</li> <li>Baixa els omòplats abans de la primera tirada.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Tirada (2 s).</span> Colzes cap enrere, resseguint les costelles, com si volguessis tocar la paret de darrere amb ells. Les mans només aguanten.</li> <li><span class=\"key\">Contracció (1 s).</span> Ajunta els omòplats al final del recorregut.</li> <li><span class=\"key\">Retorn (3 s).</span> Estén del tot i deixa que els omòplats s'estirin endavant.</li> <li><span class=\"key\">Pausa (1 s)</span> amb l'esquena estirada, sense que la pila reposi.</li> </ol>","grip_title":"La presa","tags":{"primary":["Dorsal ample"],"secondary":["Trapezi mitjà"],"minor":["Romboides"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TA-05","position":"TA-05","session":"TA","order":5,"name":"Reverse Fly màquina","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Reverse Fly amb pit recolzat · no consta a l'inventari M1–M7"},"muscles":"Deltoide posterior · trapezi mitjà","prescription":{"series":"3","reps":"12–20","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Seu de cara al respatller, amb el pit recolzat","Alçada del seient: els braços queden a l'alçada de l'espatlla","Avantbraços als coixinets; les mans no agafen res","Pes baix: has de poder fer 20 repeticions amb rang complet"],"dont":"Massa pes i recorregut curt: se l'acaba quedant el trapezi","feel":"Una crema difusa just darrere de l'espatlla","grip":"Sense presa — la força surt de l'avantbraç contra el coixinet"},"theory_html":"<p><span class=\"k\">Què fa el deltoide posterior.</span> Obre el braç cap enrere. És la cara de l'espatlla que no toca cap empenta, i la que <span class=\"k\">impedeix que l'espatlla rodi endavant</span>: tots els pressos treballen els rotadors que la tanquen, i sense res que compensi, el desequilibri s'acumula cicle rere cicle. També és el que arrodoneix l'espatlla vista de costat.</p> <p><span class=\"k\">El malentès que arruïna l'exercici.</span> La sensació més forta arriba quan ajuntes els omòplats, i per això el cos hi va sol. Però això és feina de trapezi mitjà i romboides, que ja tens coberta amb el rem. Aquí la idea és <span class=\"k\">allunyar les mans entre elles</span> amb els omòplats relativament quiets; és menys espectacular i és el que fa treballar el múscul que busques.</p> <p><span class=\"k\">Per què és fix i va en superjoc.</span> Quan una cosa així és opcional, a la pràctica vol dir cicles sencers sense fer-la. És petit, es recupera de pressa i no genera fatiga general, així que encadenar-lo amb les elevacions laterals no costa res de temps.</p>","cues":["Obre fins a la línia de l'espatlla, sense forçar més enllà","Pensa a allunyar les mans entre elles, no a ajuntar omòplats","Braços a l'alçada de l'espatlla, mai per sobre","Coll llarg: si les espatlles pugen, el pes és excessiu","Retorn de 3 segons sense que les plaques toquin"],"setup_steps":["Seu <span class=\"key\">de cara al respatller</span>, amb el pit recolzat i els peus estables.","Ajusta l'alçada del seient perquè els braços quedin a l'<span class=\"key\">alçada de l'espatlla</span>. Si queden més amunt, entren els romboides i el trapezi, que ja treballen al rem.","Recolza els <span class=\"key\">avantbraços als coixinets</span>, amb el colze doblegat i fix: l'angle constant és el que manté la palanca igual tota la sèrie.","Omòplats avall i coll llarg. Tria un pes que et permeti 20 repeticions completes: amb més, el múscul que busques no arriba a manar."],"grip_html":"<p><span class=\"k\">Aquí no s'agafa res.</span> La força surt de l'avantbraç empenyent el coixinet cap enrere. Si t'agafes a les nanses i estrenys, el braç es tensa, el colze canvia d'angle i el moviment s'escurça.</p> <p><span class=\"k\">Colze fix.</span> L'angle del colze és el mateix del principi al final: és el que manté constant la palanca i deixa la feina al deltoide posterior.</p> <p><span class=\"k\">Alçada dels braços i part del múscul.</span> Amb els braços a l'alçada de l'espatlla, la feina se centra al deltoide posterior. Si pugen per sobre, entren el trapezi mitjà i els romboides, que és el que aquest exercici justament no busca: d'aquests ja se n'encarrega el rem.</p>","execution_steps":["<span class=\"key\">Obertura (2 s).</span> Separa els braços cap enrere fins a la línia de l'espatlla, com si volguessis allunyar les mans entre elles.","<span class=\"key\">Contracció (1 s).</span> Al punt màxim, sense forçar més enllà del rang natural.","<span class=\"key\">Retorn (3 s).</span> Controlat, sense que les plaques toquin fons.","Encadena la repetició següent sense pausa: la tensió no s'apaga en tota la sèrie."],"notice_html":"<p>Una crema difusa just darrere de l'espatlla, que apareix tard i marxa de pressa; no esperis la sensació contundent d'un press. <span class=\"k\">Si el que notes és entre els omòplats</span>, el trapezi mitjà i els romboides han pres el relleu. <span class=\"k\">Si el que notes és el coll</span>, has encongit les espatlles.</p>","verify_html":"<p><span class=\"k\">Prova del seient:</span> amb el pit al coixí i els braços endavant, les mans queden a l'alçada de les espatlles. Si queden més amunt, el seient és massa baix.</p> <p><span class=\"k\">Prova del pes:</span> has de poder fer 20 repeticions amb rang complet. Si a la dotzena ja escurces el recorregut, has començat massa amunt.</p> <p><span class=\"k\">Prova de la sensació:</span> si notes que ajuntes els omòplats més que no pas que obres els braços, baixa el pes i torna a pensar en les mans separant-se.</p>","errors":[{"error":"Massa pes i recorregut curt","why":"El deltoide posterior és petit: amb pes excessiu, el trapezi i els romboides s'ho queden tot.","fix":"Pes que permeti 20 repeticions amb rang complet.","cause":"La càrrega que sembla raonable a la vista ja és massa per a aquest múscul."},{"error":"Ajuntar els omòplats en lloc d'obrir els braços","why":"Llavors és un exercici de trapezi mitjà, no de deltoide posterior.","fix":"Pensa a allunyar les mans entre elles, amb els omòplats relativament quiets.","cause":"Ajuntar els omòplats dona una sensació de contracció molt més forta i el cos hi va sol."},{"error":"Encongir les espatlles en obrir","why":"El trapezi superior torna a prendre la feina, i aquí costa de veure perquè el moviment ja és petit.","fix":"Coll llarg abans de cada repetició; si les espatlles pugen, baixa el pes.","cause":"Amb el pes just per sobre del teu, el cos recluta el múscul gran més proper."}],"progression_html":"<p>Per repeticions primer: de 12 a 20 amb la mateixa càrrega, i llavors un sol increment i tornada a 12.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=v0rJuhEa59c","title":"Reverse Pec Deck Fly | Proper Form Tutorial for Rear Delts","confidence":"alta","note":"Mateix patró. Si la teva màquina porta coixinets per a l'avantbraç, fes servir-los en lloc de les nanses."},"alternatives":{"principal":{"name":"Face Pull amb corda a politja","why_equivalent":"Mateixa obertura cap enrere amb el deltoide posterior i els romboides de motors.","adjust":"Pes molt inferior al de la màquina; la corda no perdona les compensacions del tronc.","short":"mateixa obertura, a politja"},"contingencia":{"name":"Reverse Fly amb manuelles, tronc inclinat endavant","why_acceptable":"Conserva el pla de moviment sense el suport del pit.","adjust":"Pes lleuger i RIR 3 fins a dominar la posició inclinada.","short":"mateix pla, sense suport"},"not_equivalent":["Remada al mentó · risc d'espatlla","Press militar · treball per sobre del cap"]},"v22":true,"setup_html":"<ol> <li>Seu <span class=\"key\">de cara al respatller</span>, amb el pit recolzat i els peus estables.</li> <li>Ajusta l'alçada del seient perquè els braços quedin a l'<span class=\"key\">alçada de l'espatlla</span>. Si queden més amunt, entren els romboides i el trapezi, que ja treballen al rem.</li> <li>Recolza els <span class=\"key\">avantbraços als coixinets</span>, amb el colze doblegat i fix: l'angle constant és el que manté la palanca igual tota la sèrie.</li> <li>Omòplats avall i coll llarg. Tria un pes que et permeti 20 repeticions completes: amb més, el múscul que busques no arriba a manar.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Obertura (2 s).</span> Separa els braços cap enrere fins a la línia de l'espatlla, com si volguessis allunyar les mans entre elles.</li> <li><span class=\"key\">Contracció (1 s).</span> Al punt màxim, sense forçar més enllà del rang natural.</li> <li><span class=\"key\">Retorn (3 s).</span> Controlat, sense que les plaques toquin fons.</li> <li>Encadena la repetició següent sense pausa: la tensió no s'apaga en tota la sèrie.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide posterior"],"secondary":["Trapezi mitjà"],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TA-06","position":"TA-06","session":"TA","order":6,"name":"Elevacions laterals amb manuelles","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Manuelles · no consta a l'inventari M1–M7"},"muscles":"Deltoide lateral","prescription":{"series":"3","reps":"12–20","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Manuelles molt més lleugeres del que et sembla raonable","Dempeus, peus a l'amplada dels malucs i genolls desbloquejats","Colze amb 10–15° de flexió, fixada abans de començar","Coll llarg i espatlles avall abans de la primera repetició"],"dont":"Encongir l'espatlla i passar la feina al trapezi","feel":"Crema al costat de l'espatlla, no al coll","grip":"Neutra — palmells cap al cos, i no giren"},"theory_html":"<p><span class=\"k\">Què fa el deltoide lateral, i per què el notaràs a la silueta.</span> Separa el braç del cos. És el múscul que més decideix l'<span class=\"k\">amplada de les espatlles vista de front</span>, i el canvi de forma del tronc que es busca quan s'entrena per estètica ve, sobretot, d'aquí. També és petit, es recupera de pressa i no genera fatiga general: per això en té tres exposicions per cicle quan la resta de grups en tenen dues.</p> <p><span class=\"k\">Per què el pes sembla ridícul.</span> És un múscul petit movent tot el braç estès com a palanca. La càrrega correcta sempre sembla massa baixa, i per això aquí es progressa per repeticions abans que per pes. I per sobre de l'alçada de l'espatlla el braç encara puja, però ja no el puja ell: el trapezi n'agafa el relleu.</p> <p><span class=\"k\">Manuella o politja.</span> Amb manuelles la tensió és màxima a l'horitzontal i mínima amb el braç penjant; la politja inverteix el repartiment. Amb el mateix rang donen resultats semblants, així que alternar-les és varietat, no una condició per créixer.</p>","cues":["Puja el colze, no la mà","Colze igual o una mica més alt que el canell al punt alt","Atura't a l'alçada de l'espatlla, ni un dit més amunt","Baixada de 3 segons, sense deixar caure el braç","Tronc immòbil: si et gronxes, el pes és excessiu"],"setup_steps":["Dempeus, peus a l'amplada dels malucs i genolls lleugerament desbloquejats.","Manuelles als costats del cos, amb els palmells encarats cap a les cuixes.","<span class=\"key\">Coll llarg i espatlles avall</span> abans de la primera repetició: és la posició que impedeix que el trapezi comenci la feina abans que el deltoide.","Fixa el colze amb <span class=\"key\">10–15° de flexió</span> i no el moguis: si s'obre i es tanca, la palanca canvia i la tensió se'n va."],"grip_html":"<p><span class=\"k\">Presa neutra, i no gira.</span> Palmells cap al cos. Molta gent gira el palmell cap avall al punt alt pensant que aïlla més; el que fa és rotar l'espatlla cap endins justament en la posició de menys espai articular.</p> <p><span class=\"k\">La mà no aixeca.</span> Aixeca el colze i deixa que la mà el segueixi. Si la mà va per davant, el pes acaba penjat del canell i el deltoide en fa menys.</p> <p><span class=\"k\">Cap on va el braç.</span> Cap al costat, o un pèl endavant, mai endarrere. Endavant del tot és una elevació frontal, que treballa un altre cap del deltoide i és a l'annex.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat fins a l'alçada de l'espatlla.","<span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més alt que el canell.","<span class=\"key\">Baixada (3 s).</span> Controlada fins al costat del cos.","Encadena sense rebot i sense aturar-te a descansar amb els braços penjats."],"notice_html":"<p>Crema al costat de l'espatlla, que apareix aviat i s'acumula molt. <span class=\"k\">Si el que notes és el coll o la part alta de l'esquena</span>, el trapezi ha pres el relleu i el pes és massa. <span class=\"k\">Si el que notes és el davant de l'espatlla</span>, estàs pujant endavant en comptes de cap al costat. <span class=\"k\">Si notes l'espatlla per dins</span>, has passat de l'horitzontal.</p>","verify_html":"<p><span class=\"k\">Prova del mirall lateral:</span> al punt alt, el colze queda igual o una mica més amunt que el canell.</p> <p><span class=\"k\">Prova del tronc quiet:</span> si has de gronxar-te per arrencar la primera repetició, el pes és excessiu, sense excepcions.</p> <p><span class=\"k\">Prova de les 15:</span> has de poder fer 15 repeticions netes amb el tronc immòbil. Si no, baixa de parell.</p>","errors":[{"error":"Encongir l'espatlla","why":"El teu error més persistent, i aquí el més fàcil de cometre: el trapezi fa la feina i el deltoide en queda fora.","fix":"Coll llarg i espatlles avall abans de cada repetició. Si no ho pots mantenir, baixa de parell de manuelles.","cause":"El deltoide lateral mou molt poc pes, i la manuella que sembla raonable a la mà ja obliga el trapezi a ajudar."},{"error":"Pujar per sobre de l'espatlla","why":"Per sobre de l'horitzontal hi entra el trapezi.","fix":"Atura't a l'alçada de l'espatlla.","cause":"L'horitzontal no es nota com un final, i el braç continua perquè encara pot."},{"error":"Gronxar el cos","why":"L'impuls mou el pes i el deltoide deixa de ser el motor.","fix":"Càrrega que permeti 15 repeticions amb el tronc immòbil.","cause":"Amb el pes just per sobre del teu, el balanceig és l'única manera de passar dels primers graus."},{"error":"Aixecar els talons","why":"L'has detectat tu. Si els talons pugen, el cos pot ajudar a moure el pes i les repeticions deixen de ser comparables.","fix":"Peus plans i talons a terra a totes les repeticions; si no es mantenen, baixa de pes."}],"progression_html":"<p>Per repeticions: de 12 a 20 amb les mateixes manuelles, i només llavors el parell següent, tornant a 12. Pujar pes aviat aquí garanteix que el trapezi agafi la feina.</p>","note_html":"","extra_sections":[{"title":"Assegut o a un braç: quan val la pena","html":"<p>Dempeus és la versió per defecte, perquè és la més ràpida i la que et deixa encadenar el superjoc amb el Reverse Fly. Però hi ha dues variants que valen la pena quan vols afinar la tècnica.</p> <p><span class=\"k\">Assegut amb respatller.</span> Amb l'esquena recolzada no et pots gronxar, i el pes que aixequis és el que aixeca el deltoide de debò. És la manera més clara de descobrir si el teu pes de sempre era massa: proves una sèrie asseguda i, si no surt, ja tens la resposta.</p> <p><span class=\"k\">A un braç, agafat amb la mà lliure.</span> Agafa't a una màquina o a un muntant amb la mà que descansa i fes les repeticions amb l'altra. Tens més estabilitat, pots mirar-te la trajectòria i pots atendre un sol costat. Costa el doble de temps, així que reserva-ho per a les sessions en què vagis sobrat.</p>"},{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie pots fer un <span class=\"k\">dropset</span>: en arribar al punt on ja no puges net, deixa les manuelles, agafa el parell immediatament inferior i continua sense descansar fins que tampoc surti. Una sola vegada, i només a l'última sèrie. És la tècnica que els vídeos de referència proposen precisament per a aquest exercici, perquè és un múscul petit que es recupera de seguida i no deixa fatiga general.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=nnH63icHYXY","title":"Dumbbell Lateral Raise | Proper Form Tutorial for Bigger Shoulders","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Elevació lateral a màquina","why_equivalent":"Mateixa abducció amb trajectòria guiada i resistència constant, amb el deltoide lateral com a motor únic.","adjust":"La màquina no perdona l'impuls: comença un esglaó per sota del que faries amb manuelles.","short":"mateixa abducció, guiada"},"contingencia":{"name":"Elevacions laterals a politja","why_acceptable":"És l'altra variant d'aquesta mateixa posició, amb tensió constant.","adjust":"Pes molt lleuger; mateix RIR.","short":"tensió constant tot el rang"},"not_equivalent":["Press militar · treball per sobre del cap","Remada al mentó · risc d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs i genolls lleugerament desbloquejats.</li> <li>Manuelles als costats del cos, amb els palmells encarats cap a les cuixes.</li> <li><span class=\"key\">Coll llarg i espatlles avall</span> abans de la primera repetició: és la posició que impedeix que el trapezi comenci la feina abans que el deltoide.</li> <li>Fixa el colze amb <span class=\"key\">10–15° de flexió</span> i no el moguis: si s'obre i es tanca, la palanca canvia i la tensió se'n va.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat fins a l'alçada de l'espatlla.</li> <li><span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més alt que el canell.</li> <li><span class=\"key\">Baixada (3 s).</span> Controlada fins al costat del cos.</li> <li>Encadena sense rebot i sense aturar-te a descansar amb els braços penjats.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide lateral"],"secondary":[],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TA-06b","position":"TA-06","session":"TA","order":7,"name":"Elevacions laterals a politja","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Torre de politges, politja baixa amb nansa simple · no consta a l'inventari M1–M7"},"muscles":"Deltoide lateral","prescription":{"series":"3","reps":"12–20","tempo":"2–3 s ↓","rest":"30 s","rir":"0–1"},"quick":{"do":["Politja a l'alçada més baixa, amb nansa simple","De costat a la torre, amb la torre a la banda contrària del braç que treballa","Agafa la nansa passant-la per davant del cos: el cable creua en diagonal","Mà lliure agafada a la torre; colze amb 10–15° de flexió"],"dont":"Deixar que la pila toqui fons entre repeticions","feel":"Crema al costat de l'espatlla des del primer centímetre","grip":"Neutra — palmell cap al cos, i no gira"},"theory_html":"<p><span class=\"k\">Què fa el deltoide lateral.</span> Separa el braç del cos, i és el que decideix l'amplada de les espatlles vista de front. Aquí el treballes amb l'eina que li dona tensió des del primer grau.</p> <p><span class=\"k\">Per què la politja canvia les coses.</span> Amb manuelles, la resistència ve de la gravetat: amb el braç penjant no hi ha gairebé tensió, i n'hi ha el màxim a l'horitzontal. La politja baixa tira en diagonal des de terra i inverteix el repartiment: hi ha tensió des del primer centímetre, amb el múscul estirat, que és on la manuella pràcticament no en dona.</p> <p><span class=\"k\">La col·locació és el 90% de l'exercici.</span> Creuant el cable per davant del cos, el braç arrenca una mica per dins de la línia del tronc i el deltoide comença estirat. De cara a la torre, amb el cable paral·lel, perds justament això. El descans és curt perquè es compta després dels dos braços: mentre treballa un, l'altre ja en descansa gairebé dos minuts.</p>","cues":["Puja el colze, no la mà","Atura't a l'alçada de l'espatlla, ni un dit més amunt","Baixa fins que la mà creui una mica la línia del cos","La tensió no s'apaga mai: la pila no toca fons","Coll llarg i espatlla avall abans de cada repetició"],"setup_steps":["Politja a l'<span class=\"key\">alçada més baixa</span>, amb una nansa simple.","Col·loca't <span class=\"key\">de costat a la torre</span>, amb la torre a la banda contrària del braç que treballarà.","Agafa la nansa amb el braç més allunyat, passant-la <span class=\"key\">per davant del cos</span>: el cable creua en diagonal i el braç arrenca amb el múscul ja estirat.","Peus a l'amplada dels malucs i mà lliure agafada a la torre, perquè el tronc no hi participi. Colze amb 10–15° de flexió, fix."],"grip_html":"<p><span class=\"k\">Presa neutra, i no gira.</span> Palmell cap al cos de principi a fi. Girar-lo cap avall al punt alt rota l'espatlla cap endins en la posició amb menys espai articular.</p> <p><span class=\"k\">La mà només enganxa la nansa.</span> Estrènyer-la amb força tensa l'avantbraç i el fa entrar en un exercici que no és seu. Agafada ferma però relaxada.</p> <p><span class=\"k\">Per on passa el cable.</span> Per davant del cos, no per darrere ni pel costat. Si el cable et passa per darrere del canell, el braç arrenca fora de la línia i la primera part del recorregut se't fa impossible.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat i lleugerament endavant, fins a l'alçada de l'espatlla.","<span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més amunt que el canell.","<span class=\"key\">Baixada (3 s).</span> Torna fins que la mà creui una mica la línia del cos, sense deixar que la pila reposi.","Fes totes les repeticions d'un braç, canvia de costat sense descansar i descansa 30 s en acabar els dos."],"notice_html":"<p>Crema al costat de l'espatlla, present ja a les primeres repeticions. <span class=\"k\">Si el que notes és el coll</span>, el trapezi ha pres el relleu. <span class=\"k\">Si notes l'espatlla per dins</span>, has passat de l'horitzontal o has girat el palmell cap avall.</p>","verify_html":"<p><span class=\"k\">Prova de la col·locació:</span> a la posició inicial, la mà queda lleugerament creuada per davant de la cuixa contrària. Si queda al costat del cos, estàs mal orientat o massa a prop.</p> <p><span class=\"k\">Prova del pes:</span> has de poder fer 15 repeticions sense que el tronc es mogui gens. Aquí el pes correcte sempre sembla ridículament baix.</p> <p><span class=\"k\">Prova de la pila:</span> si sents el cop dels pesos entre repeticions, has perdut la tensió que era el motiu de fer-ho a politja.</p>","errors":[{"error":"Encongir l'espatlla cap a l'orella","why":"El trapezi fa la feina i el deltoide en queda fora. És el teu error més repetit.","fix":"Coll llarg i espatlla avall abans de cada repetició; si no es manté, baixa la càrrega.","cause":"Amb tensió des del primer centímetre, l'espatlla puja buscant on fer força abans que el deltoide arrenqui."},{"error":"Pujar per sobre de l'espatlla","why":"Per sobre de l'horitzontal hi entra el trapezi superior i l'espai de l'espatlla s'estreny.","fix":"Atura't a l'alçada de l'espatlla.","cause":"Amb tensió constant el braç encara pot continuar, i l'horitzontal no es nota com un final."},{"error":"Girar el palmell cap avall al punt alt","why":"Rota l'espatlla cap endins en la posició de més pinçament, sense cap avantatge.","fix":"Presa neutra tota l'estona.","cause":"Ve de la idea que girar el palmell aïlla més el deltoide."},{"error":"Aixecar els talons","why":"L'has detectat tu. Si els talons pugen, el cos pot ajudar a moure el pes i les repeticions deixen de ser comparables.","fix":"Peus plans i talons a terra a totes les repeticions; si no es mantenen, baixa de pes."}],"progression_html":"<p>Per repeticions abans que per pes: de 12 a 20 amb la mateixa càrrega, i llavors un sol increment i tornada a 12.</p>","note_html":"Els creuaments de politja al pit queden fora del programa per la teva regla: politges només per a braços i deltoides. Aquesta posició és una de les excepcions on la politja aporta alguna cosa que cap altra eina dona.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie, <span class=\"k\">dropset</span>: baixa un o dos esglaons de la pila en acabar i continua sense descansar fins que el braç ja no pugi a l'alçada de l'espatlla. Una vegada per sessió, i sempre a l'última sèrie.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=eihMRam0P2Q","title":"Low Cable Lateral Raise: How To","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Elevació lateral a màquina","why_equivalent":"Mateix pla d'abducció amb trajectòria guiada.","adjust":"Pes similar al de la politja; mateix RIR.","short":"mateix pla, guiada"},"contingencia":{"name":"Elevacions laterals amb manuelles","why_acceptable":"És l'altra variant d'aquesta posició. Perd la tensió constant, guanya llibertat de trajectòria.","adjust":"Comença un esglaó per sota: sense politja, els primers graus costen més.","short":"mateixa abducció, trajectòria lliure"},"not_equi
