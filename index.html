valent":["Press militar · treball per sobre del cap","Remada al mentó · risc d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Politja a l'<span class=\"key\">alçada més baixa</span>, amb una nansa simple.</li> <li>Col·loca't <span class=\"key\">de costat a la torre</span>, amb la torre a la banda contrària del braç que treballarà.</li> <li>Agafa la nansa amb el braç més allunyat, passant-la <span class=\"key\">per davant del cos</span>: el cable creua en diagonal i el braç arrenca amb el múscul ja estirat.</li> <li>Peus a l'amplada dels malucs i mà lliure agafada a la torre, perquè el tronc no hi participi. Colze amb 10–15° de flexió, fix.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat i lleugerament endavant, fins a l'alçada de l'espatlla.</li> <li><span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més amunt que el canell.</li> <li><span class=\"key\">Baixada (3 s).</span> Torna fins que la mà creui una mica la línia del cos, sense deixar que la pila reposi.</li> <li>Fes totes les repeticions d'un braç, canvia de costat sense descansar i descansa 30 s en acabar els dos.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide lateral"],"secondary":[],"minor":[],"traits":["Tensió constant"]},"registre":{"proposta":"doble"}},{"key":"TA-07a","position":"TA-07","session":"TA","order":8,"name":"Curl de bíceps amb barra EZ","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Barra EZ · no consta a l'inventari M1–M7"},"muscles":"Bíceps braquial · braquial","prescription":{"series":"2","reps":"10–15","tempo":"2–3 s ↓","rest":"60 s","rir":"1"},"quick":{"do":["Aquest cicle toca curl; si saltes Tronc C, puja a 3 sèries","Dempeus, peus a l'amplada dels malucs, colzes a les costelles","Agafa la barra per les corbes interiors, presa supina","Superjoc amb el core per no allargar la sessió"],"dont":"Gronxar el tronc per moure més pes","feel":"Crema al ventre del bíceps, sense que el tronc hi participi","grip":"Supina, a l'angle que dona la barra EZ"},"theory_html":"<p><span class=\"k\">Què fa el bíceps.</span> Dues coses: doblega el colze i <span class=\"k\">gira el palmell cap amunt</span>. Per això la presa decideix quin múscul treballa, i no és un detall d'aficionat: amb el palmell amunt mana el bíceps; amb el palmell neutre, el braquial, que queda a sota; amb el palmell avall, el braquioradial, que és de l'avantbraç.</p> <p><span class=\"k\">Què hi fa un curl al final de Tronc A.</span> El bíceps ja ha treballat a totes les tirades del dia. Faràs menys pes del que podries en fred, i està bé: això és <span class=\"k\">volum barat</span>, sèries que afegeixen estímul amb poca fatiga perquè el múscul ja és calent. El treball amb càrrega real el fas a Tronc C.</p> <p><span class=\"k\">Per què la barra EZ.</span> La corba deixa la mà a mig camí entre supinada i neutra i descarrega canell i colze. Amb barra recta, molta gent nota molèstia al canell abans que el bíceps arribi a la fallada, i llavors el límit no és el múscul que volies entrenar.</p>","cues":["El colze queda quiet, enganxat a les costelles","Puja sense que el colze viatgi endavant","Extensió gairebé completa a baix, sense descansar","Tronc immòbil i talons a terra de la primera a l'última repetició"],"setup_steps":["Dempeus, peus a l'amplada dels malucs.","Agafa la barra per les <span class=\"key\">corbes interiors</span>, amb presa supina. Si per agafar-la has de separar els colzes del cos, la presa és massa ampla per a tu.","Colzes enganxats a les costelles, i comprova que hi continuen tocant amb els braços estesos: el colze es queda quiet mentre l'avantbraç fa tot el moviment.","Si el vols encadenar amb el core, prepara l'espai abans: aquestes dues sèries van en superjoc."],"grip_html":"<p><span class=\"k\">Per què la presa girada canvia poc.</span> El bíceps fa dues coses: doblegar el colze i girar el palmell cap amunt. Amb la barra EZ el palmell queda a mig camí, de manera que el bíceps continua sent el motor però el braquial hi participa una mica més.</p> <p><span class=\"k\">Amplada.</span> Les corbes interiors. Si per agafar la barra has de separar els colzes de les costelles, la presa és massa ampla per a tu.</p> <p><span class=\"k\">Si el colze parla.</span> Passa a les manuelles amb el palmell supinat o a la corda de politja, que és la presa més tolerant. El que no s'ha de fer és insistir amb la barra recta.</p>","execution_steps":["<span class=\"key\">Pujada (1 s).</span> Flexiona el colze sense que es mogui endavant.","<span class=\"key\">Contracció (1 s).</span> A dalt, sense arribar al punt on la barra «descansa» sobre el colze avançat.","<span class=\"key\">Baixada (3 s).</span> Fins a extensió gairebé completa.","<span class=\"key\">Pausa (1 s)</span> amb el braç estès, sense deixar-hi anar la tensió."],"notice_html":"<p>Crema local i clara al bíceps en dues sèries, sense que el tronc hi hagi participat. <span class=\"k\">Si notes el canell</span>, la presa no és la teva: canvia d'eina abans que d'exercici. <span class=\"k\">Si notes l'avantbraç més que el braç</span>, estàs estrenyent massa la barra.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> han de tocar les costelles amb els braços estesos i continuar tocant-les a dalt.</p> <p><span class=\"k\">Prova de la paret:</span> fes una sèrie amb l'esquena i el cap tocant una paret. El pes que puguis moure així és el teu pes real.</p>","errors":[{"error":"Gronxar el tronc","why":"És el senyal universal de massa pes al curl.","fix":"La prova de la paret decideix el pes.","cause":"El bíceps és petit i s'esgota de pressa; quan ja no pot, el tronc és el múscul gran més a prop."},{"error":"Els colzes viatgen endavant","why":"Converteix la part alta del recorregut en un descans i treu la tensió just on la volies.","fix":"Colzes enganxats a les costelles.","cause":"A dalt del tot la barra gairebé no pesa si el colze s'avança, i és l'únic lloc on es pot descansar sense soltar-la."},{"error":"No estendre del tot a baix","why":"Perds la part estirada, que és la que més estimula.","fix":"Braç gairebé recte abans de cada repetició.","cause":"L'extensió completa és on el bíceps té menys força, i és la part que es retalla sola."}],"progression_html":"<p>Aquesta posició és volum barat, no el lloc on busques rècords. Mantén un pes que et permeti 15 repeticions netes amb el tronc immòbil i puja només quan les 15 siguin còmodes a les dues sèries.</p>","note_html":"<span class=\"k\">Regla del braç.</span> Si aquest cicle completes Tronc C, aquestes dues sèries són tot el que cal aquí: el bíceps ja té les seves a TC‑01 i TC‑03. Si l'omets, puja a <span class=\"key\">3 sèries</span> i fes el pushdown a Tronc B com a posició oberta. No intentis recuperar tot el volum perdut: el pic d'estímul val més que la suma.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p><span class=\"k\">Pausa curta:</span> en arribar al punt on ja no puges, descansa 15 o 20 segons i continua amb el mateix pes fins a tornar a fallar. Només a l'última sèrie. L'alternativa, els parcials, és al capítol «Tècniques d'intensitat».</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=5NsFLGUf0Fo","title":"How To EZ Bar Curl With Perfect Form (Grow Your Biceps)","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Curl amb manuelles, presa supina","why_equivalent":"Mateixa flexió de colze amb el braç al costat del tronc i cada braç pel seu compte.","adjust":"Menys pes per braç del que sumaria la barra; el palmell es manté supinat des de baix, sense girar-lo a mig recorregut.","short":"mateixa flexió, un braç cada costat"},"contingencia":{"name":"Curl a politja amb corda","why_acceptable":"Tensió constant i presa neutra, la més tolerant si el colze parla.","adjust":"Menys pes del que esperaries: la tensió constant fatiga abans.","short":"tensió constant, presa neutra"},"not_equivalent":["Curl amb barra recta · canell fix","Dominada supina · component d'esquena"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs.</li> <li>Agafa la barra per les <span class=\"key\">corbes interiors</span>, amb presa supina. Si per agafar-la has de separar els colzes del cos, la presa és massa ampla per a tu.</li> <li>Colzes enganxats a les costelles, i comprova que hi continuen tocant amb els braços estesos: el colze es queda quiet mentre l'avantbraç fa tot el moviment.</li> <li>Si el vols encadenar amb el core, prepara l'espai abans: aquestes dues sèries van en superjoc.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (1 s).</span> Flexiona el colze sense que es mogui endavant.</li> <li><span class=\"key\">Contracció (1 s).</span> A dalt, sense arribar al punt on la barra «descansa» sobre el colze avançat.</li> <li><span class=\"key\">Baixada (3 s).</span> Fins a extensió gairebé completa.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el braç estès, sense deixar-hi anar la tensió.</li> </ol>","grip_title":"La presa","tags":{"primary":["Bíceps braquial"],"secondary":["Braquial"],"minor":[],"traits":["Pre-fatigat"]},"registre":{"proposta":"regla"}},{"key":"TA-07b","position":"TA-07","session":"TA","order":9,"name":"Pushdown de tríceps a politja","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Torre de politja alta, barra o corda · no consta a l'inventari M1–M7"},"muscles":"Tríceps braquial, cap lateral i medial","prescription":{"series":"2","reps":"10–15","tempo":"2–3 s ↓","rest":"60 s","rir":"1"},"quick":{"do":["Aquest cicle toca pushdown; si saltes Tronc C, puja a 3 sèries","Politja alta; un pas enrere i tronc lleugerament inclinat endavant","Colzes enganxats als costats abans de la primera repetició","Superjoc amb el core per no allargar la sessió"],"dont":"Inclinar-te endavant per acabar la sèrie amb el pes del cos","feel":"Crema a la part de darrere del braç, sense ajuda del tronc","grip":"Pronada a la barra · neutra a la corda"},"theory_html":"<p><span class=\"k\">Què fa el tríceps, i per què és el múscul gran del braç.</span> Estén el colze, i prou. Té tres caps que fan aquesta mateixa funció, i tots tres junts són més grans que el bíceps: quan es parla de braços gruixuts, la major part del volum ve d'aquí. La diferència entre ells és on s'agafen: <span class=\"k\">un dels tres creua també l'espatlla</span>, i per això només treballa a fons quan el braç va per sobre del cap.</p> <p><span class=\"k\">Què treballa aquest exercici.</span> Amb el colze al costat del cos, els dos caps que només creuen el colze. El tercer el cobreix l'exercici de Tronc C amb el braç amunt: no és repetició, és la part que aquest no toca.</p> <p><span class=\"k\">Què hi fa aquí.</span> El tríceps ja ha treballat a tots els pressos de la sessió. Aquestes dues sèries són volum barat: molt estímul per poca fatiga afegida, amb el múscul calent. La càrrega real la busques a Tronc C, en fred.</p>","cues":["Colzes enganxats als costats: el colze es queda quiet","Només es mou l'avantbraç; el tronc no ajuda","Extensió completa al punt baix, sense bloquejar de cop","Deixa pujar l'avantbraç clarament per sobre de l'horitzontal"],"setup_steps":["Politja alta amb la barra o la corda enganxada.","Un pas enrere, peus a l'amplada dels malucs i tronc <span class=\"key\">lleugerament inclinat endavant</span>: així el cable cau en línia amb l'avantbraç i no t'arrossega.","Colzes enganxats als costats. Si s'obren, l'extensió es converteix en una empenta i entra el pit.","Tria l'eina —barra, corda o barra en V— i anota-la: no mouen el mateix pes i el registre ha de comparar el mateix."],"grip_html":"<p><span class=\"k\">Les tres eines treballen el mateix múscul.</span> El cap lateral i el medial. El cap llarg no el toca cap, perquè per a això el braç ha d'anar per sobre del cap. Tria per canell i per càrrega, no esperant un múscul diferent.</p> <p><span class=\"k\">Corda, presa neutra.</span> Palmells encarats. És la més còmoda per al canell i permet separar les puntes al final del recorregut, cosa que fa notar millor la contracció. A canvi, no deixa moure tant de pes.</p> <p><span class=\"k\">Barra recta, presa pronada.</span> Palmells cap avall. És la més estable i amb la que pots carregar més, a canvi de posar el canell en una posició menys natural. La <span class=\"k\">barra en V</span> queda enmig: presa semiprona, còmoda com la corda i estable com la barra.</p>","execution_steps":["<span class=\"key\">Extensió (1 s).</span> Estén el colze fins que el braç quedi recte. Amb corda, separa les mans al final.","<span class=\"key\">Contracció (1 s).</span> Al punt baix, sense bloquejar de cop.","<span class=\"key\">Retorn (3 s).</span> Deixa pujar l'avantbraç fins que passi clarament l'horitzontal.","<span class=\"key\">Pausa (1 s)</span> amb el tríceps estirat, sense que la pila reposi."],"notice_html":"<p>Crema a la part de darrere del braç, del colze cap amunt. <span class=\"k\">Si el que notes és el pit o el davant de l'espatlla</span>, els colzes s'han obert i has començat a empènyer. <span class=\"k\">Si notes pressió dins del colze</span>, la presa és massa estreta o hi ha massa pes: passa a la corda. <span class=\"k\">Si no notes res</span>, el retorn s'està quedant curt i treballes mig recorregut.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> posa els dits de la mà lliure entre el colze i les costelles en una sèrie de prova. Si el colze es desenganxa durant l'extensió, s'han obert.</p> <p><span class=\"k\">Prova del tronc:</span> si t'has d'inclinar més per acabar la sèrie, baixa la càrrega.</p> <p><span class=\"k\">Prova del rang:</span> al punt alt, l'avantbraç passa clarament l'horitzontal. Si no hi arriba, treballes mig recorregut.</p>","errors":[{"error":"Els colzes s'obren o pugen","why":"El pit i el dorsal comencen a ajudar i el tríceps en fa menys.","fix":"Colzes fixos als costats tota la sèrie.","cause":"Obrir el colze converteix l'extensió en una empenta, i el pit pot amb molt més pes."},{"error":"Empènyer amb el cos","why":"Inclinar-se afegeix el pes del cos a la barra.","fix":"Tronc immòbil; si no, baixa la càrrega.","cause":"És el recurs automàtic quan el tríceps ja no arriba."},{"error":"Rang curt a dalt","why":"La part alta és on el tríceps està més estirat, i és on més estímul hi ha.","fix":"Puja fins que el colze quedi ben flexionat.","cause":"És on el tríceps té menys força, i el retorn es queda curt sol."}],"progression_html":"<p>Volum barat, no el lloc dels rècords. Mantén un pes que et permeti 15 repeticions netes amb el tronc immòbil i puja només quan les 15 siguin còmodes a les dues sèries.</p>","note_html":"<span class=\"k\">Regla del braç.</span> Si aquest cicle completes Tronc C, aquestes dues sèries són tot el que cal aquí: el tríceps ja té les seves a TC‑02 i TC‑04. Si l'omets, puja a <span class=\"key\">3 sèries</span> i fes el curl a Tronc B com a posició oberta.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p><span class=\"k\">Aguantar a baix:</span> a les últimes repeticions, atura't amb el colze estès i mantén la posició uns segons abans de deixar pujar la barra. Només a l'última sèrie. L'alternativa, la pausa curta, és al capítol «Tècniques d'intensitat».</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=w_viR9hVi4A","title":"Tricep Pushdown: Proper Form, Attachments, and the Biggest Mistake Killing Your Gains","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Press tancat al Chest Press (M5), mans juntes","why_equivalent":"Extensió de colze amb esquena recolzada i trajectòria guiada. Amb les mans juntes, el tríceps passa a ser el motor.","adjust":"Càrrega molt més alta que a la politja: busca el mateix RIR, no el mateix pes.","short":"extensió de colze, esquena recolzada"},"contingencia":{"name":"Fons assistit a M2, tronc vertical","why_acceptable":"El tronc vertical desplaça la feina cap al tríceps. Perd l'aïllament i afegeix demanda d'espatlla.","adjust":"Més assistència de la que creus; atura't si l'espatlla parla abans que el braç.","short":"tríceps amb tronc vertical"},"not_equivalent":["Fons entre bancs · espatlla forçada","Press francès amb barra · colze descobert"]},"v22":true,"setup_html":"<ol> <li>Politja alta amb la barra o la corda enganxada.</li> <li>Un pas enrere, peus a l'amplada dels malucs i tronc <span class=\"key\">lleugerament inclinat endavant</span>: així el cable cau en línia amb l'avantbraç i no t'arrossega.</li> <li>Colzes enganxats als costats. Si s'obren, l'extensió es converteix en una empenta i entra el pit.</li> <li>Tria l'eina —barra, corda o barra en V— i anota-la: no mouen el mateix pes i el registre ha de comparar el mateix.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Extensió (1 s).</span> Estén el colze fins que el braç quedi recte. Amb corda, separa les mans al final.</li> <li><span class=\"key\">Contracció (1 s).</span> Al punt baix, sense bloquejar de cop.</li> <li><span class=\"key\">Retorn (3 s).</span> Deixa pujar l'avantbraç fins que passi clarament l'horitzontal.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el tríceps estirat, sense que la pila reposi.</li> </ol>","grip_title":"La presa","tags":{"primary":["Tríceps braquial, cap lateral i medial"],"secondary":[],"minor":[],"traits":["Pre-fatigat"]},"registre":{"opcions":{"titol":"Eina","valors":["Corda","Barra recta","Barra en V"]},"proposta":"regla"}},{"key":"TA-08","position":"TA-08","session":"TA","order":10,"name":"Dead bug","category":"FIX","category_label":"Fix","machine":{"code":null,"label":"A terra, amb una manuella lleugera o un disc a les mans"},"muscles":"Core · antiextensió","prescription":{"series":"2","reps":"6–10 per costat","tempo":"lent i controlat","rest":"45 s","rir":"—"},"quick":{"do":["Estirat de panxa amunt, genolls i malucs a 90°, canyelles paral·leles al terra","Braços estesos cap al sostre, amb una manuella lleugera o un disc","Enganxa la lumbar al terra abans de moure res","Superjoc amb el curl o el pushdown per tancar la sessió"],"dont":"Arquejar la lumbar per guanyar recorregut","feel":"L'abdomen sencer estret, sense notar la lumbar","grip":"Les dues mans al mateix pes, braços verticals"},"theory_html":"<p><span class=\"k\">L'abdomen fa dues coses, i la segona és la important.</span> Pot generar moviment —doblegar el tronc endavant, que és el crunch— i pot <span class=\"k\">impedir que el tronc es mogui</span> quan alguna cosa l'empeny. La segona és la que fa servir el cos tot el dia i la que protegeix la columna. Aquí entrenes una forma concreta d'aquesta feina: impedir que la lumbar s'arquegi quan els braços i les cames s'allunyen.</p> <p><span class=\"k\">Per què és aquí i no és decoratiu.</span> La línia vermella d'aquest bloc és la columna lumbar, i el core és el sistema que la protegeix: quan fa la seva feina, la columna no l'ha de fer.</p> <p><span class=\"k\">Una cosa que val més dir clara.</span> Aquestes sèries fan créixer i enfortir l'abdomen, però que es vegi depèn del greix que el tapa, i això no es decideix al gimnàs. Entrenar-lo més dies no accelera aquella part.</p>","cues":["Braç i cama contraris, lents i alhora","Estén menys la cama abans que perdre la posició de la lumbar","Respira amb normalitat: no aguantis l'aire","La inèrcia aquí no val res: si va ràpid, no compta"],"setup_steps":["Estirat de panxa amunt, amb els genolls i els malucs a 90° i les canyelles paral·leles al terra.","Braços estesos cap al sostre, amb una manuella lleugera o un disc a les mans.","<span class=\"key\">Enganxa la lumbar al terra</span> abans de moure res: aquesta pressió és l'exercici, no una precaució.","Comprova el teu rang amb la mà: posa-la sota la part baixa de l'esquena i mira fins on pots estendre sense deixar de fer-hi pressió."],"grip_html":"<p><span class=\"k\">Un sol pes, dues mans.</span> El disc o la manuella es porta amb les dues mans i els braços verticals, com una columna. No és una càrrega per moure: és una referència que fa més fàcil notar si el tronc cedeix.</p> <p><span class=\"k\">Si encara no tens la posició.</span> Fes-ho sense pes fins que puguis estendre braç i cama amb la lumbar enganxada. Aquí la càrrega és l'últim esglaó, no el primer.</p>","execution_steps":["<span class=\"key\">Extensió (2 s).</span> Baixa alhora un braç cap enrere i la cama contrària cap endavant, tan lluny com puguis sense que la lumbar es desenganxi.","<span class=\"key\">Pausa (1 s)</span> al punt més llunyà que controles, amb l'abdomen estret.","<span class=\"key\">Retorn (2 s)</span> a la posició inicial, sense deixar caure ni el braç ni la cama.","Repeteix amb l'altre parell. Una repetició per costat compta com una."],"notice_html":"<p>L'abdomen sencer estret i sostingut, sense pics: aquesta feina es nota com una tensió constant, no com una crema. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, la lumbar ja s'ha desenganxat i has passat el teu rang. <span class=\"k\">Si el que notes és el davant de la cuixa</span>, has estès la cama més del que l'abdomen pot compensar.</p>","verify_html":"<p><span class=\"k\">Prova de la mà:</span> el punt on deixes de notar pressió sobre la mà que tens sota l'esquena és el teu rang. Rang curt amb la lumbar enganxada val infinitament més que rang llarg sense.</p> <p><span class=\"k\">Prova de la simultaneïtat:</span> braç i cama han d'arribar alhora al punt final. Si un arriba abans, ha anat per inèrcia.</p> <p><span class=\"k\">Prova de la respiració:</span> has de poder dir una frase sencera a mitja repetició.</p>","errors":[{"error":"La lumbar es desenganxa del terra","why":"La sèrie deixa de treballar el core en aquell mateix moment: el que passa a partir d'aquí és la columna treballant sola.","fix":"Estén menys la cama.","cause":"Es busca el recorregut sencer, i quan l'abdomen ja no pot, la pelvis acompanya el braç i la cama."},{"error":"Anar de pressa","why":"La inèrcia fa el moviment i amaga el punt on la lumbar cedeix.","fix":"Dos segons de sortida, un de pausa, dos de tornada. Si no pots, menys repeticions.","cause":"Sense càrrega externa costa de notar el progrés, i la resposta automàtica és afegir velocitat."},{"error":"Aguantar la respiració","why":"El core ha de sostenir amb la respiració en marxa, que és com treballa fora del gimnàs.","fix":"Respira mentre et mous; si no pots, baixa la càrrega de les mans.","cause":"Bloquejar l'aire dona rigidesa de franc i fa la posició més fàcil de mantenir."}],"progression_html":"<p>10 repeticions netes per costat a les dues sèries amb el rang complet i la lumbar enganxada → més càrrega a les mans i tornada a 6. Allargar la pausa a dos segons és l'esglaó intermedi. Mai a costa de perdre la posició de la lumbar.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=bxn9FBrt4-A","title":"How to do a Dead Bug | Proper Form & Technique | NASM","confidence":"exacta","note":"Font: National Academy of Sports Medicine.","alt_url":"https://www.youtube.com/watch?v=s6coxb732BA","alt_title":"How To Do A Forearm Plank | Exercise Demonstration Video and Guide"},"alternatives":{"principal":{"name":"Planca frontal activa","why_equivalent":"Mateixa antiextensió, isomètrica en lloc de dinàmica.","adjust":"Per temps: 20–40 s. Empeny el terra i estreny el gluti; si el cul puja, la sèrie s'ha acabat.","short":"mateixa funció, isomètrica"},"contingencia":{"name":"Roda abdominal des de genolls","why_acceptable":"Antiextensió dinàmica molt més exigent.","adjust":"Rang molt més curt del que sembla; atura't just abans que la lumbar cedeixi.","short":"mateixa funció, més exigent"},"not_equivalent":["Abdominals amb flexió llastada · fora del patró antiextensió","Hiperextensió lumbar · flexió no controlada"]},"v22":true,"setup_html":"<ol> <li>Estirat de panxa amunt, amb els genolls i els malucs a 90° i les canyelles paral·leles al terra.</li> <li>Braços estesos cap al sostre, amb una manuella lleugera o un disc a les mans.</li> <li><span class=\"key\">Enganxa la lumbar al terra</span> abans de moure res: aquesta pressió és l'exercici, no una precaució.</li> <li>Comprova el teu rang amb la mà: posa-la sota la part baixa de l'esquena i mira fins on pots estendre sense deixar de fer-hi pressió.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Extensió (2 s).</span> Baixa alhora un braç cap enrere i la cama contrària cap endavant, tan lluny com puguis sense que la lumbar es desenganxi.</li> <li><span class=\"key\">Pausa (1 s)</span> al punt més llunyà que controles, amb l'abdomen estret.</li> <li><span class=\"key\">Retorn (2 s)</span> a la posició inicial, sense deixar caure ni el braç ni la cama.</li> <li>Repeteix amb l'altre parell. Una repetició per costat compta com una.</li> </ol>","grip_title":"La presa","tags":{"primary":["Recte abdominal","Transvers"],"secondary":[],"minor":[],"traits":["Antiextensió"]},"registre":{"opcions":{"titol":"Material","valors":["Manuella","Disc"]},"proposta":"regla"}},{"key":"C-01","position":"C-01","session":"C","order":1,"name":"Leg Press, peus al centre","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Leg Press · no consta a l'inventari M1–M7"},"muscles":"Quàdriceps · gluti major","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2–3 min","rir":"2"},"quick":{"do":["Esquena i cul enganxats al respatller: és la condició de tot l'exercici","Peus a l'amplada dels muscles, al centre de la plataforma, puntes una mica obertes","Mans als mànecs laterals, tibant-los: ajuden a fixar el maluc al seient","Si el respatller és regulable, més tombat permet baixar més sense moure la pelvis"],"dont":"Baixar tant que el cul es desenganxa i la lumbar es carrega","feel":"Crema profunda a la cara anterior de la cuixa","grip":"Peus al centre de la plataforma; pressió entre taló i base dels dits"},"grip_title":"Els peus i la col·locació","theory_html":"<p><span class=\"k\">Què fa el quàdriceps.</span> Estén el genoll, i prou. Són quatre músculs al davant de la cuixa que fan aquesta mateixa feina; l'únic matís que necessites és que <span class=\"k\">un dels quatre creua també el maluc</span>, i per això no treballa igual segons com tinguis la cadera. És el múscul que dona volum a la cuixa vista de front i el que et sosté cada vegada que baixes una escala.</p> <p><span class=\"k\">Per què la premsa i no l'esquat.</span> És l'exercici amb més càrrega del programa i la plataforma et decideix la trajectòria: pots empènyer fort sense administrar l'equilibri i, sobretot, <span class=\"k\">sense una barra sobre l'esquena</span>. En un bloc on la columna lumbar és la línia vermella, aquest és el motiu.</p> <p><span class=\"k\">On acaba la baixada, de veritat.</span> No la marca la màquina ni la paral·lela de la qual parla tothom: la marca el moment en què <span class=\"k\">la pelvis comença a rodar i el cul es desenganxa del seient</span>. A partir d'aquell punt, el que es doblega és la lumbar amb tot el pes de la plataforma a sobre. Una profunditat menor amb la pelvis quieta val més que una de gran amb la pelvis rodant.</p>","cues":["Genolls en la mateixa direcció que apunten els peus","Atura la baixada just abans que la pelvis es mogui","El taló no s'aixeca mai de la plataforma","Extensió còmoda, sense impacte","Pausa d'un segon a baix, sense deixar que la plataforma descansi sobre tu"],"setup_steps":["Esquena i cul <span class=\"key\">completament enganxats</span> al respatller: és el punt fix de tot l'exercici. Si la màquina permet inclinar-lo, un respatller una mica més tombat et deixa baixar més abans que la pelvis vulgui rodar.","Peus a l'amplada dels muscles, <span class=\"key\">al centre de la plataforma</span>, amb les puntes lleugerament obertes perquè el genoll pugui seguir la direcció del peu.","Pressió repartida entre el taló i la base dels dits. Si tot el pes se'n va als dits, el taló s'acabarà aixecant i perdràs la base.","Mans als mànecs laterals i <span class=\"key\">tiba'n</span>: aquesta tracció és el que manté el maluc clavat al seient quan la càrrega puja. Cap recolzat, sense mirar-te els genolls."],"grip_html":"<p><span class=\"k\">Alçada dels peus.</span> Al centre de la plataforma, l'angle del genoll és més tancat i el quàdriceps porta la feina. Deu centímetres més amunt, la feina es desplaça una mica cap al gluti i l'isquiotibial, i és la variant C‑01b.</p> <p><span class=\"k\">Amplada i obertura.</span> A l'amplada dels muscles, amb les puntes obertes uns 15–20°. El genoll ha de viatjar en la mateixa direcció que apunta el peu: si el peu va recte i el genoll cap endins, l'articulació treballa torçada.</p> <p><span class=\"k\">Pressió del peu.</span> Repartida entre el taló i la base dels dits, mai només als dits. El taló que s'aixeca és el senyal que has baixat massa o que els peus estan massa avall.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Deixa venir la plataforma cap a tu amb els genolls en la direcció dels peus.","<span class=\"key\">Punt baix.</span> Fins que el genoll faci uns 90° o una mica menys, i sempre abans que la pelvis es mogui.","<span class=\"key\">Pausa (1 s).</span> Sense rebotar i sense deixar que la plataforma reposi sobre tu.","<span class=\"key\">Empenta (1 s).</span> Empeny amb tota la planta i fins a una extensió còmoda, sense impacte."],"notice_html":"<p>Crema profunda al davant de la cuixa i al gluti. <span class=\"k\">Si notes la part baixa de l'esquena</span>, has passat el punt on la pelvis roda: aquella és la teva profunditat, encara que sembli curta. <span class=\"k\">Si notes el genoll per davant</span>, revisa que els peus no estiguin massa avall. <span class=\"k\">Si les cames no cremen i acabes ofegat</span>, la sèrie ha anat massa ràpida: el tempo és el que hi posa la tensió.</p>","verify_html":"<p><span class=\"k\">Prova del seient:</span> grava't de costat o que algú t'ho miri. On el cul es desenganxa del respatller és la teva profunditat màxima. Memoritza-la i no la negociïs per pujar pes.</p> <p><span class=\"k\">Prova del segon a baix:</span> atura't un segon complet. Si allà el cul comença a rodar o no pots reprendre l'empenta, el pes és excessiu.</p> <p><span class=\"k\">Prova dels genolls:</span> si es tanquen cap endins abans de l'última sèrie, el pes és massa alt per al control d'avui.</p>","errors":[{"error":"El cul es desenganxa del seient","why":"La pelvis ha rodat i la lumbar queda doblegada amb tot el pes de la plataforma a sobre.","fix":"Redueix el rang fins al punt on la pelvis encara no es mou, i memoritza'l.","cause":"Es busca la profunditat que es veu fer a altres persones, sense que la teva pelvis tingui el mateix rang."},{"error":"Bloquejar els genolls a dalt","why":"Amb aquesta càrrega, el pes passa directament a l'articulació i la tensió del múscul s'apaga.","fix":"Atura't just abans de l'extensió completa, sempre.","cause":"És l'únic lloc de la sèrie on es pot descansar sense treure el pes."},{"error":"Genolls que es tanquen cap endins","why":"Apareix a les últimes repeticions, quan el gluti mitjà es cansa, i posa el genoll en una posició torçada.","fix":"Pensa a empènyer els genolls cap enfora durant tota la pujada.","cause":"El gluti mitjà es cansa abans que el quàdriceps, i el genoll cau cap on menys resistència troba."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb RIR 2 i sense que la pelvis es mogui → puja pes i torna a 8. El rang no es retalla mai per posar-hi un disc més.</p>","note_html":"","extra_sections":[],"figure":"legpress_feet","video":{"url":"https://www.youtube.com/watch?v=K5n2vg3oZa4","title":"How to PROPERLY Leg Press (FIX YOUR FORM NOW)","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Hack Squat PureStrength","why_equivalent":"Mateix patró de premsa bilateral, esquena recolzada i trajectòria guiada. Quàdriceps dominant, sense demanda d'erectors.","adjust":"El pes no es transfereix: comença un esglaó per sota. RIR igual.","short":"mateixa premsa guiada"},"contingencia":{"name":"Esquat búlgar amb manuelles","why_acceptable":"Conserva la flexió de maluc i genoll amb càrrega, amb el pes als costats. Perd la guia i la càrrega absoluta.","adjust":"Menys estable: RIR 3. Una sèrie per cama compta com a sèrie.","short":"pes als costats"},"not_equivalent":["Esquat amb barra · barra a les espatlles","Pes mort · càrrega en flexió"]},"v22":true,"setup_html":"<ol> <li>Esquena i cul <span class=\"key\">completament enganxats</span> al respatller: és el punt fix de tot l'exercici. Si la màquina permet inclinar-lo, un respatller una mica més tombat et deixa baixar més abans que la pelvis vulgui rodar.</li> <li>Peus a l'amplada dels muscles, <span class=\"key\">al centre de la plataforma</span>, amb les puntes lleugerament obertes perquè el genoll pugui seguir la direcció del peu.</li> <li>Pressió repartida entre el taló i la base dels dits. Si tot el pes se'n va als dits, el taló s'acabarà aixecant i perdràs la base.</li> <li>Mans als mànecs laterals i <span class=\"key\">tiba'n</span>: aquesta tracció és el que manté el maluc clavat al seient quan la càrrega puja. Cap recolzat, sense mirar-te els genolls.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Deixa venir la plataforma cap a tu amb els genolls en la direcció dels peus.</li> <li><span class=\"key\">Punt baix.</span> Fins que el genoll faci uns 90° o una mica menys, i sempre abans que la pelvis es mogui.</li> <li><span class=\"key\">Pausa (1 s).</span> Sense rebotar i sense deixar que la plataforma reposi sobre tu.</li> <li><span class=\"key\">Empenta (1 s).</span> Empeny amb tota la planta i fins a una extensió còmoda, sense impacte.</li> </ol>","tags":{"primary":["Quàdriceps"],"secondary":["Gluti major"],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"C-01b","position":"C-01","session":"C","order":2,"name":"Leg Press, peus alts","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Leg Press · no consta a l'inventari M1–M7"},"muscles":"Quàdriceps · gluti major · isquiotibials","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2–3 min","rir":"2"},"quick":{"do":["Peus 10–15 cm més amunt del centre i una mica més amples","Comprova que el taló queda sencer sobre la plataforma","Esquena i cul enganxats al respatller","Compara sempre peus alts amb peus alts: el pes sol ser menor"],"dont":"Intentar igualar la profunditat de la variant centrada","feel":"Cuixa davantera, gluti i un tibar clar darrere la cuixa al punt baix","grip":"Peus a la part alta de la plataforma; pressió cap al taló"},"grip_title":"Els peus i la col·locació","theory_html":"<p><span class=\"k\">El mite dels peus alts.</span> Circula molt la idea que pujant els peus la premsa passa a ser un exercici de gluti o d'isquiotibial. És una mitja veritat: <span class=\"k\">la premsa és un exercici de quàdriceps</span>, hi posis els peus on hi posis. El que fas pujant-los és obrir l'angle del maluc i tancar menys el del genoll, de manera que el gluti i la part posterior de la cuixa hi participen una mica més. Una mica. El gluti el treballes de debò al hip thrust, i els isquios al Back Extension.</p> <p><span class=\"k\">Què n'has d'esperar.</span> Rang més curt, perquè amb el maluc més tancat la pelvis vol rodar abans, i una mica menys de pes. Totes dues coses són normals i no són un retrocés.</p> <p><span class=\"k\">Per què val la pena alternar-la.</span> Perquè canviar l'angle del maluc reparteix la feina entre els quatre caps del quàdriceps d'una manera diferent. Alterna-la amb la posició centrada per miniblocs de 3–4 cicles, mai dins del mateix, perquè cada orientació tingui temps de progressar.</p>","cues":["Empeny amb el taló, no amb la punta","Atura abans que la pelvis roti: aquí passa abans que amb els peus al centre","Genolls en la direcció dels peus","No bloquegis el genoll a dalt","Pausa d'un segon a baix, sense rebotar"],"setup_steps":["Esquena i cul completament enganxats al respatller, com a la posició centrada.","Peus <span class=\"key\">10–15 cm més amunt</span> del centre de la plataforma i una mica més amples que les espatlles.","Comprova que el <span class=\"key\">taló queda sencer</span> sobre la plataforma. Si sobresurt per dalt, has pujat massa i acabaràs empenyent amb els dits.","Puntes lleugerament obertes i mans als mànecs laterals, tibant-los per fixar el maluc."],"grip_html":"<p><span class=\"k\">Quant amunt.</span> Entre deu i quinze centímetres per sobre del centre. Més amunt no és millor: el taló perd superfície i l'empenta se'n va als dits.</p> <p><span class=\"k\">Per què la pressió va al taló.</span> Amb els peus alts, pujar sobre els dits torna la feina al quàdriceps i anul·la el motiu de la variant. Imagina que empenys la plataforma amb el taló sol.</p> <p><span class=\"k\">Amplada.</span> Una mica més ample que a la variant centrada, amb les puntes obertes. Dona espai al maluc per flexionar-se sense que la pelvis roti tan aviat.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Deixa venir la plataforma amb els genolls en la direcció dels peus.","<span class=\"key\">Punt baix.</span> Arriba abans que amb els peus al centre: atura't just abans que la pelvis vulgui rodar.","<span class=\"key\">Pausa (1 s).</span> Sense rebotar ni deixar que la plataforma descansi sobre tu.","<span class=\"key\">Empenta (1 s).</span> Empeny amb el taló i fins a una extensió còmoda, sense impacte."],"notice_html":"<p>Feina repartida entre quàdriceps, gluti i part posterior de la cuixa, amb un tibar clar darrere la cuixa al punt baix: això últim és correcte i ve de l'angle del maluc. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, la pelvis ja ha rodat. <span class=\"k\">Si només notes el davant de la cuixa</span>, els peus no són prou amunt i estàs fent la variant centrada sense saber-ho.</p>","verify_html":"<p><span class=\"k\">Prova dels peus:</span> col·locat i sense pes, el taló ha de quedar sencer sobre la plataforma.</p> <p><span class=\"k\">Prova del segon a baix:</span> si el cul es desenganxa durant aquell segon, has baixat més del compte o el pes és excessiu.</p> <p><span class=\"k\">Prova del registre:</span> compara aquesta variant només amb ella mateixa. Si la compares amb la centrada, sempre semblarà un retrocés.</p>","errors":[{"error":"Intentar igualar la profunditat de la posició centrada","why":"L'angle de maluc més tancat fa rotar la pelvis abans, i forçar el mateix rang la desenganxa del seient.","fix":"Atura la baixada quan la pelvis vulgui moure's, encara que sigui més amunt del que estàs acostumat.","cause":"Es pren com a referència una profunditat que amb els peus alts ja no és assolible."},{"error":"Empènyer amb la punta del peu","why":"Torna la feina al quàdriceps i anul·la el motiu de fer la variant.","fix":"Pressió al taló durant tota l'empenta.","cause":"Amb els peus a la part alta, el taló queda a la vora i n'hi ha prou amb lliscar un dit."},{"error":"Bloquejar els genolls a dalt","why":"El pes passa a l'articulació i la tensió del múscul s'apaga.","fix":"Atura't just abans de l'extensió completa.","cause":"És l'únic punt de la sèrie on es pot descansar sense treure el pes."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb RIR 2 i sense que la pelvis es mogui → puja pes i torna a 8.</p>","note_html":"","extra_sections":[],"figure":"legpress_feet","video":{"url":"https://www.youtube.com/watch?v=K5n2vg3oZa4","title":"How to PROPERLY Leg Press (FIX YOUR FORM NOW)","confidence":"aproximada","note":"Mateix vídeo que C‑01: no mostra específicament la variant amb peus alts."},"alternatives":{"principal":{"name":"Hack Squat, peus avançats","why_equivalent":"Mateix patró de premsa amb l'angle de maluc més obert i més participació de gluti i isquiotibials.","adjust":"Menys pes que amb els peus al centre; mateix RIR.","short":"maluc obert"},"contingencia":{"name":"Esquat búlgar","why_acceptable":"Manté l'èmfasi posterior amb flexió de maluc pronunciada. Perd la trajectòria guiada.","adjust":"RIR 3; una sèrie per cama compta com a sèrie.","short":"isquio i gluti"},"not_equivalent":["Pes mort romanès amb barra · càrrega en flexió","Esquat amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Esquena i cul completament enganxats al respatller, com a la posició centrada.</li> <li>Peus <span class=\"key\">10–15 cm més amunt</span> del centre de la plataforma i una mica més amples que les espatlles.</li> <li>Comprova que el <span class=\"key\">taló queda sencer</span> sobre la plataforma. Si sobresurt per dalt, has pujat massa i acabaràs empenyent amb els dits.</li> <li>Puntes lleugerament obertes i mans als mànecs laterals, tibant-los per fixar el maluc.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Deixa venir la plataforma amb els genolls en la direcció dels peus.</li> <li><span class=\"key\">Punt baix.</span> Arriba abans que amb els peus al centre: atura't just abans que la pelvis vulgui rodar.</li> <li><span class=\"key\">Pausa (1 s).</span> Sense rebotar ni deixar que la plataforma descansi sobre tu.</li> <li><span class=\"key\">Empenta (1 s).</span> Empeny amb el taló i fins a una extensió còmoda, sense impacte.</li> </ol>","tags":{"primary":["Quàdriceps"],"secondary":["Gluti major"],"minor":["Isquiotibials"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"C-01c","position":"C-01","session":"C","order":3,"name":"Hack Squat PureStrength","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Hack Squat PureStrength (Technogym), de discos · no consta a l'inventari M1–M7"},"muscles":"Quàdriceps · gluti major","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"2–3 min","rir":"2"},"quick":{"do":["Esquena sencera al respatller i muscles sota els coixinets","Peus a l'amplada dels muscles, a la meitat de la plataforma, oberts 15–20°","Desbloqueja les palanques amb les cames gairebé esteses","Un sol canvi de col·locació per sessió, i apunta el que funciona"],"dont":"Separar l'esquena o el cul del respatller per baixar més","feel":"Crema profunda al davant de la cuixa i estirament al punt baix","grip":"Peus al mig de la plataforma; pes entre taló i planta"},"grip_title":"Els peus i la col·locació","theory_html":"<p><span class=\"k\">Per què val la pena aprendre-la.</span> És l'exercici de quàdriceps amb més potencial de càrrega del programa, i la màquina et permet baixar més que amb pes lliure sense haver d'administrar l'equilibri. Això importa perquè la part baixa del recorregut, amb el <span class=\"k\">quàdriceps estirat sota càrrega</span>, és on hi ha més estímul: és el moment que fa créixer el múscul, no el de les cames gairebé esteses.</p> <p><span class=\"k\">Per què et costa, exactament.</span> No és manca de força. La Hack Squat és exigent en una sola cosa, <span class=\"k\">la col·locació dels peus</span>: uns centímetres amunt o avall canvien quins músculs treballen i si el genoll o la lumbar acaben patint. La resta del moviment és senzill.</p> <p><span class=\"k\">Com trobar la teva posició.</span> Comença al centre de la plataforma. Si els talons s'aixequen o el genoll es queixa, puja els peus un pam. Si no notes gens el quàdriceps, baixa'ls mig pam. <span class=\"k\">Un sol canvi cada cop</span>, i apunta el que funciona.</p>","cues":["Genolls en la direcció dels peus, sobretot en pujar","Baixa fins on el cul no es desenganxi del respatller","Pes repartit entre taló i planta, mai als dits","Pausa d'un segon a baix, sense rebotar","Extensió còmoda, sense impacte"],"setup_steps":["Recolza l'esquena sencera al respatller i els muscles sota els coixinets. Lumbar, esquena alta i cap en contacte: <span class=\"key\">no se'n separen en cap moment</span>.","Peus a l'amplada dels muscles, a la <span class=\"key\">meitat de la plataforma</span>, oberts uns 15–20°.","Pes repartit entre el taló i la planta. Si se't va als dits, els peus estan massa avall.","Desbloqueja les palanques de seguretat amb les cames gairebé esteses, no bloquejades del tot."],"grip_html":"<p><span class=\"k\">Els peus decideixen l'exercici.</span> Més amunt a la plataforma, el maluc es tanca més i el genoll pateix menys; més avall, el genoll avança i el quàdriceps treballa més curt, que és quan sol aparèixer la molèstia.</p> <p><span class=\"k\">Amplada i obertura.</span> A l'amplada dels muscles i amb les puntes obertes 15–20°, perquè el genoll pugui seguir la direcció del peu durant tota la baixada.</p> <p><span class=\"k\">Mai res sota els talons.</span> Si el taló s'aixeca, la solució és pujar els peus un pam, no posar-hi un disc a sota: en aquesta màquina, aixecar el taló amb un suport improvisat desplaça el pes a una posició que no controles.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Doblega genolls i malucs alhora, deixant baixar el carro. Els genolls viatgen en la direcció dels peus.","<span class=\"key\">Punt baix.</span> Fins que les cuixes quedin una mica per sota de la paral·lela, o fins on puguis <span class=\"key\">sense que el cul es desenganxi del respatller</span>. Aquest és el límit real, no el que marqui la màquina.","<span class=\"key\">Pausa (1 s).</span> Sense rebotar. Aquí el quàdriceps està estirat i tens.","<span class=\"key\">Pujada (1 s).</span> Empeny amb tota la planta, com si volguessis allunyar la plataforma de tu. Extensió còmoda, sense impacte."],"notice_html":"<p>Crema profunda al davant de la cuixa que s'acumula sèrie rere sèrie, i estirament al punt baix. <span class=\"k\">Si notes pressió a la part baixa de l'esquena</span>, has passat el punt on el cul es desenganxa. <span class=\"k\">Si notes el genoll punxant</span>, els peus estan massa avall.</p>","verify_html":"<p><span class=\"k\">Prova del respatller:</span> atura la baixada un dit abans del punt on notes que la pelvis es mou. Encara que sigui menys profunditat de la que voldries, aquesta és la teva.</p> <p><span class=\"k\">Prova dels talons:</span> han de mantenir el contacte amb la plataforma de dalt a baix.</p> <p><span class=\"k\">Prova de l'esforç:</span> si pots parlar còmodament a l'última sèrie, el pes és insuficient. Aquest hauria de ser l'exercici més dur de la sessió.</p>","errors":[{"error":"Els talons s'aixequen de la plataforma","why":"Vol dir que els peus estan massa avall o massa junts, o que el turmell no té prou mobilitat, i el pes passa als dits.","fix":"Puja els peus un pam i torna a provar. Mai posis res sota els talons en aquesta màquina.","cause":"Amb els peus avall, el taló ha d'aixecar-se per completar la baixada."},{"error":"Els genolls es tanquen cap endins en pujar","why":"Sol aparèixer a les últimes repeticions, quan el gluti mitjà es cansa.","fix":"Pensa a separar el terra amb els peus durant tota la pujada. Si persisteix, baixa el pes.","cause":"El gluti mitjà es cansa abans que el quàdriceps i el genoll cau quan deixa de sostenir-lo."},{"error":"Separar-se del respatller per baixar més","why":"La pelvis roda i la lumbar queda doblegada amb tot el carro a sobre.","fix":"El rang acaba on acaba el contacte.","cause":"Es busca la profunditat que es veu fer a altres persones."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb RIR 2 i sense que la pelvis es mogui → puja el mínim increment i torna a 8. Si per posar-hi un disc més has de retallar rang, no has progressat.</p>","note_html":"És la variant rotatòria de la posició C‑01, no un exercici obligatori. Incorpora-la quan la col·locació dels peus et surti sola; mentrestant, la premsa fa la mateixa feina sense el problema tècnic.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=eGqpU0oXx3U","title":"Technogym Pure Strength Plate Loaded | Hack Squat","confidence":"exacta","note":"Mateixa màquina Technogym PureStrength."},"alternatives":{"principal":{"name":"Leg Press, peus al centre","why_equivalent":"Mateix patró de premsa bilateral amb esquena recolzada i trajectòria guiada.","adjust":"El pes tampoc es transfereix: ajusta't a la sensació, no al número.","short":"mateixa premsa bilateral"},"contingencia":{"name":"Esquat búlgar amb manuelles","why_acceptable":"Conserva la flexió de maluc i genoll amb càrrega. Perd la guia de les dues màquines.","adjust":"RIR 3; una sèrie per cama compta com a sèrie.","short":"flexió carregada, sense guia"},"not_equivalent":["Esquat amb barra · barra a les espatlles","Pes mort · càrrega en flexió"]},"v22":true,"setup_html":"<ol> <li>Recolza l'esquena sencera al respatller i els muscles sota els coixinets. Lumbar, esquena alta i cap en contacte: <span class=\"key\">no se'n separen en cap moment</span>.</li> <li>Peus a l'amplada dels muscles, a la <span class=\"key\">meitat de la plataforma</span>, oberts uns 15–20°.</li> <li>Pes repartit entre el taló i la planta. Si se't va als dits, els peus estan massa avall.</li> <li>Desbloqueja les palanques de seguretat amb les cames gairebé esteses, no bloquejades del tot.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Doblega genolls i malucs alhora, deixant baixar el carro. Els genolls viatgen en la direcció dels peus.</li> <li><span class=\"key\">Punt baix.</span> Fins que les cuixes quedin una mica per sota de la paral·lela, o fins on puguis <span class=\"key\">sense que el cul es desenganxi del respatller</span>. Aquest és el límit real, no el que marqui la màquina.</li> <li><span class=\"key\">Pausa (1 s).</span> Sense rebotar. Aquí el quàdriceps està estirat i tens.</li> <li><span class=\"key\">Pujada (1 s).</span> Empeny amb tota la planta, com si volguessis allunyar la plataforma de tu. Extensió còmoda, sense impacte.</li> </ol>","tags":{"primary":["Quàdriceps"],"secondary":["Gluti major"],"minor":[],"traits":["Variant exigent"]},"registre":{"proposta":"doble"}},{"key":"C-02","position":"C-02","session":"C","order":4,"name":"Back Extension 45°","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Banc de Back Extension 45° · no consta a l'inventari M1–M7"},"muscles":"Isquiotibials · gluti major · erectors","prescription":{"series":"3 + 1","reps":"8–12","tempo":"3‑1‑1‑0","rest":"2 min","rir":"2"},"quick":{"do":["Coixí just sota l'os del maluc, mai a la panxa","Talons ben encaixats sota els suports, genoll sense bloquejar","Braços creuats al pit; el disc arriba quan dominis el moviment","Columna recta del cap al coccix abans de començar"],"dont":"Pujar per sobre de la línia del cos i comprimir la lumbar","feel":"Estirament a la part posterior de la cuixa","grip":"Braços creuats al pit, o abraçant un disc"},"grip_title":"La col·locació i la càrrega","theory_html":"<p><span class=\"k\">Què fa l'isquiotibial, i per què fa falta aquest exercici.</span> Té dues feines: <span class=\"k\">doblegar el genoll</span> i <span class=\"k\">estendre el maluc</span>, és a dir, portar el tronc de doblegat a dret. Aquesta segona és la que es fa aquí, i és també la que treballa el múscul <span class=\"k\">estirat</span>, que és la posició en què més creix. El cúrl femoral cobreix la primera. Sense aquest exercici, els isquios passarien tot el bloc sense treballar mai estirats.</p> <p><span class=\"k\">Per què substitueix el pes mort romanès.</span> Fa la mateixa frontissa —el maluc va enrere i el tronc baixa amb l'esquena rígida— però sense cap barra comprimint la columna. És el que et permet mantenir la línia vermella lumbar sense renunciar a aquest treball.</p> <p><span class=\"k\">Què hi guanyes fora del gimnàs.</span> L'isquiotibial és un dels motors de cada gambada. Les lesions més freqüents de qui corre són al genoll, al tendó d'Aquil·les i a la canyella, però un isquiotibial fort i acostumat a treballar estirat és la part del programa que més directament el prepara per a la cursa, i per això, quan cal retallar la sessió, no són les que cauen.</p>","cues":["Dobla només pel maluc: l'esquena no canvia de forma","Baixa fins a notar estirament clar a la cuixa posterior","Puja estrenyent el gluti fins a la línia recta del cos","Tres segons de baixada, sempre","Mirada al terra un parell de metres endavant"],"setup_steps":["Ajusta el coixí perquè la <span class=\"key\">vora superior quedi just sota l'os del maluc</span>. Si et prem la panxa, el maluc no pot girar i qui es doblega és la columna, que és el contrari del que busques.","Talons ben encaixats sota els suports i cames esteses, sense bloquejar el genoll: són l'ancoratge que et permet baixar sense caure.","Braços creuats al pit. El disc entra més endavant, quan el moviment ja et surti net.","Columna recta del cap al coccix, amb la mirada al terra un parell de metres endavant: mirar amunt et trenca la línia."],"grip_html":"<p><span class=\"k\">Braços creuats al pit.</span> Cada mà a l'espatlla contrària. És la posició de partida i la que et deixa concentrar-te en la frontissa.</p> <p><span class=\"k\">Mans a les temples.</span> El pes del tronc queda més lluny del maluc i l'exercici es fa més dur sense afegir cap disc. És el primer esglaó de progressió.</p> <p><span class=\"k\">Amb disc.</span> Abraçat contra el pit, començant per 5 kg. Com més amunt el portis, més dura es fa la repetició: si vols pujar la dificultat sense canviar de disc, puja'l cap a l'estèrnum.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Deixa caure el tronc doblegant <span class=\"key\">només pel maluc</span>. L'esquena manté exactament la mateixa forma.","<span class=\"key\">Punt baix.</span> Fins a notar un estirament clar a la part posterior de la cuixa. Sol ser cap als 70–90°, però el que mana és l'estirament, no els graus.","<span class=\"key\">Pausa (1 s).</span> Aquí és on l'isquiotibial fa la feina que cap altre exercici del programa li demana.","<span class=\"key\">Pujada (1 s).</span> Estreny el gluti i atura't <span class=\"key\">quan el cos estigui recte</span>, en línia amb les cames."],"notice_html":"<p>Estirament i tensió a la part posterior de la cuixa a la baixada, i el gluti estrenyent a la pujada. La part baixa de l'esquena s'ha de notar <span class=\"k\">sostenint la posició</span>, no movent-se. <span class=\"k\">Si no notes l'estirament</span>, el coixí és massa amunt o estàs doblegant l'esquena en lloc del maluc. <span class=\"k\">Si l'endemà el que et fa mal és la lumbar i no els isquios</span>, has fet l'exercici amb l'esquena.</p>","verify_html":"<p><span class=\"k\">Prova del perfil:</span> a dalt, algú que et miri de costat ha de veure una fusta, no un arc. Si puges per sobre de la línia del cos, la feina ha passat a les vèrtebres lumbars.</p> <p><span class=\"k\">Prova de l'estirament:</span> si no el notes a la cuixa posterior durant la baixada, el coixí està massa amunt o estàs doblegant l'esquena.</p> <p><span class=\"k\">Prova dels tres segons:</span> la baixada dura tres segons comptats a les quatre sèries. Si a l'última se'n fan un, el disc és massa.</p>","errors":[{"error":"Arquejar l'esquena per baixar més","why":"La frontissa deixa de girar pel maluc i el moviment el fa la columna.","fix":"Baixa menys. El rang correcte és el que pots fer amb l'esquena rígida.","cause":"Doblegar l'esquena és l'única manera de baixar més quan el maluc ja ha arribat al seu rang."},{"error":"El coixí massa amunt","why":"Si et prem la panxa en lloc del maluc, la frontissa no pot girar.","fix":"Baixa'l fins que la vora quedi just sota l'os del maluc.","cause":"El coixí es queda on el va deixar l'últim que l'ha fet servir."},{"error":"Fer el moviment ràpid","why":"L'estímul d'aquest exercici és l'estirament sota tensió, i la inèrcia el destrueix.","fix":"Tres segons per baixar, sempre.","cause":"Amb pes al pit la baixada lenta costa, i escurçar-la és la manera automàtica d'acabar la sèrie."}],"progression_html":"<p>Primer amb el pes del cos, fins a 12 repeticions netes i amb tempo controlat a totes les sèries. Llavors mans a les temples i, més endavant, un disc de 5 kg al pit tornant a 8. La progressió aquí ha de ser lenta: és un exercici on la tècnica es degrada abans que la força.</p>","note_html":"Si algun dia has de retallar la sessió, aquest no és l'exercici que cau. És l'únic del programa que carrega l'isquiotibial estirat. La quarta sèrie és condicional: només si no hi ha cap molèstia lumbar, la tècnica s'ha mantingut igual a les tres primeres, el running està estable i la sessió va per sota dels 80 minuts.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=hF8RTPYrK6I","title":"45 Degree Back Extension - Proper technique","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Good morning amb manuella al pit","why_equivalent":"Mateixa flexió de maluc amb columna neutra i isquiotibials de motor.","adjust":"Pes molt lleuger; comença sense càrrega fins a dominar la posició de la columna.","short":"mateixa frontissa, columna neutra"},"contingencia":{"name":"Pes mort romanès amb manuelles, rang curt","why_acceptable":"Manté la frontissa amb càrrega a les mans, sense el suport del banc.","adjust":"RIR 3 i rang reduït fins que la lumbar es mantingui neutra tota l'estona.","short":"frontissa, càrrega a les mans"},"not_equivalent":["Pes mort romanès amb barra pesada · càrrega en flexió alta","Hiperextensió ràpida · tècnica degradada per velocitat"]},"v22":true,"setup_html":"<ol> <li>Ajusta el coixí perquè la <span class=\"key\">vora superior quedi just sota l'os del maluc</span>. Si et prem la panxa, el maluc no pot girar i qui es doblega és la columna, que és el contrari del que busques.</li> <li>Talons ben encaixats sota els suports i cames esteses, sense bloquejar el genoll: són l'ancoratge que et permet baixar sense caure.</li> <li>Braços creuats al pit. El disc entra més endavant, quan el moviment ja et surti net.</li> <li>Columna recta del cap al coccix, amb la mirada al terra un parell de metres endavant: mirar amunt et trenca la línia.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Deixa caure el tronc doblegant <span class=\"key\">només pel maluc</span>. L'esquena manté exactament la mateixa forma.</li> <li><span class=\"key\">Punt baix.</span> Fins a notar un estirament clar a la part posterior de la cuixa. Sol ser cap als 70–90°, però el que mana és l'estirament, no els graus.</li> <li><span class=\"key\">Pausa (1 s).</span> Aquí és on l'isquiotibial fa la feina que cap altre exercici del programa li demana.</li> <li><span class=\"key\">Pujada (1 s).</span> Estreny el gluti i atura't <span class=\"key\">quan el cos estigui recte</span>, en línia amb les cames.</li> </ol>","tags":{"primary":["Isquiotibials"],"secondary":["Gluti major"],"minor":["Erectors"],"traits":[]},"registre":{"proposta":"regla"}},{"key":"C-02b","position":"C-02","session":"C","order":5,"name":"Romanian Deadlift amb barra","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Barra lliure · no consta a l'inventari M1–M7"},"muscles":"Isquiotibials · gluti major · erectors","prescription":{"series":"2–3","reps":"8–12","tempo":"2–3 s ↓","rest":"2–3 min","rir":"3"},"quick":{"do":["Només en dies bons, mai el mateix dia ni l'endemà d'una sortida exigent","Barra a terra o en suports baixos, peus a l'amplada dels malucs","Presa pronada, mans just per fora de les cuixes","Genolls una mica flexionats i fixos abans de començar"],"dont":"Arrodonir l'esquena a la part baixa del recorregut","feel":"Estirament fort a la cuixa posterior amb l'esquena quieta","grip":"Pronada, a l'amplada dels malucs"},"grip_title":"La presa i la trajectòria de la barra","theory_html":"<p><span class=\"k\">L'única frontissa amb càrrega lliure del programa.</span> Treballa l'isquiotibial i el gluti en posició estirada i hi afegeix tota la cadena posterior sostenint el tronc com un bloc. És un exercici excel·lent, i això és precisament el que el fa perillós en el teu cas.</p> <p><span class=\"k\">Per què és una variant condicional.</span> És també l'exercici amb més fatiga lumbar de tot el programa, i la columna és la línia vermella d'aquest bloc. El Back Extension cobreix la mateixa funció amb una fracció del cost: per això és la variant per defecte, i aquesta només entra amb les condicions de la nota.</p> <p><span class=\"k\">Com compta.</span> Substitueix el Back Extension, no s'hi afegeix: la posició continua comptant com a «3 + 1» sèries.</p>","cues":["Barra arran de la cama durant tot el recorregut","Porta el cul enrere; el tronc baixa com a conseqüència","Genolls fixos: no es dobleguen més a mesura que baixes","Atura quan notis l'estirament, no quan la barra toqui terra","A dalt, dret i estable: res d'hiperextendre"],"setup_steps":["Barra a terra o en suports baixos, peus a l'amplada dels malucs.","<span class=\"key\">Presa pronada</span>, mans just per fora de les cuixes.","Genolls lleugerament flexionats i fixos: aquesta flexió no canvia durant la sèrie.","Pit obert, omòplats baixos i <span class=\"key\">barra tocant les cuixes</span> abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Presa pronada i tancada.</span> Palmells cap al cos i polze tancat. Si l'agarrament et falla abans que els isquios, aquest exercici et queda gran per avui.</p> <p><span class=\"k\">La barra no se separa de la cama.</span> És la regla que decideix la seguretat de l'exercici: cada centímetre que la barra s'allunya del cos multiplica la palanca sobre la lumbar.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Porta el <span class=\"key\">cul enrere</span> i deixa que el tronc baixi. La barra viatja arran de la cama.","<span class=\"key\">Punt baix.</span> Fins a notar un estirament clar a la cuixa posterior, normalment cap a mitja canyella. No baixis fins a terra.","<span class=\"key\">Pujada (1 s).</span> Estén el maluc estrenyent el gluti, com si empenyessis el terra amb els peus.","A dalt, dret i estable, sense hiperextendre ni tirar les espatlles enrere."],"notice_html":"<p>Estirament fort a la part posterior de la cuixa durant la baixada i el gluti estrenyent a la pujada. La part baixa de l'esquena s'ha de notar sostenint, no movent-se. <span class=\"k\">Si la notes com si fos ella qui aixeca el pes</span>, atura la sèrie.</p>","verify_html":"<p><span class=\"k\">Prova de la barra:</span> ha de tocar la cuixa i no separar-se'n en tota la baixada.</p> <p><span class=\"k\">Prova de l'esquena:</span> si s'arrodoneix a la part baixa, has baixat més del que la teva mobilitat permet.</p> <p><span class=\"k\">Prova del mig camí:</span> atura la baixada un segon a mig recorregut. Si has de corbar l'esquena per sostenir-hi la barra, el pes és excessiu per a un exercici complementari.</p>","errors":[{"error":"L'esquena s'arrodoneix a la part baixa","why":"És el motiu pel qual aquest exercici és a l'annex i no al cicle.","fix":"Baixa menys. El rang correcte és el que pots fer amb l'esquena rígida.","cause":"La mobilitat s'acaba abans que la sensació de poder baixar més, i l'esquena continua el moviment."},{"error":"Convertir-ho en un esquat","why":"Si els genolls es dobleguen més a mesura que baixes, ha deixat de ser una frontissa.","fix":"Fixa el genoll a l'inici i mou només el maluc.","cause":"Doblegar el genoll fa la baixada més còmoda quan els isquios comencen a tibar."},{"error":"Hiperextendre a dalt","why":"Comprimeix la lumbar just al final de cada repetició.","fix":"Atura't dret, ni un grau més.","cause":"Acabar dret no es nota com un final clar i el cos tendeix a passar-se."}],"progression_html":"<p>Aquí la progressió no és l'objectiu. Mantén una càrrega moderada i constant i fes créixer la qualitat: més control a la baixada, més estirament, esquena més estable. Si vols pujar pes, primer ha de pujar el Back Extension.</p>","note_html":"Condicions per fer-lo: només si la sessió ha anat bé de la primera a l'última posició, mai el mateix dia ni l'endemà d'una sortida en zona 3, RIR 3 sempre, i amb el pes que et permetria fer 12 repeticions netes encara que en toquin 8. Si dubtes si toca, no toca.","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=lKLYvNGz6mk","title":"Barbell Romanian Deadlift - Proper Form & Technique [4K]","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Pes mort romanès amb manuelles","why_equivalent":"Mateixa frontissa de maluc amb càrrega davant del cos.","adjust":"Pes inferior al de la barra; les manuelles xoquen abans amb les canyelles.","short":"mateixa frontissa, menys càrrega"},"contingencia":{"name":"Good morning amb manuella al pit","why_acceptable":"Manté la frontissa amb menys càrrega i rang més curt.","adjust":"RIR 3; comença sense pes fins a confirmar la tècnica.","short":"frontissa amb rang curt"},"not_equivalent":["Pes mort convencional · càrrega en flexió alta","Esquat amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Barra a terra o en suports baixos, peus a l'amplada dels malucs.</li> <li><span class=\"key\">Presa pronada</span>, mans just per fora de les cuixes.</li> <li>Genolls lleugerament flexionats i fixos: aquesta flexió no canvia durant la sèrie.</li> <li>Pit obert, omòplats baixos i <span class=\"key\">barra tocant les cuixes</span> abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Porta el <span class=\"key\">cul enrere</span> i deixa que el tronc baixi. La barra viatja arran de la cama.</li> <li><span class=\"key\">Punt baix.</span> Fins a notar un estirament clar a la cuixa posterior, normalment cap a mitja canyella. No baixis fins a terra.</li> <li><span class=\"key\">Pujada (1 s).</span> Estén el maluc estrenyent el gluti, com si empenyessis el terra amb els peus.</li> <li>A dalt, dret i estable, sense hiperextendre ni tirar les espatlles enrere.</li> </ol>","tags":{"primary":["Isquiotibials"],"secondary":["Gluti major"],"minor":["Erectors"],"traits":[]},"registre":{"proposta":"regla"}},{"key":"C-03","position":"C-03","session":"C","order":6,"name":"Leg Extension","category":"ALT","category_label":"Alterna · cicles senars","machine":{"code":null,"label":"Leg Extension · no consta a l'inventari M1–M7"},"muscles":"Quàdriceps · recte femoral","prescription":{"series":"2","reps":"12–15","tempo":"2–3 s ↓","rest":"90 s","rir":"0–1"},"quick":{"do":["Respatller ajustat: el genoll alineat amb l'eix de gir de la màquina","Cul al fons del seient i enganxat tota la sèrie","Coixí just per sobre del turmell, no sobre l'empenya","Agafa't als mànecs laterals abans de la primera repetició"],"dont":"Impulsar amb el tronc per arrencar","feel":"Crema aïllada a la cara anterior de la cuixa","grip":"Peus neutres, en línia amb el genoll"},"grip_title":"La col·locació","theory_html":"<p><span class=\"k\">Per què cal, si ja tens la premsa.</span> Dels quatre músculs del quàdriceps, un —el <span class=\"k\">recte femoral</span>— creua també el maluc. A la premsa, amb el maluc doblegat, aquest cap queda mig adormit i pràcticament no treballa. Aquest exercici és l'únic del programa que estén el genoll <span class=\"k\">sense que el maluc hi participi</span>, i per tant l'únic que el desperta.</p> <p><span class=\"k\">Per què alterna amb l'adducció.</span> Són dues funcions que la sessió vol conservar però que, fetes totes dues cada cicle, la portaven per sobre dels 80 minuts. Alternant-les, cadascuna es fa un cicle sí i un no, i cap de les dues cau mai dos cicles seguits.</p> <p><span class=\"k\">Un ús extra que té.</span> És la màquina on pots fer isomètrics per al genoll si la cursa el desperta: la mateixa posició, aturat a mig recorregut, aguantant entre 20 i 30 segons amb un pes moderat. És el que es fa servir habitualment per al tendó rotular del corredor.</p>","cues":["Estén fins gairebé recte, sense impuls","Pausa d'1 segon estrenyent a dalt","Baixada de 3 segons, sense arribar a descarregar","El cul no es desenganxa del seient","No rebotis al punt baix"],"setup_steps":["Ajusta el respatller perquè el <span class=\"key\">genoll quedi alineat amb l'eix de gir</span> de la màquina. Si no coincideixen, part de la força es perd en la palanca i l'articulació rep una torsió que no toca.","Cul al fons del seient. Si es desenganxa per arrencar, el pes és excessiu.","Coixí just per sobre del turmell: sobre l'empenya prem l'os, i massa amunt escurça la palanca i falseja el pes que registres.","Agafa't als mànecs laterals i tria un pes que et permeti aguantar un segon a dalt amb el quàdriceps estret."],"grip_html":"<p><span class=\"k\">L'eix de gir és l'ajust que ho decideix tot.</span> Si el teu genoll no coincideix amb el pivot de la màquina, part de la força es perd en la palanca i l'articulació rep una torsió que no toca.</p> <p><span class=\"k\">On va el coixí.</span> Just per sobre del turmell. Sobre l'empenya prem l'os i fa mal; massa amunt, escurça la palanca i falseja el pes.</p> <p><span class=\"k\">Els peus.</span> Neutres, en línia amb el genoll. Girar les puntes cap enfora o cap endins per notar una part o altra del quàdriceps no canvia gran cosa i sí que canvia com treballa el genoll.</p>","execution_steps":["<span class=\"key\">Extensió (1–2 s).</span> Estén el genoll fins gairebé recte, sense impuls.","<span class=\"key\">Contracció (1 s).</span> Estreny el quàdriceps a dalt. Aquí és on es guanya l'exercici.","<span class=\"key\">Baixada (3 s).</span> Torna lentament fins que el genoll quedi ben flexionat, sense arribar a descarregar.","Encadena la repetició següent sense rebotar."],"notice_html":"<p>Crema molt local al davant de la cuixa, que puja i marxa de pressa. <span class=\"k\">Si el que notes és el genoll per dins</span>, l'eix de la màquina no coincideix amb el teu. <span class=\"k\">Si notes la part baixa de l'esquena</span>, t'has desenganxat del respatller per arrencar.</p>","verify_html":"<p><span class=\"k\">Prova de l'eix:</span> assegut i sense pes, el genoll ha de coincidir amb el pivot. Si no, ajusta el respatller abans de la primera sèrie.</p> <p><span class=\"k\">Prova del seient:</span> si el cul es desenganxa per arrencar, el pes és excessiu.</p> <p><span class=\"k\">Prova de la pausa:</span> si no pots aguantar un segon complet a dalt amb el quàdriceps estret, hi has arribat per inèrcia.</p>","errors":[{"error":"Impulsar amb el tronc","why":"El quàdriceps aïllat mou poc pes, i quan la càrrega el supera el tronc és l'únic que pot afegir força.","fix":"Baixa la càrrega i fes-ho amb pausa a dalt.","cause":"Es tria el pes pensant en la premsa, no en un aïllament."},{"error":"Deixar caure el pes a la baixada","why":"Perds la meitat de l'estímul.","fix":"Tres segons de retorn.","cause":"La baixada no compta al comptador de repeticions i és la primera que es deixa anar."},{"error":"Rebotar al punt baix","why":"Carrega el genoll i no afegeix res.","fix":"Atura't un instant abans de tornar a estendre.","cause":"Rebotar estalvia l'arrencada, que és on el quàdriceps té menys avantatge."}],"progression_html":"<p>15 repeticions netes amb pausa a dalt a les dues sèries → puja pes i torna a 12.</p>","note_html":"","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie, <span class=\"k\">pausa curta</span>: en arribar al punt on ja no estens del tot, deixa reposar 15 o 20 segons i continua amb el mateix pes fins a tornar a fallar. Només a l'última sèrie: genera molta fatiga per a un aïllament. L'alternativa, els parcials, és al capítol «Tècniques d'intensitat».</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=2lvdnQg04PM","title":"Exercise Tutorial: Technogym Leg Extension Machine","confidence":"exacta","note":"Màquina Technogym; el model pot variar."},"alternatives":{"principal":{"name":"Extensió de quàdriceps, una cama","why_equivalent":"Mateixa extensió de genoll aïllada, unilateral en lloc de bilateral.","adjust":"Mateix RIR; una sèrie per cama compta com a sèrie.","short":"mateixa extensió, unilateral"},"contingencia":{"name":"Esquat búlgar amb manuelles, tronc vertical","why_acceptable":"Manté el quàdriceps de protagonista amb el tronc dret, amb una mica de gluti afegit.","adjust":"Comença lleuger: no hi ha transferència directa de pes.","short":"quàdriceps amb tronc dret"},"not_equivalent":["Esquat amb barra · barra a les espatlles","Gambades amb barra · barra a les espatlles"]},"v22":true,"setup_html":"<ol> <li>Ajusta el respatller perquè el <span class=\"key\">genoll quedi alineat amb l'eix de gir</span> de la màquina. Si no coincideixen, part de la força es perd en la palanca i l'articulació rep una torsió que no toca.</li> <li>Cul al fons del seient. Si es desenganxa per arrencar, el pes és excessiu.</li> <li>Coixí just per sobre del turmell: sobre l'empenya prem l'os, i massa amunt escurça la palanca i falseja el pes que registres.</li> <li>Agafa't als mànecs laterals i tria un pes que et permeti aguantar un segon a dalt amb el quàdriceps estret.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Extensió (1–2 s).</span> Estén el genoll fins gairebé recte, sense impuls.</li> <li><span class=\"key\">Contracció (1 s).</span> Estreny el quàdriceps a dalt. Aquí és on es guanya l'exercici.</li> <li><span class=\"key\">Baixada (3 s).</span> Torna lentament fins que el genoll quedi ben flexionat, sense arribar a descarregar.</li> <li>Encadena la repetició següent sense rebotar.</li> </ol>","tags":{"primary":["Quàdriceps"],"secondary":["Recte femoral"],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"C-03b","position":"C-03","session":"C","order":7,"name":"Adducció de maluc","category":"ALT","category_label":"Alterna · cicles parells","machine":{"code":null,"label":"Màquina d'adducció · no consta a l'inventari M1–M7"},"muscles":"Adductors","prescription":{"series":"2","reps":"12–20","tempo":"3‑1‑2‑1","rest":"60 s","rir":"0–1"},"quick":{"do":["Esquena recolzada i coixins a la cara interna de la cuixa","Obertura inicial moderada: estirament clar però còmode","Guanya rang amb les setmanes, no el primer dia","Pes baix: aquí el rang és l'estímul, no la càrrega"],"dont":"Obrir massa d'entrada i deixar tornar les plaques de cop","feel":"Treball a la cara interna de la cuixa","grip":"Coixins a la cara interna de la cuixa, no al genoll"},"grip_title":"La col·locació i l'obertura","theory_html":"<p><span class=\"k\">Què fan els adductors.</span> Acosten la cama a la línia mitjana del cos, i sostenen el maluc quan estàs sobre una sola cama. És un grup gran, de la cara interna de la cuixa, i <span class=\"k\">contribueix de debò al volum de la cuixa</span>: la idea que no val la pena entrenar-los perquè no es veuen és falsa, perquè la cuixa es veu de front i de dins.</p> <p><span class=\"k\">Per què és obligatori i no opcional.</span> Perquè quan era opcional no es feia mai. I perquè formen parell amb l'abductor: un obre, l'altre tanca, i entrenar-ne només un crea un desequilibri al voltant del maluc que surt barat d'evitar.</p> <p><span class=\"k\">Aquí el rang mana més que el pes.</span> L'estímul ve de l'obertura amb què comences, que és el que estira el múscul. Per això la progressió comença guanyant obertura i el pes és l'últim esglaó.</p>","cues":["Tancament controlat d'1–2 segons","Pausa d'1 segon amb les cames juntes","Obertura de 3 segons sense que les plaques toquin","Esquena recolzada i quieta: si el tronc es mou, baixa un esglaó"],"setup_steps":["Seu amb l'esquena recolzada i els coixins a la <span class=\"key\">cara interna de la cuixa</span>, no al genoll.","Ajusta l'obertura inicial fins on notis un <span class=\"key\">estirament clar però còmode</span>. Aquesta obertura és el que determina l'estímul.","Tria un pes que et deixi controlar l'obertura durant tres segons.","Comprova que els peus no empenyen contra res: la feina ha de sortir de la cara interna de la cuixa."],"grip_html":"<p><span class=\"k\">On van els coixins.</span> A la cara interna de la cuixa, per sobre del genoll. Sobre el genoll, la força es transmet a l'articulació i no al múscul.</p> <p><span class=\"k\">L'obertura inicial és la variable.</span> Determina quant s'estira el múscul i, per tant, quant estímul rep; i també on és el risc. Es guanya rang amb les setmanes.</p> <p><span class=\"k\">Com saber si t'has passat.</span> A la posició inicial has de notar tensió, no una estrebada a l'engonal. L'estrebada és l'única manera de fer-se mal en aquesta màquina.</p>","execution_steps":["<span class=\"key\">Tancament (1–2 s).</span> Junta les cames de manera controlada.","<span class=\"key\">Pausa (1 s)</span> amb les cames juntes.","<span class=\"key\">Obertura (3 s).</span> Lenta fins a l'estirament, sense que les plaques toquin fons.","Encadena sense rebot: el retorn brusc amb obertura gran és el moment de risc."],"notice_html":"<p>Feina a la cara interna de la cuixa i un estirament clar però còmode al punt d'obertura màxima. <span class=\"k\">Si notes una estrebada a l'engonal</span>, has obert més del compte. <span class=\"k\">Si no notes res</span>, l'obertura inicial és massa petita.</p>","verify_html":"<p><span class=\"k\">Prova de l'obertura:</span> a la posició inicial has de poder respirar tranquil·lament amb les cames obertes. Si has d'aguantar l'aire, tanca-la un punt.</p> <p><span class=\"k\">Prova del tronc:</span> si t'has de tombar endavant per tancar les cames, el pes és excessiu.</p> <p><span class=\"k\">Prova dels tres segons:</span> l'obertura dura tres segons sense que les plaques toquin fons.</p>","errors":[{"error":"Obertura inicial excessiva","why":"És la manera de fer-se mal en aquesta màquina: l'engonal rep una tracció que no pot sostenir.","fix":"Comença amb una obertura moderada i guanya rang amb les setmanes.","cause":"L'obertura no fa mal mentre s'hi entra, i el límit no es nota fins que s'ha passat."},{"error":"Deixar que les plaques toquin en obrir","why":"Perds tensió i, amb obertura gran, el retorn brusc és el moment de risc.","fix":"Controla els tres segons sencers.","cause":"Al final de la sèrie l'obertura costa de frenar."},{"error":"Ajudar-se amb el tronc","why":"Els adductors mouen poc pes, i quan la càrrega els supera el tronc és l'únic que pot afegir força.","fix":"Esquena recolzada i quieta; si es mou, baixa un esglaó.","cause":"Es tria el pes per la sensació de la màquina, no pel múscul."}],"progression_html":"<p>Tres esglaons, per ordre: primer <span class=\"k\">obertura</span> —més rang amb la mateixa càrrega és més estímul, no menys—; després <span class=\"k\">repeticions</span>, de 12 a 20 amb el rang nou; i només llavors <span class=\"k\">pes</span>, tornant a 12.</p>","note_html":"","extra_sections":[],"figure":"abduction","video":{"url":"https://www.youtube.com/watch?v=h9BqUMqK-SY","title":"How to PROPERLY Use the Abductor & Adductor Machine","confidence":"alta","note":"Mateix vídeo que C‑06: cobreix les dues màquines."},"alternatives":{"principal":{"name":"Adducció de maluc amb goma, de costat","why_equivalent":"Mateixa adducció aïllada, amb els adductors de motor únic.","adjust":"Tensió des del primer grau; ajusta l'ancoratge de la goma.","short":"mateixa adducció aïllada"},"contingencia":{"name":"Esquat sumo sense pes, aturada a baix","why_acceptable":"Recluta els adductors en isomètric al punt més obert. Menys específic.","adjust":"Per temps: 20–30 segons per sèrie.","short":"adductors en isomètric"},"not_equivalent":["Esquat sumo amb barra · barra a les espatlles","Pes mort sumo · càrrega en flexió"]},"v22":true,"setup_html":"<ol> <li>Seu amb l'esquena recolzada i els coixins a la <span class=\"key\">cara interna de la cuixa</span>, no al genoll.</li> <li>Ajusta l'obertura inicial fins on notis un <span class=\"key\">estirament clar però còmode</span>. Aquesta obertura és el que determina l'estímul.</li> <li>Tria un pes que et deixi controlar l'obertura durant tres segons.</li> <li>Comprova que els peus no empenyen contra res: la feina ha de sortir de la cara interna de la cuixa.</li> </ol>","ex
