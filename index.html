":"mateixa obertura, sense rotació"},"contingencia":{"name":"Rotació externa amb goma, colze al costat","why_acceptable":"Conserva la part de manteniment del manegot, sense la feina de deltoide posterior.","adjust":"Goma lleugera, 15–20 repeticions per braç.","short":"només la part de manegot"},"not_equivalent":["Remada al mentó · risc d'espatlla","Press militar · treball per sobre del cap"]},"v22":true,"setup_html":"<ol> <li>Politja a l'<span class=\"key\">alçada del cap o lleugerament per sobre</span>, amb corda. Si la poses baixa, la tirada es converteix en un rem i perds la part que fa d'aquest exercici el que és.</li> <li>Un peu una mica endavant, com si fessis un pas curt: evita que el tronc es tombi enrere per fer contrapès.</li> <li>Fes un pas enrere fins que el cable ja tingui tensió amb els braços estesos.</li> <li>Espatlles relaxades i lleugerament estirades endavant a la posició inicial: és d'on ha de sortir el moviment.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Tirada (2 s).</span> Tira la corda cap a la cara, a l'alçada del nas o del front, separant les mans a mesura que s'acosten.</li> <li><span class=\"key\">Rotació.</span> Al final, gira els punys cap enrere fins que els canells quedin per sobre dels colzes i els palmells mirin endavant.</li> <li><span class=\"key\">Pausa (1 s)</span> amb els colzes a l'alçada de l'espatlla.</li> <li><span class=\"key\">Retorn (3 s).</span> Desfés el moviment a poc a poc, deixant que les espatlles s'estirin endavant al final.</li> </ol>","tags":{"primary":["Deltoide posterior"],"secondary":["Manegot rotador"],"minor":["Trapezi mitjà"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TB-06","position":"TB-06","session":"TB","order":6,"name":"Elevacions laterals amb manuelles","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Manuelles · no consta a l'inventari M1–M7"},"muscles":"Deltoide lateral","prescription":{"series":"3","reps":"12–20","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Manuelles molt més lleugeres del que et sembla raonable","Dempeus, peus a l'amplada dels malucs i genolls desbloquejats","Colze amb 10–15° de flexió, fixada abans de començar","Si a Tronc A has fet politja, aquest cicle toquen manuelles"],"dont":"Encongir l'espatlla i passar la feina al trapezi","feel":"Crema al costat de l'espatlla, no al coll","grip":"Neutra — palmells cap al cos, i no giren"},"theory_html":"<p><span class=\"k\">Què fa el deltoide lateral.</span> Separa el braç del cos, i és el múscul que més decideix l'<span class=\"k\">amplada de les espatlles vista de front</span>: el canvi de forma del tronc que es busca entrenant ve, sobretot, d'aquí. És petit, es recupera de pressa i no deixa fatiga general, i per això en té tres exposicions per cicle quan la resta de grups en tenen dues.</p> <p><span class=\"k\">Per què va després del press d'espatlles.</span> El press ja ha treballat el deltoide, però sobretot la part de davant. Aquesta posició ve a buscar la lateral, que és la que dona amplada i la que cap empenta cobreix del tot. Que hi arribis amb el múscul una mica cansat no és un problema: aquí no busques càrrega.</p> <p><span class=\"k\">Per què el pes sembla ridícul.</span> És un múscul petit movent tot el braç estès com a palanca. La càrrega correcta sempre sembla massa baixa. I per sobre de l'alçada de l'espatlla el braç encara puja, però ja no el puja ell: el trapezi n'agafa el relleu.</p>","cues":["Puja el colze, no la mà","Colze igual o una mica més alt que el canell al punt alt","Atura't a l'alçada de l'espatlla, ni un dit més amunt","Baixada de 3 segons, sense deixar caure el braç","Tronc immòbil: si et gronxes, el pes és excessiu"],"setup_steps":["Dempeus, peus a l'amplada dels malucs i genolls lleugerament desbloquejats.","Manuelles als costats del cos, amb els palmells encarats cap a les cuixes.","<span class=\"key\">Coll llarg i espatlles avall</span> abans de la primera repetició.","Fixa el colze amb <span class=\"key\">10–15° de flexió</span>: aquesta flexió no canvia en tota la sèrie."],"grip_html":"<p><span class=\"k\">Presa neutra, i no gira.</span> Palmells cap al cos. Molta gent gira el palmell cap avall al punt alt pensant que aïlla més; el que fa és rotar l'espatlla cap endins justament en la posició de menys espai articular.</p> <p><span class=\"k\">La mà no aixeca.</span> Aixeca el colze i deixa que la mà el segueixi. Si la mà va per davant, el pes acaba penjat del canell i el deltoide en fa menys.</p> <p><span class=\"k\">Cap on va el braç.</span> Cap al costat, o un pèl endavant, mai endarrere. Endavant del tot és una elevació frontal, que treballa un altre cap del deltoide i és a l'annex.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat fins a l'alçada de l'espatlla.","<span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més alt que el canell.","<span class=\"key\">Baixada (3 s).</span> Controlada fins al costat del cos.","Encadena sense rebot i sense aturar-te a descansar amb els braços penjats."],"notice_html":"<p>Una crema lateral que apareix aviat i s'acumula molt. <span class=\"k\">Si el que notes és el coll o la part alta de l'esquena</span>, el trapezi ha pres el relleu. <span class=\"k\">Si el que notes és el davant de l'espatlla</span>, estàs pujant endavant en comptes de cap al costat.</p>","verify_html":"<p><span class=\"k\">Prova del mirall lateral:</span> al punt alt, el colze queda igual o una mica més amunt que el canell.</p> <p><span class=\"k\">Prova del tronc quiet:</span> si has de gronxar-te per arrencar la primera repetició, el pes és excessiu, sense excepcions.</p> <p><span class=\"k\">Prova de les 15:</span> has de poder fer 15 repeticions netes amb el tronc immòbil. Si no, baixa de parell.</p>","errors":[{"error":"Encongir l'espatlla","why":"El teu error més persistent, i aquí el més fàcil de cometre: el trapezi fa la feina i el deltoide en queda fora.","fix":"Coll llarg i espatlles avall abans de cada repetició. Si no ho pots mantenir, baixa de parell de manuelles.","cause":"El deltoide lateral mou molt poc pes, i la manuella que sembla raonable a la mà ja obliga el trapezi a ajudar."},{"error":"Pujar per sobre de l'espatlla","why":"Per sobre de l'horitzontal hi entra el trapezi.","fix":"Atura't a l'alçada de l'espatlla.","cause":"L'horitzontal no es nota com un final, i el braç continua perquè encara pot."},{"error":"Gronxar el cos","why":"L'impuls mou el pes i el deltoide deixa de ser el motor.","fix":"Càrrega que permeti 15 repeticions amb el tronc immòbil.","cause":"Amb el pes just per sobre del teu, el balanceig és l'única manera de passar dels primers graus."},{"error":"Aixecar els talons","why":"L'has detectat tu. Si els talons pugen, el cos pot ajudar a moure el pes i les repeticions deixen de ser comparables.","fix":"Peus plans i talons a terra a totes les repeticions; si no es mantenen, baixa de pes."}],"progression_html":"<p>Per repeticions: de 12 a 20 amb les mateixes manuelles, i només llavors el parell següent, tornant a 12. Pujar pes aviat aquí garanteix que el trapezi agafi la feina.</p>","note_html":"Dins d'un mateix cicle, Tronc A i Tronc B fan sempre variants oposades, i s'intercanvien a cada minibloc. A Tronc C sempre és politja. Amb el mateix rang de moviment totes dues donen resultats semblants: l'alternança és varietat i trajectòria, no una condició per créixer.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie pots fer un <span class=\"k\">dropset</span>: en arribar al punt on ja no puges net, canvia al parell immediatament inferior i continua sense descansar fins que tampoc surti. Una sola vegada per sessió.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=nnH63icHYXY","title":"Dumbbell Lateral Raise | Proper Form Tutorial for Bigger Shoulders","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Elevació lateral a màquina","why_equivalent":"Mateixa abducció amb trajectòria guiada i resistència constant, amb el deltoide lateral com a motor únic.","adjust":"La màquina no perdona l'impuls: comença un esglaó per sota del que faries amb manuelles.","short":"mateixa abducció, guiada"},"contingencia":{"name":"Elevacions laterals a politja","why_acceptable":"És l'altra variant d'aquesta mateixa posició, amb tensió constant.","adjust":"Pes molt lleuger; mateix RIR.","short":"tensió constant tot el rang"},"not_equivalent":["Press militar · treball per sobre del cap","Remada al mentó · risc d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs i genolls lleugerament desbloquejats.</li> <li>Manuelles als costats del cos, amb els palmells encarats cap a les cuixes.</li> <li><span class=\"key\">Coll llarg i espatlles avall</span> abans de la primera repetició.</li> <li>Fixa el colze amb <span class=\"key\">10–15° de flexió</span>: aquesta flexió no canvia en tota la sèrie.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat fins a l'alçada de l'espatlla.</li> <li><span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més alt que el canell.</li> <li><span class=\"key\">Baixada (3 s).</span> Controlada fins al costat del cos.</li> <li>Encadena sense rebot i sense aturar-te a descansar amb els braços penjats.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide lateral"],"secondary":[],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TB-06b","position":"TB-06","session":"TB","order":7,"name":"Elevacions laterals a politja","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Torre de politges, politja baixa amb nansa simple · no consta a l'inventari M1–M7"},"muscles":"Deltoide lateral","prescription":{"series":"3","reps":"12–20","tempo":"2–3 s ↓","rest":"30 s","rir":"0–1"},"quick":{"do":["Politja a l'alçada més baixa, amb nansa simple","De costat a la torre, amb la torre a la banda contrària del braç que treballa","Agafa la nansa passant-la per davant del cos: el cable creua en diagonal","Si a Tronc A has fet manuelles, aquest cicle toca politja"],"dont":"Deixar que la pila toqui fons entre repeticions","feel":"Crema al costat de l'espatlla des del primer centímetre","grip":"Neutra — palmell cap al cos, i no gira"},"theory_html":"<p><span class=\"k\">Què fa el deltoide lateral.</span> Separa el braç del cos i és el que decideix l'amplada de les espatlles vista de front. Aquí el treballes amb l'eina que li dona tensió des del primer grau.</p> <p><span class=\"k\">Per què la politja canvia les coses.</span> Amb manuelles la resistència ve de la gravetat: amb el braç penjant no n'hi ha gairebé, i n'hi ha el màxim a l'horitzontal. La politja baixa tira en diagonal des de terra i inverteix el repartiment: hi ha tensió des del primer centímetre, amb el múscul estirat, que és on la manuella pràcticament no en dona.</p> <p><span class=\"k\">La col·locació és el 90% de l'exercici.</span> Creuant el cable per davant del cos, el braç arrenca una mica per dins de la línia del tronc i el deltoide comença estirat. De cara a la torre, amb el cable paral·lel, perds justament això. Si aquest exercici no t'havia funcionat mai, molt probablement el motiu és aquest i no el pes.</p>","cues":["Puja el colze, no la mà","Atura't a l'alçada de l'espatlla, ni un dit més amunt","Baixa fins que la mà creui una mica la línia del cos","La tensió no s'apaga mai: la pila no toca fons","Coll llarg i espatlla avall abans de cada repetició"],"setup_steps":["Politja a l'<span class=\"key\">alçada més baixa</span>, amb una nansa simple.","Col·loca't <span class=\"key\">de costat a la torre</span>, amb la torre a la banda contrària del braç que treballarà.","Agafa la nansa amb el braç més allunyat, passant-la <span class=\"key\">per davant del cos</span>: el cable creua el cos en diagonal.","Peus a l'amplada dels malucs i mà lliure agafada a la torre. Colze amb 10–15° de flexió, que no canvia en tota la sèrie."],"grip_html":"<p><span class=\"k\">Presa neutra, i no gira.</span> Palmell cap al cos de principi a fi. Girar-lo cap avall al punt alt rota l'espatlla cap endins en la posició amb menys espai articular.</p> <p><span class=\"k\">La mà només enganxa la nansa.</span> Estrènyer-la amb força tensa l'avantbraç i el fa entrar en un exercici que no és seu. Agafada ferma però relaxada.</p> <p><span class=\"k\">Per on passa el cable.</span> Per davant del cos, no per darrere ni pel costat. Si el cable et passa per darrere del canell, el braç arrenca fora de la línia i la primera part del recorregut se't fa impossible.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat i lleugerament endavant, fins a l'alçada de l'espatlla.","<span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més amunt que el canell.","<span class=\"key\">Baixada (3 s).</span> Torna fins que la mà creui una mica la línia del cos, sense deixar que la pila reposi.","Fes totes les repeticions d'un braç, canvia de costat sense descansar i descansa 30 s en acabar els dos."],"notice_html":"<p>Crema al costat de l'espatlla, present ja a les primeres repeticions. <span class=\"k\">Si el que notes és el coll</span>, el trapezi ha pres el relleu. <span class=\"k\">Si notes l'espatlla per dins</span>, has passat de l'horitzontal o has girat el palmell cap avall.</p>","verify_html":"<p><span class=\"k\">Prova de la col·locació:</span> a la posició inicial, la mà queda lleugerament creuada per davant de la cuixa contrària. Si queda al costat del cos, estàs mal orientat o massa a prop.</p> <p><span class=\"k\">Prova del pes:</span> has de poder fer 15 repeticions sense que el tronc es mogui gens. Aquí el pes correcte sempre sembla ridículament baix.</p> <p><span class=\"k\">Prova de la pila:</span> si sents el cop dels pesos entre repeticions, has perdut la tensió que era el motiu de fer-ho a politja.</p>","errors":[{"error":"Encongir l'espatlla cap a l'orella","why":"El trapezi fa la feina i el deltoide en queda fora. És el teu error més repetit.","fix":"Coll llarg i espatlla avall abans de cada repetició; si no es manté, baixa la càrrega.","cause":"Amb tensió des del primer centímetre, l'espatlla puja buscant on fer força abans que el deltoide arrenqui."},{"error":"Pujar per sobre de l'espatlla","why":"Per sobre de l'horitzontal hi entra el trapezi superior i l'espai de l'espatlla s'estreny.","fix":"Atura't a l'alçada de l'espatlla.","cause":"Amb tensió constant el braç encara pot continuar, i l'horitzontal no es nota com un final."},{"error":"Girar el palmell cap avall al punt alt","why":"Rota l'espatlla cap endins en la posició de més pinçament, sense cap avantatge.","fix":"Presa neutra tota l'estona.","cause":"Ve de la idea que girar el palmell aïlla més el deltoide."},{"error":"Aixecar els talons","why":"L'has detectat tu. Si els talons pugen, el cos pot ajudar a moure el pes i les repeticions deixen de ser comparables.","fix":"Peus plans i talons a terra a totes les repeticions; si no es mantenen, baixa de pes."}],"progression_html":"<p>Per repeticions abans que per pes: de 12 a 20 amb la mateixa càrrega, i llavors un sol increment i tornada a 12.</p>","note_html":"Els creuaments de politja al pit queden fora del programa per la teva regla: politges només per a braços i deltoides. Aquesta posició és una de les excepcions on la politja aporta alguna cosa que cap altra eina dona.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie, <span class=\"k\">dropset</span>: baixa un o dos esglaons de la pila en acabar i continua sense descansar fins que el braç ja no arribi a l'alçada de l'espatlla.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=eihMRam0P2Q","title":"Low Cable Lateral Raise: How To","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Elevació lateral a màquina","why_equivalent":"Mateix pla d'abducció amb trajectòria guiada.","adjust":"Pes similar al de la politja; mateix RIR.","short":"mateix pla, guiada"},"contingencia":{"name":"Elevacions laterals amb manuelles","why_acceptable":"És l'altra variant d'aquesta posició. Perd la tensió constant, guanya llibertat de trajectòria.","adjust":"Comença un esglaó per sota: sense politja, els primers graus costen més.","short":"mateixa abducció, trajectòria lliure"},"not_equivalent":["Press militar · treball per sobre del cap","Remada al mentó · risc d'espatlla"]},"v22":true,"setup_html":"<ol> <li>Politja a l'<span class=\"key\">alçada més baixa</span>, amb una nansa simple.</li> <li>Col·loca't <span class=\"key\">de costat a la torre</span>, amb la torre a la banda contrària del braç que treballarà.</li> <li>Agafa la nansa amb el braç més allunyat, passant-la <span class=\"key\">per davant del cos</span>: el cable creua el cos en diagonal.</li> <li>Peus a l'amplada dels malucs i mà lliure agafada a la torre. Colze amb 10–15° de flexió, que no canvia en tota la sèrie.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Puja el colze cap al costat i lleugerament endavant, fins a l'alçada de l'espatlla.</li> <li><span class=\"key\">Pausa (1 s).</span> Colze igual o una mica més amunt que el canell.</li> <li><span class=\"key\">Baixada (3 s).</span> Torna fins que la mà creui una mica la línia del cos, sense deixar que la pila reposi.</li> <li>Fes totes les repeticions d'un braç, canvia de costat sense descansar i descansa 30 s en acabar els dos.</li> </ol>","grip_title":"La presa","tags":{"primary":["Deltoide lateral"],"secondary":[],"minor":[],"traits":["Tensió constant"]},"registre":{"proposta":"doble"}},{"key":"TB-07","position":"TB-07","session":"TB","order":8,"name":"Papallona de pectoral a màquina","category":"FIX","category_label":"Fix","machine":{"code":"M3","label":"Pectoral (Technogym, selectoritzada)"},"muscles":"Pectoral major, porció esternal · porció clavicular · deltoide anterior","prescription":{"series":"3","reps":"10–15","tempo":"2–3 s ↓","rest":"60–90 s","rir":"1"},"quick":{"do":["Seient: el colze queda just per sota de l'espatlla","Maneta d'obertura: estirament clar, sense molèstia a l'espatlla","Esquena sencera al respatller i peus plans a terra","Avantbraços contra els coixins, mans relaxades"],"dont":"Deixar que les espatlles rodin endavant en tancar: la feina passa al deltoide anterior","feel":"El pit estirant-se en obrir i estrenyent-se al centre en tancar","grip":"Avantbraços contra els coixins, colze a uns 90°"},"theory_html":"<p><span class=\"k\">La funció que faltava.</span> El pit fa una sola cosa: <span class=\"k\">acostar el braç al centre del cos</span>. Els pressos ho fan empenyent, i aquest moviment és la versió pura: el braç s'obre i es tanca sense que el colze hi participi. Fins ara el programa tenia tres pressos i cap tancament, i el tancament és el que treballa la part gran del pit en tot el seu recorregut.</p> <p><span class=\"k\">Per què a màquina i no amb manuelles.</span> Amb manuelles, a la part final els braços queden verticals i la gravetat deixa d'oferir resistència justament quan el pit s'està contraient; i a la part baixa, amb el pit estirat, has de frenar molt per no forçar l'espatlla. La màquina manté la resistència tot el recorregut i fixa la trajectòria: pots anar a prop de la fallada sense estabilitzar res.</p> <p><span class=\"k\">Per què al final de Tronc B.</span> El pit ja ha fet el press inclinat i arriba escalfat. Una obertura al final hi afegeix estímul amb menys càrrega per a l'espatlla que un altre press.</p>","cues":["Omòplats enrere i avall, enganxats al respatller","Tanca amb els avantbraços, amb el colze fix a 90°","Atura't a un dit de tocar i estreny 1 s","Obre en 3 s sense que la pila reposi"],"setup_steps":["Regula el seient amb la palanca groga. Assegut i amb l'avantbraç al coixí, el <span class=\"key\">colze ha de quedar just per sota de l'alçada de l'espatlla</span>: per sobre, la feina se'n va a l'espatlla i al trapezi.","Regula l'<span class=\"key\">obertura inicial</span> amb la maneta: el punt on notes un estirament clar al pit però cap molèstia al davant de l'espatlla. L'obertura és el que decideix l'estímul, i es guanya amb les setmanes.","Esquena sencera al respatller i peus plans a terra. Omòplats enrere i avall, pit lleugerament obert.","Recolza els avantbraços verticals contra els coixins, amb el colze a uns 90°. Les mans s'hi recolzen sense estrènyer: si empenyen, l'exercici es converteix en un mig press."],"grip_html":"<p><span class=\"k\">Aquí no hi ha presa: hi ha contacte.</span> L'avantbraç sencer, del colze al canell, empeny el coixí. Quan la força surt de les mans, el colze es doblega i s'estira durant la repetició i l'exercici es converteix en un mig press, que és el que ja fas a M5.</p> <p><span class=\"k\">Angle del colze.</span> Uns 90°, idèntic de la primera a l'última repetició. És el que manté la palanca constant i la tensió al pit.</p> <p><span class=\"k\">Alçada del colze i part del pit.</span> Amb el colze just per sota de l'espatlla, la feina es concentra a la part mitjana del pit. Si puges una mica el seient, el colze queda més avall i el recorregut apunta lleugerament cap avall, cosa que dona una mica més de feina a les fibres baixes. Al revés no funciona: amb el colze per sobre de l'espatlla no guanyes pit alt, només poses l'espatlla en mala posició. El pit alt ja el treballen TA‑01 i TB‑02.</p>","execution_steps":["<span class=\"key\">Tancament (2 s).</span> Porta els coixins cap al centre amb els avantbraços, com si volguessis ajuntar els colzes davant de l'estèrnum. L'esquena alta no se separa del respatller.","<span class=\"key\">Pausa tancada (1 s).</span> Estreny el pit amb els coixins a un dit de tocar-se, sense picar-los.","<span class=\"key\">Obertura (3 s).</span> Deixa tornar els braços enrere, frenant-los, fins a l'estirament que has fixat amb la maneta. La pila de pesos no arriba a reposar.","<span class=\"key\">Pausa oberta (1 s).</span> Aguanta l'estirament un segon, amb el pit obert, i torna a tancar sense rebotar."],"notice_html":"<p>Estirament a través del pit quan obres i una contracció clara al centre quan tanques. <span class=\"k\">Si notes el davant de l'espatlla</span>, l'obertura inicial és massa gran o l'espatlla ha rodat endavant. <span class=\"k\">Si notes sobretot els braços</span>, estàs empenyent amb les mans. <span class=\"k\">Si no notes res</span>, probablement el seient està massa baix i els colzes et queden per sobre de l'espatlla.</p>","verify_html":"<p><span class=\"k\">Prova del respatller:</span> a la pausa tancada, la part alta de l'esquena continua tocant el respatller. Si s'ha separat, has tancat amb les espatlles.</p> <p><span class=\"k\">Prova de la pila:</span> els pesos no tornen a reposar en tota la sèrie. Si reposen, la tensió desapareix a cada repetició.</p> <p><span class=\"k\">Prova del colze:</span> mira't un cop de costat: l'angle del colze és el mateix obert i tancat.</p>","errors":[{"error":"Espatlles que roden endavant en tancar","why":"El deltoide anterior agafa la feina i el pit queda a mitges; a més, és la posició en què l'espatlla pateix.","fix":"Atura el tancament on l'esquena alta encara toca el respatller.","cause":"Buscar els últims centímetres del tancament amb un pes massa alt."},{"error":"Obertura inicial massa gran","why":"Un estirament extrem al començament carrega la part anterior de l'espatlla, no el pit.","fix":"Tanca un punt la maneta i guanya rang amb les setmanes.","cause":"Pensar que més obertura sempre vol dir més estímul."},{"error":"Empènyer amb les mans","why":"El colze s'obre i es tanca i l'exercici es converteix en un press, que ja tens a TA‑03.","fix":"Força als avantbraços, colze fix a 90°.","cause":"Agafar-se a la màquina com si fos una nansa de press."},{"error":"Picar els coixins al centre","why":"El cop treu la tensió just al punt de contracció.","fix":"Atura't a un dit de tocar.","cause":"Tancar massa ràpid per acabar la repetició."}],"progression_html":"<p>15 repeticions netes a les tres sèries amb RIR 1 → un esglaó de pes i torna a 10. Si l'obertura encara no és la teva òptima, guanya primer un punt d'obertura amb el mateix pes: és més estímul, no menys.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=iIUWXNxc_Kk","title":"Pectoral Machine Technogym","confidence":"aproximada","note":"Màquina Pectoral de Technogym; no s'ha pogut comprovar que sigui el mateix model que M3. Si la teva màquina és diferent, fes cas de la fitxa."},"alternatives":{"principal":{"name":"Obertures amb manuelles en banc pla","why_equivalent":"Mateixa adducció de pit amb estirament al punt baix. Pectoral esternal com a motor.","adjust":"Pes molt inferior. Colzes lleugerament doblegats i fixos; baixa fins que el pit s'estiri, amb els braços una mica per darrere de la línia de les espatlles, i puja sense fer xocar les manuelles.","short":"mateixa adducció, pes lliure"},"contingencia":{"name":"Obertures amb manuelles en banc inclinat 15°","why_acceptable":"Conserva l'adducció amb una mica més de feina per a la part alta del pit.","adjust":"Mateix RIR; menys pes que en pla.","short":"adducció amb angle ascendent"},"not_equivalent":["Creuament a politja · fora de la regla (politges només per a braços i deltoides)","Fons · espatlla forçada"]},"v22":true,"setup_html":"<ol> <li>Regula el seient amb la palanca groga. Assegut i amb l'avantbraç al coixí, el <span class=\"key\">colze ha de quedar just per sota de l'alçada de l'espatlla</span>: per sobre, la feina se'n va a l'espatlla i al trapezi.</li> <li>Regula l'<span class=\"key\">obertura inicial</span> amb la maneta: el punt on notes un estirament clar al pit però cap molèstia al davant de l'espatlla. L'obertura és el que decideix l'estímul, i es guanya amb les setmanes.</li> <li>Esquena sencera al respatller i peus plans a terra. Omòplats enrere i avall, pit lleugerament obert.</li> <li>Recolza els avantbraços verticals contra els coixins, amb el colze a uns 90°. Les mans s'hi recolzen sense estrènyer: si empenyen, l'exercici es converteix en un mig press.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Tancament (2 s).</span> Porta els coixins cap al centre amb els avantbraços, com si volguessis ajuntar els colzes davant de l'estèrnum. L'esquena alta no se separa del respatller.</li> <li><span class=\"key\">Pausa tancada (1 s).</span> Estreny el pit amb els coixins a un dit de tocar-se, sense picar-los.</li> <li><span class=\"key\">Obertura (3 s).</span> Deixa tornar els braços enrere, frenant-los, fins a l'estirament que has fixat amb la maneta. La pila de pesos no arriba a reposar.</li> <li><span class=\"key\">Pausa oberta (1 s).</span> Aguanta l'estirament un segon, amb el pit obert, i torna a tancar sense rebotar.</li> </ol>","grip_title":"La presa","tags":{"primary":["Pit esternal"],"secondary":["Pit clavicular"],"minor":["Deltoide anterior"],"traits":["Adducció","Aïllament"]},"registre":{"proposta":"doble"}},{"key":"TB-S1a","position":"TB-S1","session":"TB","order":9,"name":"Pushdown de tríceps a politja","category":"OBERT","category_label":"Obert","machine":{"code":null,"label":"Torre de politja alta, barra o corda · no consta a l'inventari M1–M7"},"muscles":"Tríceps braquial, cap lateral i medial","prescription":{"series":"2–3","reps":"10–15","tempo":"2–3 s ↓","rest":"60 s","rir":"1"},"quick":{"do":["Només el cicle que a TA‑07 has fet el curl","Politja alta, agafador just per sobre de l'alçada del pit","Un peu lleugerament avançat si guanyes equilibri","Va al final: no allarguis la sessió per ell"],"dont":"Inclinar el tronc endavant per empènyer amb el pes del cos","feel":"Crema a la part de darrere del braç, del colze cap amunt","grip":"Pronada a la barra · neutra a la corda si el colze parla"},"grip_title":"La presa","theory_html":"<p><span class=\"k\">Què tapa aquesta posició.</span> Tronc B no té cap exercici directe de braç. Mentre facis Tronc C cada cicle no fa falta, però quan l'omets, i com que TA‑07 alterna entre curl i pushdown, <span class=\"k\">una de les dues meitats del braç cau a zero</span> aquell cicle. Això existeix per evitar-ho, i per res més.</p> <p><span class=\"k\">Quin tros del tríceps treballa.</span> Els tres caps estenen el colze; un d'ells creua també l'espatlla i només treballa a fons amb el braç amunt. Amb el colze al costat del cos, aquí treballen els altres dos: els que es veuen per fora del braç.</p> <p><span class=\"k\">Per què tres sèries i no sis.</span> Perquè el que limita el braç no és el múscul, és el tendó del colze. Recuperar tot el volum d'un cicle sense Tronc C voldria dir concentrar-lo en dos dies, i el primer que se'n ressent és el tendó. Tres sèries ben fetes donen la major part de l'estímul per una fracció del cost.</p>","cues":["Colze enganxat al costat: es queda quiet, no fa de palanca","Només es mou l'avantbraç; el tronc queda quiet","Extensió completa a baix, amb aturada d'un segon","Deixa pujar l'avantbraç per sobre de l'horitzontal","Omòplat avall abans de començar i mantingut tot el recorregut"],"setup_steps":["Barra recta o corda a la politja alta, amb l'agafador just per sobre de l'alçada del pit.","Dempeus, peus a l'amplada dels malucs i un peu lleugerament avançat si així guanyes equilibri.","Presa pronada a l'amplada de les espatlles amb barra, o neutra amb corda.","Colzes als costats i <span class=\"key\">omòplats avall</span> abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Barra o corda.</span> Totes dues treballen el cap lateral i el medial del tríceps; el cap llarg no el toca cap, perquè per a això el braç ha d'anar per sobre del cap.</p> <p><span class=\"k\">Quan triar la corda.</span> Si el colze parla. La presa neutra i la possibilitat de separar les puntes al final descarreguen l'articulació, a canvi de moure menys pes.</p> <p><span class=\"k\">Amplada amb barra.</span> A l'amplada de les espatlles. Més estreta, el canell es força; més ampla, els colzes s'obren i el pit comença a ajudar.</p>","execution_steps":["<span class=\"key\">Extensió (1 s).</span> Estén els colzes fins a baix sense moure el braç de lloc.","<span class=\"key\">Pausa (1 s)</span> amb el colze estès, sense bloquejar-lo de cop.","<span class=\"key\">Retorn (3 s).</span> Deixa pujar l'avantbraç fins a passar l'horitzontal.","<span class=\"key\">Pausa (1 s)</span> amb el tríceps estirat abans de la repetició següent."],"notice_html":"<p>Crema a la part de darrere del braç, del colze cap amunt. <span class=\"k\">Si notes pressió dins del colze</span>, hi ha massa pes o la presa és massa tancada: passa a la corda i baixa un esglaó. <span class=\"k\">Si ho notes a l'espatlla</span>, l'estàs encongint per ajudar.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> posa els dits de la mà lliure entre el colze i les costelles en una sèrie de prova. Si el colze es desenganxa durant l'extensió, s'han obert.</p> <p><span class=\"k\">Prova del segon a baix:</span> si pots aturar-te un segon amb el colze estès i res no tremola, el pes és correcte.</p> <p><span class=\"k\">Prova de l'endemà:</span> si el colze parla, la propera vegada fes-lo amb corda.</p>","errors":[{"error":"Moure el colze endavant i enrere","why":"Converteix el pushdown en una empenta i deixa entrar el pit i el dorsal.","fix":"Colze enganxat al costat. Només es mou l'avantbraç.","cause":"El pit i el dorsal poden amb molt més pes i s'afegeixen sols quan el tríceps ja no arriba."},{"error":"Bloquejar el colze de cop a baix","why":"El cop se'l menja l'articulació, i és el camí curt a la molèstia.","fix":"Arriba a l'extensió completa i atura-t'hi un segon, sense impacte.","cause":"És la manera ràpida d'arribar a baix quan el tríceps ja no hi arriba sol."},{"error":"Encongir l'espatlla per ajudar","why":"Treu tensió directa del tríceps.","fix":"Omòplat avall de la primera a l'última repetició.","cause":"El trapezi s'afegeix quan la càrrega passa del que el tríceps pot moure."}],"progression_html":"<p>15 repeticions netes a totes les sèries amb la pausa d'un segon a baix → següent esglaó. Si en pujar de pes el tronc s'inclina, torna enrere: en una posició oberta el pes no és l'objectiu, i el cost d'equivocar-se el paga el colze.</p>","note_html":"<span class=\"k\">Regla del braç.</span> El cicle que completes Tronc C, TA‑07 es manté a 2 sèries i aquesta posició no es fa. El cicle que l'omets, TA‑07 puja a 3 sèries i fas l'altra variant aquí. Aquest full és la variant de tríceps: la fas el cicle que a TA‑07 has fet el curl.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>Si vols exprimir l'última sèrie: en fallar, descansa 15 o 20 segons i continua amb el mateix pes. L'alternativa, l'aguantada, és al capítol «Tècniques d'intensitat».</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=w_viR9hVi4A","title":"Tricep Pushdown: Proper Form, Attachments, and the Biggest Mistake Killing Your Gains","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Press tancat al Chest Press (M5), mans juntes","why_equivalent":"Extensió de colze amb esquena recolzada i trajectòria guiada. Amb les mans juntes, el tríceps és el motor.","adjust":"Càrrega molt més alta que a la politja: busca el mateix RIR, no el mateix pes.","short":"extensió amb esquena recolzada"},"contingencia":{"name":"Fons assistit a M2, tronc vertical","why_acceptable":"El tronc vertical desplaça la feina cap al tríceps. Perd l'aïllament i afegeix demanda d'espatlla.","adjust":"Més assistència de la que creus; atura't si l'espatlla parla abans que el braç.","short":"tríceps amb tronc vertical"},"not_equivalent":["Fons entre bancs · espatlla forçada","Press francès amb barra · colze descobert"]},"v22":true,"setup_html":"<ol> <li>Barra recta o corda a la politja alta, amb l'agafador just per sobre de l'alçada del pit.</li> <li>Dempeus, peus a l'amplada dels malucs i un peu lleugerament avançat si així guanyes equilibri.</li> <li>Presa pronada a l'amplada de les espatlles amb barra, o neutra amb corda.</li> <li>Colzes als costats i <span class=\"key\">omòplats avall</span> abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Extensió (1 s).</span> Estén els colzes fins a baix sense moure el braç de lloc.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el colze estès, sense bloquejar-lo de cop.</li> <li><span class=\"key\">Retorn (3 s).</span> Deixa pujar l'avantbraç fins a passar l'horitzontal.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el tríceps estirat abans de la repetició següent.</li> </ol>","tags":{"primary":["Tríceps braquial, cap lateral i medial"],"secondary":[],"minor":[],"traits":["Posició de rescat"]},"registre":{"opcions":{"titol":"Eina","valors":["Barra recta","Corda"]},"proposta":"doble"}},{"key":"TB-S1b","position":"TB-S1","session":"TB","order":10,"name":"Curl de bíceps amb barra EZ","category":"OBERT","category_label":"Obert","machine":{"code":null,"label":"Barra EZ · no consta a l'inventari M1–M7"},"muscles":"Bíceps braquial · braquial","prescription":{"series":"2–3","reps":"10–15","tempo":"2–3 s ↓","rest":"60 s","rir":"1"},"quick":{"do":["Només el cicle que a TA‑07 has fet el pushdown","Dempeus, peus a l'amplada dels malucs i genolls tous","Barra agafada per les corbes interiors, presa supina","Va al final: no allarguis la sessió per ell"],"dont":"Gronxar el tronc per llançar la barra amunt","feel":"Crema al ventre del bíceps, sense que el tronc hi participi","grip":"Supina, a l'angle que dona la barra EZ"},"grip_title":"La presa","theory_html":"<p><span class=\"k\">Què tapa aquesta posició.</span> A Tronc B el bíceps només treballa acompanyant la dominada, que és feina indirecta amb l'esquena de motor. Quan Tronc C cau i a TA‑07 aquell cicle toca el pushdown, <span class=\"k\">el bíceps es queda sense cap sèrie directa</span>.</p> <p><span class=\"k\">Per què la barra EZ i no la recta.</span> El bíceps fa dues coses: doblegar el colze i girar el palmell amunt. La barra recta fixa la mà en supinació completa i obliga el canell i el colze a acceptar aquella posició; la corba de l'EZ deixa la mà a mig camí, amb gairebé la mateixa feina per al bíceps i molt menys peatge per a les articulacions de sota.</p> <p><span class=\"k\">Per què tres sèries i no sis.</span> El que limita el braç és el tendó del colze, no el múscul. Concentrar el volum perdut compra tendinitis, no múscul.</p>","cues":["Colze enganxat al costat: no viatja endavant en pujar","El tronc i els talons queden quiets; si es gronxa, hi ha massa pes","Puja fins on el colze mana, no fins on arriba la barra","Baixada de tres segons fins a l'extensió completa","Omòplat avall: no encongeixis per acabar l'última repetició"],"setup_steps":["Dempeus, peus a l'amplada dels malucs i genolls tous.","Barra EZ amb <span class=\"key\">presa supina</span> a les corbes interiors, mans a l'amplada de les espatlles.","Braços estesos, barra a les cuixes i colzes ja enganxats als costats.","Omòplats avall i costelles baixes abans de la primera repetició."],"grip_html":"<p><span class=\"k\">Per què la presa girada canvia poc.</span> Amb la corba de l'EZ el palmell queda a mig camí entre supinat i neutre: el bíceps continua sent el motor i el braquial hi participa una mica més.</p> <p><span class=\"k\">Amplada.</span> Les corbes interiors, a l'amplada de les espatlles. Si per agafar la barra has de separar els colzes de les costelles, la presa és massa ampla per a tu.</p> <p><span class=\"k\">Si el colze parla.</span> Passa a manuelles amb el palmell supinat o a la corda de politja. El que no s'ha de fer és insistir amb la barra recta.</p>","execution_steps":["<span class=\"key\">Pujada (1 s).</span> Flexiona el colze sense moure el braç de lloc, fins que l'avantbraç passi la vertical.","<span class=\"key\">Pausa (1 s)</span> a dalt, on la tensió és màxima, no on la barra descansa sobre el colze avançat.","<span class=\"key\">Baixada (3 s)</span> fins a l'extensió completa, sense deixar-la caure.","<span class=\"key\">Pausa (1 s)</span> amb el braç estès abans de la repetició següent."],"notice_html":"<p>Crema al ventre del bíceps. <span class=\"k\">Si ho notes a l'avantbraç</span>, estàs agafant massa fort o la presa és massa ampla. <span class=\"k\">Si ho notes al colze per dins</span>, baixa un esglaó i allarga la baixada: és el senyal que arriba abans de la molèstia.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> amb els braços estesos han de tocar les costelles i continuar-hi tocant a dalt.</p> <p><span class=\"k\">Prova de la paret:</span> fes una sèrie amb els malucs i les espatlles tocant una paret. Si no pots completar-la, el pes era massa i el tronc ajudava.</p> <p><span class=\"k\">Prova de la baixada:</span> si els tres segons es converteixen en un, has passat el punt útil de la sèrie.</p>","errors":[{"error":"Gronxar el tronc per llançar la barra","why":"El moviment el fa el maluc i el bíceps només aguanta el pes al final.","fix":"Malucs i espatlles contra una paret imaginària. Si cal impuls, sobra pes.","cause":"El bíceps és petit i s'esgota de pressa; el maluc és el múscul gran més a prop."},{"error":"Portar el colze endavant per pujar més amunt","why":"Passat cert punt, el deltoide anterior fa la feina i el bíceps perd tensió justament a dalt.","fix":"Colze quiet al costat. El recorregut acaba on el colze deixa de manar.","cause":"A dalt del tot la barra gairebé no pesa si el colze s'avança."},{"error":"Deixar caure la barra a la baixada","why":"La baixada controlada és la meitat de l'estímul, i és gratis.","fix":"Tres segons comptats fins a l'extensió completa.","cause":"La baixada no es veu al comptador de repeticions."}],"progression_html":"<p>15 repeticions netes a totes les sèries amb la baixada de tres segons intacta → següent parell de discos. Si en pujar de pes la baixada s'escurça o el tronc es mou, torna enrere.</p>","note_html":"<span class=\"k\">Regla del braç.</span> El cicle que completes Tronc C, TA‑07 es manté a 2 sèries i aquesta posició no es fa. El cicle que l'omets, TA‑07 puja a 3 sèries i fas l'altra variant aquí. Aquest full és la variant de bíceps: la fas el cicle que a TA‑07 has fet el pushdown.","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>Si vols exprimir l'última sèrie: en fallar, descansa 15 o 20 segons i torna-hi amb el mateix pes. L'alternativa, els parcials, és al capítol «Tècniques d'intensitat».</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=5NsFLGUf0Fo","title":"How To EZ Bar Curl With Perfect Form (Grow Your Biceps)","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Curl amb manuelles, presa supina","why_equivalent":"Mateixa flexió de colze amb el braç al costat del tronc i cada braç pel seu compte.","adjust":"Menys pes per braç del que sumaria la barra; el palmell es manté supinat des de baix.","short":"mateixa flexió, un braç cada costat"},"contingencia":{"name":"Curl a politja amb corda","why_acceptable":"Tensió constant i presa neutra, la més tolerant si el colze parla.","adjust":"Menys pes del que esperaries: la tensió constant fatiga abans.","short":"tensió constant, presa neutra"},"not_equivalent":["Curl amb barra recta · canell fix","Dominada supina · component d'esquena"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs i genolls tous.</li> <li>Barra EZ amb <span class=\"key\">presa supina</span> a les corbes interiors, mans a l'amplada de les espatlles.</li> <li>Braços estesos, barra a les cuixes i colzes ja enganxats als costats.</li> <li>Omòplats avall i costelles baixes abans de la primera repetició.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (1 s).</span> Flexiona el colze sense moure el braç de lloc, fins que l'avantbraç passi la vertical.</li> <li><span class=\"key\">Pausa (1 s)</span> a dalt, on la tensió és màxima, no on la barra descansa sobre el colze avançat.</li> <li><span class=\"key\">Baixada (3 s)</span> fins a l'extensió completa, sense deixar-la caure.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el braç estès abans de la repetició següent.</li> </ol>","tags":{"primary":["Bíceps braquial"],"secondary":["Braquial"],"minor":[],"traits":["Posició de rescat"]},"registre":{"proposta":"doble"}},{"key":"TC-01","position":"TC-01","session":"TC","order":1,"name":"Curl de bíceps amb barra EZ","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Barra EZ · no consta a l'inventari M1–M7"},"muscles":"Bíceps braquial · braquial","prescription":{"series":"4","reps":"8–12","tempo":"2–3 s ↓","rest":"90 s","rir":"1"},"quick":{"do":["Hi entres en fred: aquí és on poses la càrrega real","Dempeus, peus a l'amplada dels malucs, abdomen lleugerament estret","Barra agafada per les corbes interiors, presa supina","Colzes enganxats a les costelles abans de la primera repetició"],"dont":"Gronxar el tronc per moure més pes","feel":"Crema al bíceps sense que el tronc hi participi","grip":"Supina, a l'angle que dona la barra EZ"},"grip_title":"La presa","theory_html":"<p><span class=\"k\">Què fa el bíceps.</span> Dues coses, i totes dues importen: <span class=\"k\">doblega el colze</span> i <span class=\"k\">gira el palmell cap amunt</span>. Per això la presa no és una qüestió de comoditat sinó de múscul: amb el palmell amunt mana el bíceps; amb el palmell neutre, el braquial, que queda a sota; amb el palmell avall, el braquioradial, que és de l'avantbraç. Tres preses, tres músculs.</p> <p><span class=\"k\">Per què aquí en fred.</span> A Tronc C hi entres descansat i sense pit ni esquena al davant. Aquí busques la càrrega real i la progressió; les dues sèries de Tronc A són volum barat amb el múscul ja fatigat.</p> <p><span class=\"k\">Per què la barra EZ.</span> La seva corba deixa la mà a mig camí entre supinada i neutra, i descarrega canell i colze. Hi perds molt poc bíceps. Amb barra recta, molta gent nota molèstia al canell abans que el múscul arribi a la fallada, i llavors el límit de la sèrie no és el que volies entrenar.</p>","cues":["El colze queda quiet, enganxat a les costelles","Puja sense que el colze viatgi endavant","Contracció d'un segon a dalt, sense deixar descansar la barra","Baixada de 3 s fins a extensió gairebé completa","Tronc immòbil i talons a terra de la primera a l'última repetició"],"setup_steps":["Dempeus, peus a l'amplada dels malucs i abdomen lleugerament estret.","Agafa la barra EZ per les <span class=\"key\">corbes interiors</span>, amb presa supina.","Colzes enganxats a les costelles: es queden quiets, és l'avantbraç qui es mou.","Braços estesos, sense que la barra descansi sobre les cuixes."],"grip_html":"<p><span class=\"k\">Per què la presa girada canvia poc.</span> El bíceps fa dues coses: doblegar el colze i girar el palmell amunt. Amb la corba de l'EZ el palmell queda a mig camí, de manera que el bíceps continua manant i el braquial hi participa una mica més.</p> <p><span class=\"k\">Amplada.</span> Les corbes interiors. Si per agafar la barra has de separar els colzes de les costelles, la presa és massa ampla per a tu.</p> <p><span class=\"k\">Si el colze parla.</span> Passa a manuelles amb el palmell supinat des de baix, o a la corda de politja, que és la presa més tolerant. El que no s'ha de fer és insistir amb la barra recta.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Flexiona el colze sense que es mogui endavant.","<span class=\"key\">Contracció (1 s)</span> a dalt, sense arribar al punt on la barra descansa sobre el colze avançat.","<span class=\"key\">Baixada (3 s)</span> fins a extensió gairebé completa.","<span class=\"key\">Pausa (1 s)</span> amb el braç estès abans de la repetició següent."],"notice_html":"<p>Crema local i clara al bíceps, sense que el tronc hi hagi participat. <span class=\"k\">Si notes el canell</span>, la presa no és la teva: canvia d'eina abans que d'exercici. <span class=\"k\">Si notes l'avantbraç més que el braç</span>, estàs estrenyent massa la barra.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> han de tocar les costelles amb els braços estesos i continuar-hi tocant a dalt.</p> <p><span class=\"k\">Prova de la paret:</span> fes una sèrie amb l'esquena i el cap tocant una paret. El pes que puguis moure sense desenganxar-te és el teu pes real.</p>","errors":[{"error":"Gronxar el tronc","why":"És el senyal universal de massa pes al curl.","fix":"La prova de la paret decideix el pes.","cause":"El bíceps és petit i s'esgota de pressa; quan ja no pot, el tronc és el múscul gran més a prop."},{"error":"Els colzes viatgen endavant","why":"Converteix la part alta del recorregut en un descans i treu la tensió justament on la volies.","fix":"Colzes enganxats a les costelles.","cause":"A dalt del tot la barra gairebé no pesa si el colze s'avança."},{"error":"No estendre del tot a baix","why":"Perds la part estirada, que és la que més estimula.","fix":"Braç gairebé recte abans de cada repetició.","cause":"L'extensió completa és on el bíceps té menys força, i és la part que es retalla sola."}],"progression_html":"<p>12 repeticions netes a les quatre sèries amb el tronc immòbil → un increment i tornada a 8. Compara cada variant amb ella mateixa: el curl inclinat mou molt menys pes i no és un retrocés.</p>","note_html":"","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie: <span class=\"k\">pausa curta</span> —en fallar, descansa 15 o 20 segons amb la barra a les cuixes i continua amb el mateix pes—. L'alternativa, els parcials, és al capítol «Tècniques d'intensitat».</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=5NsFLGUf0Fo","title":"How To EZ Bar Curl With Perfect Form (Grow Your Biceps)","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Curl amb manuelles, presa supina","why_equivalent":"Mateixa flexió de colze amb el braç al costat del tronc i cada braç pel seu compte.","adjust":"Menys pes per braç del que sumaria la barra; el palmell supinat des de baix, sense girar-lo a mig recorregut.","short":"mateixa flexió, un braç cada costat"},"contingencia":{"name":"Curl a politja amb corda","why_acceptable":"Tensió constant i presa neutra, la més tolerant si el colze parla.","adjust":"Menys pes del que esperaries: la tensió constant fatiga abans.","short":"tensió constant, presa neutra"},"not_equivalent":["Curl amb barra recta · canell fix","Dominada supina · component d'esquena"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs i abdomen lleugerament estret.</li> <li>Agafa la barra EZ per les <span class=\"key\">corbes interiors</span>, amb presa supina.</li> <li>Colzes enganxats a les costelles: es queden quiets, és l'avantbraç qui es mou.</li> <li>Braços estesos, sense que la barra descansi sobre les cuixes.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Flexiona el colze sense que es mogui endavant.</li> <li><span class=\"key\">Contracció (1 s)</span> a dalt, sense arribar al punt on la barra descansa sobre el colze avançat.</li> <li><span class=\"key\">Baixada (3 s)</span> fins a extensió gairebé completa.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el braç estès abans de la repetició següent.</li> </ol>","tags":{"primary":["Bíceps braquial"],"secondary":["Braquial"],"minor":[],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TC-01b","position":"TC-01","session":"TC","order":2,"name":"Curl inclinat amb manuelles","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Banc regulable i manuelles"},"muscles":"Bíceps braquial, cap llarg · braquial","prescription":{"series":"4","reps":"8–12","tempo":"2–3 s ↓","rest":"90 s","rir":"1"},"quick":{"do":["Banc regulable a 45–60°","Gluti al fons del seient; cap, espatlles i gluti recolzats","Braços penjant en vertical, amb els palmells endavant","Peus plans a terra"],"dont":"Portar els colzes endavant a la pujada: perds l'estirament que justifica l'exercici","feel":"El bíceps estirant-se al punt baix, més amunt del braç que al curl dempeus","grip":"Supina completa — palmells amunt en tot el recorregut"},"theory_html":"<p><span class=\"k\">Per què canviar la posició del braç canvia l'exercici.</span> El bíceps no creua només el colze: també creua l'espatlla. Això vol dir que <span class=\"k\">la seva longitud depèn d'on tens el braç</span>. Amb el braç per darrere del tronc, com passa en aquest banc, la part exterior del múscul —el cap llarg— treballa estirada. Amb el braç per davant, com al predicador, l'èmfasi passa a la part interior. Dempeus queda al mig.</p> <p><span class=\"k\">Per què amb el tronc recolzat.</span> El banc et treu el balanceig: no et pots ajudar amb l'esquena ni amb les cames, i tota la feina recau al braç. Mouràs menys pes que amb la barra EZ, i això no és un retrocés: és el preu d'eliminar les trampes.</p> <p><span class=\"k\">El preu de les manuelles.</span> Al punt baix, amb el braç penjant, la gravetat deixa d'oferir resistència. A canvi guanyes l'estirament i que cada braç vagi pel seu compte, cosa que fa aflorar les diferències entre costats en lloc d'amagar-les.</p>","cues":["Palmells amunt des del primer centímetre","El colze apunta a terra i no avança","Baixa en 3 s fins a estendre el braç del tot","Cap i espatlles sempre tocant el banc"],"setup_steps":["Banc regulable a <span class=\"key\">45–60°</span>. Com més vertical, menys estirament; com més tombat, més estirament i més exigència per al davant de l'espatlla. Comença a 60° i baixa un punt quan el moviment et sigui còmode.","Seu amb el gluti al fons del seient i l'esquena, les espatlles i el cap recolzats. Peus plans a terra.","Deixa penjar els braços en vertical, una manuella a cada costat, amb els <span class=\"key\">palmells mirant endavant</span> des del principi.","Espatlles lleugerament enrere contra el respatller: així no rodaran endavant quan el pes pugi."],"grip_html":"<p><span class=\"k\">Supinació completa, des del primer centímetre.</span> Palmells mirant endavant amb el braç penjat i cap amunt quan puja. És la posició en què el bíceps fa les seves dues funcions a la vegada —doblegar el colze i girar el palmell amunt— i per tant la que el treballa més.</p> <p><span class=\"k\">No giris la manuella durant el recorregut.</span> Si comences amb el palmell encarat al cos i el gires a mig camí, la part baixa la fan el braquial i el braquioradial, just on aquest exercici havia de posar el bíceps estirat. Els vídeos de referència el consideren l'error principal del curl.</p> <p><span class=\"k\">Si et molesta el canell o el colze.</span> No forcis la supinació. Aquell cicle fes la variant EZ, que té la presa lleugerament girada i és més amable amb el canell.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Doblega el colze sense moure'l de lloc: el colze continua apuntant a terra i el braç no s'avança.","<span class=\"key\">Pausa alta (1 s).</span> Estreny el bíceps amb les manuelles a prop de les espatlles, sense que el colze vingui endavant per acabar el recorregut.","<span class=\"key\">Baixada (3 s).</span> Controlada fins a estendre el braç del tot, notant l'estirament.","<span class=\"key\">Pausa baixa (1 s).</span> Braç estès i palmell endavant. Torna a pujar sense impuls."],"notice_html":"<p>Un estirament clar a la part alta del braç al punt baix, diferent del que notes dempeus: aquesta és la sensació que justifica la variant. <span class=\"k\">Si el que notes és el davant de l'espatlla</span>, el banc és massa tombat per a tu. <span class=\"k\">Si notes més l'avantbraç</span>, les manuelles han girat durant la pujada.</p>","verify_html":"<p><span class=\"k\">Prova del colze:</span> de costat al mirall, el colze és al mateix lloc a baix i a dalt. Si a dalt ha avançat, has acabat el curl amb l'espatlla.</p> <p><span class=\"k\">Prova del respatller:</span> el cap i les espatlles no se separen del banc en tota la sèrie.</p> <p><span class=\"k\">Prova del palmell:</span> a mig recorregut, el palmell mira al sostre, no cap a tu.</p>","errors":[{"error":"Colzes que avancen a la pujada","why":"El braç surt de darrere del tronc i perds l'estirament del cap llarg, que és el motiu de l'exercici; a més, l'espatlla hi entra.","fix":"Atura la pujada on el colze encara no s'ha mogut.","cause":"És la manera de fer passar un pes massa alt per la part final."},{"error":"Girar les manuelles a mig recorregut","why":"La part baixa passa al braquial i al braquioradial, i el bíceps estirat —l'avantatge d'aquesta variant— es perd.","fix":"Palmells endavant des del primer centímetre.","cause":"La supinació completa costa més, i quan cansa la mà busca la posició neutra."},{"error":"Retallar la baixada","why":"Sense l'estirament del punt baix, és un curl dempeus més incòmode.","fix":"Braç estès del tot a cada repetició; si no hi arribes, baixa pes.","cause":"Les últimes repeticions surten més fàcils si no es baixa del tot."}],"progression_html":"<p>12 repeticions netes a les quatre sèries amb RIR 1 → següent parell de manuelles i torna a 8. Compara aquesta variant només amb ella mateixa: la càrrega no té res a veure amb la del curl EZ.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=rAx_tf13V5k","title":"Incline Dumbbell Curl (How To | Form Tutorial)","confidence":"alta","note":"Mateix exercici i mateix angle de banc (45–60°)."},"alternatives":{"principal":{"name":"Curl a politja d'esquena a la torre (curl bayesià)","why_equivalent":"Mateix braç per darrere del tronc, amb tensió constant també al punt baix. Es fa dempeus, sense el suport del banc.","adjust":"Un braç cada vegada, amb el cable venint de darrere; pes baix i sense balanceig.","short":"braç enrere, tensió constant"},"contingencia":{"name":"Curl amb manuelles dempeus, supinació completa","why_acceptable":"Conserva la supinació i el treball de cada braç per separat. Perd l'estirament del cap llarg.","adjust":"Mateix RIR; sol permetre un parell de manuelles més.","short":"mateix gest, menys estirament"},"not_equivalent":["Curl predicador · braç per davant: l'èmfasi passa al cap curt","Curl martell · presa neutra: treballa sobretot el braquial"]},"v22":true,"setup_html":"<ol> <li>Banc regulable a <span class=\"key\">45–60°</span>. Com més vertical, menys estirament; com més tombat, més estirament i més exigència per al davant de l'espatlla. Comença a 60° i baixa un punt quan el moviment et sigui còmode.</li> <li>Seu amb el gluti al fons del seient i l'esquena, les espatlles i el cap recolzats. Peus plans a terra.</li> <li>Deixa penjar els braços en vertical, una manuella a cada costat, amb els <span class=\"key\">palmells mirant endavant</span> des del principi.</li> <li>Espatlles lleugerament enrere contra el respatller: així no rodaran endavant quan el pes pugi.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Doblega el colze sense moure'l de lloc: el colze continua apuntant a terra i el braç no s'avança.</li> <li><span class=\"key\">Pausa alta (1 s).</span> Estreny el bíceps amb les manuelles a prop de les espatlles, sense que el colze vingui endavant per acabar el recorregut.</li> <li><span class=\"key\">Baixada (3 s).</span> Controlada fins a estendre el braç del tot, notant l'estirament.</li> <li><span class=\"key\">Pausa baixa (1 s).</span> Braç estès i palmell endavant. Torna a pujar sense impuls.</li> </ol>","grip_title":"La presa","tags":{"primary":["Bíceps braquial, cap llarg"],"secondary":["Braquial"],"minor":[],"traits":["Estirament"]},"registre":{"proposta":"doble"}},{"key":"TC-02","position":"TC-02","session":"TC","order":3,"name":"Pushdown de tríceps a politja","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Torre de politja alta, barra, corda o barra en V · no consta a l'inventari M1–M7"},"muscles":"Tríceps braquial, cap lateral i medial","prescription":{"series":"3","reps":"8–12","tempo":"2–3 s ↓","rest":"90 s","rir":"1"},"quick":{"do":["Politja alta; un pas enrere i tronc lleugerament inclinat endavant","Tria l'eina abans de començar i anota-la: no mouen el mateix pes","Colzes enganxats als costats, com al curl","Agafa amb la tensió ja present, sense estirades inicials"],"dont":"Inclinar el tronc per empènyer amb el pes del cos","feel":"Crema a la part de darrere del braç, del colze cap amunt","grip":"Pronada a la barra · neutra a la corda · semiprona a la barra en V"},"grip_title":"La presa","theory_html":"<p><span class=\"k\">Per què el tríceps és el múscul del braç.</span> Té tres caps i tots tres fan el mateix: <span class=\"k\">estendre el colze</span>. Junts són més grans que el bíceps, i la major part del volum del braç ve d'aquí. La diferència entre ells és on s'agafen: un creua també l'espatlla i només treballa a fons amb el braç per sobre del cap. Els altres dos —els que es veuen per fora del braç— són els que treballes aquí.</p> <p><span class=\"k\">Per què no en calen més sèries.</span> Aquests dos caps intervenen en tota la funció d'empènyer: press inclinat, chest press, press d'espatlles. Amb la quantitat d'empentes que porta el cicle, el pushdown és la part del tríceps més coberta indirectament, i per això té tres sèries i no quatre. El que no el cobreix res és l'exercici amb el braç amunt.</p> <p><span class=\"k\">Per què aquí en fred.</span> A Tronc A aquesta posició és volum barat amb el múscul fatigat. Aquí és on hi busques càrrega i progressió reals.</p>","cues":["Només es mou l'avantbraç; el tronc queda quiet","Extensió completa al punt baix, sense bloquejar de cop","Deixa pujar l'avantbraç clarament per sobre de l'horitzontal","Colzes fixos: si s'obren, el pit ha començat a ajudar"],"setup_steps":["Politja alta amb la barra, la corda o la barra en V.","Un pas enrere, peus a l'amplada dels malucs i tronc <span class=\"key\">lleugerament inclinat endavant</span>.","Colzes enganxats als costats; comprova-ho amb els dits de la mà lliure abans de la primera sèrie.","Agafa l'eina amb els braços ja doblegats i la tensió present."],"grip_html":"<p><span class=\"k\">Les tres eines treballen el mateix.</span> El cap lateral i el medial. El cap llarg no el toca cap: per a això el braç ha d'anar per sobre del cap. Tria per canell i per càrrega, no esperant un múscul diferent.</p> <p><span class=\"k\">Corda, presa neutra.</span> Palmells encarats. La més còmoda per al canell; permet separar les puntes al final, cosa que fa notar millor la contracció i dona una mica més de rang. A canvi, no deixa moure tant de pes.</p> <p><span class=\"k\">Barra recta, presa pronada.</span> Palmells cap avall. La més estable i la que permet més càrrega, a canvi de fixar el canell en una posició menys natural. La <span class=\"k\">barra en V</span> queda enmig: presa semiprona, còmoda com la corda i estable com la barra. Alterna-les entre cicles i apunta quina fas, perquè el pes no és comparable.</p>","execution_steps":["<span class=\"key\">Extensió (2 s).</span> Estén el colze fins que el braç quedi recte. Amb corda, separa les mans al final.","<span class=\"key\">Contracció (1 s)</span> al punt baix, sense bloquejar de cop.","<span class=\"key\">Retorn (3 s)</span> fins que l'avantbraç passi clarament l'horitzontal.","<span class=\"key\">Pausa (1 s)</span> amb el tríceps estirat abans de la repetició següent."],"notice_html":"<p>Crema a la part de darrere del braç, del colze cap amunt. <span class=\"k\">Si el que notes és el pit o el davant de l'espatlla</span>, els colzes s'han obert i has començat a empènyer. <span class=\"k\">Si notes pressió dins del colze</span>, baixa un esglaó i passa a la corda: és el senyal que arriba abans de la molèstia. <span class=\"k\">Si no notes res</span>, el retorn s'està quedant curt.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> posa els dits de la mà lliure entre el colze i les costelles en una sèrie de prova. Si es desenganxen durant l'extensió, s'han obert.</p> <p><span class=\"k\">Prova del tronc:</span> si t'has d'inclinar més per acabar la sèrie, baixa la càrrega.</p> <p><span class=\"k\">Prova del rang:</span> si l'avantbraç no puja prou, treballes mig recorregut i et perds la part estirada del tríceps.</p>","errors":[{"error":"Els colzes s'obren o pugen","why":"El pit i el dorsal comencen a ajudar i el tríceps en fa menys.","fix":"Colzes fixos als costats tota la sèrie.","cause":"Obrir el colze converteix l'extensió en una empenta, i el pit pot amb molt més pes."},{"error":"Empènyer amb el cos","why":"Inclinar-se afegeix el pes del cos a la barra.","fix":"Tronc immòbil; si no, baixa la càrrega.","cause":"És el recurs automàtic quan el tríceps ja no arriba."},{"error":"Rang curt a dalt","why":"La part alta és on el tríceps treballa més estirat.","fix":"Puja fins que el colze quedi ben flexionat.","cause":"És on el tríceps té menys força, i el retorn es queda curt sol."}],"progression_html":"<p>12 repeticions netes a les tres sèries amb els colzes fixos → un increment i tornada a 8. Si els colzes s'obren en pujar de pes, torna enrere.</p>","note_html":"","extra_sections":[{"title":"Quan vulguis exprimir l'última sèrie","html":"<p>A l'última sèrie, <span class=\"k\">aguantar a baix</span>: a les últimes repeticions atura't amb el colze estès i mantén uns segons abans de deixar pujar la barra. És la manera d'afegir tensió sense afegir pes, que és el que el colze agraeix.</p>"}],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=w_viR9hVi4A","title":"Tricep Pushdown: Proper Form, Attachments, and the Biggest Mistake Killing Your Gains","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Press tancat al Chest Press (M5), mans juntes","why_equivalent":"Extensió de colze amb esquena recolzada i trajectòria guiada; amb les mans juntes el tríceps és el motor.","adjust":"Càrrega molt més alta que a la politja: busca el mateix RIR, no el mateix pes.","short":"extensió amb esquena recolzada"},"contingencia":{"name":"Fons assistit a M2, tronc vertical","why_acceptable":"El tronc vertical desplaça la feina cap al tríceps. Perd l'aïllament i afegeix demanda d'espatlla.","adjust":"Més assistència de la que creus; atura't si l'espatlla parla abans que el braç.","short":"tríceps amb tronc vertical"},"not_equivalent":["Fons entre bancs · espatlla forçada","Press francès amb barra dempeus · colze descobert"]},"v22":true,"setup_html":"<ol> <li>Politja alta amb la barra, la corda o la barra en V.</li> <li>Un pas enrere, peus a l'amplada dels malucs i tronc <span class=\"key\">lleugerament inclinat endavant</span>.</li> <li>Colzes enganxats als costats; comprova-ho amb els dits de la mà lliure abans de la primera sèrie.</li> <li>Agafa l'eina amb els braços ja doblegats i la tensió present.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Extensió (2 s).</span> Estén el colze fins que el braç quedi recte. Amb corda, separa les mans al final.</li> <li><span class=\"key\">Contracció (1 s)</span> al punt baix, sense bloquejar de cop.</li> <li><span class=\"key\">Retorn (3 s)</span> fins que l'avantbraç passi clarament l'horitzontal.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el tríceps estirat abans de la repetició següent.</li> </ol>","tags":{"primary":["Tríceps braquial, cap lateral i medial"],"secondary":[],"minor":[],"traits":[]},"registre":{"opcions":{"titol":"Eina","valors":["Corda","Barra recta","Barra en V"]},"proposta":"doble"}},{"key":"TC-03","position":"TC-03","session":"TC","order":4,"name":"Curl martell amb manuelles","category":"VAR","category_label":"Fix · variant","machine":{"code":null,"label":"Manuelles · no consta a l'inventari M1–M7"},"muscles":"Braquial · braquioradial · bíceps","prescription":{"series":"2","reps":"10–15","tempo":"2–3 s ↓","rest":"60 s","rir":"0–1"},"quick":{"do":["Dempeus, peus a l'amplada dels malucs","Una manuella a cada mà, palmells encarats","Colzes enganxats a les costelles abans de començar","Per defecte, les dues mans alhora: és el que fa que la sessió càpiga"],"dont":"Girar el palmell amunt durant la pujada i tornar al curl normal","feel":"Feina a sota del bíceps i a l'avantbraç","grip":"Neutra — palmells encarats de principi a fi"},"grip_title":"La presa","theory_html":"<p><span class=\"k\">El múscul que no es veu i es nota.</span> A sota del bíceps hi ha el <span class=\"k\">braquial</span>, i a l'avantbraç el braquioradial. Tots dos treballen millor amb el palmell encarat. El braquial no s'aprecia directament —queda tapat— però quan creix <span class=\"k\">empeny el bíceps cap amunt</span> i fa que el braç es vegi més gruixut de perfil. És el motiu pel qual val la pena un exercici de presa neutra i no només curls.</p> <p><span class=\"k\">Per què dues sèries i no tres.</span> Perquè des d'aquesta revisió el programa té molta presa neutra a l'esquena: les dominades de Tronc B i el rem de Tronc A es fan amb els palmells encarats, i el braquial hi treballa a cada repetició. Amb aquest treball indirecte, dues sèries directes basten.</p> <p><span class=\"k\">Per què va entre el curl i el tríceps.</span> Alternar tirada i empenta dins de la sessió reparteix la fatiga i evita que dos exercicis seguits demanin el mateix.</p>","cues":["Presa neutra de principi a fi: els polzes apunten al sostre","El colze queda quiet i no viatja endavant","Contracció d'un segon a dalt","Baixada de 3 s fins a extensió gairebé completa","Tronc immòbil i talons a terra, com a la resta dels curls"],"setup_steps":["Dempeus, peus a l'amplada dels malucs.","Una manuella a cada mà amb <span class=\"key\">presa neutra</span>: palmells encarats.","Colzes enganxats a les costelles i fixos tota la sèrie.","Decideix si les faràs alhora o alternades i no ho canviïs dins de la sèrie."],"grip_html":"<p><span class=\"k\">Presa neutra, i no gira.</span> Palmells encarats del principi al final. Si acabes amb el palmell cap amunt, has tornat al curl normal i el braquial se'n queda fora.</p> <p><span class=\"k\">Alhora o alternades.</span> Per defecte, totes dues mans alhora: és més ràpid i la sessió ja va justa de temps. Alternades permeten concentrar-se en cada braç i sovint moure una mica més de pes, i són una bona opció els dies que vagis sobrat.</p> <p><span class=\"k\">La trajectòria.</span> El braç puja per davant del cos, no cap endins. Portar les manuelles cap al centre del pit escurça el recorregut i treu feina al braquial.</p>","execution_steps":["<span class=\"key\">Pujada (2 s).</span> Flexiona el colze sense que viatgi endavant, mantenint el palmell encarat.","<span class=\"key\">Contracció (1 s)</span> a dalt, sense arribar al punt on la manuella descansa.","<span class=\"key\">Baixada (3 s)</span> fins a extensió gairebé completa.","<span class=\"key\">Pausa (1 s)</span> amb el braç estès abans de la repetició següent."],"notice_html":"<p>Feina a sota del bíceps i a l'avantbraç, en un punt diferent del que notes amb la barra EZ. <span class=\"k\">Si notes exactament el mateix punt que al curl EZ</span>, el palmell ha girat durant la pujada i has tornat al curl normal.</p>","verify_html":"<p><span class=\"k\">Prova de la presa:</span> al punt alt, els polzes han d'apuntar cap al sostre.</p> <p><span class=\"k\">Prova del tronc:</span> si et gronxes per arrencar, el pes és excessiu.</p> <p><span class=\"k\">Prova de la baixada:</span> el retorn ha de durar tres segons a les dues sèries. Si a l'última se'n fa un, les manuelles són massa pesades per al control que et queda.</p>","errors":[{"error":"Girar el palmell durant la pujada","why":"Si acabes amb el palmell cap amunt, has tornat al curl normal i el braquial se'n queda fora.","fix":"Presa neutra de principi a fi.","cause":"Girar el palmell dona més força al final i permet acabar la repetició quan el braquial ja no arriba."},{"error":"Portar les manuelles cap al centre del pit","why":"Escurça el recorregut i treu feina al braquial.","fix":"El braç puja per davant del cos, seguint la seva línia.","cause":"Acostar les mans fa la part final més fàcil."},{"error":"Deixar caure les manuelles a la baixada","why":"El braquial respon especialment bé al control de la baixada.","fix":"Tres segons comptats fins a l'extensió, a totes les repeticions.","cause":"La baixada no es veu al comptador de repeticions."}],"progression_html":"<p>15 repeticions netes a les dues sèries → següent parell de manuelles i tornada a 10.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=Iz1kGNIfS3Y","title":"Hammer Curl Tutorial | Correct Form Demo","confidence":"alta","note":null},"alternatives":{"principal":{"name":"Curl martell a politja amb corda","why_equivalent":"Mateixa presa neutra i flexió de colze, amb el braquial i el braquioradial de motors.","adjust":"Tensió constant: comença un esglaó per sota del pes de manuelles.","short":"mateixa presa, tensió constant"},"contingencia":{"name":"Curl amb barra EZ, presa neutra a les nanses centrals","why_acceptable":"Manté part de la presa neutra; perd la independència de cada braç.","adjust":"Mateix RIR; la crema es desplaça una mica cap al bíceps.","short":"mateixa flexió, menys neutra"},"not_equivalent":["Curl amb barra recta · presa supina: un altre múscul","Dominada pronada · patró d'esquena"]},"v22":true,"setup_html":"<ol> <li>Dempeus, peus a l'amplada dels malucs.</li> <li>Una manuella a cada mà amb <span class=\"key\">presa neutra</span>: palmells encarats.</li> <li>Colzes enganxats a les costelles i fixos tota la sèrie.</li> <li>Decideix si les faràs alhora o alternades i no ho canviïs dins de la sèrie.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Pujada (2 s).</span> Flexiona el colze sense que viatgi endavant, mantenint el palmell encarat.</li> <li><span class=\"key\">Contracció (1 s)</span> a dalt, sense arribar al punt on la manuella descansa.</li> <li><span class=\"key\">Baixada (3 s)</span> fins a extensió gairebé completa.</li> <li><span class=\"key\">Pausa (1 s)</span> amb el braç estès abans de la repetició següent.</li> </ol>","tags":{"primary":["Braquial"],"secondary":["Braquioradial"],"minor":["Bíceps"],"traits":[]},"registre":{"proposta":"doble"}},{"key":"TC-04","position":"TC-04","session":"TC","order":5,"name":"Tríceps en estirament","category":"FIX","category_label":"Fix","machine":{"code":null,"label":"Torre de politja alta amb corda · no consta a l'inventari M1–M7"},"muscles":"Tríceps, cap llarg","prescription":{"series":"3","reps":"10–15","tempo":"3‑1‑2‑1","rest":"60 s","rir":"1–2"},"quick":{"do":["Politja alta i corda, d'esquena a la torre i amb un peu endavant","Tronc inclinat des del maluc, amb l'esquena neutra","Colzes al costat del cap, apuntant endavant i fixos","Costelles avall abans de la primera repetició"],"dont":"Deixar que la corda t'estiri enrere o arquejar la lumbar per acabar la repetició","feel":"Estirament a la part posterior del braç, amb el braç amunt","grip":"Corda amb presa neutra, palmells encarats"},"grip_title":"La presa i la posició del colze","theory_html":"<p><span class=\"k\">Per què el braç ha d'anar amunt.</span> Dels tres caps del tríceps, un —el cap llarg— <span class=\"k\">creua també l'espatlla</span>. Això vol dir que la seva longitud depèn d'on tens el braç: amb el colze al costat del cos treballa escurçat i hi participa poc, i amb el braç per sobre del cap queda allargat. Aquesta és l'única posició del programa que l'estira sota càrrega.</p> <p><span class=\"k\">Per què és la posició de tríceps que no es toca.</span> El pushdown queda cobert indirectament per tots els pressos del cicle. Això, no. Quan cal retallar temps, es retalla allà i no aquí.</p> <p><span class=\"k\">Per què no xoca amb la línia vermella.</span> La regla diu «cap <span class=\"k\">press</span> per sobre del cap tret de TB‑04». Això és una extensió: el colze s'obre i es tanca, i el pes no es prem en vertical sobre l'espatlla. Per a la columna, el tronc s'inclina des del maluc amb l'esquena neutra; si arqueges la lumbar per acabar una repetició, el pes és massa alt.</p>","cues":["Colzes al costat del cap i apuntant endavant, fixos tota la sèrie","Baixa en 3 s fins a l'estirament clar darrere el braç","Inclinació des del maluc; l'esquena, neutra","Puja fins a una extensió còmoda, sense impacte","Si el colze parla, retalla el pes i no el rang"],"setup_steps":["Corda a la <span class=\"key\">politja alta</span>. D'esquena a la torre, amb un peu endavant.","Agafa la corda amb presa neutra i porta-la darrere el cap, amb els <span class=\"key\">colzes doblegats i apuntant endavant</span>.","Inclina el tronc endavant <span class=\"key\">des del maluc</span>, amb l'esquena neutra: ni arrodonida ni arquejada.","<span class=\"key\">Costelles avall</span> i abdomen ferm abans de la primera repetició: la corda no t'ha d'estirar enrere."],"grip_html":"<p><span class=\"k\">Presa neutra a la corda.</span> Palmells encarats, una mà a cada extrem de la corda.</p> <p><span class=\"k\">Colzes al costat del cap i apuntant endavant.</span> És la posició que manté el cap llarg estirat. Si s'obren cap als costats, el múscul surt d'aquella posició i el canell rep la càrrega en angle.</p>","execution_steps":["<span class=\"key\">Baixada (3 s).</span> Darrere el cap, flexionant només el colze, fins a notar l'estirament clar a la part posterior del braç.","<span class=\"key\">Pausa (1 s)</span> al punt baix, sense que els colzes s'obrin.","<span class=\"key\">Pujada (2 s)</span> endavant i amunt, fins a una extensió còmoda, sense impacte.","<span class=\"key\">Pausa (1 s)</span> a dalt, i torna a baixar sense deixar que la corda t'estiri."],"notice_html":"<p>Estirament clar a la part posterior del braç al punt baix i crema del colze cap amunt a les últimes repeticions. <span class=\"k\">Si el que notes és la part baixa de l'esquena</span>, has arquejat o la corda t'estira enrere. <span class=\"k\">Si notes pressió dins del colze</span>, baixa un esglaó i allarga la baixada. <span class=\"k\">Si no notes l'estirament</span>, no estàs baixant prou i fas un pushdown car.</p>","verify_html":"<p><span class=\"k\">Prova dels colzes:</span> al punt baix, mira't de front. Han d'apuntar endavant i quedar a l'amplada del cap.</p> <p><span class=\"k\">Prova de l'esquena:</span> si notes la lumbar més que el tríceps, torna a inclinar-te des del maluc i baixa un esglaó.</p> <p><span class=\"k\">Prova del segon a baix:</span> atura't un segon amb la corda darrere el cap. Si no la pots controlar, o la corda t'estira enrere, el pes és excessiu.</p>","errors":[{"error":"Els colzes s'obren durant la baixada","why":"El cap llarg deixa d'estar en la posició allargada que justifica l'exercici, i el canell rep la càrrega en angle.","fix":"Colzes endavant i a l'amplada del cap. Si no els pots mantenir, baixa un esglaó.","cause":"El pes és massa alt per controlar-lo darrere el cap, i obrir els colzes escurça la palanca."},{"error":"Arquejar la lumbar per acabar la repetició","why":"Posa la columna en extensió carregada justament on menys la controles.","fix":"Inclina't des del maluc, costelles avall, i baixa un esglaó si no ho mantens.","cause":"La corda estira el cos enrere i l'esquena ho compensa arquejant-se."},{"error":"No baixar fins a l'estirament","why":"L'estirament del cap llarg és l'única raó per la qual aquesta posició existeix; sense ell, fas un pushdown car.","fix":"Baixa fins a notar l'estirament clar. Si el colze parla, retalla el pes, no el rang.","cause":"La baixada s'atura abans d'hora quan el pes és alt o el colze es queixa."}],"progression_html":"<p>15 repeticions netes a les tres sèries amb RIR 1–2 → següent esglaó de la pila i tornada a 10. Puja a poc a poc: aquí el límit arriba pel canell i pel colze abans que pel tríceps. Només si la variant et resulta plenament tolerada, sense cap molèstia de colze ni de canell, pots acostar l'última sèrie a RIR 0–1.</p>","note_html":"","extra_sections":[],"figure":null,"video":{"url":"https://www.youtube.com/watch?v=v1qDINLCb8Q","title":"How to PROPERLY Overhead Dumbbell Tricep Extension (FIX THIS!)","confidence":"aproximada","note":"Mostra la versió amb manuella, que ara és l'alternativa principal."},"alternatives":{"principal":{"name":"Tríceps en estirament amb manuella, assegut","why_equivalent":"Mateixa extensió amb el cap llarg en estirament, amb el suport del respatller.","adjust":"Banc amb respatller vertical, esquena recolzada i una manuella agafada amb les dues mans.","short":"mateix estirament, amb manuella"},"contingencia":{"name":"Press francès amb manuella, tombat","why_acceptable":"Manté l'estirament del cap llarg amb el suport del banc.","adjust":"RIR 3; vigila el colze si nota pressió.","short":"estirament amb suport del banc"},"not_equivalent":["Fons assistit · el braç no passa mai per sobre del cap","Press francès amb barra dempeus · colze descobert i sense suport"]},"v22":true,"setup_html":"<ol> <li>Corda a la <span class=\"key\">politja alta</span>. D'esquena a la torre, amb un peu endavant.</li> <li>Agafa la corda amb presa neutra i porta-la darrere el cap, amb els <span class=\"key\">colzes doblegats i apuntant endavant</span>.</li> <li>Inclina el tronc endavant <span class=\"key\">des del maluc</span>, amb l'esquena neutra: ni arrodonida ni arquejada.</li> <li><span class=\"key\">Costelles avall</span> i abdomen ferm abans de la primera repetició: la corda no t'ha d'estirar enrere.</li> </ol>","execution_html":"<ol> <li><span class=\"key\">Baixada (3 s).</span> Darrere el cap, flexionant només el colze, fins a notar l'estirament clar a la part posterior del braç.</li> <li><span class=\"key\">Pausa (1 s)</span> al punt baix, sense que els colzes s'obrin.</li> <li><span class=\"key\">Pujada (2 s)</span> endavant i amunt, fins a una extensió còmoda, sense impacte.</li> <li><span class=\"key\">Pausa (1 s)</span> a dalt, i
